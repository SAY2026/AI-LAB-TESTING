<!doctype html>
<html lang="sw" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a6b74">
<meta name="apple-mobile-web-app-title" content="Kichina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="safari.webmanifest">
<link rel="icon" href="safari-icon-192.png">
<link rel="apple-touch-icon" href="safari-icon-180.png">
<title>Safari ya Kichina · 汉语之旅</title>
<style>
:root{--sea:#0a6b74;--sea2:#0e8b96;--foam:#e3f3f2;--sand:#fbf5e9;--card:#fff;--ink:#17222b;--mut:#62707c;--line:#e2dccc;--gold:#e8a317;--coral:#e2553d;--leaf:#2b9a57;--lock:#c9c5ba}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sand);color:var(--ink);font:17px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.top{background:var(--sea);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;flex:1;line-height:1.2}
.top small{display:block;font-weight:400;opacity:.85;font-size:12px}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:14px;white-space:nowrap;border:0;color:#fff}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:700;background:var(--sea);color:#fff;box-shadow:0 4px 0 #06474d;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #06474d}
.btn.sec{background:#fff;color:var(--sea);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #a86f00}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px;box-shadow:0 2px 0 #06474d}
.btn.sec.sm{box-shadow:0 2px 0 var(--line)}
.btn[disabled]{background:var(--lock);box-shadow:0 4px 0 #a9a59a;color:#fff}
input[type=text],select,textarea{font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:150px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* path */
.lvl{background:var(--sea2);color:#fff;border-radius:16px;padding:12px 14px;margin:18px 0 6px}
.lvl b{font-size:18px}.lvl div{font-size:13px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.node{display:flex;flex-direction:column;align-items:center;width:150px;text-align:center;border:0;background:none;color:var(--ink);padding:4px}
.node .c{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--sea);box-shadow:0 6px 0 #06474d;color:#fff;position:relative}
.node.done .c{background:var(--gold);box-shadow:0 6px 0 #a86f00}
.node.lock .c{background:var(--lock);box-shadow:0 6px 0 #a9a59a}
.node.empty .c{background:#fff;border:3px dashed var(--lock);box-shadow:none;color:var(--lock)}
.node .n{font-weight:700;font-size:15px;margin-top:8px;line-height:1.2}
.node .s{font-size:12px;color:var(--mut)}
.node:nth-child(4n+2){transform:translateX(60px)}.node:nth-child(4n+4){transform:translateX(-60px)}
.stars{font-size:13px;letter-spacing:1px}
/* lesson */
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.lessonTop{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:720px;margin:0 auto}
.x{border:0;background:none;font-size:24px;color:var(--mut);padding:0 6px}
.prompt{font-size:20px;font-weight:700;margin:6px 0 14px}
.big{font-size:64px;text-align:center;line-height:1.15;margin:8px 0}
.py{color:var(--coral);text-align:center;font-size:22px}
.mean{text-align:center;font-size:20px}
.mean small{display:block;color:var(--mut);font-size:15px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-bottom-width:5px;background:#fff;border-radius:14px;padding:14px 12px;font-size:20px;text-align:center;color:var(--ink)}
.opt.hz{font-size:30px}
.opt small,.tile small{display:block;font-size:15px;color:var(--coral);line-height:1.2;margin-top:2px}
.opt.sel{border-color:var(--sea2);background:var(--foam)}
.opt.ok{border-color:var(--leaf);background:#e2f5e9}
.opt.bad{border-color:var(--coral);background:#fde8e4}
.opt.gone{visibility:hidden}
.say{width:76px;height:76px;border-radius:22px;border:0;background:var(--sea2);color:#fff;font-size:32px;box-shadow:0 5px 0 #06474d;display:block;margin:6px auto 14px}
.say.sm{width:44px;height:44px;font-size:18px;border-radius:14px;display:inline-block;margin:0 0 0 8px;vertical-align:middle;box-shadow:0 3px 0 #06474d}
.slot{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;padding:8px 14px;font-size:24px;color:var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.foot .in{max-width:720px;margin:0 auto}
.foot.ok{background:#e2f5e9;border-color:var(--leaf)}.foot.bad{background:#fde8e4;border-color:var(--coral)}
.fb{font-weight:700;margin-bottom:8px}.foot.ok .fb{color:var(--leaf)}.foot.bad .fb{color:var(--coral)}
#hw{width:260px;height:260px;margin:0 auto 10px;border:2px solid var(--line);border-radius:16px;background:
 linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat,#fff}
.note{background:var(--foam);border-radius:14px;padding:12px;font-size:16px}
.av{font-size:30px;border:2px solid var(--line);background:#fff;border-radius:14px;width:54px;height:54px}
.av.sel{border-color:var(--sea);background:var(--foam)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.hide{display:none}
@media print{.top,.foot,.noprint{display:none}}
</style>
</head>
<body>
<div id="app"></div>

 U("L0U1","🎵","Toni nne","The four tones","四个声调",
  {sw:"Kichina kina toni nne. Sauti ile ile ‘ma’ ikibadilika toni, maana hubadilika: mā (mama), má (katani), mǎ (farasi), mà (kukaripia). Sikiliza kwa makini!",en:"Chinese has four tones. The same sound ‘ma’ changes meaning with the tone: mā (mother), má (hemp), mǎ (horse), mà (to scold). Listen carefully!",zh:"汉语有四个声调。同一个音 ma，声调不同，意思就不同。"},

function pool(u){var a=[],us=allUnits();for(var i=0;i<us.length;i++){a=a.concat(us[i].words);if(us[i]===u)break}return a}
function pick3(w,all,key){var o=[],s=shuffle(all);for(var i=0;i<s.length&&o.length<3;i++){var x=s[i];if(x.h!==w.h&&x[key]!==w[key]&&!o.some(function(y){return y[key]===x[key]}))o.push(x)}return shuffle(o.concat([w]))}
function writable(w){for(var i=0;i<w.h.length;i++)if(HZ[w.h[i]])return w.h[i];return null}
function buildLesson(u,idx){
 var l=lessonsOf(u)[idx],all=pool(u),q=[];
 if(l.type==="w"){
  l.words.forEach(function(w){q.push({k:"intro",w:w});q.push({k:"mean",w:w,o:pick3(w,all,"sw")})});
  shuffle(l.words).forEach(function(w){q.push({k:"listen",w:w,o:pick3(w,all,"h")})});
  if(l.words.length>=3)q.push({k:"match",ws:shuffle(l.words).slice(0,4)});
  shuffle(l.words).forEach(function(w,i){q.push(i%2?{k:"py",w:w,o:pick3(w,all,"p")}:{k:"hz",w:w,o:pick3(w,all,"h")})});
  var wr=l.words.filter(writable)[0];if(wr&&window.HanziWriter)q.push({k:"write",w:wr,c:writable(wr)});
 }else{
  u.sents.forEach(function(s){q.push({k:"sintro",s:s})});
  shuffle(u.sents).forEach(function(s){q.push({k:"build",s:s,extra:shuffle(all.filter(function(w){return s.k.indexOf(w.h)<0&&w.h.length<=2})).slice(0,2).map(function(w){return w.h})})});
  if(u.words.length>=4)q.push({k:"match",ws:shuffle(u.words).slice(0,4)});
  shuffle(u.words).slice(0,4).forEach(function(w){q.push({k:"listen",w:w,o:pick3(w,all,"h")})});
 }
 return q;
}
function startLesson(u,idx,q){LS={u:u,idx:idx,q:q||buildLesson(u,idx),i:0,miss:0,total:0,state:null,sel:null};LS.total=LS.q.length;V={name:"lesson",u:u};render()}
function weakWords(){var p=P(),m={};allUnits().forEach(function(u){u.words.forEach(function(w){if(p.weak[w.h]>0)m[w.h]=w})});return Object.keys(m).sort(function(a,b){return p.weak[b]-p.weak[a]}).slice(0,8).map(function(k){return m[k]})}
