main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:21px;margin:6px 0 10px}
h3{font-size:17px;margin:20px 0 8px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.mut{color:var(--mut);font-size:14px}
.btn{border:0;background:var(--pri);color:#fff;padding:11px 16px;border-radius:9px;font-size:15px;cursor:pointer}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:120px;font-size:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
.hz{font-size:21px;white-space:nowrap}
.py{color:var(--acc)}
.say{border:0;background:var(--pri2);color:var(--pri);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px;margin-left:4px}
body.hide-py .py,body.hide-mean .mean{visibility:hidden}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-child{border-top:0}
.q .stem{font-size:18px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:18px;cursor:pointer;background:#fff}

.q.wrong{background:#fdf0ee;outline:2px solid var(--bad);outline-offset:4px;border-radius:6px}
ruby rt{font-size:.5em;color:var(--acc)}
body.hide-py ruby rt{visibility:hidden}
td[data-bad]{background:#fde3df}
.q.right .stem::after{content:" ✓";color:var(--ok)}
.passage{background:var(--pri2);border-radius:10px;padding:12px;font-size:19px;line-height:1.9;margin-bottom:8px}
.score{font-size:26px;font-weight:700;color:var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--pri2)}
.timer.low{background:#fde3df;color:var(--bad)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.x{text-decoration:line-through;color:var(--bad)}
.lik{display:flex;gap:6px}
.lik label{border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;background:#fff}
.lik input{display:none}
.lik input:checked+span{font-weight:700;color:#fff;background:var(--pri);padding:2px 7px;border-radius:5px}
.sv td{font-size:14px}
.key{display:none}
body.teacher .key{display:block}
.tonly{display:none}
body.teacher .tonly{display:revert}
.paper-head{display:none}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
@media print{
 header,nav,.bar,.noprint,.say{display:none!important}

 .q{break-inside:avoid;padding:5pt 0}
 .opts{grid-template-columns:repeat(4,1fr);gap:4pt}
 .opts label{border:0;padding:0;font-size:12pt}
 .paper-head{display:block;margin-bottom:8pt}
 .key{break-before:page}
 body.hide-py .py,body.hide-mean .mean,body.hide-py ruby rt{visibility:visible}

 .lik label{border:1px solid #777;padding:0 6pt}
 textarea{border:1px solid #777;min-height:130pt}
 h2{font-size:14pt}h3{font-size:12pt;margin:8pt 0 4pt}
}

function collect(prefix,n){var a=[];for(var i=0;i<n;i++){var e=document.querySelector('input[name="'+prefix+i+'"]:checked');a[i]=e?+e.value:null}return a}

function likert(name,val){return '<div class="lik">'+[1,2,3,4,5].map(function(n){return '<label><input type="radio" name="'+name+'" value="'+n+'"'+(val===n?" checked":"")+'><span>'+n+'</span></label>'}).join("")+'</div>'}
function tri(a){return esc(a[0])+'<br>'+esc(a[1])+'<br>'+esc(a[2])}
function choice(k,q,val){return '<tr><td colspan="2">'+tri(q.q)+'</td></tr><tr><td colspan="2"><div class="row">'+q.o.map(function(o,j){return '<label><input type="radio" name="'+k+'" value="'+j+'"'+(val===j?" checked":"")+'> '+esc(o[0]+" / "+o[1]+" / "+o[2])+'</label>'}).join("")+'</div></td></tr>'}
function vSurvey(){
 var r=rec();if(!r)return needSign();
 var wave=sget("f2x:wave",null)||(r.pre&&!r.post?"post":"pre"),d=r[wave]||{};
 var h='<h2>'+esc(t("survey"))+' '+printBtn()+'</h2><div class="row noprint" style="margin-bottom:10px"><button class="btn '+(wave==="pre"?"":"sec")+' sm" data-act="wave" data-w="pre">'+esc(t("pre"))+(r.pre?" ✓":"")+'</button><button class="btn '+(wave==="post"?"":"sec")+' sm" data-act="wave" data-w="post">'+esc(t("post"))+(r.post?" ✓":"")+'</button></div>';
 h+='<div class="card survey"><b>F2 汉语复习学生问卷 · Student questionnaire · Dodoso la mwanafunzi — '+(wave==="pre"?"前测 PRE KABLA":"后测 POST BAADA")+'</b><div class="paper-head">School / Shule: __________ Code / Namba: ______</div>'+
 '<div class="mut">'+esc(SCALE.zh)+'<br>'+esc(SCALE.en)+'<br>'+esc(SCALE.sw)+'</div><div class="tw"><table class="sv">'+
 SURVEY.map(function(q,i){return '<tr><td>'+(i+1)+'. '+tri(q.slice(1))+'</td><td style="width:210px">'+likert("s"+i,d["q"+(i+1)])+'</td></tr>'}).join("")+
 (wave==="pre"?BG:POSTQ).map(function(q){return choice("c_"+q.k,q,d[q.k])}).join("")+
 (wave==="post"?OPENQ.map(function(q){return '<tr><td colspan="2">'+tri(q.slice(1))+'<br><input type="text" id="o_'+q[0]+'" style="width:100%" value="'+esc(d[q[0]]||"")+'"></td></tr>'}).join(""):"")+
 '</table></div></div><button class="btn noprint" data-act="subsurvey" data-w="'+wave+'">'+esc(t("save"))+'</button> <span id="svmsg" class="ok"></span>';
 return h;
}

var COLS=["school","id","mode","diag_form_pre","diag_pre","diag_post","mock_mode","mock_max","mock_I","mock_II","mock_III","mock_IV","mock_V","mock_auto","writing","mock_total","pre1","pre2","pre3","pre4","pre5","pre6","pre7","pre8","post1","post2","post3","post4","post5","post6","post7","post8","dev","hrs","hard","best","change","help","real_p1","real_p23"];
function rowOf(r){var m=r.mock||{},s=m.secs||[],p=r.pre||{},q=r.post||{};
 var a=[r.school,r.id,{m1:"own_device",m2:"whole_class",m3:"print"}[r.mode]||"",r.diag?r.diag.form||"A":"",r.diag?r.diag.score:"",r.diag2?r.diag2.score:"",m.mode||(r.mock?"full":""),r.mock?(m.max||92)+8:"",s[0],s[1],s[2],s[3],s[4],m.auto,m.wmark,(m.auto!=null&&m.wmark!=null)?m.auto+m.wmark:""];
 for(var i=1;i<=8;i++)a.push(p["q"+i]);for(i=1;i<=8;i++)a.push(q["q"+i]);
 a.push(p.dev,p.hrs,p.hard,q.best,q.change,q.help,r.real?r.real.p1:"",r.real&&r.real.p23!=null?r.real.p23:"");return a.map(function(x){return x==null?"":x})}
function vResults(){
 var ks=Object.keys(RECS).sort();
 var h='<h2>'+esc(t("results"))+'</h2><div class="card row noprint"><button class="btn" data-act="csv">CSV</button><button class="btn sec" data-act="json">JSON</button>'+printBtn()+'<span class="mut">'+ks.length+' records on this device</span></div>'+
 '<div class="card"><div class="tw"><table><tr>'+COLS.slice(0,16).map(function(c){return '<th>'+c+'</th>'}).join("")+'<th>SE pre→post</th><th>TAM</th><th>DA</th><th>CR</th></tr>'+
 ks.map(function(k){var r=RECS[k],a=rowOf(r),p=r.pre||{},q=r.post||{};function pr(i,j){function v(o){return (o["q"+i]!=null&&o["q"+j]!=null)?((o["q"+i]+o["q"+j])/2).toFixed(1):"—"}return v(p)+" → "+v(q)}
  return '<tr>'+a.slice(0,16).map(function(x){return '<td>'+esc(x)+'</td>'}).join("")+'<td>'+pr(1,2)+'</td><td>'+pr(3,4)+'</td><td>'+pr(5,6)+'</td><td>'+pr(7,8)+'</td></tr>'}).join("")+'</table></div></div>'+
 '<div class="card mut"><b>Research notes · 研究说明</b><br>Items 1–2 = Self-Efficacy (SE), 3–4 = Technology Acceptance (TAM), 5–6 = Digital Agency (DA), 7–8 = Contextual Resilience (CR): the four DILM variables, adapted here for students. Matched PRE/POST by anonymous code; "mode" (own device / whole class / print) records how each learner worked. The items are adapted, not yet validated scales; students are minors, so collect with permission from the school and the Ministry and keep codes, never names. Each device stores only its own records: export a CSV from every device and merge.<br>第 1–2 题 = 自我效能，3–4 = 技术接受，5–6 = 数字能动性，7–8 = 情境韧性（DILM 四个变量的学生版）。按匿名编号前后配对；“学习方式”一栏记录每个学生的学习方式。水平测试有 A、B 两套平行卷：编号末位是单数的学生先做 A、后做 B，双数相反，这样前后测的差不受某一套卷难易的影响。 The diagnostic has two parallel forms: odd codes sit A first and B at the end, even codes the reverse, so the pre/post difference does not depend on which form is harder.题目是改编的，还不是验证过的量表；学生是未成年人，请在学校和教育部许可范围内收集，只用编号不写名字。每台设备只保存自己的记录，请逐台导出 CSV 后合并。</div>';
 return h;
}
function download(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-say],[data-view],[data-act]");if(!el)return;
 if(el.dataset.say){say(el.dataset.say,+el.dataset.n||1);return}
 if(el.dataset.view){VIEW=el.dataset.view;render();return}
 var a=el.dataset.act,r=rec();
 if(a==="print"){window.print()}
 else if(a==="signin"){var id=$("#fid").value.trim();if(!id){$("#fid").focus();return}CUR={school:$("#fsch").value,id:id,mode:$("#fmode").value};sset("f2x:cur",CUR);rec().mode=CUR.mode;saveRecs();sset("f2x:wave",null);sset("f2x:dwave",null);timerEnd=0;render()}
 else if(a==="quiz"){startQuiz(+el.dataset.g)}
 else if(a==="qa"){quizAnswer(+el.dataset.j,el)}
 else if(a==="subdiag"){var IT=el.dataset.f==="A"?DIAG:DIAGB,ans=collect("d",IT.length),sc=0;IT.forEach(function(it,i){if(ans[i]===it.a)sc++});r[el.dataset.k]={form:el.dataset.f,ans:ans,score:sc,ts:Date.now()};saveRecs();render()}
 else if(a==="dwave"){sset("f2x:dwave",el.dataset.w);render()}
 else if(a==="rediag"){delete r[el.dataset.k];saveRecs();render()}
 else if(a==="subreal"){var A={},s1=0;RM.q1.forEach(function(x,i){var e2=document.querySelector('input[name="ra'+i+'"]:checked');A["a"+i]=e2?+e2.value:null;if(A["a"+i]===x[2])s1++});RM.q2k.forEach(function(k,i){var s2=document.querySelector('select[name="rm'+i+'"]');A["m"+i]=s2&&s2.value!==""?+s2.value:null;if(A["m"+i]===k)s1++});r.real={ans:A,p1:s1,p23:null,ts:Date.now()};saveRecs();render()}
 else if(a==="rmark"){var vb=parseFloat($("#rb").value),vc=parseFloat($("#rc").value);if(!(vb>=0&&vb<=70&&vc>=0&&vc<=15))return;r.real.p2=vb;r.real.p3=vc;r.real.p23=vb+vc;saveRecs();render()}
 else if(a==="rereal"){delete r.real;saveRecs();render()}
 else if(a==="timer"){timerEnd=Date.now()+((r.mockmode||"short")==="short"?40:90)*60000;tick()}
 else if(a==="mmode"){r.mockmode=el.dataset.m;saveRecs();render()}
 else if(a==="submock"){var all={},secs=[],auto=0;var sh=(r.mockmode||"short")==="short",mx=0;MOCK.forEach(function(s){var its=sh&&s.id!=="V"?s.items.slice(0,5):s.items,an=collect("m"+s.id,its.length),sc=0;its.forEach(function(it,i){all[s.id+i]=an[i];if(an[i]===it.a)sc+=s.marks});secs.push(sc);auto+=sc;mx+=its.length*s.marks});
  r.mock={mode:sh?"short":"full",max:mx,ans:all,w:$("#mw").value,secs:secs,auto:auto,wmark:null,ts:Date.now()};delete r.mdraft;saveRecs();timerEnd=0;render()}
 else if(a==="remock"){delete r.mock;saveRecs();render()}
 else if(a==="wmark"){var v=parseFloat($("#wmark").value);if(!(v>=0&&v<=8))return;r.mock.wmark=v;saveRecs();render()}
 else if(a==="wave"){sset("f2x:wave",el.dataset.w);render()}
 else if(a==="subsurvey"){var w=el.dataset.w,d={ts:Date.now()};SURVEY.forEach(function(q,i){var x=document.querySelector('input[name="s'+i+'"]:checked');d["q"+(i+1)]=x?+x.value:null});
  (w==="pre"?BG:POSTQ).forEach(function(q){var x=document.querySelector('input[name="c_'+q.k+'"]:checked');d[q.k]=x?+x.value:null});
  if(w==="post")OPENQ.forEach(function(q){d[q[0]]=$("#o_"+q[0]).value});r[w]=d;saveRecs();$("#svmsg").textContent=t("saved")}
 else if(a==="csv"){download("f2_results.csv",[COLS.join(",")].concat(Object.keys(RECS).sort().map(function(k){return rowOf(RECS[k]).map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",")})).join("\r\n"),"text/csv")}
 else if(a==="json"){download("f2_results.json",JSON.stringify(RECS,null,1),"application/json")}
});
/* autosave the mock draft */
document.addEventListener("change",function(e){
 if(VIEW!=="mock")return;var r=rec();if(!r||r.mock)return;var n=e.target.name||"";
 r.mdraft=r.mdraft||{ans:{},w:""};if(n.charAt(0)==="m"&&e.target.type==="radio")r.mdraft.ans[n.slice(1)]=+e.target.value;saveRecs();
});
document.addEventListener("input",function(e){
 if(e.target.id==="mw"){var r=rec();if(r&&!r.mock){r.mdraft=r.mdraft||{ans:{},w:""};r.mdraft.w=e.target.value;saveRecs()}var n=(e.target.value.match(/[一-鿿]/g)||[]).length;$("#wc").textContent=n+" 字"}
});

$("#lang").onchange=function(){S.lang=this.value;sset("f2x:set",S);render()};

$("#tmean").onchange=function(){S.mean=this.checked;sset("f2x:set",S);nav()};

try{speechSynthesis.getVoices()}catch(e){}
render();
