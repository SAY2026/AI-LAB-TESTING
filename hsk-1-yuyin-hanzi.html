sabiwa kama mmoja.","ex_zh":"竖、横折、横——拐弯的笔画只算一笔。"},{"t":"mcq","q":"How many strokes does 月 have?","o":["3","4","5"],"a":1,"tag":"characters","ex":"撇, 横折钩, 横, 横 = 4.","q_sw":"月 ina mistari mingapi?","q_zh":"“月”有几画？","ex_sw":"撇, 横折钩, 横, 横 = 4.","ex_zh":"撇、横折钩、横、横 = 4 画。"},{"t":"mcq","q":"The second stroke of 七 goes down, curves right and hooks up. It is…","o":["竖钩","竖弯钩","横折钩"],"a":1,"tag":"characters","ex":"竖弯钩 = vertical + curve + hook.","q_sw":"Mstari wa pili wa 七 unashuka, unapinda kulia na kuishia na ndoano juu. Ni…","q_zh":"“七”的第二笔向下、向右弯、再向上钩。它是……","ex_sw":"竖弯钩 = wima + mzingo + ndoano.","ex_zh":"竖弯钩 = 竖 + 弯 + 钩。"},{"t":"mcq","q":"Which special hook is found in 心?","o":["卧钩 (lying hook)","斜钩 (slanting hook)","竖钩 (vertical hook)"],"a":0,"tag":"characters","ex":"心 has 卧钩, shaped like a smile.","q_sw":"Ndoano ipi maalum iko katika 心?","q_zh":"“心”里有哪种特殊的钩？","ex_sw":"心 ina 卧钩, yenye umbo la tabasamu.","ex_zh":"“心”有卧钩，形状像微笑。","o_sw":["卧钩 (ndoano iliyolala)","斜钩 (ndoano ya mshazari)","竖钩 (ndoano ya wima)"],"o_zh":["卧钩","斜钩","竖钩"]},{"t":"mcq","q":"What is the first stroke of 女?","o":["撇点","横","撇折"],"a":0,"tag":"characters","ex":"女: 撇点, 撇, 横.","q_sw":"Mstari wa kwanza wa 女 ni upi?","q_zh":"“女”的第一笔是什么？","ex_sw":"女: 撇点, 撇, 横.","ex_zh":"女：撇点、撇、横。"},{"t":"mcq","q":"The stroke 提 moves…","o":["from bottom left up to the right","from top right down to the left","from left to right, level"],"a":0,"tag":"characters","ex":"提 is a short rising stroke.","q_sw":"Mstari 提 unaenda…","q_zh":"“提”这一笔的方向是……","ex_sw":"提 ni mstari mfupi unaopanda.","ex_zh":"提是一个短的向上笔画。","o_sw":["kutoka chini kushoto kwenda juu kulia","kutoka juu kulia kwenda chini kushoto","kutoka kushoto kwenda kulia, kwa mlalo"],"o_zh":["从左下向右上","从右上向左下","从左到右，平着写"]},{"t":"match","pairs":[["横","horizontal"],["竖","vertical"],["撇","left-falling"],["捺","right-falling"],["点","dot"]],"tag":"characters","ex":"The basic stroke names.","ex_sw":"Majina ya mistari ya msingi.","ex_zh":"基本笔画的名称。","pairs_sw":[["横","mlalo"],["竖","wima"],["撇","unaoshuka kushoto"],["捺","unaoshuka kulia"],["点","kitone"]]},{"t":"hanzi","q":"Write the character with only ONE stroke: yī (one)","a":["一"],"tag":"characters","ex":"一 = one 横.","q_sw":"Andika herufi yenye mstari MMOJA tu: yī (moja)","q_zh":"写出只有一画的字：yī（一）","ex_sw":"一 = 横 mmoja.","ex_zh":"一 = 一个横。"}]},{"id":"P7","title_zh":"笔顺规则","title_en":"Stroke-order rules","title_sw":"Kanuni za mpangilio wa mistari","intro":{"en":"Characters are written in a fixed order. Correct stroke order makes writing faster and neater, helps you remember characters, and is needed for handwriting input on phones. Seven basic rules cover most characters; learn the exceptions too.","sw":"Herufi huandikwa kwa mpangilio maalum. Mpangilio sahihi wa mistari hufanya uandishi kuwa wa haraka na nadhifu, hukusaidia kukumbuka herufi, na unahitajika kwa kuandika kwa mkono kwenye simu. Kanuni saba za msingi zinahusu herufi nyingi; jifunze pia mambo yasiyofuata kanuni.","zh":"汉字要按固定的顺序书写。正确的笔顺能让字写得又快又整齐，帮助记忆汉字，也是手机手写输入所必需的。七条基本规则适用于大多数汉字；例外情况也要学。"},"sections":[{"h":"1. 先横后竖 Horizontal before vertical","en":"When a horizontal and a vertical stroke cross, write the horizontal first.","sw":"Mstari wa mlalo na wa wima vikikatana, andika wa mlalo kwanza.","examples":[{"zh":"十","p":"shí","en":"ten","sw":"kumi"},{"zh":"干","p":"gān","en":"dry","sw":"kavu"},{"zh":"丰","p":"fēng","en":"plentiful","sw":"tele; -ingi"}],"zh":"横和竖相交时，先写横。","h_sw":"1. Mlalo kabla ya wima"},{"h":"2. 先撇后捺 Left-falling before right-falling","en":"When 撇 and 捺 meet or cross, write 撇 first.","sw":"撇 na 捺 vikikutana au kukatana, andika 撇 kwanza.","examples":[{"zh":"人","p":"rén","en":"person","sw":"mtu"},{"zh":"八","p":"bā","en":"eight","sw":"nane"},{"zh":"大","p":"dà","en":"big","sw":"kubwa"}],"zh":"撇和捺相交或相接时，先写撇。","h_sw":"2. Unaoshuka kushoto kabla ya unaoshuka kulia"},{"h":"3. 从上到下 Top before bottom","en":"Write the top part before the bottom part.","sw":"Andika sehemu ya juu kabla ya sehemu ya chini.","examples":[{"zh":"三","p":"sān","en":"three","sw":"tatu"},{"zh":"早","p":"zǎo","en":"early","sw":"mapema"},{"zh":"字","p":"zì","en":"character","sw":"herufi (ya Kichina)"}],"zh":"先写上面的部分，再写下面的部分。","h_sw":"3. Juu kabla ya chini"},{"h":"4. 从左到右 Left before right","en":"Write the left part before the right part.","sw":"Andika sehemu ya kushoto kabla ya sehemu ya kulia.","examples":[{"zh":"好","p":"hǎo","en":"good","note":"女 then 子","sw":"nzuri","note_sw":"女 kisha 子","note_zh":"先女后子"},{"zh":"你","p":"nǐ","en":"you","note":"亻 then 尔","sw":"wewe","note_sw":"亻 kisha 尔","note_zh":"先亻后尔"},{"zh":"明","p":"míng","en":"bright","note":"日 then 月","sw":"angavu","note_sw":"日 kisha 月","note_zh":"先日后月"}],"zh":"先写左边的部分，再写右边的部分。","h_sw":"4. Kushoto kabla ya kulia"},{"h":"5. 从外到内 Outside before inside","en":"When a frame is open at the bottom, write the frame first, then the inside.","sw":"Fremu ikiwa wazi chini, andika fremu kwanza, kisha ndani.","examples":[{"zh":"月","p":"yuè","en":"moon","sw":"mwezi"},{"zh":"同","p":"tóng","en":"same","sw":"sawa"},{"zh":"问","p":"wèn","en":"to ask","sw":"kuuliza"}],"zh":"框架下面开口时，先写外框，再写里面。","h_sw":"5. Nje kabla ya ndani"},{"h":"6. 先里头后封口 Inside before closing","en":"For a fully enclosed character, write the left and top of the frame, then the inside, and close the bottom LAST ('go in, then shut the door').","sw":"Kwa herufi iliyozungukwa kabisa, andika upande wa kushoto na juu wa fremu, kisha ndani, na ufunge chini MWISHO ('ingia, kisha funga mlango').","examples":[{"zh":"日","p":"rì","en":"sun","sw":"jua"},{"zh":"回","p":"huí","en":"to return","sw":"kurudi"},{"zh":"国","p":"guó","en":"country","sw":"nchi"}],"zh":"四面全包围的字，先写外框的左边和上边，再写里面，最后封口写底下那一横（“先进人，后关门”）。","h_sw":"6. Ndani kabla ya kufunga"},{"h":"7. 先中间后两边 Middle before the two sides","en":"When a character has a middle part with smaller parts on both sides, write the middle first.","sw":"Herufi ikiwa na sehemu ya katikati na sehemu ndogo pande zote mbili, andika ya katikati kwanza.","examples":[{"zh":"小","p":"xiǎo","en":"small","sw":"ndogo"},{"zh":"水","p":"shuǐ","en":"water","sw":"maji"},{"zh":"山","p":"shān","en":"mountain","sw":"mlima"}],"zh":"字的中间有主要部分、两边有较小部分时，先写中间。","h_sw":"7. Katikati kabla ya pande mbili"},{"h":"例外一：右上角和里面的点 Exception: the dot at the top right or inside","en":"A dot at the top right, or a dot inside a character, is often written LAST.","sw":"Kitone kilicho juu kulia, au kitone kilicho ndani ya herufi, mara nyingi huandikwa MWISHO.","examples":[{"zh":"我","p":"wǒ","en":"I","note":"the dot is the 7th and last stroke","sw":"mimi","note_sw":"kitone ni mstari wa 7 na wa mwisho","note_zh":"点是第7笔，也是最后一笔"},{"zh":"书","p":"shū","en":"book","note":"横折, 横折钩, 竖, then 点 last","sw":"kitabu","note_sw":"横折, 横折钩, 竖, kisha 点 mwisho","note_zh":"横折、横折钩、竖，最后写点"},{"zh":"犬","p":"quǎn","en":"dog","note":"横, 撇, 捺, then 点 last","sw":"mbwa","note_sw":"横, 撇, 捺, kisha 点 mwisho","note_zh":"横、撇、捺，最后写点"}],"zh":"右上角的点或字里面的点，常常最后写。","h_sw":"Isipokuwa 1: kitone cha juu kulia au cha ndani"},{"h":"例外二：辶 和 廴 最后写 Exception: 辶 and 廴 are written last","en":"Characters with the 'walk' radical 辶 or 廴 at the bottom left: write the inside part first, then 辶/廴 last.","sw":"Herufi zenye kijenzi cha 'kutembea' 辶 au 廴 chini kushoto: andika sehemu ya ndani kwanza, kisha 辶/廴 mwisho.","examples":[{"zh":"这","p":"zhè","en":"this","note":"文 first, 辶 last","sw":"hiki; hii","note_sw":"文 kwanza, 辶 mwisho","note_zh":"先写文，最后写辶"},{"zh":"过","p":"guò","en":"to pass","note":"寸 first, 辶 last","sw":"kupita","note_sw":"寸 kwanza, 辶 mwisho","note_zh":"先写寸，最后写辶"},{"zh":"建","p":"jiàn","en":"to build","note":"聿 first, 廴 last","sw":"kujenga","note_sw":"聿 kwanza, 廴 mwisho","note_zh":"先写聿，最后写廴"}],"zh":"左下有“走之”辶 或 廴 的字：先写里面的部分，最后写 辶/廴。","h_sw":"Isipokuwa 2: 辶 na 廴 huandikwa mwisho"}],"practice":[{"t":"mcq","q":"In 十, which stroke is written first?","o":["横","竖"],"a":0,"tag":"characters","ex":"Rule 1: horizontal before vertical.","q_sw":"Katika 十, mstari upi huandikwa kwanza?","q_zh":"“十”先写哪一笔？","ex_sw":"Kanuni ya 1: mlalo kabla ya wima.","ex_zh":"规则 1：先横后竖。"},{"t":"mcq","q":"Which rule does 人 follow?","o":["先撇后捺","从外到内","先中间后两边"],"a":0,"tag":"characters","ex":"撇 first, then 捺.","q_sw":"人 inafuata kanuni ipi?","q_zh":"“人”遵循哪条规则？","ex_sw":"撇 kwanza, kisha 捺.","ex_zh":"先撇，后捺。"},{"t":"mcq","q":"What is the last stroke of 我?","o":["斜钩","点","撇"],"a":1,"tag":"characters","ex":"The top-right dot of 我 is written last.","q_sw":"Mstari wa mwisho wa 我 ni upi?","q_zh":"“我”的最后一笔是什么？","ex_sw":"Kitone cha juu kulia cha 我 huandikwa mwisho.","ex_zh":"“我”右上角的点最后写。"},{"t":"mcq","q":"In 这, which part is written last?","o":["文","辶"],"a":1,"tag":"characters","ex":"辶 is written after the inside part.","q_sw":"Katika 这, sehemu ipi huandikwa mwisho?","q_zh":"“这”哪一部分最后写？","ex_sw":"辶 huandikwa baada ya sehemu ya ndani.","ex_zh":"辶 在里面的部分之后写。"},{"t":"mcq","q":"In 国, which stroke is written last?","o":["the dot inside","the bottom horizontal that closes the box","the first vertical"],"a":1,"tag":"characters","ex":"Go in first, then close the door: the bottom 横 is last.","q_sw":"Katika 国, mstari upi huandikwa mwisho?","q_zh":"“国”最后写哪一笔？","ex_sw":"Ingia kwanza, kisha funga mlango: 横 wa chini ni wa mwisho.","ex_zh":"先进人，后关门：底下的横最后写。","o_sw":["kitone cha ndani","mlalo wa chini unaofunga kisanduku","wima wa kwanza"],"o_zh":["里面的点","封口的底横","第一笔竖"]},{"t":"mcq","q":"What is the first stroke of 小?","o":["the middle 竖钩","the left dot","the right dot"],"a":0,"tag":"characters","ex":"Rule 7: middle before the two sides.","q_sw":"Mstari wa kwanza wa 小 ni upi?","q_zh":"“小”的第一笔是什么？","ex_sw":"Kanuni ya 7: katikati kabla ya pande mbili.","ex_zh":"规则 7：先中间后两边。","o_sw":["竖钩 wa katikati","kitone cha kushoto","kitone cha kulia"],"o_zh":["中间的竖钩","左边的点","右边的点"]},{"t":"mcq","q":"How do you write 好?","o":["女 first, then 子","子 first, then 女"],"a":0,"tag":"characters","ex":"Rule 4: left before right.","q_sw":"Unaandikaje 好?","q_zh":"“好”怎么写？","ex_sw":"Kanuni ya 4: kushoto kabla ya kulia.","ex_zh":"规则 4：从左到右。","o_sw":["女 kwanza, kisha 子","子 kwanza, kisha 女"],"o_zh":["先写女，再写子","先写子，再写女"]},{"t":"mcq","q":"What is the first stroke of 日?","o":["竖 (left side)","横折","the middle 横"],"a":0,"tag":"characters","ex":"日: 竖, 横折, 横, 横 — the bottom 横 closes it.","q_sw":"Mstari wa kwanza wa 日 ni upi?","q_zh":"“日”的第一笔是什么？","ex_sw":"日: 竖, 横折, 横, 横 — 横 wa chini unaifunga.","ex_zh":"日：竖、横折、横、横——最后的底横封口。","o_sw":["竖 (upande wa kushoto)","横折","横 wa katikati"],"o_zh":["竖（左边）","横折","中间的横"]},{"t":"match","pairs":[["先横后竖","十"],["先撇后捺","八"],["从外到内","月"],["先中间后两边","水"],["先里头后封口","回"]],"tag":"characters","ex":"One example character for each rule.","ex_sw":"Herufi moja ya mfano kwa kila kanuni.","ex_zh":"每条规则配一个例字。"},{"t":"hanzi","q":"mén (door) — write it, frame first","a":["门"],"tag":"characters","ex":"门: 点, 竖, 横折钩.","q_sw":"mén (mlango) — iandike, fremu kwanza","q_zh":"mén（门）——写出来，先写外框","ex_sw":"门: 点, 竖, 横折钩.","ex_zh":"门：点、竖、横折钩。"}]},{"id":"P8","title_zh":"汉字结构与部首","title_en":"Character structures and radicals","title_sw":"Muundo wa herufi na vijenzi vikuu (部首)","intro":{"en":"Most characters are built from smaller parts. Knowing the seven basic structures tells you how to divide the square; knowing the radicals (部首) gives you clues to meaning and helps you look characters up in a dictionary.","sw":"Herufi nyingi zimejengwa kwa sehemu ndogo. Kujua miundo saba ya msingi kunakuonyesha jinsi ya kugawa mraba; kujua vijenzi (部首) kunakupa dalili za maana na kunakusaidia kutafuta herufi katika kamusi.","zh":"大多数汉字由更小的部件组成。了解七种基本结构，就知道怎样分配一个方格；了解部首，能得到字义的线索，也能帮助查字典。"},"sections":[{"h":"汉字结构 The seven structures","en":"独体字 single-part characters cannot be split. 左右 left-right, 上下 top-bottom, 左中右 left-middle-right, 上中下 top-middle-bottom. 半包围 half-enclosed: the frame covers two or three sides (辶, 门, 广, 匚 …). 全包围 fully enclosed: the frame closes all four sides. Write each part smaller so the whole character fits one square.","sw":"独体字 herufi za sehemu moja haziwezi kugawanywa. 左右 kushoto-kulia, 上下 juu-chini, 左中右 kushoto-katikati-kulia, 上中下 juu-katikati-chini. 半包围 zilizozungukwa nusu: fremu inafunika pande mbili au tatu (辶, 门, 广, 匚 …). 全包围 zilizozungukwa kabisa: fremu inafunga pande zote nne. Andika kila sehemu ndogo zaidi ili herufi nzima itoshe mraba mmoja.","examples":[{"zh":"人 口 木 大","p":"rén kǒu mù dà","en":"person, mouth, tree, big","note":"独体 single part","sw":"mtu, mdomo, mti, kubwa","note_sw":"独体 sehemu moja","note_zh":"独体字"},{"zh":"你 好 明 林","p":"nǐ hǎo míng lín","en":"you, good, bright, woods","note":"左右 left-right","sw":"wewe, nzuri, angavu, msitu","note_sw":"左右 kushoto-kulia","note_zh":"左右结构"},{"zh":"字 早 男 草","p":"zì zǎo nán cǎo","en":"character, early, male, grass","note":"上下 top-bottom","sw":"herufi, mapema, mwanamume, nyasi","note_sw":"上下 juu-chini","note_zh":"上下结构"},{"zh":"谢 做 班","p":"xiè zuò bān","en":"thank, do, class","note":"左中右 left-middle-right","sw":"shukuru, fanya, darasa","note_sw":"左中右 kushoto-katikati-kulia","note_zh":"左中右结构"},{"zh":"意 害","p":"yì hài","en":"meaning, harm","note":"上中下 top-middle-bottom","sw":"maana, madhara","note_sw":"上中下 juu-katikati-chini","note_zh":"上中下结构"},{"zh":"这 问 医 床","p":"zhè wèn yī chuáng","en":"this, ask, medicine, bed","note":"半包围 half-enclosed","sw":"hiki, uliza, dawa; tiba, kitanda","note_sw":"半包围 imezungukwa nusu","note_zh":"半包围结构"},{"zh":"国 回 四 因","p":"guó huí sì yīn","en":"country, return, four, because","note":"全包围 fully enclosed","sw":"nchi, rudi, nne, kwa sababu","note_sw":"全包围 imezungukwa kabisa","note_zh":"全包围结构"}],"zh":"独体字只有一个部件，不能拆分。左右结构、上下结构、左中右结构、上中下结构。半包围结构：外框包住两面或三面（辶、门、广、匚 …）。全包围结构：外框四面都封闭。每个部件要写得小一些，让整个字正好放进一个方格。","h_sw":"Miundo saba ya herufi"},{"h":"什么是部首？ What is a radical?","en":"A radical is the part of a character used to arrange it in a dictionary. It often shows the MEANING area: 氵 (water) in 河 river, 海 sea; 扌 (hand) in 打 hit, 找 look for. Another part often gives a hint about the SOUND: 妈 mā = 女 (woman) + 马 mǎ (sound). Radicals are clues, not rules — always check the meaning.","sw":"Kijenzi (部首) ni sehemu ya herufi inayotumika kuipanga katika kamusi. Mara nyingi kinaonyesha eneo la MAANA: 氵 (maji) katika 河 mto, 海 bahari; 扌 (mkono) katika 打 piga, 找 tafuta. Sehemu nyingine mara nyingi hutoa dalili ya SAUTI: 妈 mā = 女 (mwanamke) + 马 mǎ (sauti). Vijenzi ni dalili, si kanuni — hakikisha maana kila wakati.","examples":[{"zh":"妈","p":"mā","en":"mother","note":"女 meaning + 马 sound","sw":"mama","note_sw":"女 maana + 马 sauti","note_zh":"女表义 + 马表音"},{"zh":"河","p":"hé","en":"river","note":"氵 water + 可 sound","sw":"mto","note_sw":"氵 maji + 可 sauti","note_zh":"氵表义（水）+ 可表音"},{"zh":"饭","p":"fàn","en":"meal","note":"饣 food + 反 sound","sw":"mlo","note_sw":"饣 chakula + 反 sauti","note_zh":"饣表义（食物）+ 反表音"}],"zh":"部首是字典里用来给汉字归类的部分。部首常常表示意义范畴：氵（水）在 河、海 里；扌（手）在 打、找 里。另一个部件常常提示读音：妈 mā = 女（女性）+ 马 mǎ（表音）。部首只是线索，不是规则——一定要核对字义。","h_sw":"Kijenzi (部首) ni nini?"},{"h":"40个常用部首（一）Radicals 1–10","en":"Each item: radical, name in pinyin, meaning, name in Chinese and two example characters.","sw":"Kila kipengele: kijenzi, jina lake kwa pinyin, maana, jina kwa Kichina na herufi mbili za mfano.","examples":[{"zh":"亻","p":"dānrénpáng","en":"person","sw":"mtu","note":"单人旁 — 你 nǐ, 他 tā"},{"zh":"口","p":"kǒuzìpáng","en":"mouth","sw":"mdomo","note":"口字旁 — 吃 chī, 喝 hē"},{"zh":"女","p":"nǚzìpáng","en":"woman","sw":"mwanamke","note":"女字旁 — 妈 mā, 姐 jiě"},{"zh":"子","p":"zǐzìpáng","en":"child","sw":"mtoto","note":"子字旁 — 孩 hái, 学 xué"},{"zh":"氵","p":"sāndiǎnshuǐ","en":"water","sw":"maji","note":"三点水 — 河 hé, 海 hǎi"},{"zh":"冫","p":"liǎngdiǎnshuǐ","en":"ice; cold","sw":"barafu; baridi","note":"两点水 — 冷 lěng, 冰 bīng"},{"zh":"木","p":"mùzìpáng","en":"tree; wood","sw":"mti; mbao","note":"木字旁 — 林 lín, 树 shù"},{"zh":"艹","p":"cǎozìtóu","en":"grass; plant","sw":"nyasi; mmea","note":"草字头 — 草 cǎo, 茶 chá"},{"zh":"日","p":"rìzìpáng","en":"sun; day","sw":"jua; siku","note":"日字旁 — 明 míng, 早 zǎo"},{"zh":"月","p":"yuèzìpáng","en":"moon; flesh (body)","sw":"mwezi; nyama (mwili)","note":"月字旁 — 朋 péng, 脸 liǎn"}],"zh":"每一项包括：部首、拼音名称、意义、汉字名称和两个例字。","h_sw":"Vijenzi 40 vya kawaida (1): 1–10"},{"h":"40个常用部首（二）Radicals 11–20","en":"Hand, speech, heart, roof, door, thread, metal, food and movement.","sw":"Mkono, maneno, moyo, paa, mlango, uzi, chuma, chakula na mwendo.","examples":[{"zh":"扌","p":"tíshǒupáng","en":"hand","sw":"mkono","note":"提手旁 — 打 dǎ, 找 zhǎo"},{"zh":"讠","p":"yánzìpáng","en":"speech; words","sw":"maneno; kusema","note":"言字旁 — 说 shuō, 话 huà"},{"zh":"忄","p":"shùxīnpáng","en":"heart; feeling","sw":"moyo; hisia","note":"竖心旁 — 忙 máng, 快 kuài"},{"zh":"心","p":"xīnzìdǐ","en":"heart; feeling","sw":"moyo; hisia","note":"心字底 — 想 xiǎng, 忘 wàng"},{"zh":"宀","p":"bǎogàitóu","en":"roof; house","sw":"paa; nyumba","note":"宝盖头 — 家 jiā, 字 zì"},{"zh":"门","p":"ménzìkuàng","en":"door; gate","sw":"mlango","note":"门字框 — 问 wèn, 间 jiān"},{"zh":"纟","p":"jiǎosīpáng","en":"silk; thread","sw":"hariri; uzi","note":"绞丝旁 — 红 hóng, 绿 lǜ"},{"zh":"钅","p":"jīnzìpáng","en":"metal; gold","sw":"chuma; dhahabu","note":"金字旁 — 钱 qián, 银 yín"},{"zh":"饣","p":"shízìpáng","en":"food; eating","sw":"chakula; kula","note":"食字旁 — 饭 fàn, 饿 è"},{"zh":"辶","p":"zǒuzhīdǐ","en":"walking; movement","sw":"kutembea; mwendo","note":"走之底 — 这 zhè, 远 yuǎn"}],"zh":"手、言语、心、屋顶、门、丝线、金属、食物和行走。","h_sw":"Vijenzi 40 vya kawaida (2): 11–20"},{"h":"40个常用部首（三）Radicals 21–30","en":"Body and nature: foot, earth, fire, rain, eye, ear, head, clothing.","sw":"Mwili na mazingira: mguu, ardhi, moto, mvua, jicho, sikio, kichwa, nguo.","examples":[{"zh":"⻊","p":"zúzìpáng","en":"foot","sw":"mguu","note":"足字旁 — 跑 pǎo, 路 lù"},{"zh":"土","p":"títǔpáng","en":"earth; soil","sw":"ardhi; udongo","note":"提土旁 — 地 dì, 坐 zuò"},{"zh":"火","p":"huǒzìpáng","en":"fire","sw":"moto","note":"火字旁 — 灯 dēng, 烧 shāo"},{"zh":"灬","p":"sìdiǎndǐ","en":"fire (at the bottom)","sw":"moto (chini ya herufi)","note":"四点底 — 热 rè, 点 diǎn"},{"zh":"雨","p":"yǔzìtóu","en":"rain; weather","sw":"mvua; hali ya hewa","note":"雨字头 — 雪 xuě, 零 líng"},{"zh":"目","p":"mùzìpáng","en":"eye","sw":"jicho","note":"目字旁 — 看 kàn, 眼 yǎn"},{"zh":"耳","p":"ěrzìpáng","en":"ear","sw":"sikio","note":"耳字旁 — 聊 liáo, 职 zhí"},{"zh":"页","p":"yèzìpáng","en":"head; page","sw":"kichwa; ukurasa","note":"页字旁 — 题 tí, 颜 yán"},{"zh":"衤","p":"yīzìpáng","en":"clothing","sw":"nguo","note":"衣字旁 — 衬 chèn, 裤 kù"},{"zh":"礻","p":"shìzìpáng","en":"ritual; blessing","sw":"ibada; baraka","note":"示字旁 — 礼 lǐ, 视 shì"}],"zh":"身体与自然：脚、土、火、雨、眼睛、耳朵、头、衣服。","h_sw":"Vijenzi 40 vya kawaida (3): 21–30"},{"h":"40个常用部首（四）Radicals 31–40","en":"Tools, money, animals, food and illness. Note: 阝 on the LEFT (阳) and on the RIGHT (那) are two different radicals that look the same.","sw":"Zana, pesa, wanyama, chakula na ugonjwa. Kumbuka: 阝 upande wa KUSHOTO (阳) na upande wa KULIA (那) ni vijenzi viwili tofauti vinavyofanana.","examples":[{"zh":"刂","p":"lìdāopáng","en":"knife","sw":"kisu","note":"立刀旁 — 到 dào, 别 bié"},{"zh":"力","p":"lìzìpáng","en":"strength","sw":"nguvu","note":"力字旁 — 动 dòng, 加 jiā"},{"zh":"贝","p":"bèizìpáng","en":"shell; money","sw":"kombe; pesa","note":"贝字旁 — 贵 guì, 货 huò"},{"zh":"车","p":"chēzìpáng","en":"vehicle","sw":"gari","note":"车字旁 — 辆 liàng, 轮 lún"},{"zh":"马","p":"mǎzìpáng","en":"horse","sw":"farasi","note":"马字旁 — 骑 qí, 驾 jià"},{"zh":"鸟","p":"niǎozìpáng","en":"bird","sw":"ndege (mnyama)","note":"鸟字旁 — 鸡 jī, 鸭 yā"},{"zh":"犭","p":"fǎnquǎnpáng","en":"animal (dog)","sw":"mnyama (mbwa)","note":"反犬旁 — 狗 gǒu, 猫 māo"},{"zh":"米","p":"mǐzìpáng","en":"rice; grain","sw":"mchele; nafaka","note":"米字旁 — 糖 táng, 粥 zhōu"},{"zh":"疒","p":"bìngzìpáng","en":"illness","sw":"ugonjwa","note":"病字旁 — 病 bìng, 疼 téng"},{"zh":"阝","p":"zuǒ'ěrpáng / yòu'ěrpáng","en":"mound (left side) / city (right side)","sw":"kilima (kushoto) / mji (kulia)","note":"左耳旁 / 右耳旁 — 阳 yáng (left), 那 nà (right)","note_sw":"左耳旁 / 右耳旁 — 阳 yáng (kushoto), 那 nà (kulia)","note_zh":"左耳旁 / 右耳旁——阳（在左）、那（在右）"}],"zh":"工具、钱财、动物、粮食和疾病。注意：在左边的 阝（阳）和在右边的 阝（那）样子相同，但是两个不同的部首。","h_sw":"Vijenzi 40 vya kawaida (4): 31–40"}],"practice":[{"t":"mcq","q":"What is the structure of 你?","o":["左右 (left-right)","上下 (top-bottom)","全包围 (fully enclosed)"],"a":0,"tag":"characters","ex":"亻 on the left, 尔 on the right.","q_sw":"Muundo wa 你 ni upi?","q_zh":"“你”是什么结构？","ex_sw":"亻 kushoto, 尔 kulia.","ex_zh":"亻在左，尔在右。","o_sw":["左右 (kushoto-kulia)","上下 (juu-chini)","全包围 (imezungukwa kabisa)"],"o_zh":["左右结构","上下结构","全包围结构"]},{"t":"mcq","q":"What is the structure of 国?","o":["半包围","全包围","上下"],"a":1,"tag":"characters","ex":"囗 closes all four sides.","q_sw":"Muundo wa 国 ni upi?","q_zh":"“国”是什么结构？","ex_sw":"囗 inafunga pande zote nne.","ex_zh":"囗 把四面都封住。"},{"t":"mcq","q":"What is the structure of 字?","o":["左右","上下","左中右"],"a":1,"tag":"characters","ex":"宀 on top, 子 below.","q_sw":"Muundo wa 字 ni upi?","q_zh":"“字”是什么结构？","ex_sw":"宀 juu, 子 chini.","ex_zh":"宀在上，子在下。"},{"t":"mcq","q":"What is the structure of 谢?","o":["左右","上中下","左中右"],"a":2,"tag":"characters","ex":"讠 + 身 + 寸: left-middle-right.","q_sw":"Muundo wa 谢 ni upi?","q_zh":"“谢”是什么结构？","ex_sw":"讠 + 身 + 寸: kushoto-katikati-kulia.","ex_zh":"讠 + 身 + 寸：左中右结构。"},{"t":"mcq","q":"What is the structure of 这?","o":["半包围","全包围","独体"],"a":0,"tag":"characters","ex":"辶 wraps around two sides.","q_sw":"Muundo wa 这 ni upi?","q_zh":"“这”是什么结构？","ex_sw":"辶 inazunguka pande mbili.","ex_zh":"辶 包住两面。"},{"t":"mcq","q":"The radical 氵 is about…","o":["water","fire","hand"],"a":0,"tag":"characters","ex":"氵 三点水 = water: 河, 海.","q_sw":"Kijenzi 氵 kinahusu…","q_zh":"部首 氵 和什么有关？","ex_sw":"氵 三点水 = maji: 河, 海.","ex_zh":"氵 三点水 = 水：河、海。","o_sw":["maji","moto","mkono"],"o_zh":["水","火","手"]},{"t":"mcq","q":"Which character is most likely about speaking?","o":["说","跑","树"],"a":0,"tag":"characters","ex":"说 has 讠 (speech).","q_sw":"Herufi ipi ina uwezekano mkubwa wa kuhusu kusema?","q_zh":"哪个字最可能和说话有关？","ex_sw":"说 ina 讠 (maneno).","ex_zh":"“说”有言字旁 讠。"},{"t":"mcq","q":"What is the radical of 病 (ill)?","o":["疒","丙","广"],"a":0,"tag":"characters","ex":"疒 病字旁 = illness.","q_sw":"Kijenzi cha 病 (ugonjwa) ni kipi?","q_zh":"“病”的部首是什么？","ex_sw":"疒 病字旁 = ugonjwa.","ex_zh":"疒 病字旁 = 疾病。"},{"t":"mcq","q":"Characters with 钅 are usually about…","o":["metal or money","food","trees"],"a":0,"tag":"characters","ex":"钅 金字旁: 钱 money, 银 silver.","q_sw":"Herufi zenye 钅 kwa kawaida zinahusu…","q_zh":"带 钅 的字通常和什么有关？","ex_sw":"钅 金字旁: 钱 pesa, 银 fedha.","ex_zh":"钅 金字旁：钱、银。","o_sw":["chuma au pesa","chakula","miti"],"o_zh":["金属或钱","食物","树木"]},{"t":"match","pairs":[["亻","person"],["氵","water"],["扌","hand"],["口","mouth"],["木","tree"]],"tag":"characters","ex":"Five very common radicals.","ex_sw":"Vijenzi vitano vinavyotumika sana.","ex_zh":"五个非常常用的部首。","pairs_sw":[["亻","mtu"],["氵","maji"],["扌","mkono"],["口","mdomo"],["木","mti"]]},{"t":"hanzi","q":"mā (mother) — it has the 女 radical","a":["妈"],"tag":"characters","ex":"妈 = 女 + 马.","q_sw":"mā (mama) — ina kijenzi 女","q_zh":"mā（妈）——有女字旁","ex_sw":"妈 = 女 + 马.","ex_zh":"妈 = 女 + 马。"}]},{"id":"P9","title_zh":"课堂用语","title_en":"Classroom Chinese for teachers","title_sw":"Lugha ya darasani kwa walimu","intro":{"en":"Use these short phrases every lesson so that students hear real Chinese from the first day. Say the Chinese first, with a gesture; add Kiswahili only if students do not understand.","sw":"Tumia vifungu hivi vifupi kila kipindi ili wanafunzi wasikie Kichina halisi tangu siku ya kwanza. Sema Kichina kwanza, pamoja na ishara; ongeza Kiswahili tu ikiwa wanafunzi hawaelewi.","zh":"每节课都用这些简短的话，让学生从第一天起就听到真正的汉语。先说汉语，配合手势；只有学生听不懂时才补充斯瓦希里语。"},"sections":[{"h":"上课 Starting the lesson","en":"Greetings and taking the register.","sw":"Salamu na kuita majina.","examples":[{"zh":"上课！","p":"Shàngkè!","en":"Class begins!","sw":"Tuanze somo!"},{"zh":"同学们好！","p":"Tóngxuémen hǎo!","en":"Hello, everyone!","sw":"Habari zenu, wanafunzi!"},{"zh":"老师好！","p":"Lǎoshī hǎo!","en":"Hello, teacher! (students' reply)","sw":"Habari, mwalimu! (jibu la wanafunzi)"},{"zh":"请坐。","p":"Qǐng zuò.","en":"Please sit down.","sw":"Tafadhali kaeni."},{"zh":"现在点名。","p":"Xiànzài diǎnmíng.","en":"Now I will call the register.","sw":"Sasa ninaita majina."},{"zh":"到！","p":"Dào!","en":"Here! (answer to the register)","sw":"Nipo!"}],"zh":"问候和点名。","h_sw":"Kuanza somo"},{"h":"指令 Instructions","en":"Tell students what to do.","sw":"Waambie wanafunzi la kufanya.","examples":[{"zh":"请打开书。","p":"Qǐng dǎkāi shū.","en":"Please open your books.","sw":"Tafadhali fungueni vitabu."},{"zh":"请看第十页。","p":"Qǐng kàn dì-shí yè.","en":"Please look at page ten.","sw":"Tafadhali angalieni ukurasa wa kumi."},{"zh":"请合上书。","p":"Qǐng héshàng shū.","en":"Please close your books.","sw":"Tafadhali fungeni vitabu."},{"zh":"请听我说。","p":"Qǐng tīng wǒ shuō.","en":"Please listen to me.","sw":"Tafadhali nisikilizeni."},{"zh":"请跟我读。","p":"Qǐng gēn wǒ dú.","en":"Please read after me.","sw":"Tafadhali someni baada yangu."},{"zh":"再说一遍。","p":"Zài shuō yí biàn.","en":"Say it again.","sw":"Sema tena."},{"zh":"大声一点儿。","p":"Dàshēng yìdiǎnr.","en":"A bit louder, please.","sw":"Kwa sauti kubwa zaidi."},{"zh":"一起读。","p":"Yìqǐ dú.","en":"Read together.","sw":"Someni pamoja."},{"zh":"请看黑板。","p":"Qǐng kàn hēibǎn.","en":"Please look at the board.","sw":"Tafadhali angalieni ubaoni."},{"zh":"请写下来。","p":"Qǐng xiě xiàlai.","en":"Please write it down.","sw":"Tafadhali iandikeni."},{"zh":"两个人一组。","p":"Liǎng ge rén yì zǔ.","en":"Work in pairs.","sw":"Fanyeni kazi wawili wawili."},{"zh":"请举手。","p":"Qǐng jǔ shǒu.","en":"Please raise your hand.","sw":"Tafadhali nyoosheni mkono."},{"zh":"安静！","p":"Ānjìng!","en":"Quiet, please!","sw":"Kimya!"},{"zh":"请回答。","p":"Qǐng huídá.","en":"Please answer.","sw":"Tafadhali jibu."}],"zh":"告诉学生要做什么。","h_sw":"Maagizo"},{"h":"表扬和反馈 Praise and feedback","en":"Short, positive feedback keeps students speaking.","sw":"Maoni mafupi na mazuri huwafanya wanafunzi waendelee kuzungumza.","examples":[{"zh":"很好！","p":"Hěn hǎo!","en":"Very good!","sw":"Vizuri sana!"},{"zh":"对。","p":"Duì.","en":"Correct.","sw":"Sahihi."},{"zh":"不对。","p":"Bú duì.","en":"Not correct.","sw":"Si sahihi."},{"zh":"太棒了！","p":"Tài bàng le!","en":"Excellent!","sw":"Hodari sana!"},{"zh":"加油！","p":"Jiāyóu!","en":"Keep going! You can d Z.duo=function(items,key,label,opt){opt=opt||{};items=items.filter(function(it){return it&&it.t;});if(!items.length){toast("—");return;}
  var queue=opt.noShuffle?items.slice():shuffle(items);if(opt.max)queue=queue.slice(0,opt.max);var total=queue.length,idx=0,right=0,hearts=opt.hearts||5,xp=0,wrong=[];
  var o=h("div",{class:"overlay"});var box=h("div",{class:"duo"});o.appendChild(box);document.body.appendChild(o);
  box.innerHTML='<div class="hd"><button class="x">✕</button><div class="prog"><i style="width:0"></i></div><span class="hearts">❤ '+hearts+'</span><span class="xp">⭐ 0</span></div><div class="body"></div><div class="ft"><span class="msg"></span><button class="btn go">'+Z.L("检查","Angalia","Check")+"</button></div>";
  var body=$(".body",box),ft=$(".ft",box),go=$(".go",box),msg=$(".msg",box);$(".x",box).onclick=function(){Z.stop();o.remove();};

  function end(){P.rec(key,right,total,label);P.xp(xp);P.sessInc();Z.stop();var pct=Math.round(right/total*100);body.innerHTML='<div class="big">'+(pct>=80?"🏆":pct>=50?"👍":"💪")+'</div><h2 style="text-align:center">'+right+" / "+total+" · "+pct+'%</h2><p style="text-align:center">⭐ +'+xp+" XP · 🔥 "+P.streak()+" "+Z.L("天连续","siku mfululizo","day streak")+"</p>"+(wrong.length?"<h3>"+Z.L("错题复习","Rudia makosa","Review mistakes")+"</h3>"+wrong.map(function(it){return '<div class="q">'+qText(it)+'<div class="fb show info">🔑 '+esc(keyText(it))+" "+exHTML(it)+"</div></div>";}).join(""):"");ft.innerHTML="";var again=h("button",{class:"btn"},"↻ "+Z.L("再来一次","Tena","Again"));again.onclick=function(){o.remove();Z.duo(items,key,label,opt);};var close=h("button",{class:"btn alt"},"✓ "+Z.L("完成","Maliza","Done"));close.onclick=function(){o.remove();opt.onEnd&&opt.onEnd(right,total);};ft.appendChild(again);ft.appendChild(close);$(".prog i",box).style.width="100%";}
  go.onclick=function(){if(state==="ask"){var it=queue[idx];var r=null;if(curEl._check)r=curEl._check();if(!Z.isAuto(it)){r=null;}
      if(r===true){right++;xp+=2;ft.className="ft ok";msg.innerHTML="✓ "+Z.L("太棒了！","Safi sana!","Great!");if(opt.srs&&it._w)P.srsSet(it._w,true);}

/* ---------- drills from a vocabulary list ---------- */
Z.drillItems=function(words,n){var W=words.filter(function(w){return w&&w.h;});if(W.length<3)return [];var out=[];var pick=shuffle(W).slice(0,Math.min(n||10,W.length));
  pick.forEach(function(w,i){var others=shuffle(W.filter(function(x){return x.h!==w.h;})).slice(0,3);var kind=i%5;var mean=function(x){return x.sw||x.en;};
    if(kind===0){var o=shuffle([w].concat(others));out.push({t:"listen",audio:w.h,q_zh:"听一听，选汉字",q_sw:"Sikiliza, chagua herufi",q:"Listen and choose",o:o.map(function(x){return x.h;}),a:o.indexOf(w),_w:w.h});}
    else if(kind===1){var o2=shuffle([w].concat(others));out.push({t:"mcq",q:w.h,q_zh:"「"+w.h+"」是什么意思？",q_sw:"「"+w.h+"」 maana yake ni nini?",o:o2.map(mean),a:o2.indexOf(w),_w:w.h,ex:w.p+" · "+w.en,ex_sw:w.p+" · "+(w.sw||"")});}
    else if(kind===2){var o3=shuffle([w].concat(others));out.push({t:"mcq",q:mean(w),q_zh:"哪个汉字是：",q_sw:"Kichina cha: "+mean(w),o:o3.map(function(x){return x.h;}),a:o3.indexOf(w),_w:w.h,ex:w.p});}
    else if(kind===3){var o4=shuffle([w].concat(others));out.push({t:"mcq",q:w.p,q_zh:"看拼音，选汉字",q_sw:"Soma pinyin, chagua herufi",o:o4.map(function(x){return x.h;}),a:o4.indexOf(w),_w:w.h});}
    else{out.push({t:"pinyin",q:w.h,q_zh:"写出拼音（可用数字表示声调：ni3）",q_sw:"Andika pinyin (toni kwa namba: ni3)",a:w.p,_w:w.h,ex:w.p});}});
  if(pick.length>=4){var mp=shuffle(pick).slice(0,5);out.push({t:"match",q_zh:"配对",q_sw:"Linganisha",pairs:mp.map(function(w){return [w.h,w.sw||w.en];})});}
  return out;};
