<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音与汉字 · 汉语教师自学课程 · SAY AI Lab</title><meta name="description" content="Matamshi na herufi · Kozi ya kujisomea kwa walimu wa Kichina · Pronunciation & characters · self-study for Chinese teachers">
<style>:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#63706a;--line:#dfe5e0;--pri:#128c5a;--pri2:#0e6e47;--acc:#e0a526;--bad:#d64541;--good:#1fa463;--soft:#e8f5ee;--red:#c0392b;--blue:#2d6cdf;--r:14px}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e6efe9;--mut:#9aa9a1;--line:#2f3a34;--soft:#1f3a2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e6efe9;--mut:#9aa9a1;--line:#2f3a34;--soft:#1f3a2c}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:var(--pri)}button{font:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--pri2);color:#fff;box-shadow:0 2px 8px #0002}
.top .in{max-width:1100px;margin:auto;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}.top h1 small{opacity:.8;font-weight:400;font-size:12px;display:block}
.top nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.top nav button,.top nav a{background:#ffffff1a;color:#fff;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:14px;text-decoration:none}
.top nav button.on{background:#fff;color:var(--pri2);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1100px;margin:8px auto 0;padding:0 14px;font-size:13px;color:var(--mut)}
.bar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.bar .who{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
main{max-width:1100px;margin:auto;padding:12px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:20px}.card h3{margin:14px 0 6px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.tile .n{font-size:12px;color:var(--mut)}.tile .t{font-size:17px;font-weight:700}.tile .s{font-size:13px;color:var(--mut)}
.tile .done{float:right;font-size:12px;background:var(--soft);color:var(--pri2);border-radius:999px;padding:1px 8px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--pri2);margin:2px 4px 2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600;font-size:15px}
.btn.alt{background:var(--card);color:var(--pri2);border:1.5px solid var(--pri)}.btn.warn{background:var(--acc);color:#222}.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.play{border:0;background:var(--soft);color:var(--pri2);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:13px;flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.play:hover{background:var(--pri);color:#fff}.play.slow{width:auto;padding:0 8px;font-size:11px}
.zh{font-size:1.05em}.py{color:var(--blue);font-size:.9em}.sw{color:#8a5a00}.en{color:var(--mut);font-size:.88em}
:root[data-theme="dark"] .sw{color:#e8b64c}
.hide-en .en,.hide-py .py,.hide-sw .sw{display:none!important}
.tri>span{display:block}.tri.inl>span{display:inline;margin-right:8px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.word{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;background:var(--card)}
.word .h{font-size:26px;line-height:1.1;cursor:pointer}.word .h:hover{color:var(--red)}
.word .img{font-size:26px}
.line{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.line .spk{font-weight:700;color:var(--pri2);min-width:3.2em}
.line .zh{font-size:19px}
.line.on{background:#fff6d6}:root[data-theme="dark"] .line.on{background:#3a3520}
.gram{border-left:4px solid var(--acc);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}
.gram .pat{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 8px;border-radius:6px;display:inline-block;margin:4px 0}
.mis{font-size:14px;margin-top:6px}.mis .w{color:var(--bad);text-decoration:line-through}.mis .r{color:var(--good);font-weight:600}
.tbox{background:#fff9e8;border:1px solid #f0d58a;border-radius:12px;padding:10px 14px;margin:10px 0}
:root[data-theme="dark"] .tbox{background:#2d2816;border-color:#6b5a26}
.tbox h4{margin:0 0 4px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.q .qn{font-weight:700;color:var(--mut);margin-right:6px}
.q .opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:17px;min-width:44px}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--blue);background:#eaf1ff}
:root[data-theme="dark"] .opt.sel{background:#1c2c4a}
.opt.ok{border-color:var(--good);background:#e3f7ea;color:#0b5a2f}.opt.no{border-color:var(--bad);background:#fde8e7;color:#8c1d19}
.q input[type=text],.q textarea,.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:17px;width:100%;max-width:520px;background:var(--card);color:var(--ink)}
.q textarea{min-height:90px;max-width:100%}
.fb{margin-top:6px;font-size:14px;border-radius:8px;padding:6px 10px;display:none}
.fb.show{display:block}.fb.ok{background:#e3f7ea;color:#0b5a2f}.fb.no{background:#fde8e7;color:#8c1d19}.fb.info{background:var(--soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border:1.5px dashed var(--line);border-radius:10px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:18px;color:var(--ink)}
.chip.used{opacity:.25;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:560px}
.match .opt{width:100%;text-align:left}.match .opt.gone{visibility:hidden}
.score{font-size:15px;font-weight:700}
.keyhide .key{display:none}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.duo{background:var(--card);width:min(720px,100%);max-height:96vh;overflow:auto;border-radius:18px;padding:14px 16px;position:relative}
.duo .hd{display:flex;align-items:center;gap:10px}
.duo .prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}.duo .prog i{display:block;height:100%;background:var(--good);transition:.3s}
.duo .hearts{color:var(--bad);font-weight:700;white-space:nowrap}.duo .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.duo .body{min-height:250px;padding:10px 0}
.duo .ft{position:sticky;bottom:0;background:var(--card);padding-top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.duo .ft.ok{background:#e3f7ea}.duo .ft.no{background:#fde8e7}
:root[data-theme="dark"] .duo .ft.ok{background:#173726}:root[data-theme="dark"] .duo .ft.no{background:#3b1a19}
.big{font-size:34px;text-align:center;margin:10px 0}
.hz{display:inline-block;width:110px;height:110px;margin:4px;background:#fff;border:2px solid #333;position:relative}
.hz svg.grid{position:absolute;inset:0}
.hzwrap{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.hzbox{text-align:center;font-size:12px}
table.t{border-collapse:collapse;width:100%;font-size:14px}table.t td,table.t th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.pytab{overflow:auto;max-height:520px}.pytab td{text-align:center;cursor:pointer;font-size:13px;padding:3px}.pytab td:hover{background:var(--soft)}
.muted{color:var(--mut);font-size:14px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.timer{font:700 28px ui-monospace,monospace;color:var(--pri2)}
.step{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.step .m{min-width:48px;font-weight:700;color:var(--acc)}
.step.cur{background:var(--soft)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.xp{font-weight:700;color:var(--acc)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.node{width:78px;height:78px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 var(--pri2);position:relative}
.node.lock{background:#b8c2bc;box-shadow:0 6px 0 #8e9892}.node.gold{background:var(--acc);box-shadow:0 6px 0 #a67a14;color:#222}
.node small{display:block;font-weight:400;font-size:11px}
.pathrow{display:flex;gap:16px;align-items:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:999px;z-index:99;font-size:14px}
video{max-width:100%;border-radius:10px;background:#000}
.lib li{margin:3px 0}
@media (max-width:600px){.top h1{font-size:15px}.line .zh{font-size:17px}.word .h{font-size:22px}.hz{width:92px;height:92px}.match{grid-template-columns:1fr 1fr}}
@media print{.top,.bar,.noprint,.btn,.play,.tabs{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.q{break-inside:avoid}.keyhide .key{display:none}.printkey .key{display:block!important}}
.btn .sw,.btn .en,.tabs button.on .sw,.tabs button.on .en,.node .sw{color:inherit!important;opacity:.85}
.btn.alt .sw{color:#8a5a00!important}
.tabs button .en,.btn .en{font-size:.8em}
@media (max-width:600px){.top{position:static}.top nav a{font-size:12px;padding:4px 8px}}

<script>window.D={"page":"found","FOUND":{"modules":[{"id":"P1","title_zh":"声调","title_en":"The four tones and the neutral tone","title_sw":"Toni nne na toni hafifu","intro":{"en":"Mandarin is a tone language: the pitch of your voice changes the meaning of a syllable. mā (mother) and mǎ (horse) have the same sounds but different tones. Learn the four tones and the neutral tone first — everything else is built on them.","sw":"Kichina ni lugha ya toni: kupanda na kushuka kwa sauti kunabadilisha maana ya silabi. mā (mama) na mǎ (farasi) zina sauti zilezile lakini toni tofauti. Jifunze toni nne na toni hafifu kwanza — kila kitu kingine kinajengwa juu yake.","zh":"汉语是声调语言：声音的高低变化会改变音节的意思。mā（妈妈）和 mǎ（马）声母韵母相同，只是声调不同。请先学会四个声调和轻声——其他内容都建立在声调之上。"},"sections":[{"h":"什么是声调？ What is a tone?","en":"A tone is the pitch pattern of a syllable. Teachers describe pitch on a scale from 1 (lowest) to 5 (highest). In Pinyin the tone is written as a mark above the main vowel: ā á ǎ à. A syllable with no mark has the neutral tone. The classic example below shows five different words made from the same sounds 'ma'.","sw":"Toni ni mwelekeo wa sauti ya silabi (juu, chini, kupanda au kushuka). Walimu hupima sauti kwa kipimo cha 1 (chini kabisa) hadi 5 (juu kabisa). Katika Pinyin toni huandikwa kwa alama juu ya irabu kuu: ā á ǎ à. Silabi isiyo na alama ina toni hafifu. Mfano maarufu hapa chini unaonyesha maneno matano tofauti yenye sauti moja 'ma'.","examples":[{"zh":"妈","p":"mā","en":"mother","note":"1st tone — high and level","sw":"mama","note_sw":"toni ya 1 — juu na sawasawa","note_zh":"第一声——高而平"},{"zh":"麻","p":"má","en":"hemp; numb","note":"2nd tone — rising","sw":"katani; kufa ganzi","note_sw":"toni ya 2 — inapanda","note_zh":"第二声——上升"},{"zh":"马","p":"mǎ","en":"horse","note":"3rd tone — low, dipping","sw":"farasi","note_sw":"toni ya 3 — chini, inashuka kidogo","note_zh":"第三声——低，先降后升"},{"zh":"骂","p":"mà","en":"to scold","note":"4th tone — falling","sw":"kukemea","note_sw":"toni ya 4 — inashuka","note_zh":"第四声——下降"},{"zh":"吗","p":"ma","en":"question particle","note":"neutral tone — short and light","sw":"kiambishi cha swali","note_sw":"toni hafifu — fupi na nyepesi","note_zh":"轻声——短而轻"}],"zh":"声调就是一个音节的音高变化。老师用 1（最低）到 5（最高）的五度来描述音高。拼音把声调符号标在主要元音上面：ā á ǎ à。没有符号的音节是轻声。下面这个经典例子里，同样的声音 'ma' 组成了五个不同的词。","h_sw":"Toni ni nini?"},{"h":"第一声 1st tone (55) ˉ","en":"High and level, like holding one long note when you sing. Start high (level 5) and stay there. Hand gesture: move your hand straight across at eye level. Common mistake: starting too low or letting the pitch drop at the end.","sw":"Juu na sawasawa, kama kuimba noti moja ndefu. Anza juu (kiwango 5) na ubaki hapo. Ishara ya mkono: sogeza mkono moja kwa moja kwa usawa wa macho. Kosa la kawaida: kuanza chini sana au kuacha sauti ishuke mwishoni.","examples":[{"zh":"八","p":"bā","en":"eight","sw":"nane"},{"zh":"天","p":"tiān","en":"sky; day","sw":"anga; siku"},{"zh":"书","p":"shū","en":"book","sw":"kitabu"}],"zh":"高而平，像唱歌时拉长一个音。从高处（5 度）开始并一直保持。手势：手在眼睛高度平着向前移动。常见错误：起音太低，或者结尾时音高往下掉。","h_sw":"Toni ya 1 (55) ˉ"},{"h":"第二声 2nd tone (35) ˊ","en":"Rising from the middle to the top, like the surprised question 'Eh?' or English 'What?'. Hand gesture: move your hand up diagonally from chest to forehead. Make sure the rise continues to the very end of the syllable.","sw":"Inapanda kutoka katikati hadi juu, kama swali la mshangao 'Eh?'. Ishara ya mkono: panda mkono kwa mshazari kutoka kifuani hadi pajini. Hakikisha sauti inaendelea kupanda hadi mwisho wa silabi.","examples":[{"zh":"茶","p":"chá","en":"tea","sw":"chai"},{"zh":"人","p":"rén","en":"person","sw":"mtu"},{"zh":"学","p":"xué","en":"to study","sw":"kusoma; kujifunza"}],"zh":"从中间升到最高，像吃惊时问“嗯？”或英语的 'What?'。手势：手从胸口斜着向上移到额头。一定要让声音一直升到音节结束。","h_sw":"Toni ya 2 (35) ˊ"},{"h":"第三声 3rd tone (214) ˇ","en":"Low, dipping down and (when said alone or at the end of a sentence) rising again. Hand gesture: hand goes down a little, stays low, then comes up. In normal speech, a 3rd tone before another syllable is usually only the low part (21) — see module P5. Keep it relaxed and low; many learners make it too high.","sw":"Chini, inashuka kidogo kisha (ikitamkwa peke yake au mwisho wa sentensi) inapanda tena. Ishara ya mkono: mkono unashuka kidogo, unabaki chini, kisha unapanda. Katika mazungumzo ya kawaida, toni ya tatu kabla ya silabi nyingine mara nyingi ni sehemu ya chini tu (21) — angalia moduli P5. Iweke chini na tulivu; wanafunzi wengi huitamka juu mno.","examples":[{"zh":"我","p":"wǒ","en":"I; me","sw":"mimi"},{"zh":"好","p":"hǎo","en":"good","sw":"nzuri"},{"zh":"水","p":"shuǐ","en":"water","sw":"maji"}],"zh":"低，先往下降，（单独读或在句末时）再升上来。手势：手先往下一点，停在低处，再往上抬。在平常说话中，第三声后面还有别的音节时，通常只读低的部分（21）——见 P5 单元。要读得放松、够低；很多学生读得太高。","h_sw":"Toni ya 3 (214) ˇ"},{"h":"第四声 4th tone (51) ˋ","en":"Falling sharply from the top to the bottom, like a firm command 'Stop!' or 'Njoo!'. Hand gesture: chop your hand down quickly. It is short and strong.","sw":"Inashuka kwa nguvu kutoka juu hadi chini, kama amri thabiti 'Njoo!' au 'Simama!'. Ishara ya mkono: shusha mkono chini haraka kama kukata. Ni fupi na yenye nguvu.","examples":[{"zh":"是","p":"shì","en":"to be","sw":"kuwa; ni"},{"zh":"大","p":"dà","en":"big","sw":"kubwa"},{"zh":"四","p":"sì","en":"four","sw":"nne"}],"zh":"从最高处快速降到最低，像坚决的命令“站住！”或斯瓦希里语的 'Njoo!'。手势：手迅速往下一劈。第四声短而有力。","h_sw":"Toni ya 4 (51) ˋ"},{"h":"轻声 The neutral tone","en":"Some syllables are short, light and unstressed. They have no tone mark. Particles such as 吗 ma, 呢 ne, 的 de, and the second syllable of many words (妈妈 māma) are neutral. Do not give them a full tone; say them quickly and softly.","sw":"Silabi fulani ni fupi, nyepesi na hazina mkazo. Hazina alama ya toni. Viambishi kama 吗 ma, 呢 ne, 的 de, na silabi ya pili ya maneno mengi (妈妈 māma) zina toni hafifu. Usizipe toni kamili; zitamke haraka na kwa upole.","examples":[{"zh":"吗","p":"ma","en":"question particle","sw":"kiambishi cha swali"},{"zh":"呢","p":"ne","en":"particle: 'and …?'","sw":"kiambishi: 'na …je?'"},{"zh":"妈妈","p":"māma","en":"mum","sw":"mama"},{"zh":"爸爸","p":"bàba","en":"dad","sw":"baba"}],"zh":"有些音节又短又轻，不重读，也不标声调符号。吗 ma、呢 ne、的 de 等助词，以及很多词的第二个音节（妈妈 māma）都读轻声。不要给它们读完整的声调，要读得快而轻。","h_sw":"Toni hafifu"},{"h":"给说斯瓦希里语的人的建议 Tips for Kiswahili speakers","en":"Kiswahili has no word tones: the meaning of 'kaka' does not change if you say it high or low, and stress falls on the second-to-last syllable. In Chinese, pitch IS part of the word, and there is no fixed stress. So: (1) learn every new word together with its tone, never 'the sounds first, tones later'; (2) exaggerate the tones and use the hand gestures while practising; (3) do not put Kiswahili stress on the second-to-last syllable of Chinese words; (4) record yourself and compare with the audio; (5) practise tones in two-syllable words (see the tone-pair list), because that is how they appear in real speech.","sw":"Kiswahili hakina toni za maneno: maana ya 'kaka' haibadiliki ukiisema juu au chini, na mkazo huwa kwenye silabi ya pili kutoka mwisho. Katika Kichina, toni NI sehemu ya neno, na hakuna mkazo maalum. Kwa hiyo: (1) jifunze kila neno jipya pamoja na toni yake, si 'sauti kwanza, toni baadaye'; (2) kuza toni na tumia ishara za mkono unapofanya mazoezi; (3) usiweke mkazo wa Kiswahili kwenye silabi ya pili kutoka mwisho ya maneno ya Kichina; (4) jirekodi na ulinganishe na sauti ya mfano; (5) fanya mazoezi ya toni katika maneno ya silabi mbili (angalia orodha ya jozi za toni), kwa sababu ndivyo zinavyotumika katika mazungumzo halisi.","examples":[{"zh":"你好","p":"nǐ hǎo","en":"hello","note":"3+3: said ní hǎo (see P5)","sw":"habari; hujambo","note_sw":"3+3: hutamkwa ní hǎo (angalia P5)","note_zh":"3+3：读作 ní hǎo（见 P5）"},{"zh":"老师","p":"lǎoshī","en":"teacher","note":"3+1","sw":"mwalimu"},{"zh":"谢谢","p":"xièxie","en":"thank you","note":"4+neutral","sw":"asante","note_sw":"4+hafifu","note_zh":"4+轻声"}],"zh":"斯瓦希里语没有字调：'kaka' 读高读低意思都不变，重音总落在倒数第二个音节。汉语里音高本身就是词的一部分，也没有固定的重音。所以：（1）每学一个新词都要连声调一起记，不要“先记音、以后再管声调”；（2）练习时把声调夸张一些，并配合手势；（3）不要把斯瓦希里语倒数第二音节的重音带进汉语词；（4）给自己录音，和标准录音对比；（5）用双音节词练声调（见声调组合表），因为真实说话中声调就是这样出现的。","h_sw":"Ushauri kwa wazungumzaji wa Kiswahili"}],"practice":[{"t":"tone","q":"妈","p":"mā","a":[1],"tag":"tones","ex":"mā has a flat mark: 1st tone, high and level.","ex_sw":"mā ina alama ya mlalo: toni ya 1, juu na sawasawa.","ex_zh":"mā 上面是一条平线：第一声，高而平。"},{"t":"tone","q":"马","p":"mǎ","a":[3],"tag":"tones","ex":"ǎ (a 'v' shape) is the 3rd tone.","ex_sw":"ǎ (umbo la 'v') ni toni ya 3.","ex_zh":"ǎ（像字母 v 的形状）是第三声。"},{"t":"tone","q":"茶","p":"chá","a":[2],"tag":"tones","ex":"á rises: 2nd tone.","ex_sw":"á inapanda: toni ya 2.","ex_zh":"á 往上升：第二声。"},{"t":"tone","q":"是","p":"shì","a":[4],"tag":"tones","ex":"ì falls: 4th tone.","ex_sw":"ì inashuka: toni ya 4.","ex_zh":"ì 往下降：第四声。"},{"t":"tone","q":"吗","p":"ma","a":[0],"tag":"tones","ex":"No mark = neutral tone (write 0).","ex_sw":"Hakuna alama = toni hafifu (andika 0).","ex_zh":"没有符号 = 轻声（填 0）。"},{"t":"listen","audio":"马","q":"Which syllable do you hear?","o":["mā","má","mǎ","mà"],"a":2,"tag":"listening","ex":"马 mǎ (horse) — low, dipping 3rd tone.","q_sw":"Unasikia silabi ipi?","q_zh":"你听到的是哪个音节？","ex_sw":"马 mǎ (farasi) — toni ya 3, chini na inashuka kidogo.","ex_zh":"马 mǎ（马）——低而先降后升的第三声。"},{"t":"listen","audio":"骂","q":"Which syllable do you hear?","o":["mā","má","mǎ","mà"],"a":3,"tag":"listening","ex":"骂 mà (to scold) — falling 4th tone.","q_sw":"Unasikia silabi ipi?","q_zh":"你听到的是哪个音节？","ex_sw":"骂 mà (kukemea) — toni ya 4 inayoshuka.","ex_zh":"骂 mà（骂人）——下降的第四声。"},{"t":"listen","audio":"麻","q":"Which syllable do you hear?","o":["mà","má","mā","mǎ"],"a":1,"tag":"listening","ex":"麻 má — rising 2nd tone.","q_sw":"Unasikia silabi ipi?","q_zh":"你听到的是哪个音节？","ex_sw":"麻 má — toni ya 2 inayopanda.","ex_zh":"麻 má——上升的第二声。"},{"t":"mcq","q":"Which tone is high and level (pitch 55)?","o":["1st tone","2nd tone","3rd tone","4th tone"],"a":0,"tag":"tones","ex":"The 1st tone stays at the top: 55.","q_sw":"Toni ipi iko juu na sawasawa (kiwango 55)?","q_zh":"哪个声调高而平（调值 55）？","ex_sw":"Toni ya 1 inabaki juu: 55.","ex_zh":"第一声一直保持在最高处：55。","o_sw":["toni ya 1","toni ya 2","toni ya 3","toni ya 4"],"o_zh":["第一声","第二声","第三声","第四声"]},{"t":"mcq","q":"Which tone falls sharply from high to low (pitch 51)?","o":["1st tone","2nd tone","3rd tone","4th tone"],"a":3,"tag":"tones","ex":"The 4th tone falls 5→1, like a firm command.","q_sw":"Toni ipi inashuka kwa nguvu kutoka juu hadi chini (kiwango 51)?","q_zh":"哪个声调从高处快速降到低处（调值 51）？","ex_sw":"Toni ya 4 inashuka 5→1, kama amri thabiti.","ex_zh":"第四声从 5 降到 1，像坚决的命令。","o_sw":["toni ya 1","toni ya 2","toni ya 3","toni ya 4"],"o_zh":["第一声","第二声","第三声","第四声"]},{"t":"mcq","q":"Kiswahili speakers often put stress on the second-to-last syllable. In Chinese you should…","o":["do the same","give each syllable its own tone and not add that stress","stress the last syllable"],"a":1,"tag":"tones","ex":"Chinese has no fixed word stress; each syllable carries its tone.","q_sw":"Wazungumzaji wa Kiswahili mara nyingi huweka mkazo kwenye silabi ya pili kutoka mwisho. Katika Kichina unapaswa…","q_zh":"说斯瓦希里语的人常把重音放在倒数第二个音节上。说汉语时你应该……","ex_sw":"Kichina hakina mkazo maalum wa neno; kila silabi ina toni yake.","ex_zh":"汉语没有固定的词重音；每个音节都有自己的声调。","o_sw":["kufanya vivyo hivyo","kuipa kila silabi toni yake bila kuongeza mkazo huo","kuweka mkazo kwenye silabi ya mwisho"],"o_zh":["也这样做","给每个音节读出它自己的声调，不加这种重音","重读最后一个音节"]},{"t":"match","pairs":[["妈 mā","mother"],["麻 má","hemp; numb"],["马 mǎ","horse"],["骂 mà","to scold"]],"tag":"tones","ex":"Same sounds, four tones, four meanings.","ex_sw":"Sauti zilezile, toni nne, maana nne.","ex_zh":"声音相同，四个声调，四个意思。","pairs_sw":[["妈 mā","mama"],["麻 má","katani; kufa ganzi"],["马 mǎ","farasi"],["骂 mà","kukemea"]]},{"t":"hanzi","q":"mǎ (horse)","a":["马"],"tag":"characters","ex":"马 mǎ = horse.","q_sw":"mǎ (farasi)","q_zh":"mǎ（马）","ex_sw":"马 mǎ = farasi.","ex_zh":"马 mǎ = 马（动物）。"},{"t":"speak","q":"Read the five 'ma' syllables with hand gestures.","audio":"妈，麻，马，骂，吗。","tag":"tones","ex":"mā má mǎ mà ma — make the differences big.","q_sw":"Soma silabi tano za 'ma' ukitumia ishara za mkono.","q_zh":"配合手势读五个 'ma' 音节。","ex_sw":"mā má mǎ mà ma — zifanye tofauti ziwe kubwa.","ex_zh":"mā má mǎ mà ma——把区别读得夸张一些。"}]},{"id":"P2","title_zh":"声母","title_en":"Initials (consonants)","title_sw":"Sauti za mwanzo (konsonanti)","intro":{"en":"A Chinese syllable = initial + final + tone. The initial is the consonant at the start (b in bā). Mandarin has 21 initials, plus y and w used in spelling. The biggest challenge for Kiswahili speakers is ASPIRATION (a puff of air) and the three groups zh ch sh r / z c s / j q x.","sw":"Silabi ya Kichina = sauti ya mwanzo + sauti ya mwisho + toni. Sauti ya mwanzo ni konsonanti ya mwanzo (b katika bā). Kichina kina sauti za mwanzo 21, pamoja na y na w zinazotumika katika uandishi. Changamoto kubwa kwa wazungumzaji wa Kiswahili ni MPUMUO (pumzi inayotoka kwa nguvu) na makundi matatu zh ch sh r / z c s / j q x.","zh":"一个汉语音节 = 声母 + 韵母 + 声调。声母是开头的辅音（bā 里的 b）。普通话有 21 个声母，另有拼写时用的 y 和 w。对说斯瓦希里语的人来说，最大的难点是送气（嘴里送出一股气），以及 zh ch sh r / z c s / j q x 三组声母。"},"sections":[{"h":"21个声母 The 21 initials","en":"Learn them in groups by where the mouth makes them: b p m f (lips) · d t n l (tongue tip) · g k h (back of tongue) · j q x (tongue flat, tip down) · zh ch sh r (tongue tip curled up) · z c s (tongue tip at the teeth). y and w are not true initials; they are written when a syllable starts with i, u or ü (see P4).","sw":"Zijifunze kwa makundi kulingana na mahali mdomo unapozitamka: b p m f (midomo) · d t n l (ncha ya ulimi) · g k h (nyuma ya ulimi) · j q x (ulimi bapa, ncha chini) · zh ch sh r (ncha ya ulimi imepinda juu) · z c s (ncha ya ulimi kwenye meno). y na w si sauti za mwanzo halisi; huandikwa silabi inapoanza na i, u au ü (angalia P4).","examples":[{"zh":"爸","p":"bà","en":"dad","note":"b","sw":"baba"},{"zh":"他","p":"tā","en":"he","note":"t","sw":"yeye (mwanamume)"},{"zh":"哥","p":"gē","en":"elder brother","note":"g","sw":"kaka"},{"zh":"家","p":"jiā","en":"home","note":"j","sw":"nyumbani"},{"zh":"中","p":"zhōng","en":"middle","note":"zh","sw":"katikati"},{"zh":"三","p":"sān","en":"three","note":"s","sw":"tatu"}],"zh":"按发音部位分组学习：b p m f（双唇/唇齿）· d t n l（舌尖）· g k h（舌根）· j q x（舌面，舌尖向下）· zh ch sh r（舌尖翘起）· z c s（舌尖抵齿背）。y 和 w 不是真正的声母；音节以 i、u 或 ü 开头时才写它们（见 P4）。","h_sw":"Sauti 21 za mwanzo"},{"h":"b p m f · d t n l · g k h","en":"m f n l are close to Kiswahili (mama, fua, nane, lala). b d g are NOT voiced like Kiswahili 'baba, dada, gari': there is no vibration and no puff — they sound close to Kiswahili p t k in 'papa, tatu, kaka'. p t k must have a strong puff of air. h is rougher than English h, made at the back of the mouth, close to the 'kh' that some speakers use in words like 'khabari'.","sw":"m f n l zinakaribiana na Kiswahili (mama, fua, nane, lala). b d g HAZINA mtetemo kama 'baba, dada, gari' za Kiswahili, wala pumzi: zinasikika karibu na p t k za Kiswahili katika 'papa, tatu, kaka'. p t k lazima ziwe na pumzi kali. h ni nzito kuliko h ya Kiingereza, inatamkwa nyuma ya kinywa, karibu na 'kh' ambayo baadhi ya watu hutumia katika maneno kama 'khabari'.","examples":[{"zh":"饭","p":"fàn","en":"rice; meal","sw":"wali; mlo"},{"zh":"大","p":"dà","en":"big","sw":"kubwa"},{"zh":"你","p":"nǐ","en":"you","sw":"wewe"},{"zh":"来","p":"lái","en":"to come","sw":"kuja"},{"zh":"看","p":"kàn","en":"to look","sw":"kuangalia"},{"zh":"喝","p":"hē","en":"to drink","sw":"kunywa"}],"zh":"m f n l 和斯瓦希里语差不多（mama, fua, nane, lala）。b d g 不像斯瓦希里语 'baba, dada, gari' 那样是浊音：声带不振动，也不送气——听起来接近斯瓦希里语 'papa, tatu, kaka' 里的 p t k。汉语的 p t k 一定要有很强的气流。h 比英语的 h 粗，在口腔后部发出，接近有些人读 'khabari' 时的 'kh'。","h_sw":"b p m f · d t n l · g k h","h_zh":"唇音 · 舌尖中音 · 舌根音"},{"h":"送气与不送气 Aspiration: b/p d/t g/k z/c zh/ch j/q","en":"Kiswahili does not use a puff of air to tell words apart, but Chinese does. Hold a piece of paper in front of your mouth: for p t k c ch q the paper must move; for b d g z zh j it must stay still. Both sounds in each pair are voiceless — the ONLY difference is the puff.","sw":"Kiswahili hakitumii pumzi kutofautisha maneno, lakini Kichina kinatumia. Shika karatasi mbele ya mdomo: kwa p t k c ch q karatasi lazima itikisike; kwa b d g z zh j lazima ibaki tuli. Sauti zote mbili katika kila jozi hazina mtetemo — tofauti PEKEE ni pumzi.","examples":[{"zh":"爸 / 怕","p":"bà / pà","en":"dad / afraid","sw":"baba / kuogopa"},{"zh":"肚 / 兔","p":"dù / tù","en":"belly / rabbit","sw":"tumbo / sungura"},{"zh":"姑 / 哭","p":"gū / kū","en":"aunt / to cry","sw":"shangazi / kulia"},{"zh":"在 / 菜","p":"zài / cài","en":"at / vegetable; dish","sw":"katika; kuwepo / mboga; mlo"},{"zh":"知 / 吃","p":"zhī / chī","en":"know / eat","sw":"kujua / kula"},{"zh":"鸡 / 七","p":"jī / qī","en":"chicken / seven","sw":"kuku / saba"}],"zh":"斯瓦希里语不用送气来区别词义，汉语却用。在嘴前放一张纸：读 p t k c ch q 时纸要动；读 b d g z zh j 时纸不能动。每对里的两个音都是清音——唯一的区别就是送不送气。","h_sw":"Mpumuo: b/p d/t g/k z/c zh/ch j/q"},{"h":"j q x","en":"Put the tip of the tongue behind the LOWER teeth, raise the middle of the tongue, and smile (spread the lips). j is like a soft 'ch' with no puff; q is like Kiswahili 'ch' in 'chai' but with the tongue flat and a strong puff; x is like Kiswahili 'sh' in 'shule' said with a smile. j q x are only ever followed by i or ü (ü is written u after them: 去 qù).","sw":"Weka ncha ya ulimi nyuma ya meno ya CHINI, inua katikati ya ulimi, na tabasamu (panua midomo). j ni kama 'ch' laini bila pumzi; q ni kama 'ch' ya Kiswahili katika 'chai' lakini ulimi bapa na pumzi kali; x ni kama 'sh' ya 'shule' ikitamkwa kwa tabasamu. j q x hufuatwa na i au ü tu (ü huandikwa u baada yake: 去 qù).","examples":[{"zh":"家","p":"jiā","en":"home; family","sw":"nyumbani; familia"},{"zh":"去","p":"qù","en":"to go","sw":"kwenda"},{"zh":"小","p":"xiǎo","en":"small","sw":"ndogo"},{"zh":"谢","p":"xiè","en":"to thank","sw":"kushukuru"}],"zh":"舌尖抵住下齿背，舌面中部抬起，嘴角向两边展开（像微笑）。j 像不送气的软 'ch'；q 像斯瓦希里语 'chai' 里的 'ch'，但舌面放平并且强送气；x 像斯瓦希里语 'shule' 里的 'sh'，但要带着微笑读。j q x 后面只能跟 i 或 ü（ü 在它们后面写成 u：去 qù）。","h_sw":"j q x","h_zh":"舌面音 j q x"},{"h":"zh ch sh r","en":"Curl the tip of the tongue up and back towards the roof of the mouth. zh: no puff; ch: like Kiswahili 'ch' in 'chai' but with the tongue curled back and a puff; sh: like Kiswahili 'sh' with the tongue curled back; r: do NOT roll or tap it like Kiswahili r — keep the tongue curled and let it buzz, a little like English 'r' in 'run' or the 's' in 'pleasure'.","sw":"Pinda ncha ya ulimi juu na nyuma kuelekea kaakaa. zh: bila pumzi; ch: kama 'ch' ya 'chai' lakini ulimi umepinda nyuma na kuna pumzi; sh: kama 'sh' ya Kiswahili ulimi ukiwa umepinda nyuma; r: USIIRINGISHE kama r ya Kiswahili — weka ulimi umepinda na uache itetemeke, kidogo kama 'r' ya Kiingereza katika 'run'.","examples":[{"zh":"中","p":"zhōng","en":"middle","sw":"katikati"},{"zh":"吃","p":"chī","en":"to eat","sw":"kula"},{"zh":"书","p":"shū","en":"book","sw":"kitabu"},{"zh":"热","p":"rè","en":"hot","sw":"joto; moto"}],"zh":"舌尖向上、向后翘起，靠近上腭。zh：不送气；ch：像 'chai' 里的 'ch'，但舌尖翘起并且送气；sh：像斯瓦希里语的 'sh'，但舌尖翘起；r：不要像斯瓦希里语的 r 那样弹舌或打颤——舌尖保持翘起，让声音带一点摩擦，有点像英语 'run' 里的 'r' 或 'pleasure' 里的 's'。","h_sw":"zh ch sh r","h_zh":"翘舌音 zh ch sh r"},{"h":"z c s","en":"Tongue tip touches the back of the upper front teeth. z is like 'ds' in English 'kids' (no puff); c is like 'ts' in 'cats' with a strong puff; s is like Kiswahili s. Kiswahili has no 'ts' at the start of a word, so practise c slowly: t + s + puff.","sw":"Ncha ya ulimi inagusa nyuma ya meno ya mbele ya juu. z ni kama 'ds' katika neno la Kiingereza 'kids' (bila pumzi); c ni kama 'ts' katika 'cats' pamoja na pumzi kali; s ni kama s ya Kiswahili. Kiswahili hakina 'ts' mwanzoni mwa neno, kwa hiyo fanya mazoezi ya c polepole: t + s + pumzi.","examples":[{"zh":"字","p":"zì","en":"character","sw":"herufi (ya Kichina)"},{"zh":"菜","p":"cài","en":"vegetable; dish","sw":"mboga; mlo"},{"zh":"三","p":"sān","en":"three","sw":"tatu"}],"zh":"舌尖抵住上门齿背。z 像英语 'kids' 里的 'ds'（不送气）；c 像 'cats' 里的 'ts'，要强送气；s 和斯瓦希里语的 s 一样。斯瓦希里语词首没有 'ts'，所以 c 要慢慢练：t + s + 送气。","h_sw":"z c s","h_zh":"平舌音 z c s"},{"h":"三组对比 Three groups compared","en":"Say each set slowly and feel where your tongue is: z/zh/j, c/ch/q, s/sh/x. Mixing these groups changes the meaning: 三 sān (three) vs 山 shān (mountain); 四 sì (four) vs 是 shì (to be).","sw":"Tamka kila kundi polepole na uhisi ulimi wako uko wapi: z/zh/j, c/ch/q, s/sh/x. Kuchanganya makundi haya kunabadilisha maana: 三 sān (tatu) na 山 shān (mlima); 四 sì (nne) na 是 shì (ni).","examples":[{"zh":"早 / 找","p":"zǎo / zhǎo","en":"early / to look for","sw":"mapema / kutafuta"},{"zh":"三 / 山","p":"sān / shān","en":"three / mountain","sw":"tatu / mlima"},{"zh":"四 / 是","p":"sì / shì","en":"four / to be","sw":"nne / kuwa; ni"},{"zh":"七 / 吃","p":"qī / chī","en":"seven / to eat","sw":"saba / kula"},{"zh":"西 / 师","p":"xī / shī","en":"west / teacher (as in 老师)","sw":"magharibi / mwalimu (kama katika 老师)"}],"zh":"慢慢读每一组，感受舌头的位置：z/zh/j、c/ch/q、s/sh/x。把这几组混在一起会改变意思：三 sān（三）和 山 shān（山）；四 sì（四）和 是 shì（是）。","h_sw":"Makundi matatu yakilinganishwa"}],"practice":[{"t":"listen","audio":"怕","q":"Which do you hear?","o":["bà","pà"],"a":1,"tag":"listening","ex":"怕 pà (afraid) has a puff of air.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"怕 pà (kuogopa) ina pumzi.","ex_zh":"怕 pà（害怕）要送气。"},{"t":"listen","audio":"七","q":"Which do you hear?","o":["qī","jī"],"a":0,"tag":"listening","ex":"七 qī (seven) — aspirated q.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"七 qī (saba) — q yenye pumzi.","ex_zh":"七 qī（七）——送气的 q。"},{"t":"listen","audio":"山","q":"Which do you hear?","o":["sān","shān"],"a":1,"tag":"listening","ex":"山 shān — tongue curled back.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"山 shān — ulimi umepinda nyuma.","ex_zh":"山 shān——舌尖翘起。"},{"t":"listen","audio":"在","q":"Which do you hear?","o":["zài","cài"],"a":0,"tag":"listening","ex":"在 zài — no puff.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"在 zài — bila pumzi.","ex_zh":"在 zài——不送气。"},{"t":"mcq","q":"Which group of initials is aspirated (has a puff of air)?","o":["b d g","p t k","m n l"],"a":1,"tag":"pronunciation","ex":"p t k (and c ch q) are aspirated.","q_sw":"Kundi lipi la sauti za mwanzo lina mpumuo (pumzi)?","q_zh":"哪一组声母是送气音（有一股气流）？","ex_sw":"p t k (na c ch q) zina mpumuo.","ex_zh":"p t k（还有 c ch q）是送气音。"},{"t":"mcq","q":"j q x can only be followed by…","o":["i or ü","a or o","e or u (as in 'kuku')"],"a":0,"tag":"pronunciation","ex":"j q x + i/ü only; the u in ju qu xu is really ü.","q_sw":"j q x zinaweza kufuatwa tu na…","q_zh":"j q x 后面只能跟……","ex_sw":"j q x + i/ü tu; u katika ju qu xu kwa kweli ni ü.","ex_zh":"j q x 只拼 i/ü；ju qu xu 里的 u 其实是 ü。","o_sw":["i au ü","a au o","e au u (kama katika 'kuku')"],"o_zh":["i 或 ü","a 或 o","e 或 u（像 'kuku' 里的 u）"]},{"t":"mcq","q":"Which initial is made with the tongue tip curled up and back?","o":["z","zh","j"],"a":1,"tag":"pronunciation","ex":"zh ch sh r are the curled-tongue (retroflex) initials.","q_sw":"Sauti ipi ya mwanzo hutamkwa ncha ya ulimi ikiwa imepinda juu na nyuma?","q_zh":"哪个声母发音时舌尖向上向后翘起？","ex_sw":"zh ch sh r ni sauti za mwanzo za ulimi uliopinda.","ex_zh":"zh ch sh r 是翘舌音。"},{"t":"mcq","q":"Pinyin b sounds closest to…","o":["Kiswahili b in 'baba' (with voice)","Kiswahili p in 'papa' (no voice, no puff)","English p in 'pen' (with a puff)"],"a":1,"tag":"pronunciation","ex":"Pinyin b is voiceless and unaspirated.","q_sw":"b ya Pinyin inakaribiana zaidi na…","q_zh":"拼音 b 的发音最接近……","ex_sw":"b ya Pinyin haina mtetemo wala pumzi.","ex_zh":"拼音 b 是不送气的清音。","o_sw":["b ya Kiswahili katika 'baba' (yenye mtetemo)","p ya Kiswahili katika 'papa' (bila mtetemo, bila pumzi)","p ya Kiingereza katika 'pen' (yenye pumzi)"],"o_zh":["斯瓦希里语 'baba' 里的 b（浊音）","斯瓦希里语 'papa' 里的 p（清音，不送气）","英语 'pen' 里的 p（送气）"]},{"t":"pinyin","q":"吃","a":"chī","tag":"pinyin","ex":"吃 chī — ch + i, 1st tone.","ex_sw":"吃 chī — ch + i, toni ya 1.","ex_zh":"吃 chī——ch + i，第一声。"},{"t":"pinyin","q":"字","a":"zì","tag":"pinyin","ex":"字 zì — z + i, 4th tone.","ex_sw":"字 zì — z + i, toni ya 4.","ex_zh":"字 zì——z + i，第四声。"},{"t":"match","pairs":[["爸","bà"],["怕","pà"],["鸡","jī"],["七","qī"],["三","sān"]],"tag":"pinyin","ex":"Match each character to its pinyin.","ex_sw":"Oanisha kila herufi na pinyin yake.","ex_zh":"把每个汉字和它的拼音连起来。"},{"t":"speak","q":"Read the aspiration pairs. Hold paper in front of your mouth.","audio":"爸，怕；在，菜；鸡，七。","tag":"pronunciation","ex":"The paper moves only for 怕, 菜, 七.","q_sw":"Soma jozi za mpumuo. Shika karatasi mbele ya mdomo wako.","q_zh":"读送气/不送气对比词。在嘴前放一张纸。","ex_sw":"Karatasi inatikisika kwa 怕, 菜, 七 tu.","ex_zh":"只有读 怕、菜、七 时纸会动。"}]},{"id":"P3","title_zh":"韵母","title_en":"Finals (vowel parts)","title_sw":"Sauti za mwisho (sehemu za irabu)","intro":{"en":"The final is the part of the syllable after the initial (ā in bā, ing in xīng). There are single finals, compound finals and nasal finals ending in -n or -ng. Watch the sounds that do not exist in Kiswahili: e, ü, the special i after z c s / zh ch sh r, and -ng.","sw":"Sauti ya mwisho ni sehemu ya silabi inayofuata sauti ya mwanzo (ā katika bā, ing katika xīng). Kuna sauti za mwisho sahili, ambatani, na za puani zinazoishia na -n au -ng. Zingatia sauti zisizokuwepo katika Kiswahili: e, ü, i maalum baada ya z c s / zh ch sh r, na -ng.","zh":"韵母是音节中声母后面的部分（bā 里的 ā，xīng 里的 ing）。韵母分单韵母、复韵母和以 -n 或 -ng 结尾的鼻韵母。要特别注意斯瓦希里语里没有的音：e、ü、z c s / zh ch sh r 后面特殊的 i，以及 -ng。"},"sections":[{"h":"单韵母 Single finals: a o e i u ü","en":"a i u are like Kiswahili a i u (baba, sisi, kuku). o is like Kiswahili o but lips rounder. Careful with e: on its own, pinyin e is NOT Kiswahili e — it sounds like 'uh', made at the back of the mouth with the lips not rounded. ü: say i and round your lips as if to whistle, keeping the tongue in the i position.","sw":"a i u ni kama a i u za Kiswahili (baba, sisi, kuku). o ni kama o ya Kiswahili lakini midomo imeviringwa zaidi. Kuwa makini na e: ikiwa peke yake, e ya pinyin SI e ya Kiswahili — inasikika kama 'ə', inatamkwa nyuma ya kinywa bila kuviringa midomo. ü: tamka i kisha viringa midomo kama unapiga mluzi, ulimi ukibaki mahali pa i.","examples":[{"zh":"他","p":"tā","en":"he","sw":"yeye (mwanamume)"},{"zh":"哦","p":"ò","en":"oh (I see)","sw":"aha (nimeelewa)"},{"zh":"饿","p":"è","en":"hungry","note":"e = 'uh', not Kiswahili e","sw":"njaa; kuwa na njaa","note_sw":"e = 'ə', si e ya Kiswahili","note_zh":"e 读 'uh'（ə），不是斯瓦希里语的 e"},{"zh":"一","p":"yī","en":"one","sw":"moja"},{"zh":"五","p":"wǔ","en":"five","sw":"tano"},{"zh":"鱼","p":"yú","en":"fish","note":"yu = ü","sw":"samaki"}],"zh":"a i u 和斯瓦希里语的 a i u 一样（baba, sisi, kuku）。o 像斯瓦希里语的 o，但嘴唇更圆。e 要特别注意：单独的拼音 e 不是斯瓦希里语的 e——它听起来像 'uh'，在口腔后部发音，嘴唇不圆。ü：先发 i，再把嘴唇撮圆，像吹口哨一样，舌头保持在 i 的位置。","h_sw":"Sauti sahili za mwisho: a o e i u ü"},{"h":"复韵母 Compound finals","en":"ai ei ao ou · ia ie ua uo üe · iao iou(iu) uai uei(ui). Glide smoothly from the first vowel to the next inside ONE syllable. In Kiswahili 'kaa' has two syllables (ka-a); in Chinese 'ai' in 来 lái is one quick syllable. Inside ie, üe and ei, the e sounds like Kiswahili e.","sw":"ai ei ao ou · ia ie ua uo üe · iao iou(iu) uai uei(ui). Teleza kutoka irabu ya kwanza hadi inayofuata ndani ya silabi MOJA. Katika Kiswahili 'kaa' ina silabi mbili (ka-a); katika Kichina 'ai' ya 来 lái ni silabi moja ya haraka. Ndani ya ie, üe na ei, e inasikika kama e ya Kiswahili.","examples":[{"zh":"来","p":"lái","en":"to come","sw":"kuja"},{"zh":"给","p":"gěi","en":"to give","sw":"kutoa; kupa"},{"zh":"好","p":"hǎo","en":"good","sw":"nzuri"},{"zh":"走","p":"zǒu","en":"to walk","sw":"kutembea"},{"zh":"家","p":"jiā","en":"home","sw":"nyumbani"},{"zh":"谢","p":"xiè","en":"to thank","sw":"kushukuru"},{"zh":"花","p":"huā","en":"flower","sw":"ua"},{"zh":"我","p":"wǒ","en":"I","sw":"mimi"},{"zh":"学","p":"xué","en":"to study","sw":"kusoma; kujifunza"},{"zh":"小","p":"xiǎo","en":"small","sw":"ndogo"},{"zh":"六","p":"liù","en":"six","sw":"sita"},{"zh":"快","p":"kuài","en":"fast","sw":"haraka"},{"zh":"对","p":"duì","en":"correct","sw":"sahihi"}],"zh":"ai ei ao ou · ia ie ua uo üe · iao iou(iu) uai uei(ui)。在同一个音节里，从第一个元音平滑地滑向下一个元音。斯瓦希里语 'kaa' 是两个音节（ka-a）；汉语 来 lái 里的 'ai' 是一个快速的音节。在 ie、üe 和 ei 里，e 读得像斯瓦希里语的 e。","h_sw":"Sauti ambatani za mwisho"},{"h":"鼻韵母 Nasal finals: -n and -ng","en":"-n: an en in ün ian uan üan uen(un). The tongue tip touches the ridge behind the upper teeth, like Kiswahili n in 'nane'. -ng: ang eng ing ong iang iong uang ueng. The back of the tongue closes against the soft palate and the mouth stays open — exactly the sound of ng' in Kiswahili 'ng'ombe'. Do not add a g sound after it.","sw":"-n: an en in ün ian uan üan uen(un). Ncha ya ulimi inagusa ufizi nyuma ya meno ya juu, kama n ya 'nane'. -ng: ang eng ing ong iang iong uang ueng. Nyuma ya ulimi inafunga kwenye kaakaa laini na mdomo unabaki wazi — ni sauti ileile ya ng' katika 'ng'ombe'. Usiongeze sauti ya g baada yake.","examples":[{"zh":"三 / 上","p":"sān / shàng","en":"three / up","sw":"tatu / juu"},{"zh":"金 / 京","p":"jīn / jīng","en":"gold / capital (as in 北京)","sw":"dhahabu / mji mkuu (kama katika 北京)"},{"zh":"分 / 风","p":"fēn / fēng","en":"minute; point / wind","sw":"dakika; alama / upepo"},{"zh":"船 / 床","p":"chuán / chuáng","en":"boat / bed","sw":"mashua / kitanda"},{"zh":"中","p":"zhōng","en":"middle","sw":"katikati"}],"zh":"-n：an en in ün ian uan üan uen(un)。舌尖抵住上齿龈，就像斯瓦希里语 'nane' 里的 n。-ng：ang eng ing ong iang iong uang ueng。舌根抵住软腭，嘴巴保持张开——和斯瓦希里语 'ng'ombe' 里的 ng' 完全一样。后面不要再加 g 的音。","h_sw":"Sauti za puani: -n na -ng"},{"h":"ü 和两点规则 ü and the two dots","en":"ü has no Kiswahili equivalent: say 'i' and round the lips. After n and l the dots must be written, because nu/nü and lu/lü are different syllables (路 lù road, 绿 lǜ green). After j q x the dots are dropped, because u can never follow j q x — so ju qu xu are really jü qü xü. At the start of a syllable ü is written yu (鱼 yú, 月 yuè).","sw":"ü haina sauti inayolingana katika Kiswahili: tamka 'i' na uviringe midomo. Baada ya n na l nukta mbili lazima ziandikwe, kwa sababu nu/nü na lu/lü ni silabi tofauti (路 lù barabara, 绿 lǜ kijani). Baada ya j q x nukta huondolewa, kwa sababu u haiwezi kufuata j q x — kwa hiyo ju qu xu kwa kweli ni jü qü xü. Mwanzoni mwa silabi ü huandikwa yu (鱼 yú, 月 yuè).","examples":[{"zh":"女","p":"nǚ","en":"woman","sw":"mwanamke"},{"zh":"绿","p":"lǜ","en":"green","sw":"kijani"},{"zh":"去","p":"qù","en":"to go","note":"written u, said ü","sw":"kwenda","note_sw":"huandikwa u, hutamkwa ü","note_zh":"写成 u，读作 ü"},{"zh":"学","p":"xué","en":"to study","sw":"kusoma; kujifunza"},{"zh":"月","p":"yuè","en":"moon; month","sw":"mwezi"}],"zh":"斯瓦希里语里没有 ü：发 'i' 再把嘴唇撮圆。在 n 和 l 后面必须写两点，因为 nu/nü、lu/lü 是不同的音节（路 lù 路，绿 lǜ 绿）。在 j q x 后面省去两点，因为 u 永远不会跟在 j q x 后面——所以 ju qu xu 实际上是 jü qü xü。ü 在音节开头写作 yu（鱼 yú，月 yuè）。","h_sw":"ü na nukta mbili"},{"h":"z c s / zh ch sh r 后的 i","en":"After z c s and zh ch sh r, the letter i is NOT the Kiswahili i of 'sisi'. It is a buzzing continuation of the consonant: for zi ci si keep the tongue near the teeth and hold the sound; for zhi chi shi ri keep the tongue curled and hold it. So 四 sì does not sound like English 'see'.","sw":"Baada ya z c s na zh ch sh r, herufi i SI i ya Kiswahili ya 'sisi'. Ni mwendelezo unaovuma wa konsonanti: kwa zi ci si weka ulimi karibu na meno na uendeleze sauti; kwa zhi chi shi ri weka ulimi umepinda na uendeleze sauti. Kwa hiyo 四 sì haisikiki kama 'si' ya Kiswahili.","examples":[{"zh":"字","p":"zì","en":"character","sw":"herufi (ya Kichina)"},{"zh":"四","p":"sì","en":"four","sw":"nne"},{"zh":"是","p":"shì","en":"to be","sw":"kuwa; ni"},{"zh":"吃","p":"chī","en":"to eat","sw":"kula"},{"zh":"日","p":"rì","en":"sun; day","sw":"jua; siku"}],"zh":"在 z c s 和 zh ch sh r 后面，字母 i 不是斯瓦希里语 'sisi' 里的 i，而是声母声音的延续（带摩擦的嗡嗡声）：读 zi ci si 时舌尖靠近齿背，把声音拉长；读 zhi chi shi ri 时舌尖保持翘起，把声音拉长。所以 四 sì 听起来不像英语的 'see'。","h_sw":"i baada ya z c s / zh ch sh r"},{"h":"er","en":"er is a special final: say a relaxed 'uh' and curl the tongue tip up at the same time. It never follows an initial.","sw":"er ni sauti maalum: tamka 'ə' tulivu na upinde ncha ya ulimi juu wakati huohuo. Haifuati sauti ya mwanzo kamwe.","examples":[{"zh":"二","p":"èr","en":"two","sw":"mbili"},{"zh":"儿子","p":"érzi","en":"son","sw":"mwana (wa kiume)"},{"zh":"耳朵","p":"ěrduo","en":"ear","sw":"sikio"}],"zh":"er 是一个特殊的韵母：发一个放松的 'uh'（ə），同时把舌尖卷起。它前面永远不拼声母。","h_sw":"er","h_zh":"卷舌韵母 er"}],"practice":[{"t":"mcq","q":"In 去 qù, the letter u is really…","o":["u as in Kiswahili 'kuku'","ü (say i with rounded lips)","o"],"a":1,"tag":"pronunciation","ex":"After j q x, u is always ü.","q_sw":"Katika 去 qù, herufi u kwa kweli ni…","q_zh":"去 qù 里的字母 u 实际上是……","ex_sw":"Baada ya j q x, u daima ni ü.","ex_zh":"在 j q x 后面，u 永远是 ü。","o_sw":["u kama katika 'kuku' ya Kiswahili","ü (tamka i midomo ikiwa imeviringwa)","o"],"o_zh":["像斯瓦希里语 'kuku' 里的 u","ü（发 i 时嘴唇撮圆）","o"]},{"t":"mcq","q":"Which final ends with the same sound as ng' in 'ng'ombe'?","o":["an","ang","ai"],"a":1,"tag":"pronunciation","ex":"-ng = the ng' sound of ng'ombe.","q_sw":"Sauti ipi ya mwisho inaishia na sauti sawa na ng' ya 'ng'ombe'?","q_zh":"哪个韵母的结尾和 'ng'ombe' 里的 ng' 是同一个音？","ex_sw":"-ng = sauti ya ng' katika ng'ombe.","ex_zh":"-ng = ng'ombe 里 ng' 的音。"},{"t":"mcq","q":"The i in 四 sì sounds like…","o":["the i in Kiswahili 'sisi'","a buzzing continuation of the s","the ei in 'Mei'"],"a":1,"tag":"pronunciation","ex":"i after z c s is a buzzing vowel, not Kiswahili i.","q_sw":"i katika 四 sì inasikika kama…","q_zh":"四 sì 里的 i 听起来像……","ex_sw":"i baada ya z c s ni irabu inayovuma, si i ya Kiswahili.","ex_zh":"z c s 后面的 i 是带摩擦的特殊元音，不是斯瓦希里语的 i。","o_sw":["i ya Kiswahili katika 'sisi'","mwendelezo unaovuma wa s","ei katika 'Mei'"],"o_zh":["斯瓦希里语 'sisi' 里的 i","s 的延续（带摩擦的嗡嗡声）","'Mei' 里的 ei"]},{"t":"mcq","q":"On its own (as in 饿 è), pinyin e sounds like…","o":["Kiswahili e in 'kesho'","'uh', made at the back of the mouth","i"],"a":1,"tag":"pronunciation","ex":"Single e is a back, unrounded 'uh'.","q_sw":"Ikiwa peke yake (kama katika 饿 è), e ya pinyin inasikika kama…","q_zh":"单独使用时（如 饿 è），拼音 e 听起来像……","ex_sw":"e peke yake ni 'ə' ya nyuma bila kuviringa midomo.","ex_zh":"单韵母 e 是舌位靠后、不圆唇的 'uh'。","o_sw":["e ya Kiswahili katika 'kesho'","'ə', inayotamkwa nyuma ya kinywa","i"],"o_zh":["斯瓦希里语 'kesho' 里的 e","'uh'（ə），在口腔后部发音","i"]},{"t":"listen","audio":"京","q":"Which do you hear?","o":["jīn","jīng"],"a":1,"tag":"listening","ex":"京 jīng ends in -ng.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"京 jīng inaishia na -ng.","ex_zh":"京 jīng 以 -ng 结尾。"},{"t":"listen","audio":"船","q":"Which do you hear?","o":["chuán","chuáng"],"a":0,"tag":"listening","ex":"船 chuán (boat) ends in -n; 床 chuáng is bed.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"船 chuán (mashua) inaishia na -n; 床 chuáng ni kitanda.","ex_zh":"船 chuán（船）以 -n 结尾；床 chuáng 是床。"},{"t":"listen","audio":"绿","q":"Which do you hear?","o":["lù","lǜ"],"a":1,"tag":"listening","ex":"绿 lǜ (green) — rounded ü.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"绿 lǜ (kijani) — ü yenye midomo iliyoviringwa.","ex_zh":"绿 lǜ（绿色）——圆唇的 ü。"},{"t":"listen","audio":"风","q":"Which do you hear?","o":["fēng","fēn"],"a":0,"tag":"listening","ex":"风 fēng (wind) ends in -ng.","q_sw":"Unasikia ipi?","q_zh":"你听到的是哪个？","ex_sw":"风 fēng (upepo) inaishia na -ng.","ex_zh":"风 fēng（风）以 -ng 结尾。"},{"t":"pinyin","q":"学","a":"xué","tag":"pinyin","ex":"x + üe, written xue; 2nd tone.","ex_sw":"x + üe, huandikwa xue; toni ya 2.","ex_zh":"x + üe，写作 xue；第二声。"},{"t":"pinyin","q":"鱼","a":"yú","tag":"pinyin","ex":"ü alone is written yu.","ex_sw":"ü peke yake huandikwa yu.","ex_zh":"ü 单独成音节时写作 yu。"},{"t":"tone","q":"学生","p":"xuésheng","a":[2,0],"tag":"tones","ex":"xué (2nd) + sheng (neutral).","ex_sw":"xué (toni ya 2) + sheng (hafifu).","ex_zh":"xué（第二声）+ sheng（轻声）。"},{"t":"hanzi","q":"lǜ (green)","a":["绿"],"tag":"characters","ex":"绿 lǜ = green.","q_sw":"lǜ (kijani)","q_zh":"lǜ（绿色）","ex_sw":"绿 lǜ = kijani.","ex_zh":"绿 lǜ = 绿色。"},{"t":"match","pairs":[["来","lái"],["给","gěi"],["好","hǎo"],["走","zǒu"]],"tag":"pinyin","ex":"ai, ei, ao, ou.","ex_sw":"ai, ei, ao, ou.","ex_zh":"ai、ei、ao、ou。"},{"t":"speak","q":"Read the -n / -ng pairs.","audio":"三，上；金，京；分，风。","tag":"pronunciation","ex":"-n: tongue tip up; -ng: back of tongue, like ng'ombe.","q_sw":"Soma jozi za -n / -ng.","q_zh":"读 -n / -ng 对比词。","ex_sw":"-n: ncha ya ulimi juu; -ng: nyuma ya ulimi, kama ng'ombe.","ex_zh":"-n：舌尖抬起；-ng：舌根发音，像 ng'ombe。"}]},{"id":"P4","title_zh":"拼写规则","title_en":"Spelling rules and tone-mark placement","title_sw":"Kanuni za uandishi na mahali pa alama za toni","intro":{"en":"Pinyin has a few spelling rules that learners must know to read and type correctly: where to put the tone mark, how i/u/ü become y/w, the short forms iu ui un, and when to use an apostrophe.","sw":"Pinyin ina kanuni chache za uandishi ambazo wanafunzi lazima wazijue ili kusoma na kuandika kwa usahihi: mahali pa kuweka alama ya toni, jinsi i/u/ü zinavyokuwa y/w, maumbo mafupi iu ui un, na wakati wa kutumia apostrofi.","zh":"拼音有几条拼写规则，学生必须掌握才能正确地读和打字：声调符号标在哪里、i/u/ü 怎样改写成 y/w、iu ui un 这几个省写形式，以及什么时候用隔音符号。"},"sections":[{"h":"标调顺序 Where does the tone mark go?","en":"Put the mark on the vowel that comes first in this list: a → o → e → i → u → ü. If the syllable has a, the mark goes on a (hǎo, kuài). If there is no a, it goes on o or e (zǒu, gěi, xiè). The one exception is iu and ui: mark the SECOND letter (liù, duì). When a tone mark sits on i, the dot is dropped: nǐ, not nǐ with a dot.","sw":"Weka alama kwenye irabu inayotangulia katika orodha hii: a → o → e → i → u → ü. Silabi ikiwa na a, alama inakaa juu ya a (hǎo, kuài). Isipokuwa na a, inakaa juu ya o au e (zǒu, gěi, xiè). Isipokuwa moja ni iu na ui: weka alama kwenye herufi ya PILI (liù, duì). Alama ikikaa juu ya i, nukta ya i huondolewa: nǐ.","examples":[{"zh":"好","p":"hǎo","en":"good","note":"a first","sw":"nzuri","note_sw":"a kwanza","note_zh":"a 优先"},{"zh":"快","p":"kuài","en":"fast","note":"a first","sw":"haraka","note_sw":"a kwanza","note_zh":"a 优先"},{"zh":"走","p":"zǒu","en":"to walk","note":"o","sw":"kutembea"},{"zh":"给","p":"gěi","en":"to give","note":"e","sw":"kutoa; kupa"},{"zh":"谢","p":"xiè","en":"to thank","note":"e","sw":"kushukuru"},{"zh":"六","p":"liù","en":"six","note":"iu → 2nd letter","sw":"sita","note_sw":"iu → herufi ya 2","note_zh":"iu → 标在第二个字母"},{"zh":"对","p":"duì","en":"correct","note":"ui → 2nd letter","sw":"sahihi","note_sw":"ui → herufi ya 2","note_zh":"ui → 标在第二个字母"}],"zh":"按这个顺序找元音，先出现哪个就标在哪个上：a → o → e → i → u → ü。音节里有 a，就标在 a 上（hǎo, kuài）。没有 a，就标在 o 或 e 上（zǒu, gěi, xiè）。唯一的例外是 iu 和 ui：标在第二个字母上（liù, duì）。声调符号标在 i 上时，i 上的点要去掉：写 nǐ。","h_sw":"Alama ya toni inakaa wapi?"},{"h":"iou → iu, uei → ui, uen → un","en":"After an initial, three finals are shortened: iou → iu (六 liù, 九 jiǔ), uei → ui (对 duì, 水 shuǐ), uen → un (春 chūn). You still pronounce a light o or e in the middle, especially in the 3rd and 4th tones.","sw":"Baada ya sauti ya mwanzo, sauti tatu za mwisho hufupishwa: iou → iu (六 liù, 九 jiǔ), uei → ui (对 duì, 水 shuǐ), uen → un (春 chūn). Bado unatamka o au e hafifu katikati, hasa katika toni ya tatu na ya nne.","examples":[{"zh":"九","p":"jiǔ","en":"nine","sw":"tisa"},{"zh":"水","p":"shuǐ","en":"water","sw":"maji"},{"zh":"春","p":"chūn","en":"spring (season)","sw":"majira ya kuchipua"}],"zh":"跟在声母后面时，三个韵母要省写：iou → iu（六 liù，九 jiǔ），uei → ui（对 duì，水 shuǐ），uen → un（春 chūn）。读的时候中间仍有一个轻微的 o 或 e，第三声和第四声尤其明显。","h_sw":"iou → iu, uei → ui, uen → un","h_zh":"省写：iou → iu，uei → ui，uen → un"},{"h":"y 和 w 的规则 Rules for y and w","en":"A syllable never starts with the letters i, u or ü. When there is no initial: i → yi, in → yin, ing → ying; other i- finals change i to y (ia → ya, ie → ye, iao → yao, iou → you, ian → yan, iang → yang, iong → yong). u → wu; other u- finals change u to w (ua → wa, uo → wo, uai → wai, uei → wei, uan → wan, uen → wen, uang → wang, ueng → weng). ü → yu (üe → yue, üan → yuan, ün → yun).","sw":"Silabi haianzi kamwe na herufi i, u au ü. Kama hakuna sauti ya mwanzo: i → yi, in → yin, ing → ying; sauti nyingine zinazoanza na i hubadilisha i kuwa y (ia → ya, ie → ye, iao → yao, iou → you, ian → yan, iang → yang, iong → yong). u → wu; nyingine zinazoanza na u hubadilisha u kuwa w (ua → wa, uo → wo, uai → wai, uei → wei, uan → wan, uen → wen, uang → wang, ueng → weng). ü → yu (üe → yue, üan → yuan, ün → yun).","examples":[{"zh":"一","p":"yī","en":"one","note":"i → yi","sw":"moja"},{"zh":"也","p":"yě","en":"also","note":"ie → ye","sw":"pia"},{"zh":"有","p":"yǒu","en":"to have","note":"iou → you","sw":"kuwa na"},{"zh":"用","p":"yòng","en":"to use","note":"iong → yong","sw":"kutumia"},{"zh":"五","p":"wǔ","en":"five","note":"u → wu","sw":"tano"},{"zh":"我","p":"wǒ","en":"I","note":"uo → wo","sw":"mimi"},{"zh":"外","p":"wài","en":"outside","note":"uai → wai","sw":"nje"},{"zh":"问","p":"wèn","en":"to ask","note":"uen → wen","sw":"kuuliza"},{"zh":"鱼","p":"yú","en":"fish","note":"ü → yu","sw":"samaki"},{"zh":"月","p":"yuè","en":"moon; month","note":"üe → yue","sw":"mwezi"},{"zh":"元","p":"yuán","en":"yuan (money)","note":"üan → yuan","sw":"yuan (pesa ya China)"},{"zh":"云","p":"yún","en":"cloud","note":"ün → yun","sw":"wingu"}],"zh":"音节永远不用字母 i、u、ü 开头。没有声母时：i → yi，in → yin，ing → ying；其他以 i 开头的韵母把 i 改成 y（ia → ya, ie → ye, iao → yao, iou → you, ian → yan, iang → yang, iong → yong）。u → wu；其他以 u 开头的韵母把 u 改成 w（ua → wa, uo → wo, uai → wai, uei → wei, uan → wan, uen → wen, uang → wang, ueng → weng）。ü → yu（üe → yue, üan → yuan, ün → yun）。","h_sw":"Kanuni za y na w"},{"h":"ü 的写法 Writing ü","en":"Write the two dots only after n and l (nǚ, lǜ). After j q x and in yu, the dots are dropped (qù, xué, yú) because no confusion is possible. When typing on a phone or computer, ü is usually typed as v.","sw":"Andika nukta mbili baada ya n na l tu (nǚ, lǜ). Baada ya j q x na katika yu, nukta huondolewa (qù, xué, yú) kwa sababu hakuna mkanganyiko. Unapoandika kwenye simu au kompyuta, ü kwa kawaida huandikwa kwa herufi v.","examples":[{"zh":"女","p":"nǚ","en":"woman","sw":"mwanamke"},{"zh":"绿","p":"lǜ","en":"green","sw":"kijani"},{"zh":"去","p":"qù","en":"to go","sw":"kwenda"},{"zh":"学","p":"xué","en":"to study","sw":"kusoma; kujifunza"}],"zh":"只有在 n 和 l 后面才写两点（nǚ, lǜ）。在 j q x 后面和 yu 里省去两点（qù, xué, yú），因为不会混淆。在手机或电脑上打字时，ü 通常用字母 v 输入。","h_sw":"Kuandika ü"},{"h":"隔音符号 The apostrophe ( ' )","en":"When a syllable starting with a, o or e follows another syllable in the same word, write an apostrophe so the reader knows where the syllable begins: Xī'ān (西安, two syllables) is different from xiān (先, one syllable).","sw":"Silabi inayoanza na a, o au e ikifuata silabi nyingine katika neno moja, andika apostrofi ili msomaji ajue silabi inaanzia wapi: Xī'ān (西安, silabi mbili) ni tofauti na xiān (先, silabi moja).","examples":[{"zh":"西安","p":"Xī'ān","en":"Xi'an (city)","sw":"Xi'an (mji)"},{"zh":"可爱","p":"kě'ài","en":"cute; lovely","sw":"-a kupendeza"},{"zh":"女儿","p":"nǚ'ér","en":"daughter","sw":"binti"},{"zh":"先","p":"xiān","en":"first","note":"one syllable, no apostrophe","sw":"kwanza","note_sw":"silabi moja, hakuna apostrofi","note_zh":"一个音节，不用隔音符号"}],"zh":"以 a、o、e 开头的音节跟在同一个词的另一个音节后面时，要写隔音符号，让读者知道音节从哪里开始：Xī'ān（西安，两个音节）和 xiān（先，一个音节）不同。","h_sw":"Apostrofi ( ' )"},{"h":"大写和连写 Capitals and word spacing","en":"Write the syllables of one word together (xuésheng, lǎoshī) and leave a space between words (Wǒ shì lǎoshī.). Use a capital letter at the start of a sentence and for names of people and places (Zhōngguó, Běijīng, Hāsāng).","sw":"Andika silabi za neno moja pamoja (xuésheng, lǎoshī) na uache nafasi kati ya maneno (Wǒ shì lǎoshī.). Tumia herufi kubwa mwanzoni mwa sentensi na kwa majina ya watu na mahali (Zhōngguó, Běijīng, Hāsāng).","examples":[{"zh":"中国","p":"Zhōngguó","en":"China","sw":"China"},{"zh":"北京","p":"Běijīng","en":"Beijing","sw":"Beijing"},{"zh":"我是老师。","p":"Wǒ shì lǎoshī.","en":"I am a teacher.","sw":"Mimi ni mwalimu."}],"zh":"同一个词的音节连在一起写（xuésheng, lǎoshī），词和词之间空一格（Wǒ shì lǎoshī.）。句子开头以及人名、地名的第一个字母要大写（Zhōngguó, Běijīng, Hāsāng）。","h_sw":"Herufi kubwa na nafasi kati ya maneno"}],"practice":[{"t":"mcq","q":"Which spelling of 好 is correct?","o":["hǎo","haǒ","hǎò"],"a":0,"tag":"pinyin","ex":"a comes first in a-o-e-i-u-ü, so the mark goes on a.","q_sw":"Uandishi upi wa 好 ni sahihi?","q_zh":"“好”的哪种拼写是正确的？","ex_sw":"a inatangulia katika a-o-e-i-u-ü, kwa hiyo alama inakaa juu ya a.","ex_zh":"在 a-o-e-i-u-ü 的顺序里 a 排第一，所以标在 a 上。"},{"t":"mcq","q":"Which spelling of 六 (six) is correct?","o":["lìu","liù","lìù"],"a":1,"tag":"pinyin","ex":"In iu the mark goes on the second letter: liù.","q_sw":"Uandishi upi wa 六 (sita) ni sahihi?","q_zh":"“六”的哪种拼写是正确的？","ex_sw":"Katika iu alama inakaa kwenye herufi ya pili: liù.","ex_zh":"iu 的声调标在第二个字母上：liù。"},{"t":"mcq","q":"Which spelling of 对 (correct) is correct?","o":["duì","dùi","duí"],"a":0,"tag":"pinyin","ex":"In ui the mark goes on the second letter: duì.","q_sw":"Uandishi upi wa 对 (sahihi) ni sahihi?","q_zh":"“对”的哪种拼写是正确的？","ex_sw":"Katika ui alama inakaa kwenye herufi ya pili: duì.","ex_zh":"ui 的声调标在第二个字母上：duì。"},{"t":"mcq","q":"The final iou with no initial and 3rd tone (有, to have) is written…","o":["iǒu","yǒu","yoǔ"],"a":1,"tag":"pinyin","ex":"iou → you; mark on o.","q_sw":"Sauti ya mwisho iou bila sauti ya mwanzo na toni ya 3 (有, kuwa na) huandikwa…","q_zh":"韵母 iou 前面没有声母、读第三声时（有），写作……","ex_sw":"iou → you; alama juu ya o.","ex_zh":"iou → you；标在 o 上。"},{"t":"mcq","q":"西安 (the city Xi'an) is written…","o":["Xīān","Xī'ān","Xiān"],"a":1,"tag":"pinyin","ex":"An apostrophe separates xī and ān.","q_sw":"西安 (mji wa Xi'an) huandikwa…","q_zh":"西安（城市名）写作……","ex_sw":"Apostrofi inatenganisha xī na ān.","ex_zh":"隔音符号把 xī 和 ān 分开。"},{"t":"mcq","q":"去 (to go) is written…","o":["qù","qǜ","qiù"],"a":0,"tag":"pinyin","ex":"After q the dots of ü are dropped.","q_sw":"去 (kwenda) huandikwa…","q_zh":"去 写作……","ex_sw":"Baada ya q nukta za ü huondolewa.","ex_zh":"在 q 后面，ü 上的两点省去。"},{"t":"pinyin","q":"月","a":"yuè","tag":"pinyin","ex":"üe with no initial → yue; mark on e.","ex_sw":"üe bila sauti ya mwanzo → yue; alama juu ya e.","ex_zh":"üe 前面没有声母 → yue；标在 e 上。"},{"t":"pinyin","q":"水","a":"shuǐ","tag":"pinyin","ex":"uei → ui; mark on the second letter i.","ex_sw":"uei → ui; alama juu ya herufi ya pili i.","ex_zh":"uei → ui；标在第二个字母 i 上。"},{"t":"pinyin","q":"外","a":"wài","tag":"pinyin","ex":"uai → wai; mark on a.","ex_sw":"uai → wai; alama juu ya a.","ex_zh":"uai → wai；标在 a 上。"},{"t":"pinyin","q":"中国","a":"Zhōngguó","tag":"pinyin","ex":"A country name: capital Z, written as one word.","ex_sw":"Jina la nchi: Z kubwa, huandikwa kama neno moja.","ex_zh":"国名：首字母 Z 大写，连写成一个词。"},{"t":"match","pairs":[["i →","yi"],["u →","wu"],["ü →","yu"],["ie →","ye"],["uo →","wo"]],"tag":"pinyin","ex":"y/w spelling rules.","ex_sw":"Kanuni za uandishi wa y/w.","ex_zh":"y/w 拼写规则。"}]},{"id":"P5","title_zh":"变调","title_en":"Tone changes (tone sandhi)","title_sw":"Mabadiliko ya toni","intro":{"en":"In connected speech, some tones change because of the tone that follows. The spelling in dictionaries usually does not change, so you must know these rules: 3+3, the half-third tone, 一 yī, 不 bù, neutral-tone words and (briefly) 儿化.","sw":"Katika mazungumzo ya mfululizo, baadhi ya toni hubadilika kwa sababu ya toni inayofuata. Uandishi katika kamusi kwa kawaida haubadiliki, kwa hiyo lazima ujue kanuni hizi: 3+3, nusu ya toni ya tatu, 一 yī, 不 bù, maneno ya toni hafifu na (kwa ufupi) 儿化.","zh":"在连续说话时，有些声调会因为后面的声调而改变。词典里的拼写一般不变，所以必须掌握这些规则：3+3、半三声、“一”、“不”、轻声词，以及（简单介绍）儿化。"},"sections":[{"h":"3 + 3 → 2 + 3","en":"When two 3rd tones come together, the first one is said as a 2nd tone. We still WRITE both as 3rd tones. 你好 is written nǐ hǎo but said ní hǎo.","sw":"Toni mbili za tatu zikikutana, ya kwanza hutamkwa kama toni ya pili. Bado TUNAANDIKA zote mbili kama toni ya tatu. 你好 huandikwa nǐ hǎo lakini hutamkwa ní hǎo.","examples":[{"zh":"你好","p":"nǐ hǎo","en":"hello","note":"said ní hǎo","sw":"habari; hujambo","note_sw":"hutamkwa ní hǎo","note_zh":"读作 ní hǎo"},{"zh":"很好","p":"hěn hǎo","en":"very good","note":"said hén hǎo","sw":"nzuri sana","note_sw":"hutamkwa hén hǎo","note_zh":"读作 hén hǎo"},{"zh":"水果","p":"shuǐguǒ","en":"fruit","note":"said shuíguǒ","sw":"tunda; matunda","note_sw":"hutamkwa shuíguǒ","note_zh":"读作 shuíguǒ"},{"zh":"可以","p":"kěyǐ","en":"may; can","note":"said kéyǐ","sw":"-weza; ruhusiwa","note_sw":"hutamkwa kéyǐ","note_zh":"读作 kéyǐ"}],"zh":"两个第三声连在一起时，第一个读成第二声。但书写时两个都仍然标第三声。你好 写作 nǐ hǎo，读作 ní hǎo。","h_sw":"3 + 3 → 2 + 3","h_zh":"三声连读：3 + 3 → 2 + 3"},{"h":"半三声 The half-third tone","en":"Before a 1st, 2nd, 4th or most neutral tones, a 3rd tone is only the low part (21): it goes down and stays low, without rising again. Only at the end of a phrase, or when said alone, do you hear the full dip-and-rise 214.","sw":"Kabla ya toni ya kwanza, ya pili, ya nne au toni hafifu nyingi, toni ya tatu ni sehemu ya chini tu (21): inashuka na kubaki chini, bila kupanda tena. Mwishoni mwa kifungu tu, au ikitamkwa peke yake, ndipo unasikia 214 kamili ya kushuka na kupanda.","examples":[{"zh":"老师","p":"lǎoshī","en":"teacher","note":"low + high","sw":"mwalimu","note_sw":"chini + juu","note_zh":"低 + 高"},{"zh":"很忙","p":"hěn máng","en":"very busy","note":"low + rising","sw":"-na shughuli nyingi sana","note_sw":"chini + inapanda","note_zh":"低 + 升"},{"zh":"好看","p":"hǎokàn","en":"good-looking","note":"low + falling","sw":"-zuri kwa sura","note_sw":"chini + inashuka","note_zh":"低 + 降"},{"zh":"姐姐","p":"jiějie","en":"elder sister","note":"low + neutral","sw":"dada mkubwa","note_sw":"chini + hafifu","note_zh":"低 + 轻声"}],"zh":"在第一声、第二声、第四声和大多数轻声前面，第三声只读低的部分（21）：降下去就停在低处，不再升上来。只有在短语末尾或单独读时，才读出完整的先降后升 214。","h_sw":"Nusu ya toni ya 3"},{"h":"“一”的变调 The tone of 一","en":"一 is yī when it is alone, when counting, at the end of a word, or used as an ordinal (第一). Before a 4th tone (or a neutral tone that was originally 4th, like 个) it becomes yí. Before a 1st, 2nd or 3rd tone it becomes yì. Many textbooks write the changed tone; dictionaries write yī.","sw":"一 ni yī ikiwa peke yake, unapohesabu, mwishoni mwa neno, au ikitumika kama namba ya mpangilio (第一). Kabla ya toni ya nne (au toni hafifu ambayo asili yake ni ya nne, kama 个) inakuwa yí. Kabla ya toni ya kwanza, ya pili au ya tatu inakuwa yì. Vitabu vingi huandika toni iliyobadilika; kamusi huandika yī.","examples":[{"zh":"第一","p":"dì-yī","en":"first","note":"yī","sw":"kwanza"},{"zh":"十一","p":"shíyī","en":"eleven","note":"yī","sw":"kumi na moja"},{"zh":"一个","p":"yí ge","en":"one (thing)","note":"yí before 个 (4th)","sw":"kimoja; moja","note_sw":"yí kabla ya 个 (toni ya 4)","note_zh":"在“个”（第四声）前读 yí"},{"zh":"一样","p":"yíyàng","en":"the same","note":"yí + 4th","sw":"sawa; -leile","note_sw":"yí + toni ya 4","note_zh":"yí + 第四声"},{"zh":"一天","p":"yì tiān","en":"one day","note":"yì + 1st","sw":"siku moja","note_sw":"yì + toni ya 1","note_zh":"yì + 第一声"},{"zh":"一年","p":"yì nián","en":"one year","note":"yì + 2nd","sw":"mwaka mmoja","note_sw":"yì + toni ya 2","note_zh":"yì + 第二声"},{"zh":"一起","p":"yìqǐ","en":"together","note":"yì + 3rd","sw":"pamoja","note_sw":"yì + toni ya 3","note_zh":"yì + 第三声"}],"zh":"“一”单独读、数数、在词尾或表示序数（第一）时读 yī。在第四声前（或本来是第四声的轻声前，如“个”）变成 yí。在第一、二、三声前变成 yì。很多课本标的是变调后的声调；词典标 yī。","h_sw":"Toni ya 一"},{"h":"“不”的变调 The tone of 不","en":"不 is normally bù. Before a 4th tone it becomes bú.","sw":"不 kwa kawaida ni bù. Kabla ya toni ya nne inakuwa bú.","examples":[{"zh":"不是","p":"bú shì","en":"is not","note":"bú + 4th","sw":"si","note_sw":"bú + toni ya 4","note_zh":"bú + 第四声"},{"zh":"不去","p":"bú qù","en":"not go","note":"bú + 4th","sw":"kutokwenda","note_sw":"bú + toni ya 4","note_zh":"bú + 第四声"},{"zh":"不对","p":"bú duì","en":"not correct","note":"bú + 4th","sw":"si sahihi","note_sw":"bú + toni ya 4","note_zh":"bú + 第四声"},{"zh":"不好","p":"bù hǎo","en":"not good","note":"bù","sw":"si nzuri"},{"zh":"不来","p":"bù lái","en":"not come","note":"bù","sw":"kutokuja"},{"zh":"不吃","p":"bù chī","en":"not eat","note":"bù","sw":"kutokula"}],"zh":"“不”一般读 bù。在第四声前面变成 bú。","h_sw":"Toni ya 不"},{"h":"轻声词 Neutral-tone words","en":"Many common words have a neutral second syllable: repeated family words (妈妈, 爸爸), words ending in 子, and some fixed words (朋友, 谢谢, 东西). The neutral tone can change the meaning: 东西 dōngxi = thing; 东西 dōng xī = east and west. The pitch of a neutral tone depends on the tone before it: after a 3rd tone it is fairly high; after the other tones it is lower.","sw":"Maneno mengi ya kawaida yana silabi ya pili yenye toni hafifu: maneno ya familia yanayojirudia (妈妈, 爸爸), maneno yanayoishia na 子, na maneno fulani maalum (朋友, 谢谢, 东西). Toni hafifu inaweza kubadilisha maana: 东西 dōngxi = kitu; 东西 dōng xī = mashariki na magharibi. Kiwango cha toni hafifu hutegemea toni iliyotangulia: baada ya toni ya tatu huwa juu kiasi; baada ya toni nyingine huwa chini zaidi.","examples":[{"zh":"妈妈","p":"māma","en":"mum","sw":"mama"},{"zh":"爸爸","p":"bàba","en":"dad","sw":"baba"},{"zh":"桌子","p":"zhuōzi","en":"table","sw":"meza"},{"zh":"朋友","p":"péngyou","en":"friend","sw":"rafiki"},{"zh":"东西","p":"dōngxi","en":"thing","note":"dōng xī = east and west","sw":"kitu","note_sw":"dōng xī = mashariki na magharibi","note_zh":"dōng xī = 东方和西方"},{"zh":"地方","p":"dìfang","en":"place","sw":"mahali"}],"zh":"很多常用词的第二个音节读轻声：重叠的亲属称谓（妈妈、爸爸）、以“子”结尾的词，以及一些固定的词（朋友、谢谢、东西）。轻声可以区别意思：东西 dōngxi = 物品；东西 dōng xī = 东方和西方。轻声的高低取决于前一个字的声调：在第三声后面比较高；在其他声调后面比较低。","h_sw":"Maneno yenye toni hafifu"},{"h":"儿化 The -r ending (érhuà)","en":"In Beijing and northern China, many words add an -r sound: 哪儿 nǎr (where), 这儿 zhèr (here), 一点儿 yìdiǎnr (a little), 玩儿 wánr (to play). The 儿 is not a separate syllable; curl the tongue at the end of the word. In the south of China people often say 哪里 nǎlǐ, 这里 zhèlǐ instead. Learn to recognise 儿化; you do not need to use it a lot.","sw":"Katika Beijing na kaskazini mwa China, maneno mengi huongeza sauti ya -r: 哪儿 nǎr (wapi), 这儿 zhèr (hapa), 一点儿 yìdiǎnr (kidogo), 玩儿 wánr (kucheza). 儿 si silabi tofauti; pinda ulimi mwishoni mwa neno. Kusini mwa China watu mara nyingi husema 哪里 nǎlǐ, 这里 zhèlǐ badala yake. Jifunze kuitambua 儿化; huhitaji kuitumia sana.","examples":[{"zh":"哪儿","p":"nǎr","en":"where","sw":"wapi"},{"zh":"这儿","p":"zhèr","en":"here","sw":"hapa"},{"zh":"一点儿","p":"yìdiǎnr","en":"a little","sw":"kidogo"},{"zh":"玩儿","p":"wánr","en":"to play; have fun","sw":"kucheza; kufurahi"}],"zh":"在北京和中国北方，很多词后面加一个 -r 音：哪儿 nǎr（哪里）、这儿 zhèr（这里）、一点儿 yìdiǎnr（一点）、玩儿 wánr（玩）。“儿”不是一个单独的音节，而是在词尾卷一下舌头。中国南方的人常说 哪里 nǎlǐ、这里 zhèlǐ。学会听懂儿化就可以，不需要多用。","h_sw":"Mwisho wa -r (érhuà)"}],"practice":[{"t":"mcq","q":"How is 你好 (written nǐ hǎo) actually said?","o":["nǐ hǎo with two full 3rd tones","ní hǎo","nǐ hāo"],"a":1,"tag":"tones","ex":"3 + 3 → 2 + 3.","q_sw":"你好 (huandikwa nǐ hǎo) kwa kweli hutamkwaje?","q_zh":"你好（写作 nǐ hǎo）实际上怎么读？","ex_sw":"3 + 3 → 2 + 3.","ex_zh":"3 + 3 → 2 + 3。","o_sw":["nǐ hǎo yenye toni mbili kamili za 3","ní hǎo","nǐ hāo"],"o_zh":["nǐ hǎo，两个完整的第三声","ní hǎo","nǐ hāo"]},{"t":"mcq","q":"How is 不 said in 不是?","o":["bù","bú","bu (neutral)"],"a":1,"tag":"tones","ex":"不 before a 4th tone (shì) → bú.","q_sw":"不 hutamkwaje katika 不是?","q_zh":"“不是”里的“不”怎么读？","ex_sw":"不 kabla ya toni ya 4 (shì) → bú.","ex_zh":"“不”在第四声（shì）前 → bú。","o_sw":["bù","bú","bu (hafifu)"],"o_zh":["bù","bú","bu（轻声）"]},{"t":"mcq","q":"How is 一 said in 一个?","o":["yī","yí","yì"],"a":1,"tag":"tones","ex":"个 is originally 4th tone, so 一 → yí.","q_sw":"一 hutamkwaje katika 一个?","q_zh":"“一个”里的“一”怎么读？","ex_sw":"个 asili yake ni toni ya 4, kwa hiyo 一 → yí.","ex_zh":"“个”本来是第四声，所以“一” → yí。"},{"t":"mcq","q":"How is 一 said in 一天?","o":["yī","yí","yì"],"a":2,"tag":"tones","ex":"Before a 1st tone, 一 → yì.","q_sw":"一 hutamkwaje katika 一天?","q_zh":"“一天”里的“一”怎么读？","ex_sw":"Kabla ya toni ya 1, 一 → yì.","ex_zh":"在第一声前，“一” → yì。"},{"t":"mcq","q":"How is 一 said in 第一?","o":["yī","yí","yì"],"a":0,"tag":"tones","ex":"Ordinal numbers and the end of a word keep yī.","q_sw":"一 hutamkwaje katika 第一?","q_zh":"“第一”里的“一”怎么读？","ex_sw":"Namba za mpangilio na mwisho wa neno hubaki yī.","ex_zh":"序数和词尾的“一”保持读 yī。"},{"t":"mcq","q":"Which word has a neutral tone on its second syllable?","o":["东西 (thing)","老师","中国"],"a":0,"tag":"tones","ex":"东西 dōngxi = thing; 老师 lǎoshī and 中国 Zhōngguó have full tones.","q_sw":"Neno lipi lina toni hafifu kwenye silabi yake ya pili?","q_zh":"哪个词的第二个音节读轻声？","ex_sw":"东西 dōngxi = kitu; 老师 lǎoshī na 中国 Zhōngguó zina toni kamili.","ex_zh":"东西 dōngxi = 物品；老师 lǎoshī 和 中国 Zhōngguó 都读完整的声调。","o_sw":["东西 (kitu)","老师","中国"],"o_zh":["东西（物品）","老师","中国"]},{"t":"mcq","q":"How is 不 said in 不好?","o":["bù","bú"],"a":0,"tag":"tones","ex":"好 is not 4th tone, so 不 stays bù.","q_sw":"不 hutamkwaje katika 不好?","q_zh":"“不好”里的“不”怎么读？","ex_sw":"好 si toni ya 4, kwa hiyo 不 inabaki bù.","ex_zh":"“好”不是第四声，所以“不”仍读 bù。"},{"t":"listen","audio":"不去","q":"What do you hear?","o":["bù qù","bú qù"],"a":1,"tag":"listening","ex":"不 + 4th tone → bú qù.","q_sw":"Unasikia nini?","q_zh":"你听到的是什么？","ex_sw":"不 + toni ya 4 → bú qù.","ex_zh":"“不” + 第四声 → bú qù。"},{"t":"listen","audio":"一起","q":"What do you hear?","o":["yīqǐ","yíqǐ","yìqǐ"],"a":2,"tag":"listening","ex":"一 + 3rd tone → yì.","q_sw":"Unasikia nini?","q_zh":"你听到的是什么？","ex_sw":"一 + toni ya 3 → yì.","ex_zh":"“一” + 第三声 → yì。"},{"t":"tone","q":"妈妈","p":"māma","a":[1,0],"tag":"tones","ex":"mā + neutral ma.","ex_sw":"mā + ma hafifu.","ex_zh":"mā + 轻声 ma。"},{"t":"tone","q":"谢谢","p":"xièxie","a":[4,0],"tag":"tones","ex":"xiè + neutral xie.","ex_sw":"xiè + xie hafifu.","ex_zh":"xiè + 轻声 xie。"},{"t":"tone","q":"朋友","p":"péngyou","a":[2,0],"tag":"tones","ex":"péng + neutral you.","ex_sw":"péng + you hafifu.","ex_zh":"péng + 轻声 you。"},{"t":"match","pairs":[["不是","bú shì"],["不好","bù hǎo"],["一样","yíyàng"],["一年","yì nián"]],"tag":"tones","ex":"Apply the 一 and 不 rules.","ex_sw":"Tumia kanuni za 一 na 不.","ex_zh":"运用“一”和“不”的变调规则。"},{"t":"speak","q":"Read aloud. Remember 3 + 3 → 2 + 3.","audio":"你好！我很好。","tag":"tones","ex":"Said ní hǎo; wǒ hén hǎo.","q_sw":"Soma kwa sauti. Kumbuka 3 + 3 → 2 + 3.","q_zh":"朗读。记住 3 + 3 → 2 + 3。","ex_sw":"Hutamkwa ní hǎo; wǒ hén hǎo.","ex_zh":"读作 ní hǎo；wǒ hén hǎo。"}]},{"id":"P6","title_zh":"笔画","title_en":"Strokes","title_sw":"Mistari ya herufi","intro":{"en":"Every Chinese character is written with strokes — the lines made without lifting the pen. There are eight basic strokes and about 20–30 compound strokes built from them. Knowing their names helps you write, count strokes, and follow stroke-order animations.","sw":"Kila herufi ya Kichina huandikwa kwa mistari — mistari inayochorwa bila kuinua kalamu. Kuna mistari minane ya msingi na takriban 20–30 ya mchanganyiko inayojengwa kutokana nayo. Kujua majina yake kunakusaidia kuandika, kuhesabu mistari, na kufuata michoro ya mpangilio wa mistari.","zh":"每个汉字都由笔画写成——笔画就是笔不离开纸写出的线条。基本笔画有八种，由它们组合成的复合笔画约有 20–30 种。知道笔画名称，有助于写字、数笔画和看懂笔顺动画。"},"sections":[{"h":"什么是笔画？ What is a stroke?","en":"A stroke starts when the pen touches the paper and ends when it is lifted. A turning stroke like 横折 in 口 is ONE stroke, even though it has two directions. 口 therefore has 3 strokes, not 4. Most strokes go from top to bottom or from left to right — never from right to left horizontally.","sw":"Mstari huanza kalamu inapogusa karatasi na huisha inapoinuliwa. Mstari unaopinda kama 横折 katika 口 ni mstari MMOJA, ingawa una mielekeo miwili. Kwa hiyo 口 ina mistari 3, si 4. Mistari mingi huenda kutoka juu kwenda chini au kutoka kushoto kwenda kulia — kamwe si kutoka kulia kwenda kushoto kwa mlalo.","examples":[{"zh":"一","p":"yī","en":"one","note":"1 stroke","sw":"moja","note_sw":"mstari 1","note_zh":"1 画"},{"zh":"人","p":"rén","en":"person","note":"2 strokes","sw":"mtu","note_sw":"mistari 2","note_zh":"2 画"},{"zh":"口","p":"kǒu","en":"mouth","note":"3 strokes","sw":"mdomo","note_sw":"mistari 3","note_zh":"3 画"},{"zh":"中","p":"zhōng","en":"middle","note":"4 strokes","sw":"katikati","note_sw":"mistari 4","note_zh":"4 画"}],"zh":"笔尖接触纸面时一笔开始，笔离开纸面时一笔结束。像“口”里的横折那样拐弯的笔画，虽然有两个方向，但只算一笔。所以“口”是 3 画，不是 4 画。大多数笔画是从上往下或从左往右写的——横向的笔画从来不从右往左写。","h_sw":"Mstari (笔画) ni nini?"},{"h":"基本笔画 The eight basic strokes","en":"The eight basic strokes. Each example gives the stroke name, its shape, and characters that contain it.","sw":"Mistari minane ya msingi. Kila mfano unatoa jina la mstari, umbo lake, na herufi zenye mstari huo.","examples":[{"zh":"横 ㇐","p":"héng","en":"horizontal: straight line from left to right","sw":"mstari wa kulala kutoka kushoto kwenda kulia","note":"e.g. 一 yī (one), 十 shí (ten)","note_sw":"k.m. 一 yī (moja), 十 shí (kumi)","note_zh":"例：一、十"},{"zh":"竖 ㇑","p":"shù","en":"vertical: straight line from top to bottom","sw":"mstari wima kutoka juu kwenda chini","note":"e.g. 十 shí (ten), 中 zhōng (middle)","note_sw":"k.m. 十 shí (kumi), 中 zhōng (katikati)","note_zh":"例：十、中"},{"zh":"撇 ㇒","p":"piě","en":"left-falling: from top right sweeping down to the left","sw":"mstari unaoshuka kutoka juu kulia kwenda chini kushoto","note":"e.g. 人 rén (person), 八 bā (eight)","note_sw":"k.m. 人 rén (mtu), 八 bā (nane)","note_zh":"例：人、八"},{"zh":"点 ㇔","p":"diǎn","en":"dot: short stroke going down to the right","sw":"kitone: mstari mfupi unaoshuka kulia","note":"e.g. 六 liù (six), 头 tóu (head)","note_sw":"k.m. 六 liù (sita), 头 tóu (kichwa)","note_zh":"例：六、头"},{"zh":"捺 ㇏","p":"nà","en":"right-falling: from top left down to the right, getting thicker, with a flat end","sw":"mstari unaoshuka kutoka juu kushoto kwenda chini kulia, unanenepa mwishoni","note":"e.g. 人 rén (person), 大 dà (big)","note_sw":"k.m. 人 rén (mtu), 大 dà (kubwa)","note_zh":"例：人、大"},{"zh":"提 ㇀","p":"tí","en":"rising: short stroke from bottom left going up to the right","sw":"mstari mfupi unaopanda kutoka chini kushoto kwenda juu kulia","note":"e.g. 我 wǒ (I), 地 dì (ground)","note_sw":"k.m. 我 wǒ (mimi), 地 dì (ardhi)","note_zh":"例：我、地"},{"zh":"折 ㇕","p":"zhé","en":"turning: the stroke changes direction without lifting the pen (e.g. 横折)","sw":"mstari unaobadilisha mwelekeo bila kuinua kalamu (k.m. 横折)","note":"e.g. 口 kǒu (mouth), 山 shān (mountain)","note_sw":"k.m. 口 kǒu (mdomo), 山 shān (mlima)","note_zh":"例：口、山"},{"zh":"钩 ㇚","p":"gōu","en":"hook: a small flick at the end of a stroke (e.g. 竖钩)","sw":"ndoano: mkwaruzo mdogo mwishoni mwa mstari (k.m. 竖钩)","note":"e.g. 小 xiǎo (small), 水 shuǐ (water)","note_sw":"k.m. 小 xiǎo (ndogo), 水 shuǐ (maji)","note_zh":"例：小、水"}],"zh":"八种基本笔画。每个例子给出笔画名称、形状以及含有这个笔画的汉字。","h_sw":"Mistari minane ya msingi"},{"h":"复合笔画 Common compound strokes","en":"Compound strokes join two or more basic movements in one stroke. Their names simply list the movements in order: 横折钩 = horizontal + turn + hook.","sw":"Mistari ya mchanganyiko inaunganisha miondoko miwili au zaidi ya msingi katika mstari mmoja. Majina yake yanataja miondoko hiyo kwa mpangilio: 横折钩 = mlalo + pinda + ndoano.","examples":[{"zh":"横折 ㇕","p":"héngzhé","en":"horizontal then turn down","sw":"mlalo kisha pinda chini","note":"e.g. 口 kǒu (mouth), 日 rì (sun)","note_sw":"k.m. 口 kǒu (mdomo), 日 rì (jua)","note_zh":"例：口、日"},{"zh":"横撇 ㇇","p":"héngpiě","en":"horizontal then sweep down-left","sw":"mlalo kisha shuka kushoto","note":"e.g. 又 yòu (again), 水 shuǐ (water)","note_sw":"k.m. 又 yòu (tena), 水 shuǐ (maji)","note_zh":"例：又、水"},{"zh":"横钩 ㇖","p":"hénggōu","en":"horizontal ending in a small hook down-left","sw":"mlalo unaoishia na ndoano ndogo chini","note":"e.g. 买 mǎi (to buy), 字 zì (character)","note_sw":"k.m. 买 mǎi (kununua), 字 zì (herufi)","note_zh":"例：买、字"},{"zh":"竖钩 ㇚","p":"shùgōu","en":"vertical ending in a hook to the left","sw":"wima unaoishia na ndoano kushoto","note":"e.g. 小 xiǎo (small), 水 shuǐ (water)","note_sw":"k.m. 小 xiǎo (ndogo), 水 shuǐ (maji)","note_zh":"例：小、水"},{"zh":"竖折 ㇗","p":"shùzhé","en":"vertical then turn right","sw":"wima kisha pinda kulia","note":"e.g. 山 shān (mountain), 出 chū (to go out)","note_sw":"k.m. 山 shān (mlima), 出 chū (kutoka nje)","note_zh":"例：山、出"},{"zh":"竖提 ㇙","p":"shùtí","en":"vertical then flick up to the right","sw":"wima kisha panda kulia","note":"e.g. 以 yǐ (by means of), 比 bǐ (compare)","note_sw":"k.m. 以 yǐ (kwa njia ya), 比 bǐ (kulinganisha)","note_zh":"例：以、比"},{"zh":"横折钩 ㇆","p":"héngzhégōu","en":"horizontal, turn down, hook to the left","sw":"mlalo, pinda chini, ndoano kushoto","note":"e.g. 月 yuè (moon), 门 mén (door)","note_sw":"k.m. 月 yuè (mwezi), 门 mén (mlango)","note_zh":"例：月、门"},{"zh":"竖弯钩 ㇟","p":"shùwāngōu","en":"vertical, curve to the right, hook up","sw":"wima, pinda kulia kwa mzingo, ndoano juu","note":"e.g. 七 qī (seven), 儿 ér (son; -r)","note_sw":"k.m. 七 qī (saba), 儿 ér (mwana; -r)","note_zh":"例：七、儿"},{"zh":"撇折 ㇜","p":"piězhé","en":"left-falling then turn up to the right","sw":"shuka kushoto kisha pinda juu kulia","note":"e.g. 么 me (as in 什么), 红 hóng (red)","note_sw":"k.m. 么 me (kama katika 什么), 红 hóng (nyekundu)","note_zh":"例：么（什么）、红"},{"zh":"撇点 ㇛","p":"piědiǎn","en":"left-falling then turn down to the right","sw":"shuka kushoto kisha pinda chini kulia","note":"e.g. 女 nǚ (woman), 好 hǎo (good)","note_sw":"k.m. 女 nǚ (mwanamke), 好 hǎo (nzuri)","note_zh":"例：女、好"},{"zh":"横折提 ㇊","p":"héngzhétí","en":"horizontal, turn down, flick up to the right","sw":"mlalo, pinda chini, panda kulia","note":"e.g. 说 shuō (to speak), 话 huà (words)","note_sw":"k.m. 说 shuō (kusema), 话 huà (maneno)","note_zh":"例：说、话"},{"zh":"弯钩 ㇁","p":"wāngōu","en":"slightly curved vertical with a hook to the left","sw":"wima uliopinda kidogo wenye ndoano kushoto","note":"e.g. 子 zǐ (child), 了 le (particle)","note_sw":"k.m. 子 zǐ (mtoto), 了 le (kiambishi)","note_zh":"例：子、了"},{"zh":"斜钩 ㇂","p":"xiégōu","en":"long slanting stroke down to the right with a hook up","sw":"mstari mrefu wa mshazari kwenda chini kulia wenye ndoano juu","note":"e.g. 我 wǒ (I), 成 chéng (to become)","note_sw":"k.m. 我 wǒ (mimi), 成 chéng (kuwa)","note_zh":"例：我、成"},{"zh":"卧钩 ㇃","p":"wògōu","en":"lying curve with a hook, like a smile","sw":"mzingo uliolala wenye ndoano, kama tabasamu","note":"e.g. 心 xīn (heart)","note_sw":"k.m. 心 xīn (moyo)","note_zh":"例：心"},{"zh":"横折弯钩 ㇈","p":"héngzhéwāngōu","en":"horizontal, turn down, curve right, hook up","sw":"mlalo, pinda chini, pinda kulia, ndoano juu","note":"e.g. 九 jiǔ (nine), 几 jǐ (how many)","note_sw":"k.m. 九 jiǔ (tisa), 几 jǐ (ngapi)","note_zh":"例：九、几"},{"zh":"横撇弯钩 ㇌","p":"héngpiěwāngōu","en":"horizontal, sweep left, curve and hook (the ear radical 阝)","sw":"mlalo, shuka kushoto, pinda na ndoano (kama katika 阝)","note":"e.g. 那 nà (that), 都 dōu (all)","note_sw":"k.m. 那 nà (ile), 都 dōu (wote)","note_zh":"例：那、都"}],"zh":"复合笔画是在一笔里连起两个或更多基本动作。它们的名称就是按顺序列出这些动作：横折钩 = 横 + 折 + 钩。","h_sw":"Mistari ya mchanganyiko inayotumika sana"},{"h":"写字小建议 Writing tips","en":"Use squared paper (田字格) and keep each character the same size. Say the stroke names aloud while writing — '横，竖' for 十. Short practice every day (5 characters × 5 times) works better than a long session once a week.","sw":"Tumia karatasi yenye miraba (田字格) na uweke kila herufi ukubwa uleule. Taja majina ya mistari kwa sauti unapoandika — '横，竖' kwa 十. Mazoezi mafupi kila siku (herufi 5 × mara 5) ni bora kuliko kipindi kirefu mara moja kwa wiki.","examples":[{"zh":"十","p":"shí","en":"ten","note":"横，竖","sw":"kumi"},{"zh":"八","p":"bā","en":"eight","note":"撇，捺","sw":"nane"},{"zh":"口","p":"kǒu","en":"mouth","note":"竖，横折，横","sw":"mdomo"}],"zh":"用田字格本，每个字写得一样大。一边写一边大声说出笔画名称——写“十”时说“横，竖”。每天短时间练习（5 个字 × 每个写 5 遍）比一周一次长时间练习效果更好。","h_sw":"Ushauri wa kuandika"}],"practice":[{"t":"mcq","q":"What is the first stroke of 十?","o":["横 (horizontal)","竖 (vertical)","撇 (left-falling)"],"a":0,"tag":"characters","ex":"十: 横, then 竖.","q_sw":"Mstari wa kwanza wa 十 ni upi?","q_zh":"“十”的第一笔是什么？","ex_sw":"十: 横, kisha 竖.","ex_zh":"十：先横，后竖。","o_sw":["横 (mlalo)","竖 (wima)","撇 (unaoshuka kushoto)"],"o_zh":["横","竖","撇"]},{"t":"mcq","q":"What is the last stroke of 人?","o":["点","捺","提"],"a":1,"tag":"characters","ex":"人: 撇, then 捺.","q_sw":"Mstari wa mwisho wa 人 ni upi?","q_zh":"“人”的最后一笔是什么？","ex_sw":"人: 撇, kisha 捺.","ex_zh":"人：先撇，后捺。"},{"t":"mcq","q":"How many strokes does 口 have?","o":["2","3","4"],"a":1,"tag":"characters","ex":"竖, 横折, 横 — the turning stroke counts as one.","q_sw":"口 ina mistari mingapi?","q_zh":"“口”有几画？","ex_sw":"竖, 横折, 横 — mstari unaopinda unahe
