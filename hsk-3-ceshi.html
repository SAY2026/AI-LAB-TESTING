男：你的手机怎么又没电了？\n女：别提了，这块电池已经用了三年，早就该换了。\n问：女的是什么意思？","q":"女的是什么意思？","o":["电池该换了","手机丢了","想买新电脑","没有时间充电"],"a":0,"ex":"早就该换了 = should have been replaced long ago; she means the battery is old.","tag":"listening","ex_sw":"早就该换了 = ilipaswa kubadilishwa zamani; anamaanisha betri ni ya zamani.","ex_zh":"“早就该换了”——电池早就应该换了，她的意思是电池太旧了。"},{"t":"listen","audio":"女：听说你当上部门经理了，祝贺你！\n男：谢谢！不过压力也挺大的，我怕自己做不好。\n问：男的现在心情怎么样？","q":"男的现在心情怎么样？","o":["非常生气","很失望","十分轻松","有点儿担心"],"a":3,"ex":"我怕自己做不好 shows he is a little worried (担心), even though he is thankful.","tag":"listening","ex_sw":"我怕自己做不好 inaonyesha ana wasiwasi kidogo (担心), ingawa anashukuru.","ex_zh":"“我怕自己做不好”说明他虽然很感谢，但是有点儿担心。"},{"t":"listen","audio":"男：这件衣服打八折，才两百块，真便宜！\n女：质量怎么样？太便宜的东西不一定好。\n问：女的担心什么？","q":"女的担心什么？","o":["价格太高","质量不好","颜色不好看","大小不合适"],"a":1,"ex":"She asks 质量怎么样 and says cheap things are not necessarily good — she worries about quality.","tag":"listening","ex_sw":"Anauliza 质量怎么样 na anasema vitu vya bei rahisi si lazima viwe vizuri — ana wasiwasi kuhusu ubora.","ex_zh":"她问“质量怎么样”，还说太便宜的东西不一定好——她担心质量。"},{"t":"listen","audio":"女：从这儿到机场要多长时间？\n男：不堵车的话，四十分钟就够了。可现在是下班时间，恐怕得一个多小时。\n问：现在去机场大概要多长时间？","q":"现在去机场大概要多长时间？","o":["二十分钟","四十分钟","一个多小时","半天"],"a":2,"ex":"Forty minutes is only if there is no traffic; now it is rush hour, so 恐怕得一个多小时.","tag":"listening","ex_sw":"Dakika arobaini ni pale tu pasipo msongamano; sasa ni saa za watu kutoka kazini, kwa hiyo 恐怕得一个多小时.","ex_zh":"不堵车的话四十分钟就够了，可现在是下班时间，“恐怕得一个多小时”。"},{"t":"listen","audio":"男：阿米娜，你的论文写完了吗？\n女：差不多了，不过王老师让我再补充一些数据。\n问：阿米娜还需要做什么？","q":"阿米娜还需要做什么？","o":["重新写论文","补充数据","翻译文章","准备考试"],"a":1,"ex":"王老师让我再补充一些数据 — she still has to add more data.","tag":"listening","ex_sw":"王老师让我再补充一些数据 — bado anapaswa kuongeza takwimu zaidi.","ex_zh":"“王老师让我再补充一些数据”——她还要补充一些数据。"},{"t":"listen","audio":"女：天气预报说明天有大雨，我们去海边的计划是不是要取消了？\n男：别着急，可以推迟到后天嘛。\n问：男的建议怎么做？","q":"男的建议怎么做？","o":["取消计划","明天照样去","改去看电影","推迟一天"],"a":3,"ex":"推迟到后天 = postpone from tomorrow to the day after, i.e. one day later. He does NOT want to cancel.","tag":"listening","ex_sw":"推迟到后天 = kuahirisha kutoka kesho hadi keshokutwa, yaani siku moja baadaye. HATAKI kufuta.","ex_zh":"“推迟到后天”——从明天推到后天，就是推迟一天。他不想取消计划。"},{"t":"listen","audio":"男：这台电脑一开机就出问题，是不是有病毒了？\n女：可能是系统的问题。你还是找专业的人来修吧。\n问：女的建议男的怎么做？","q":"女的建议男的怎么做？","o":["请专业的人修电脑","自己修电脑","买一台新电脑","重新开机"],"a":0,"ex":"找专业的人来修 = get a professional to repair it.","tag":"listening","ex_sw":"找专业的人来修 = kumtafuta fundi mtaalamu aitengeneze.","ex_zh":"“找专业的人来修”——她建议找专业的人来修电脑。"},{"t":"listen","audio":"女：哈桑，你怎么突然辞职了？\n男：我想趁年轻试一试，自己开一家小公司。\n问：哈桑为什么辞职？","q":"哈桑为什么辞职？","o":["身体不好","工资太低","想自己开公司","和同事吵架了"],"a":2,"ex":"自己开一家小公司 — he wants to start his own company while he is young (趁年轻).","tag":"listening","ex_sw":"自己开一家小公司 — anataka kuanzisha kampuni yake mwenyewe akiwa bado kijana (趁年轻).","ex_zh":"“自己开一家小公司”——他想趁年轻自己开公司。"},{"t":"listen","audio":"男：这次比赛你们输了，大家是不是很失望？\n女：有点儿失望是正常的，但我们也从中积累了不少经验。\n问：女的对比赛结果是什么态度？","q":"女的对比赛结果是什么态度？","o":["很后悔","比较积极","非常生气","完全不在乎"],"a":1,"ex":"She admits some disappointment but focuses on the experience gained — a positive (积极) attitude.","tag":"listening","ex_sw":"Anakiri kuvunjika moyo kidogo lakini anazingatia uzoefu walioupata — mtazamo chanya (积极).","ex_zh":"她承认有点儿失望，但更看重积累的经验——态度很积极。"}],"inst_sw":"Sikiliza mara moja. Kila swali ni mazungumzo ya mistari miwili yakifuatiwa na swali. Chagua jibu sahihi."},{"name":"听力 第二部分","skill":"listening","inst_zh":"每题听一次。请听一段较长的对话或短文，回答后面的几个问题。","inst_en":"Listen once to a longer dialogue or passage (the same recording is used for 2–3 numbered questions) and choose the correct answer.","items":[{"t":"listen","audio":"桑给巴尔是一个美丽的岛，每年都吸引很多外国人来旅游。很多人来这里是为了看大海、晒太阳，其实这里的香料也非常有名。在岛上的香料农场里，客人可以亲眼看到各种香料是怎么生长的。导游一边带大家参观，一边介绍每种香料的用途：有的可以做菜，有的可以做药，还有的可以做香水。参观结束以后，很多人都会买一些香料带回国，送给亲戚朋友。\n问：很多外国人来桑给巴尔主要是为了什么？","q":"【短文一】第1题（共3题）：很多外国人来桑给巴尔主要是为了什么？","o":["学习语言","看大海、晒太阳","做生意","买房子"],"a":1,"ex":"很多人来这里是为了看大海、晒太阳.","tag":"listening","ex_sw":"很多人来这里是为了看大海、晒太阳.","ex_zh":"“很多人来这里是为了看大海、晒太阳”。"},{"t":"listen","audio":"桑给巴尔是一个美丽的岛，每年都吸引很多外国人来旅游。很多人来这里是为了看大海、晒太阳，其实这里的香料也非常有名。在岛上的香料农场里，客人可以亲眼看到各种香料是怎么生长的。导游一边带大家参观，一边介绍每种香料的用途：有的可以做菜，有的可以做药，还有的可以做香水。参观结束以后，很多人都会买一些香料带回国，送给亲戚朋友。\n问：在香料农场，客人可以做什么？","q":"【短文一】第2题（共3题）：在香料农场，客人可以做什么？","o":["自己做香水","免费吃饭","看香料是怎么生长的","种水果"],"a":2,"ex":"客人可以亲眼看到各种香料是怎么生长的.","tag":"listening","ex_sw":"客人可以亲眼看到各种香料是怎么生长的.","ex_zh":"“客人可以亲眼看到各种香料是怎么生长的”。"},{"t":"listen","audio":"桑给巴尔是一个美丽的岛，每年都吸引很多外国人来旅游。很多人来这里是为了看大海、晒太阳，其实这里的香料也非常有名。在岛上的香料农场里，客人可以亲眼看到各种香料是怎么生长的。导游一边带大家参观，一边介绍每种香料的用途：有的可以做菜，有的可以做药，还有的可以做香水。参观结束以后，很多人都会买一些香料带回国，送给亲戚朋友。\n问：根据这段话，香料可以用来做什么？","q":"【短文一】第3题（共3题）：根据这段话，香料可以用来做什么？","o":["做衣服","做家具","做玩具","做药"],"a":3,"ex":"有的可以做菜，有的可以做药，还有的可以做香水 — of the four options, only 做药 is mentioned.","tag":"listening","ex_sw":"有的可以做菜，有的可以做药，还有的可以做香水 — kati ya majibu, ni 做药 pekee lililotajwa.","ex_zh":"“有的可以做菜，有的可以做药，还有的可以做香水”——四个选项里只有“做药”在短文里提到了。"},{"t":"listen","audio":"女：阿里，你最近怎么总是迟到？\n男：对不起，经理。我搬家了，现在住得比较远，每天要换两次公共汽车。\n女：那你可以早点儿出门啊。\n男：我每天六点就出门了，可是路上经常堵车。我正在考虑买一辆摩托车。\n问：阿里为什么经常迟到？","q":"【对话一】第1题（共2题）：阿里为什么经常迟到？","o":["起床太晚","住得远，路上堵车","身体不舒服","忘了上班时间"],"a":1,"ex":"He moved far away, changes buses twice, and there are traffic jams (堵车).","tag":"listening","ex_sw":"Alihamia mbali, anabadilisha mabasi mara mbili, na kuna msongamano wa magari (堵车).","ex_zh":"他搬家了，住得远，每天要换两次公共汽车，路上还经常堵车。"},{"t":"listen","audio":"女：阿里，你最近怎么总是迟到？\n男：对不起，经理。我搬家了，现在住得比较远，每天要换两次公共汽车。\n女：那你可以早点儿出门啊。\n男：我每天六点就出门了，可是路上经常堵车。我正在考虑买一辆摩托车。\n问：阿里打算怎么做？","q":"【对话一】第2题（共2题）：阿里打算怎么做？","o":["买一辆摩托车","再搬一次家","换一份工作","每天坐出租车"],"a":0,"ex":"我正在考虑买一辆摩托车.","tag":"listening","ex_sw":"我正在考虑买一辆摩托车.","ex_zh":"“我正在考虑买一辆摩托车”——他打算买摩托车。"},{"t":"listen","audio":"很多人学外语的时候，最怕的就是说错。他们担心别人笑话自己，所以宁可不开口。其实，说错是学习过程中很正常的一部分。小孩子学说话的时候，每天都会说错很多次，但是他们从来不害怕，所以进步得特别快。一位有经验的老师说过：“想学好一门语言，就要勇敢地说，不要怕别人笑话。”只要坚持练习，每天进步一点点，总有一天你会说得很流利。\n问：很多人学外语时最怕什么？","q":"【短文二】第1题（共3题）：很多人学外语时最怕什么？","o":["记生词","考试","说错","写汉字"],"a":2,"ex":"最怕的就是说错.","tag":"listening","ex_sw":"最怕的就是说错.","ex_zh":"“最怕的就是说错”。"},{"t":"listen","audio":"很多人学外语的时候，最怕的就是说错。他们担心别人笑话自己，所以宁可不开口。其实，说错是学习过程中很正常的一部分。小孩子学说话的时候，每天都会说错很多次，但是他们从来不害怕，所以进步得特别快。一位有经验的老师说过：“想学好一门语言，就要勇敢地说，不要怕别人笑话。”只要坚持练习，每天进步一点点，总有一天你会说得很流利。\n问：小孩子学说话为什么进步得快？","q":"【短文二】第2题（共3题）：小孩子学说话为什么进步得快？","o":["记性特别好","不怕说错","有好老师","每天看书"],"a":1,"ex":"他们从来不害怕（说错），所以进步得特别快.","tag":"listening","ex_sw":"他们从来不害怕（说错），所以进步得特别快.","ex_zh":"“他们从来不害怕（说错），所以进步得特别快”。"},{"t":"listen","audio":"很多人学外语的时候，最怕的就是说错。他们担心别人笑话自己，所以宁可不开口。其实，说错是学习过程中很正常的一部分。小孩子学说话的时候，每天都会说错很多次，但是他们从来不害怕，所以进步得特别快。一位有经验的老师说过：“想学好一门语言，就要勇敢地说，不要怕别人笑话。”只要坚持练习，每天进步一点点，总有一天你会说得很流利。\n问：这段话主要想告诉我们什么？","q":"【短文二】第3题（共3题）：这段话主要想告诉我们什么？","o":["小孩子比大人聪明","学外语不能说错","学外语要勇敢开口说","语言太难学了"],"a":2,"ex":"The main idea: don't fear mistakes; speak bravely and keep practising.","tag":"listening","ex_sw":"Wazo kuu: usiogope makosa; ongea kwa ujasiri na uendelee kufanya mazoezi.","ex_zh":"主要意思：不要怕说错，要勇敢地说，坚持练习。"},{"t":"listen","audio":"现在，很多年轻人每天花好几个小时看手机，却很少读书。一项调查显示，超过一半的大学生一个月读不完一本书。专家认为，手机上的信息虽然多，但是往往又短又简单，很难让人认真地思考。因此，他们建议大家每天至少留出半个小时，放下手机，安安静静地读一本好书。\n问：调查发现了什么？","q":"【短文三】第1题（共2题）：调查发现了什么？","o":["大学生都很喜欢读书","大学生不用手机","手机上没有信息","超过一半的大学生一个月读不完一本书"],"a":3,"ex":"超过一半的大学生一个月读不完一本书.","tag":"listening","ex_sw":"超过一半的大学生一个月读不完一本书.","ex_zh":"“超过一半的大学生一个月读不完一本书”。"},{"t":"listen","audio":"现在，很多年轻人每天花好几个小时看手机，却很少读书。一项调查显示，超过一半的大学生一个月读不完一本书。专家认为，手机上的信息虽然多，但是往往又短又简单，很难让人认真地思考。因此，他们建议大家每天至少留出半个小时，放下手机，安安静静地读一本好书。\n问：专家建议大家怎么做？","q":"【短文三】第2题（共2题）：专家建议大家怎么做？","o":["每天少睡半个小时","每天读半个小时书","不要买手机","多上网找信息"],"a":1,"ex":"每天至少留出半个小时……读一本好书.","tag":"listening","ex_sw":"每天至少留出半个小时……读一本好书.","ex_zh":"“每天至少留出半个小时……读一本好书”。"},{"t":"listen","audio":"男：您好，我想预订一个房间，下周五和周六两个晚上。\n女：好的，请问一共几位？\n男：两个大人，一个孩子。能不能安排一间能看到海的房间？\n女：能看到海的房间只剩一间了，比普通房间贵一些，您确定要吗？\n男：没问题，就要这间。\n问：男的要住几个晚上？","q":"【对话二】第1题（共2题）：男的要住几个晚上？","o":["一个","两个","三个","五个"],"a":1,"ex":"下周五和周六两个晚上.","tag":"listening","ex_sw":"下周五和周六两个晚上.","ex_zh":"“下周五和周六两个晚上”——住两个晚上。"},{"t":"listen","audio":"男：您好，我想预订一个房间，下周五和周六两个晚上。\n女：好的，请问一共几位？\n男：两个大人，一个孩子。能不能安排一间能看到海的房间？\n女：能看到海的房间只剩一间了，比普通房间贵一些，您确定要吗？\n男：没问题，就要这间。\n问：关于那个房间，可以知道什么？","q":"【对话二】第2题（共2题）：关于那个房间，可以知道什么？","o":["看不到海","已经没有了","比普通房间贵","只能住两个人"],"a":2,"ex":"能看到海的房间……比普通房间贵一些; one such room is still left.","tag":"listening","ex_sw":"能看到海的房间……比普通房间贵一些; bado kuna chumba kimoja cha aina hiyo.","ex_zh":"“能看到海的房间……比普通房间贵一些”，而且只剩一间了。"}],"inst_sw":"Sikiliza mara moja mazungumzo marefu zaidi au kifungu (rekodi moja inatumika kwa maswali 2–3 yenye namba) kisha uchague jibu sahihi."},{"name":"阅读 第一部分","skill":"reading","inst_zh":"阅读短文，选出最适合填在空格（___）中的词语或句子。","inst_en":"Read the passage and choose the word or sentence that best fills the gap (___).","items":[{"t":"mcq","q":"【短文一】第（1）空：去年，我在一家公司找到了第一份工作。刚开始的时候，我什么都不懂，每天都很___。幸运的是，部门里的同事对我特别（2），遇到问题时总是耐心地帮助我。经过半年的努力，我不但熟悉了工作，（3）还交到了几个好朋友。现在想起来，（4）。","o":["热闹","紧张","精彩","干净"],"a":1,"ex":"A new employee who knows nothing feels 紧张 (nervous). 热闹/精彩/干净 do not describe a person's feeling here.","tag":"reading","ex_sw":"Mfanyakazi mpya asiyejua chochote huhisi 紧张 (wasiwasi). 热闹/精彩/干净 hayaelezi hisia za mtu hapa.","ex_zh":"刚工作、什么都不懂的人会觉得“紧张”。热闹、精彩、干净在这里都不能说人的心情。"},{"t":"mcq","q":"【短文一】第（2）空：去年，我在一家公司找到了第一份工作。刚开始的时候，我什么都不懂，每天都很（1）。幸运的是，部门里的同事对我特别___，遇到问题时总是耐心地帮助我。经过半年的努力，我不但熟悉了工作，（3）还交到了几个好朋友。现在想起来，（4）。","o":["骄傲","粗心","热情","危险"],"a":2,"ex":"对我特别热情 = very warm/kind to me; fits 耐心地帮助我.","tag":"reading","ex_sw":"对我特别热情 = mchangamfu/mwema sana kwangu; inaendana na 耐心地帮助我.","ex_zh":"“对我特别热情”跟后面的“耐心地帮助我”意思一致。"},{"t":"mcq","q":"【短文一】第（3）空：去年，我在一家公司找到了第一份工作。刚开始的时候，我什么都不懂，每天都很（1）。幸运的是，部门里的同事对我特别（2），遇到问题时总是耐心地帮助我。经过半年的努力，我不但熟悉了工作，___还交到了几个好朋友。现在想起来，（4）。","o":["而且","但是","因此","否则"],"a":0,"ex":"Fixed pattern 不但……而且…… (not only … but also).","tag":"reading","ex_sw":"Muundo maalum 不但……而且…… (si tu … bali pia).","ex_zh":"固定搭配：不但……而且……。"},{"t":"mcq","q":"【短文一】第（4）空：去年，我在一家公司找到了第一份工作。刚开始的时候，我什么都不懂，每天都很（1）。幸运的是，部门里的同事对我特别（2），遇到问题时总是耐心地帮助我。经过半年的努力，我不但熟悉了工作，（3）还交到了几个好朋友。现在想起来，___。","o":["我再也不想工作了","那段经历让我成长了很多","同事们都离开了公司","我从来没有遇到过困难"],"a":1,"ex":"The story is positive (help, friends, progress); the ending should sum up growth. The first sentence says 什么都不懂, so 没有遇到过困难 is wrong.","tag":"reading","ex_sw":"Hadithi ni chanya (msaada, marafiki, maendeleo); mwisho unapaswa kufupisha ukuaji. Sentensi ya kwanza inasema 什么都不懂, kwa hiyo 没有遇到过困难 si sahihi.","ex_zh":"故事是积极的（有人帮助、交了朋友、有进步），结尾应该总结成长。第一句说“什么都不懂”，所以“没有遇到过困难”不对。"},{"t":"mcq","q":"【短文二】第（1）空：很多人认为，吃早饭不重要，___是早上时间紧张的年轻人，经常不吃早饭就去上班。其实，这种习惯对身体的（2）很大。经过一夜的休息，人体需要补充营养。如果不吃早饭，上午就容易感到累，工作效率也会（3）。所以，（4）多忙，都应该吃一顿简单的早饭。","o":["几乎","到底","尤其","终于"],"a":2,"ex":"尤其是…… = especially …; it picks out one group (young people) from 很多人.","tag":"reading","ex_sw":"尤其是…… = hasa …; linachagua kundi moja (vijana) kutoka 很多人.","ex_zh":"“尤其是……”从“很多人”里特别指出一部分人（年轻人）。"},{"t":"mcq","q":"【短文二】第（2）空：很多人认为，吃早饭不重要，（1）是早上时间紧张的年轻人，经常不吃早饭就去上班。其实，这种习惯对身体的___很大。经过一夜的休息，人体需要补充营养。如果不吃早饭，上午就容易感到累，工作效率也会（3）。所以，（4）多忙，都应该吃一顿简单的早饭。","o":["印象","影响","意见","条件"],"a":1,"ex":"对……的影响很大 = has a big effect on …. 印象 (impression) looks similar but does not fit.","tag":"reading","ex_sw":"对……的影响很大 = ina athari kubwa kwa …. 印象 (taswira) linafanana lakini halifai.","ex_zh":"“对……的影响很大”；“印象”字形相近，但意思不对。"},{"t":"mcq","q":"【短文二】第（3）空：很多人认为，吃早饭不重要，（1）是早上时间紧张的年轻人，经常不吃早饭就去上班。其实，这种习惯对身体的（2）很大。经过一夜的休息，人体需要补充营养。如果不吃早饭，上午就容易感到累，工作效率也会___。所以，（4）多忙，都应该吃一顿简单的早饭。","o":["降低","缩短","放弃","减少"],"a":0,"ex":"效率降低 = efficiency drops. 效率 goes with 提高/降低, not 缩短 (shorten time/length) or 减少 (reduce amount).","tag":"reading","ex_sw":"效率降低 = ufanisi hushuka. 效率 huenda na 提高/降低, si 缩短 (kufupisha muda/urefu) wala 减少 (kupunguza kiasi).","ex_zh":"效率降低：“效率”常和“提高／降低”搭配，不和“缩短”（时间、长度）或“减少”（数量）搭配。"},{"t":"mcq","q":"【短文二】第（4）空：很多人认为，吃早饭不重要，（1）是早上时间紧张的年轻人，经常不吃早饭就去上班。其实，这种习惯对身体的（2）很大。经过一夜的休息，人体需要补充营养。如果不吃早饭，上午就容易感到累，工作效率也会（3）。所以，___多忙，都应该吃一顿简单的早饭。","o":["虽然","因为","只要","无论"],"a":3,"ex":"无论……都…… = no matter how busy, (you) should …. 都 in the next clause needs 无论/不管.","tag":"reading","ex_sw":"无论……都…… = haijalishi una shughuli kiasi gani, (unapaswa) …. 都 katika kishazi kinachofuata kinahitaji 无论/不管.","ex_zh":"无论……都……：不管多忙都应该……。后面有“都”，前面要用“无论／不管”。"}],"inst_sw":"Soma kifungu kisha uchague neno au sentensi inayofaa zaidi kujaza pengo (___)."},{"name":"阅读 第二部分","skill":"reading","inst_zh":"每题有一段文字，请选出与这段文字内容一致的一项。","inst_en":"Each item has a short text. Choose the option that agrees with the text.","items":[{"t":"mcq","q":"椰子树在桑给巴尔非常多。椰子不仅可以直接吃，椰子水还是一种很好的饮料。当地人还用椰子树的叶子盖房子、做篮子，几乎一点儿也不浪费。\n与这段话意思一致的是：","o":["椰子树在桑给巴尔很少","椰子树的叶子没有用","当地人不喝椰子水","椰子树的很多部分都有用"],"a":3,"ex":"Fruit, water and leaves are all used — 几乎一点儿也不浪费.","tag":"reading","ex_sw":"Tunda, maji na majani vyote vinatumika — 几乎一点儿也不浪费.","ex_zh":"椰子、椰子水和叶子都有用——“几乎一点儿也不浪费”。"},{"t":"mcq","q":"幽默的人往往更受欢迎。在紧张的气氛中，一句幽默的话常常能让大家放松下来。不过，开玩笑也要注意时间和地点，否则可能会让别人不舒服。\n与这段话意思一致的是：","o":["幽默能让人放松","幽默的人不受欢迎","什么时候开玩笑都合适","紧张的时候不能说话"],"a":0,"ex":"一句幽默的话常常能让大家放松下来. The text warns jokes are NOT always appropriate.","tag":"reading","ex_sw":"一句幽默的话常常能让大家放松下来. Maandishi yanaonya kwamba utani HAUFAI kila wakati.","ex_zh":"“一句幽默的话常常能让大家放松下来”。短文还提醒，开玩笑不是什么时候都合适。"},{"t":"mcq","q":"SAY AI Lab每个周末都有年轻人来给村里的孩子上课。他们大部分是大学生，不拿工资，只希望孩子们能多学一点儿知识。\n与这段话意思一致的是：","o":["来上课的都是老师","孩子们不喜欢上课","他们周末给孩子上课","他们的工资很高"],"a":2,"ex":"每个周末……来给村里的孩子上课; they are mostly university students and 不拿工资.","tag":"reading","ex_sw":"每个周末……来给村里的孩子上课; wengi wao ni wanafunzi wa chuo kikuu na 不拿工资.","ex_zh":"“每个周末……来给村里的孩子上课”；他们大部分是大学生，而且“不拿工资”。","q_zh":"SAY AI Lab每个周末都有年轻人来给村里的孩子上课。他们大部分是大学生，不拿工资，只希望孩子们能多学一点儿知识。\n与这段话意思一致的是：","q_sw":"SAY AI Lab每个周末都有年轻人来给村里的孩子上课。他们大部分是大学生，不拿工资，只希望孩子们能多学一点儿知识。\n与这段话意思一致的是："},{"t":"mcq","q":"有人认为睡得越多越好，但是研究发现，大人每天睡七到八个小时最合适。睡得太少或者太多，对健康都没有好处。\n与这段话意思一致的是：","o":["睡得越多越健康","大人最好每天睡七到八个小时","睡觉和健康没有关系","这个研究还没有结果"],"a":1,"ex":"大人每天睡七到八个小时最合适; both too little and too much sleep are bad.","tag":"reading","ex_sw":"大人每天睡七到八个小时最合适; kulala kidogo mno au kupita kiasi vyote ni vibaya.","ex_zh":"“大人每天睡七到八个小时最合适”；睡得太少或太多都不好。"},{"t":"mcq","q":"网上购物既方便又便宜，所以越来越受欢迎。但是，在网上买衣服有时会遇到问题：照片上看起来很好看，收到后却发现颜色、大小都不合适。所以，买之前最好仔细看看别人的评价。\n与这段话意思一致的是：","o":["网上购物越来越少","在网上买衣服一定没问题","网上的东西都很贵","买东西前可以先看看别人的评价"],"a":3,"ex":"买之前最好仔细看看别人的评价. The text says online shopping is cheap and increasingly popular.","tag":"reading","ex_sw":"买之前最好仔细看看别人的评价. Maandishi yanasema ununuzi mtandaoni ni rahisi na unazidi kupendwa.","ex_zh":"“买之前最好仔细看看别人的评价”。短文说网上购物便宜，而且越来越受欢迎。"}],"inst_sw":"Kila swali lina maandishi mafupi. Chagua jibu linalokubaliana na maandishi."},{"name":"阅读 第三部分","skill":"reading","inst_zh":"阅读短文，回答后面的问题。","inst_en":"Read each passage and answer the questions.","items":[{"t":"mcq","q":"【短文一】\n朱玛的爷爷是一个打鱼的人，在海边生活了一辈子。朱玛小时候最喜欢跟着爷爷坐船出海。有一次，海上突然刮起了大风，小船变得很不稳，朱玛吓得哭了起来。爷爷却一点儿也不慌，他一边小心地控制着小船，一边对朱玛说：“别怕，风再大也会停的。只要我们不放弃，就一定能回家。”过了一个多小时，风果然小了，他们平安地回到了家。\n后来，朱玛长大了，成了一名医生。工作中，他常常遇到很难治的病人，有时候好几天都休息不好。每当他想放弃的时候，就会想起爷爷在船上说的那句话。他说：“爷爷没有上过学，但是他教会了我最重要的一课——遇到困难的时候，要冷静，要坚持。”\n\n第1题（共4题）：朱玛小时候最喜欢做什么？","o":["在家看书","跟着爷爷出海","去医院玩","在海边游泳"],"a":1,"ex":"朱玛小时候最喜欢跟着爷爷坐船出海.","tag":"reading","ex_sw":"朱玛小时候最喜欢跟着爷爷坐船出海.","ex_zh":"“朱玛小时候最喜欢跟着爷爷坐船出海”。"},{"t":"mcq","q":"【短文一】\n朱玛的爷爷是一个打鱼的人，在海边生活了一辈子。朱玛小时候最喜欢跟着爷爷坐船出海。有一次，海上突然刮起了大风，小船变得很不稳，朱玛吓得哭了起来。爷爷却一点儿也不慌，他一边小心地控制着小船，一边对朱玛说：“别怕，风再大也会停的。只要我们不放弃，就一定能回家。”过了一个多小时，风果然小了，他们平安地回到了家。\n后来，朱玛长大了，成了一名医生。工作中，他常常遇到很难治的病人，有时候好几天都休息不好。每当他想放弃的时候，就会想起爷爷在船上说的那句话。他说：“爷爷没有上过学，但是他教会了我最重要的一课——遇到困难的时候，要冷静，要坚持。”\n\n第2题（共4题）：刮大风的时候，爷爷怎么样？","o":["非常冷静","很紧张","哭了起来","很生气"],"a":0,"ex":"爷爷却一点儿也不慌 — it was Juma who cried.","tag":"reading","ex_sw":"爷爷却一点儿也不慌 — aliyelia ni Juma.","ex_zh":"“爷爷却一点儿也不慌”——哭的是朱玛，不是爷爷。"},{"t":"mcq","q":"【短文一】\n朱玛的爷爷是一个打鱼的人，在海边生活了一辈子。朱玛小时候最喜欢跟着爷爷坐船出海。有一次，海上突然刮起了大风，小船变得很不稳，朱玛吓得哭了起来。爷爷却一点儿也不慌，他一边小心地控制着小船，一边对朱玛说：“别怕，风再大也会停的。只要我们不放弃，就一定能回家。”过了一个多小时，风果然小了，他们平安地回到了家。\n后来，朱玛长大了，成了一名医生。工作中，他常常遇到很难治的病人，有时候好几天都休息不好。每当他想放弃的时候，就会想起爷爷在船上说的那句话。他说：“爷爷没有上过学，但是他教会了我最重要的一课——遇到困难的时候，要冷静，要坚持。”\n\n第3题（共4题）：朱玛现在做什么工作？","o":["打鱼","老师","司机","医生"],"a":3,"ex":"后来……成了一名医生.","tag":"reading","ex_sw":"后来……成了一名医生.","ex_zh":"“后来……成了一名医生”。"},{"t":"mcq","q":"【短文一】\n朱玛的爷爷是一个打鱼的人，在海边生活了一辈子。朱玛小时候最喜欢跟着爷爷坐船出海。有一次，海上突然刮起了大风，小船变得很不稳，朱玛吓得哭了起来。爷爷却一点儿也不慌，他一边小心地控制着小船，一边对朱玛说：“别怕，风再大也会停的。只要我们不放弃，就一定能回家。”过了一个多小时，风果然小了，他们平安地回到了家。\n后来，朱玛长大了，成了一名医生。工作中，他常常遇到很难治的病人，有时候好几天都休息不好。每当他想放弃的时候，就会想起爷爷在船上说的那句话。他说：“爷爷没有上过学，但是他教会了我最重要的一课——遇到困难的时候，要冷静，要坚持。”\n\n第4题（共4题）：这篇文章主要想说明什么？","o":["出海很危险","医生的工作很累","遇到困难要冷静、要坚持","没上过学的人不懂道理"],"a":2,"ex":"The grandfather's lesson: 遇到困难的时候，要冷静，要坚持. The text says the opposite of D.","tag":"reading","ex_sw":"Funzo la babu: 遇到困难的时候，要冷静，要坚持. Maandishi yanasema kinyume cha D.","ex_zh":"爷爷教的一课：“遇到困难的时候，要冷静，要坚持”。短文的意思和D正好相反。"},{"t":"mcq","q":"【短文二】\n近几年，人工智能（AI）发展得非常快，也开始进入学校和教室。在一些地区，学生可以用电脑上的人工智能练习口语、检查作文，还可以随时提问。对于缺少老师的农村学校来说，这当然是一个好消息。\n不过，也有人担心：如果学生什么都问电脑，会不会失去独立思考的能力？专家认为，关键在于怎么使用。人工智能应该是老师的“帮手”，而不能代替老师。老师可以用它来准备材料、了解每个学生的问题，把更多时间留给和学生的交流。\n总的来说，技术本身没有好坏，重要的是人们能不能合理地利用它。\n\n第1题（共4题）：根据第一段，学生可以用人工智能做什么？","o":["代替老师上课","练习口语、检查作文","修电脑","参加考试"],"a":1,"ex":"学生可以……练习口语、检查作文，还可以随时提问.","tag":"reading","ex_sw":"学生可以……练习口语、检查作文，还可以随时提问.","ex_zh":"“学生可以……练习口语、检查作文，还可以随时提问”。"},{"t":"mcq","q":"【短文二】\n近几年，人工智能（AI）发展得非常快，也开始进入学校和教室。在一些地区，学生可以用电脑上的人工智能练习口语、检查作文，还可以随时提问。对于缺少老师的农村学校来说，这当然是一个好消息。\n不过，也有人担心：如果学生什么都问电脑，会不会失去独立思考的能力？专家认为，关键在于怎么使用。人工智能应该是老师的“帮手”，而不能代替老师。老师可以用它来准备材料、了解每个学生的问题，把更多时间留给和学生的交流。\n总的来说，技术本身没有好坏，重要的是人们能不能合理地利用它。\n\n第2题（共4题）：有些人担心什么？","o":["学生会失去独立思考的能力","电脑太贵了","农村学校没有电","学生不喜欢提问"],"a":0,"ex":"会不会失去独立思考的能力？","tag":"reading","ex_sw":"会不会失去独立思考的能力？","ex_zh":"“会不会失去独立思考的能力？”——担心学生失去独立思考的能力。"},{"t":"mcq","q":"【短文二】\n近几年，人工智能（AI）发展得非常快，也开始进入学校和教室。在一些地区，学生可以用电脑上的人工智能练习口语、检查作文，还可以随时提问。对于缺少老师的农村学校来说，这当然是一个好消息。\n不过，也有人担心：如果学生什么都问电脑，会不会失去独立思考的能力？专家认为，关键在于怎么使用。人工智能应该是老师的“帮手”，而不能代替老师。老师可以用它来准备材料、了解每个学生的问题，把更多时间留给和学生的交流。\n总的来说，技术本身没有好坏，重要的是人们能不能合理地利用它。\n\n第3题（共4题）：专家认为，人工智能应该是：","o":["老师的“帮手”","老师的代替者","学生的玩具","考试的工具"],"a":0,"ex":"人工智能应该是老师的“帮手”，而不能代替老师.","tag":"reading","ex_sw":"人工智能应该是老师的“帮手”，而不能代替老师.","ex_zh":"“人工智能应该是老师的‘帮手’，而不能代替老师”。"},{"t":"mcq","q":"【短文二】\n近几年，人工智能（AI）发展得非常快，也开始进入学校和教室。在一些地区，学生可以用电脑上的人工智能练习口语、检查作文，还可以随时提问。对于缺少老师的农村学校来说，这当然是一个好消息。\n不过，也有人担心：如果学生什么都问电脑，会不会失去独立思考的能力？专家认为，关键在于怎么使用。人工智能应该是老师的“帮手”，而不能代替老师。老师可以用它来准备材料、了解每个学生的问题，把更多时间留给和学生的交流。\n总的来说，技术本身没有好坏，重要的是人们能不能合理地利用它。\n\n第4题（共4题）：最后一段的意思是：","o":["技术都是不好的","技术越新越好","应该少用电脑","关键看人们怎么用技术"],"a":3,"ex":"技术本身没有好坏，重要的是人们能不能合理地利用它.","tag":"reading","ex_sw":"技术本身没有好坏，重要的是人们能不能合理地利用它.","ex_zh":"“技术本身没有好坏，重要的是人们能不能合理地利用它”。"}],"inst_sw":"Soma kila kifungu kisha ujibu maswali."},{"name":"书写 第一部分","skill":"writing","inst_zh":"用所给的词语写一个完整的句子。","inst_en":"Put the given words in order to make a correct sentence.","items":[{"t":"order","words":["这个消息","让","大家","感到","非常","意外"],"a":["这个消息让大家感到非常意外。"],"ex":"Causative 让: A 让 B + feeling. 这个消息 (subject) 让 大家 (object) 感到非常意外.","tag":"writing","ex_sw":"让 ya kusababisha: A 让 B + hisia. 这个消息 (kiima) 让 大家 (kitendwa) 感到非常意外.","ex_zh":"使令句：A + 让 + B + 感受。“这个消息”是主语，“大家”是宾语：这个消息让大家感到非常意外。"},{"t":"order","words":["他","把","那本词典","借给了","同学"],"a":["他把那本词典借给了同学。"],"ex":"把-sentence: Subject + 把 + object + verb + 给 + receiver. 他把词典借给了同学.","tag":"writing","ex_sw":"Sentensi ya 把: Kiima + 把 + kitendwa + kitenzi + 给 + mpokeaji. 他把词典借给了同学.","ex_zh":"把字句：主语 + 把 + 宾语 + 动词 + 给 + 接受者。他把那本词典借给了同学。"},{"t":"order","words":["我们的建议","被","经理","接受了"],"a":["我们的建议被经理接受了。"],"ex":"被-sentence: Receiver + 被 + doer + verb + 了.","tag":"writing","ex_sw":"Sentensi ya 被: Mpokeaji + 被 + mtendaji + kitenzi + 了.","ex_zh":"被字句：受事 + 被 + 施事 + 动词 + 了。"},{"t":"order","words":["连","小孩子","都","知道","这个","道理"],"a":["连小孩子都知道这个道理。"],"ex":"连……都…… = even: 连 + noun + 都 + verb. 连小孩子都知道 = even children know.","tag":"writing","ex_sw":"连……都…… = hata: 连 + nomino + 都 + kitenzi. 连小孩子都知道 = hata watoto wanajua.","ex_zh":"连……都……表示强调：连 + 名词 + 都 + 动词。连小孩子都知道。"}],"inst_sw":"Panga maneno uliyopewa ili kupata sentensi sahihi."},{"name":"书写 第二部分","skill":"writing","inst_zh":"写一篇 80 字左右的短文。","inst_en":"Write a short text of about 80 characters.","items":[{"t":"write","q":"请结合下列词语（要全部使用，顺序不分先后），写一篇 80 字左右的短文。\n比赛　紧张　准备　表现　终于","model":"上个月，我参加了学校的汉语演讲比赛。比赛前，我认真准备了两个星期，可是到了那天还是非常紧张。上台以后，我努力让自己冷静下来，大声地讲完了。我表现得还不错，终于得了第二名。这次比赛让我更有信心了。","rubric":["All 5 words used correctly (比赛、紧张、准备、表现、终于)","About 80 characters (70–100), clear order: before → during → result","Correct grammar and characters; full-width punctuation"],"words":70,"ex":"Tell a short story in time order (前 → 那天 → 以后 → 结果). 终于 fits the result after effort; 表现得…… uses the complement 得.","tag":"writing","ex_sw":"Simulia hadithi fupi kwa mpangilio wa wakati (前 → 那天 → 以后 → 结果). 终于 inafaa kwa matokeo baada ya juhudi; 表现得…… inatumia kijalizo 得.","ex_zh":"按时间顺序讲一个小故事（比赛前 → 那天 → 以后 → 结果）。“终于”用在努力以后的结果；“表现得……”用程度补语“得”。","rubric_sw":["Maneno yote 5 yametumika kwa usahihi (比赛、紧张、准备、表现、终于)","Takriban herufi 80 (70–100), mpangilio wazi: kabla → wakati → matokeo","Sarufi na herufi sahihi; alama za uandishi za upana kamili"],"rubric_zh":["5个词语都用对了（比赛、紧张、准备、表现、终于）","大约80个字（70—100），顺序清楚：之前 → 当时 → 结果","语法和汉字正确；使用全角标点"]},{"t":"write","q":"请结合这张图片写一篇 80 字左右的短文。","img":"🏃","model":"现在很多人工作很忙，很少运动。我以前也是这样，经常觉得很累。后来，我开始每天早上去海边跑步半个小时。坚持了三个月以后，我的身体好多了，精神也更好了。我觉得运动不需要花很多钱，关键是要坚持。","rubric":["Clearly connected to the picture (跑步/运动)","About 80 characters (70–100) with a beginning, change and opinion","Correct grammar and characters; full-width punctuation"],"words":70,"ex":"A good structure: situation (以前……) → change (后来……) → result (……以后) → your view (我觉得……).","tag":"writing","ex_sw":"Muundo mzuri: hali (以前……) → mabadiliko (后来……) → matokeo (……以后) → maoni yako (我觉得……).","ex_zh":"好的结构：情况（以前……）→ 变化（后来……）→ 结果（……以后）→ 看法（我觉得……）。","rubric_sw":["Inahusiana wazi na picha (跑步/运动)","Takriban herufi 80 (70–100) yenye mwanzo, mabadiliko na maoni","Sarufi na herufi sahihi; alama za uandishi za upana kamili"],"rubric_zh":["和图片（跑步／运动）关系清楚","大约80个字（70—100），有开头、变化和看法","语法和汉字正确；使用全角标点"]}],"inst_sw":"Andika maandishi mafupi ya takriban herufi 80."}],"can_do_sw":["Kuelewa wazo kuu na maelezo muhimu ya mazungumzo ya kila siku na hotuba fupi kuhusu mada zinazofahamika (kazi, masomo, afya, safari).","Kusoma makala fupi za mtindo wa magazeti, hadithi na matangazo, na kutambua hoja kuu na mtazamo wa mwandishi.","Kuchagua neno au sentensi sahihi kukamilisha aya, kwa kutumia viunganishi kama 不但……而且……, 无论……都…… na 尤其.","Kujenga sentensi changamano sahihi kwa 把, 被, 让 na 连……都…….","Kuandika aya fupi iliyopangwa vizuri ya takriban herufi 80 kutoka kwa maneno uliyopewa au picha.","Kuzungumza kuhusu uzoefu na maoni yako kwa ukamilifu wa kutosha (HSK 5 ina takriban maneno 2,500)."],"can_do_zh":["能听懂关于工作、学习、健康、旅行等熟悉话题的日常对话和简短讲话的主要意思和重要细节。","能读懂报刊式的短文、故事和通知，找出主要观点和作者的态度。","能用“不但……而且……”“无论……都……”“尤其”等关联词，选出正确的词语或句子完成段落。","能用“把、被、让”和“连……都……”组成正确的复杂句子。","能根据给出的词语或图片，写一段大约80个字、条理清楚的短文。","能比较完整地谈自己的经历和看法（HSK五级大约有2500个词）。"]}],"PAPERS":{"1":[{"id":"H10000","files":[["../HSK1级真题 34套/10000/HSK10000.pdf","试卷.pdf"]]},{"id":"H10901","files":[["../HSK1真题27份/10901/H10901.pdf","试卷.pdf"],["../HSK1真题27份/10901/HSK1 - H10901.mp3","听力 🔊.mp3"],["../HSK1真题27份/10901/H10901.mp3","听力 🔊.mp3"]]},{"id":"H10902","files":[["../HSK1真题27份/10902/H10902.pdf","试卷.pdf"],["../HSK1真题27份/10902/HSK1 - H10902.mp3","听力 🔊.mp3"],["../HSK1真题27份/10902/H10902.mp3","听力 🔊.mp3"]]},{"id":"H11003","files":[["../HSK1真题27份/11003/H11003.pdf","试卷.pdf"],["../HSK1真题27份/11003/HSK1 - H11003.mp3","听力 🔊.mp3"],["../HSK1真题27份/11003/H11003.mp3","听力 🔊.mp3"]]},{"id":"H11004","files":[["../HSK1真题27份/11004/H11004.pdf","试卷.pdf"],["../HSK1真题27份/11004/HSK1 - H11004.mp3","听力 🔊.mp3"],["../HSK1真题27份/11004/H11004.mp3","听力 🔊.mp3"]]},{"id":"H11005","files":[["../HSK1真题27份/11005/H11005.pdf","试卷.pdf"],["../HSK1真题27份/11005/HSK1 - H11005.mp3","听力 🔊.mp3"],["../HSK1真题27份/11005/H11005.mp3","听力 🔊.mp3"]]},{"id":"H11006","files":[["../HSK1真题27份/11006/H11006听力文本.pdf","听力文本.pdf"],["../HSK1真题27份/11006/H11006答案.pdf","答案.pdf"],["../HSK1真题27份/11006/H11006 答案.pdf","答案.pdf"],["../HSK1真题27份/11006/H11006.pdf","试卷.pdf"],["../HSK1真题27份/11006/H11006试题.pdf","试卷.pdf"],["../HSK1真题27份/11006/HSK1 - H11006.mp3","听力 🔊.mp3"],["../HSK1真题27份/11006/H11006.mp3","听力 🔊.mp3"]]},{"id":"H11007","files":[["../HSK1真题27份/11007/H11007听力文本.pdf","听力文本.pdf"],["../HSK1真题27份/11007/H11007答案.pdf <script>/* SAY AI Lab 汉语 · shared engine (audio, strokes, items, Duolingo runner, progress, AI coach) */
(function(){

var esc = Z.esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};

Z.h=h;

Z.hasCJK=function(s){return CJK.test(String(s||""));};
function toast(msg){var t=h("div",{class:"toast"},esc(msg));document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
Z.toast=toast;

/* ---------- storage (safe) ---------- */
var MEM={};

Z.sget=sget;Z.sset=sset;

/* ---------- settings ---------- */
var S=Z.S=Object.assign({en:true,py:true,sw:true,rate:0.9,voice:"",theme:"",key:"",model:"claude-haiku-4-5-20251001"},sget("sayzh:settings",{}));

function applyS(){var b=document.body.classList;b.toggle("hide-en",!S.en);b.toggle("hide-py",!S.py);b.toggle("hide-sw",!S.sw);if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}
Z.saveS=saveS;Z.applyS=applyS;

/* ---------- trilingual helpers ---------- */
// tri object {zh,sw,en} or item fields -> html
Z.t=function(o,inl){
  if(o==null)return "";
  if(typeof o==="string")return '<span class="'+(CJK.test(o)?"zh":"en")+'">'+esc(o)+"</span>";
  var s="";
  if(o.zh)s+='<span class="zh">'+esc(o.zh)+"</span>";
  if(o.sw)s+='<span class="sw">'+esc(o.sw)+"</span>";
  if(o.en)s+='<span class="en">'+esc(o.en)+"</span>";
  return '<span class="tri'+(inl?" inl":"")+'">'+s+"</span>";
};
Z.L=function(zh,sw,en){return Z.t({zh:zh,sw:sw,en:en},true);};
// pick a field family e.g. f(item,'ex') -> {zh:item.ex_zh, sw:item.ex_sw, en:item.ex}
Z.fam=function(o,k){if(!o)return null;var base=o[k];var r={zh:o[k+"_zh"],sw:o[k+"_sw"],en:null};if(base!=null){if(CJK.test(base)&&!/[A-Za-z]{3,}/.test(base)){if(!r.zh)r.zh=base;}else r.en=base;}if(!r.zh&&!r.sw&&!r.en)return null;return r;};

/* ---------- pinyin (numbers -> marks) & normalisation ---------- */
var TM={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù",v:"ǖǘǚǜ"};
function syl(s,t){s=s.replace(/u:|ü/g,"v");if(!t||t==5||t==0)return s.replace(/v/g,"ü");var i=-1;if(/a/.test(s))i=s.indexOf("a");else if(/e/.test(s))i=s.indexOf("e");else if(/ou/.test(s))i=s.indexOf("o");else{for(var k=s.length-1;k>=0;k--){if("iouv".indexOf(s[k])>=0){i=k;break;}}}if(i<0)return s;var c=s[i];return (s.slice(0,i)+TM[c][t-1]+s.slice(i+1)).replace(/v/g,"ü");}
Z.num2mark=function(str){return String(str).replace(/([a-zA-Züv:]+)([0-5])/g,function(m,a,b){return syl(a.toLowerCase(),+b);});};
var DEACC={};(function(){for(var k in TM){for(var j=0;j<4;j++)DEACC[TM[k][j]]=[k==="v"?"ü":k,j+1];}})();
function pyKey(s){s=Z.num2mark(String(s).toLowerCase()).replace(/v/g,"ü");return s.replace(/[\s'’·\-.,，。!?？！]/g,"");}
Z.pyEq=function(a,b){return pyKey(a)===pyKey(b);};
function norm(s){return String(s==null?"":s).replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0);}).replace(/[\s。，、！？：；“”‘’"'.,!?:;（）()《》…—\-·~]/g,"").toLowerCase();}
Z.norm=norm;
function editSim(a,b){a=norm(a);b=norm(b);if(!a.length&&!b.length)return 1;var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i];}for(var j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n);}
Z.sim=editSim;

/* ---------- audio: recorded clip -> device voice ---------- */
var AUD=D.AUD||{};
function clean(t){t=String(t||"");t=t.replace(/[_＿]{2,}/g," ").replace(/\([^)]*\)/g," ").replace(/（[^）]*）/g," ").replace(/[…．·]+/g," ");if(!CJK.test(t))return "";var runs=(t.match(/[一-鿿0-9０-９，。？！、；：《》…‘’“”（）\s]+/g)||[]).map(function(r){return r.replace(/\s+/g,"").replace(/^[，、；：。/]+|[，、；：。/]+$/g,"");}).filter(function(r){return CJK.test(r);});if(!runs.length)return "";if(runs.length===1)return runs[0];var L=runs.reduce(function(a,b){return (b.match(/[一-鿿]/g)||[]).length>(a.match(/[一-鿿]/g)||[]).length?b:a;});return (L.match(/[一-鿿]/g)||[]).length>=4?L:"";}
Z.clean=clean;
var cur=null,voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(function(v){return /^zh|cmn/i.test(v.lang)&&!/HK|TW|yue/i.test(v.lang);});}catch(e){voices=[];}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
Z.voices=function(){return voices;};
function pickVoice(){if(!voices.length)loadVoices();if(S.voice){for(var i=0;i<voices.length;i++)if(voices[i].name===S.voice)return voices[i];}var pref=[/Xiaoxiao|晓晓/,/Tingting|婷婷/,/Google 普通话|Google.*中国/,/Yunxi|云希/,/Huihui|Yaoyao/,/zh-CN/i];for(var p=0;p<pref.length;p++)for(i=0;i<voices.length;i++)if(pref[p].test(voices[i].name+" "+voices[i].lang))return voices[i];return voices[0]||null;}
function tts(text,rate,done){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";var v=pickVoice();if(v)u.voice=v;u.rate=rate||S.rate;u.onend=function(){done&&done();};u.onerror=function(){done&&done();};speechSynthesis.speak(u);}catch(e){done&&done();}}
Z.stop=function(){try{if(cur){cur.pause();cur=null;}speechSynthesis.cancel();}catch(e){}};
Z.say=function(text,opt){opt=opt||{};var t=String(text||"").replace(/[男女问]：/g,function(m){return m;});var c=clean(t);var id=AUD[c];Z.stop();var rate=opt.rate||S.rate;
  if(id&&!opt.tts){var a=new Audio("audio/"+id+".mp3");a.playbackRate=Math.max(.5,Math.min(1.5,rate/0.9));cur=a;var fell=false;var fb=function(){if(fell)return;fell=true;tts(t,rate,opt.done);};a.onerror=fb;a.onended=function(){opt.done&&opt.done();};var p=a.play();if(p&&p.catch)p.catch(fb);return;}
  tts(t.replace(/___+/g,"，"),rate,opt.done);};
Z.sayTwice=function(text,done){Z.say(text,{done:function(){setTimeout(function(){Z.say(text,{done:done});},3000);}});};
Z.playBtn=function(text,slow){if(!Z.hasCJK(text))return "";return '<button class="play noprint" data-say="'+esc(text)+'" title="播放 · Sikiliza">▶</button>'+(slow?'<button class="play slow noprint" data-say="'+esc(text)+'" data-rate="0.55" title="慢速 · polepole">慢</button>':"");};
document.addEventListener("click",function(e){var b=e.target.closest("[data-say]");if(b){e.preventDefault();Z.say(b.getAttribute("data-say"),{rate:b.getAttribute("data-rate")?+b.getAttribute("data-rate"):null});}
  var hz=e.target.closest("[data-hz]");if(hz){Z.strokePop(hz.getAttribute("data-hz"));}});

/* ---------- pinyin lookup ---------- */
var PY=D.PY||{};
Z.py=function(zh,given){if(given)return given;return PY[zh]||"";};

/* ---------- strokes (Hanzi Writer + local data, CDN fallback) ---------- */
window.HZD=window.HZD||{};
function loadChar(ch,ok,bad){if(window.HZD[ch])return ok(window.HZD[ch]);var code=ch.codePointAt(0).toString(16);var s=document.createElement("script");s.src="hanzi/"+code+".js";s.onload=function(){if(window.HZD[ch])ok(window.HZD[ch]);else cdn();};s.onerror=cdn;document.head.appendChild(s);
  function cdn(){fetch("https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/"+encodeURIComponent(ch)+".json").then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){window.HZD[ch]=j;ok(j);}).catch(function(){bad&&bad();});}}
Z.loadChar=loadChar;
var GRID='<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="#e8a0a0" stroke-width=".6" stroke-dasharray="3 2"><line x1="0" y1="50" x2="100" y2="50"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></g></svg>';
Z.writer=function(el,ch,mode,size){size=size||110;el.innerHTML=GRID;el.style.width=el.style.height=size+"px";if(!window.HanziWriter){el.insertAdjacentHTML("beforeend",'<div style="font-size:'+(size*.7)+'px;text-align:center;line-height:'+size+'px">'+esc(ch)+"</div>");return null;}
  var w=HanziWriter.create(el,ch,{width:size,height:size,padding:6,strokeColor:"#c0392b",radicalColor:"#c0392b",outlineColor:"#ddd",drawingColor:"#333",delayBetweenStrokes:250,strokeAnimationSpeed:1,showCharacter:mode!=="quiz",showOutline:true,highlightOnComplete:true,charDataLoader:function(c,onLoad,onErr){loadChar(c,onLoad,function(){el.insertAdjacentHTML("beforeend",'<div class="muted" style="position:absolute;bottom:2px;left:4px;font-size:10px">no data</div>');onErr&&onErr();});}});
  return w;};
Z.strokeWord=function(el,word,size){var chars=Array.from(word).filter(function(c){return CJK.test(c);});el.innerHTML="";var ws=[];chars.forEach(function(c){var b=h("div",{class:"hzbox"});var d=h("div",{class:"hz"});b.appendChild(d);el.appendChild(b);ws.push(Z.writer(d,c,"show",size));});
  var i=0;function next(){if(i>=ws.length)return;var w=ws[i++];if(w)w.animateCharacter({onComplete:function(){setTimeout(next,300);}});else next();}setTimeout(next,200);return ws;};
Z.strokePop=function(word){var o=h("div",{class:"overlay"});var box=h("div",{class:"duo"});o.appendChild(box);document.body.appendChild(o);
  box.innerHTML='<div class="hd"><b style="font-size:22px">'+esc(word)+'</b> '+Z.playBtn(word,true)+' <span class="py">'+esc(Z.py(word))+'</span><button class="x right">✕</button></div><p class="muted">'+Z.L("笔顺动画：看一遍，再自己描一遍。","Mpangilio wa mistari: tazama, kisha andika mwenyewe.","Stroke order: watch, then trace it yourself.")+'</p><div class="hzwrap" id="hzw"></div><div class="flex" style="margin-top:10px"><button class="btn sm" id="hzA">▶ '+Z.L("再看一遍","Tazama tena","Replay")+'</button><button class="btn sm alt" id="hzQ">✍ '+Z.L("我来写","Niandike","Trace it")+'</button></div><div class="hzwrap" id="hzq" style="margin-top:8px"></div>';

Z.duo=function(items,key,label,opt){opt=opt||{};items=items.filter(function(it){return it&&it.t;});if(!items.length){toast("—");return;}
  var queue=opt.noShuffle?items.slice():shuffle(items);if(opt.max)queue=queue.slice(0,opt.max);var total=queue.length,idx=0,right=0,hearts=opt.hearts||5,xp=0,wrong=[];
  var o=h("div",{class:"overlay"});var box=h("div",{class:"duo"});o.appendChild(box);document.body.appendChild(o);
  box.innerHTML='<div class="hd"><button class="x">✕</button><div class="prog"><i style="width:0"></i></div><span class="hearts">❤ '+hearts+'</span><span class="xp">⭐ 0</span></div><div class="body"></div><div class="ft"><span class="msg"></span><button class="btn go">'+Z.L("检查","Angalia","Check")+"</button></div>";
  var body=$(".body",box),ft=$(".ft",box),go=$(".go",box),msg=$(".msg",box);$(".x",box).onclick=function(){Z.stop();o.remove();};
  var curEl=null,state="ask";
  function show(){state="ask";ft.className="ft";msg.innerHTML="";go.textContent="检查 · Angalia";$(".prog i",box).style.width=(idx/total*100)+"%";body.innerHTML="";var it=queue[idx];curEl=Z.item(it,null,function(){},{deferred:true});body.appendChild(curEl);if(it.audio&&(it.t==="listen"||it.t==="tf"))setTimeout(function(){Z.say(it.audio);},300);if(!Z.isAuto(it)){go.textContent=it.t==="speak"?"继续 · Endelea":"看范文 · Mfano";}}
  function end(){P.rec(key,right,total,label);P.xp(xp);P.sessInc();Z.stop();var pct=Math.round(right/total*100);body.innerHTML='<div class="big">'+(pct>=80?"🏆":pct>=50?"👍":"💪")+'</div><h2 style="text-align:center">'+right+" / "+total+" · "+pct+'%</h2><p style="text-align:center">⭐ +'+xp+" XP · 🔥 "+P.streak()+" "+Z.L("天连续","siku mfululizo","day streak")+"</p>"+(wrong.length?"<h3>"+Z.L("错题复习","Rudia makosa","Review mistakes")+"</h3>"+wrong.map(function(it){return '<div class="q">'+qText(it)+'<div class="fb show info">🔑 '+esc(keyText(it))+" "+exHTML(it)+"</div></div>";}).join(""):"");ft.innerHTML="";var again=h("button",{class:"btn"},"↻ "+Z.L("再来一次","Tena","Again"));again.onclick=function(){o.remove();Z.duo(items,key,label,opt);};var close=h("button",{class:"btn alt"},"✓ "+Z.L("完成","Maliza","Done"));close.onclick=function(){o.remove();opt.onEnd&&opt.onEnd(right,total);};ft.appendChild(again);ft.appendChild(close);$(".prog i",box).style.width="100%";}
  go.onclick=function(){if(state==="ask"){var it=queue[idx];var r=null;if(curEl._check)r=curEl._check();if(!Z.isAuto(it)){r=null;}
      if(r===true){right++;xp+=2;ft.className="ft ok";msg.innerHTML="✓ "+Z.L("太棒了！","Safi sana!","Great!");if(opt.srs&&it._w)P.srsSet(it._w,true);}
      else if(r===false){hearts--;ft.className="ft no";msg.innerHTML="✗ "+esc(keyText(it));wrong.push(it);queue.push(it);total++;if(opt.srs&&it._w)P.srsSet(it._w,false);}
      else{right++;xp+=1;ft.className="ft ok";}
      $(".hearts",box).textContent="❤ "+hearts;$(".xp",box).textContent="⭐ "+xp;state="next";go.textContent="继续 · Endelea";
      if(hearts<=0){state="end";msg.innerHTML+=" · "+Z.L("心用完了","Mioyo imekwisha","Out of hearts");}}
    else if(state==="next"){idx++;if(idx>=total||idx>60)end();else show();}
    else if(state==="end"){end();}};
  show();};

/* ---------- drills from a vocabulary list ---------- */
Z.drillItems=function(words,n){var W=words.filter(function(w){return w&&w.h;});if(W.length<3)return [];var out=[];var pick=shuffle(W).slice(0,Math.min(n||10,W.length));
  pick.forEach(function(w,i){var others=shuffle(W.filter(function(x){return x.h!==w.h;})).slice(0,3);var kind=i%5;var mean=function(x){return x.sw||x.en;};
    if(kind===0){var o=shuffle([w].concat(others));out.push({t:"listen",audio:w.h,q_zh:"听一听，选汉字",q_sw:"Sikiliza, chagua herufi",q:"Listen and choose",o:o.map(function(x){return x.h;}),a:o.indexOf(w),_w:w.h});}
    else if(kind===1){var o2=shuffle([w].concat(others));out.push({t:"mcq",q:w.h,q_zh:"「"+w.h+"」是什么意思？",q_sw:"「"+w.h+"」 maana yake ni nini?",o:o2.map(mean),a:o2.indexOf(w),_w:w.h,ex:w.p+" · "+w.en,ex_sw:w.p+" · "+(w.sw||"")});}
    else if(kind===2){var o3=shuffle([w].concat(others));out.push({t:"mcq",q:mean(w),q_zh:"哪个汉字是：",q_sw:"Kichina cha: "+mean(w),o:o3.map(function(x){return x.h;}),a:o3.indexOf(w),_w:w.h,ex:w.p});}
    else if(kind===3){var o4=shuffle([w].concat(others));out.push({t:"mcq",q:w.p,q_zh:"看拼音，选汉字",q_sw:"Soma pinyin, chagua herufi",o:o4.map(function(x){return x.h;}),a:o4.indexOf(w),_w:w.h});}
    else{out.push({t:"pinyin",q:w.h,q_zh:"写出拼音（可用数字表示声调：ni3）",q_sw:"Andika pinyin (toni kwa namba: ni3)",a:w.p,_w:w.h,ex:w.p});}});
  if(pick.length>=4){var mp=shuffle(pick).slice(0,5);out.push({t:"match",q_zh:"配对",q_sw:"Linganisha",pairs:mp.map(function(w){return [w.h,w.sw||w.en];})});}
  return out;};

  '<h3>🌓 '+Z.L("外观","Mwonekano","Theme")+'</h3><select id="sT" class="inp"><option value="">自动 auto</option><option value="light">亮 light</option><option value="dark">暗 dark</option></select>'+

  $(".x",box).onclick=function(){o.remove();};$("#sS",box).onclick=function(){S.voice=$("#sV",box).value;S.theme=$("#sT",box).value;S.key=$("#sK",box).value.trim();S.model=$("#sM",box).value.trim()||S.model;saveS();o.remove();toast("✓");};};

/* ---------- teacher panel: progress of all learners on this device, import/export ---------- */
Z.teacherPanel=function(el,filterPrefix){el.innerHTML="";var c=h("div",{class:"card"});el.appendChild(c);
  var ls=P.all();var keys={};ls.forEach(function(l){var d=P.data(l);for(var k in d.recs)if(!filterPrefix||k.indexOf(filterPrefix)===0)keys[k]=d.recs[k].label||k;});var kl=Object.keys(keys).sort();
  c.innerHTML='<h2>📊 '+Z.L("班级进度","Maendeleo ya darasa","Class progress")+'</h2><p class="muted">'+Z.L("本机所有学号的成绩。其它设备的成绩：在那台设备上「导出」，在这里「导入」。","Alama za namba zote kwenye kifaa hiki. Kwa vifaa vingine: 'Hamisha' huko, 'Ingiza' hapa.","All learner codes on this device. Other devices: export there, import here.")+'</p><div class="flex noprint"><button class="btn sm" id="tAdd">+ '+Z.L("添加学号","Ongeza namba","Add code")+'</button><button class="btn sm alt" id="tCsv">⬇ CSV</button><button class="btn sm alt" id="tJson">⬇ '+Z.L("导出","Hamisha","Export")+' JSON</button><label class="btn sm alt">⬆ '+Z.L("导入","Ingiza","Import")+' <input type="file" id="tImp" accept=".json" multiple style="display:none"></label><button class="btn sm alt" id="tPr">🖨</button></div><div style="overflow:auto;margin-top:8px"><table class="t" id="tTab"></table></div>';
  var tab=$("#tTab",c);var head="<tr><th>学号 Namba</th><th>⭐ XP</th><th>🔥</th><th>"+Z.L("最近","Mwisho","Last")+"</th>"+kl.map(function(k){return "<th>"+esc(keys[k])+"</th>";}).join("")+"</tr>";
  tab.innerHTML=head+ls.map(function(l){var d=P.data(l);var last=d.days.slice().sort().pop()||"";return "<tr><td><b>"+esc(l)+"</b></td><td>"+(d.xp||0)+"</td><td>"+d.days.length+"</td><td>"+last+"</td>"+kl.map(function(k){var r=d.recs[k];if(!r)return "<td></td>";var pct=Math.round(r.best/Math.max(1,r.max)*100);return '<td style="background:'+(pct>=80?"#e3f7ea":pct>=50?"#fff6d6":"#fde8e7")+';color:#222">'+r.best+"/"+r.max+"</td>";}).join("")+"</tr>";}).join("");
  $("#tAdd",c).onclick=function(){var v=prompt("学号 · Namba · Code (F2-01, F2-02 …)");if(v){v.split(/[,，\s]+/).forEach(function(x){if(x){var l=P.all();x=x.toUpperCase();if(l.indexOf(x)<0){l.push(x);sset("sayzh:learners",l);}}});Z.teacherPanel(el,filterPrefix);}};
  function dump(){var o={pack:"SAY AI Lab 汉语",exported:new Date().toISOString(),learners:{}};P.all().forEach(function(l){o.learners[l]=P.data(l);});return o;}
  function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
  $("#tJson",c).onclick=function(){dl("say-zh-progress-"+P.today()+".json",JSON.stringify(dump()),"application/json");};
  $("#tCsv",c).onclick=function(){var rows=[["code","xp","days","last"].concat(kl.map(function(k){return keys[k];}))];P.all().forEach(function(l){var d=P.data(l);rows.push([l,d.xp||0,d.days.length,d.days.slice().sort().pop()||""].concat(kl.map(function(k){var r=d.recs[k];return r?r.best+"/"+r.max:"";})));});dl("say-zh-progress-"+P.today()+".csv","﻿"+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(",");}).join("\n"),"text/csv");};
  $("#tImp",c).onchange=function(){var fs=Array.prototype.slice.call(this.files);var n=0;fs.forEach(function(f){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);for(var l in o.learners){var mine=P.data(l),th=o.learners[l];for(var k in th.recs){var a=mine.recs[k],b=th.recs[k];if(!a||b.best>a.best||(b.t||"")>(a.t||""))mine.recs[k]=b;}mine.xp=Math.max(mine.xp||0,th.xp||0);mine.days=Array.from(new Set((mine.days||[]).concat(th.days||[])));P.save(mine,l);var all=P.all();if(all.indexOf(l)<0){all.push(l);sset("sayzh:learners",all);}}}catch(e){toast("✗ "+f.name);}n++;if(n===fs.length){toast("✓ "+n);Z.teacherPanel(el,filterPrefix);}};rd.readAsText(f);});};
  $("#tPr",c).onclick=function(){window.print();};};

/* ---------- common blocks ---------- */
Z.wordsBlock=function(words){return '<div class="words">'+(words||[]).map(function(w){return '<div class="word">'+(w.img?'<span class="img">'+esc(w.img)+"</span>":"")+'<div><div class="h" data-hz="'+esc(w.h)+'" title="笔顺 · mpangilio wa mistari">'+esc(w.h)+'</div><div class="py">'+esc(w.p||Z.py(w.h))+'</div><div class="sw">'+esc(w.sw||"")+'</div><div class="en">'+esc(w.en||"")+(w.pos?" · "+esc(w.pos):"")+'</div></div><div style="margin-left:auto">'+Z.playBtn(w.h,true)+"</div></div>";}).join("")+"</div>";};
Z.linesBlock=function(lines,title){var id="ln"+Math.random().toString(36).slice(2,8);var all=(lines||[]).map(function(l){return l.zh;});return (title?"<h3>"+Z.t(title,true)+"</h3>":"")+'<div class="flex noprint" style="margin:4px 0"><button class="btn sm" data-playall="'+id+'">▶ '+Z.L("播放全文","Cheza yote","Play all")+'</button></div><div id="'+id+'">'+(lines||[]).map(function(l,i){return '<div class="line" data-i="'+i+'"><span class="spk">'+esc(l.s||"")+'</span><div style="flex:1"><div class="zh">'+esc(l.zh)+'</div><div class="py">'+esc(l.p||Z.py(l.zh))+'</div><div class="sw">'+esc(l.sw||"")+'</div><div class="en">'+esc(l.en||"")+"</div></div>"+Z.playBtn(l.zh,true)+"</div>";}).join("")+"</div>";};

Z.tbox=function(title,o){if(!o)return "";return '<div class="tbox"><h4>👩🏾‍🏫 '+title+"</h4>"+Z.t(o)+"</div>";};
Z.mistakes=function(ms){if(!ms||!ms.length)return "";return "<ul>"+ms.map(function(m){return "<li>"+(m.wrong?'<span class="mis"><span class="w">'+esc(m.wrong)+'</span> → <span class="r">'+esc(m.right)+"</span></span> ":"")+Z.t({zh:m.why_zh,sw:m.why_sw,en:m.why},true)+"</li>";}).join("")+"</ul>";};
Z.video=function(rel,title){return '<details class="vid"><summary>🎬 '+esc(title)+'</summary><video controls preload="none" data-src="'+esc(rel)+'"></video><div class="muted vmsg"></div></details>';};
document.addEventListener("toggle",function(e){var d=e.target;if(!d.classList||!d.classList.contains("vid")||!d.open)return;var v=$("video",d);if(!v.src){v.src=v.getAttribute("data-src");v.onerror=function(){$(".vmsg",d).innerHTML=Z.L("找不到视频文件。请把「SAY-AI-Lab-汉语」文件夹放在「中文乐园」文件夹里面。","Video haipatikani. Weka folda 'SAY-AI-Lab-汉语' ndani ya folda '中文乐园'.","Video file not found: keep this folder inside 中文乐园.");};}},true);

Z.tabs=function(el,list,onPick,start){var t=h("div",{class:"tabs noprint"});list.forEach(function(x,i){var b=h("button",{},x[1]);b.onclick=function(){$$("button",t).forEach(function(z){z.classList.remove("on");});b.classList.add("on");onPick(x[0],i);};t.appendChild(b);});el.appendChild(t);var s=start||0;if(t.children[s])t.children[s].click();return t;};

/* ---------- timer for lesson plans ---------- */
Z.stepTimer=function(el,steps){var i=-1,left=0,iv=null;var disp=h("div",{class:"flex noprint"});disp.innerHTML='<span class="timer">00:00</span><button class="btn sm">▶ '+Z.L("开始上课","Anza kipindi","Start")+'</button><button class="btn sm alt">⏭</button>';el.appendChild(disp);var rows=$$(".step",el);
  function go(){i++;if(i>=steps.length){clearInterval(iv);$(".timer",disp).textContent="✓";rows.forEach(function(r){r.classList.remove("cur");});return;}left=(steps[i].min||5)*60;rows.forEach(function(r,k){r.classList.toggle("cur",k===i);});}
  $$("button",disp)[0].onclick=function(){if(iv)return;go();iv=setInterval(function(){left--;if(left<=0){try{Z.say("时间到");}catch(e){}go();}var m=Math.floor(Math.max(left,0)/60),s=Math.max(left,0)%60;$(".timer",disp).textContent=("0"+m).slice(-2)+":"+("0"+s).slice(-2);},1000);};
  $$("button",disp)[1].onclick=function(){if(iv)go();};};
})();

<script>/* page renderers */
(function(){
"use strict";
var D=window.D,Z=window.Z,$=Z.$,$$=Z.$$,esc=Z.esc,h=Z.h,L=Z.L,T=Z.t;
function stepT(s){if(s.do&&typeof s.do==="object")return T(s.do);return T({zh:s.do_zh,sw:s.do_sw,en:s.do});}
function tri(o,k){return {zh:o[k+"_zh"]||(k==="title"?o.title_zh:null),sw:o[k+"_sw"],en:o[k+"_en"]||o[k]};}
function titleOf(u){if(u.title&&typeof u.title==="object")return u.title;return {zh:u.title_zh,sw:u.title_sw,en:u.title_en};}
function card(html){var c=h("div",{class:"card"},html);return c;}
function header(){var nav=D.NAV||[];var top=h("header",{class:"top"});top.innerHTML='<div class="in"><h1>'+esc(D.TITLE.zh)+'<small>'+esc(D.TITLE.sw)+" · "+esc(D.TITLE.en)+'</small></h1><nav>'+nav.map(function(n){return '<a href="'+n[0]+'"'+(n[0]===D.SELF?' style="background:#fff;color:#0e6e47;font-weight:700"':"")+">"+esc(n[1])+"</a>";}).join("")+"</nav></div>";document.body.insertBefore(top,document.body.firstChild);}
var main;
function mainTabs(list){var bar=h("div");main.appendChild(bar);var area=h("div");main.appendChild(area);var ids=list.map(function(x){return x[0];});var start=Math.max(0,ids.indexOf((location.hash||"").slice(1).split("/")[0]));Z.tabs(bar,list.map(function(x){return [x[0],x[1]];}),function(id,i){area.innerHTML="";try{history.replaceState(null,"","#"+id);}catch(e){}list[i][2](area);window.scrollTo(0,0);},start);}
function recBadge(key){var r=Z.P.get(key);if(!r)return "";return '<span class="done">'+r.best+"/"+r.max+"</span>";}
function itemsCard(area,title,items,key,label,opt){var c=card("<h3>"+title+"</h3>");area.appendChild(c);Z.itemList(c,items,key,label,opt);return c;}
