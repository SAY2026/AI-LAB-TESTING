<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>词汇闯关 · 分级测试 · HSK 1–5 自测 · SAY AI Lab</title><meta name="description" content="Changamoto ya msamiati · Jaribio la kiwango · HSK 1–5 · Word path · placement · HSK 1–5 self-tests">
<style>:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#63706a;--line:#dfe5e0;--pri:#128c5a;--pri2:#0e6e47;--acc:#e0a526;--bad:#d64541;--good:#1fa463;--soft:#e8f5ee;--red:#c0392b;--blue:#2d6cdf;--r:14px}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e6efe9;--mut:#9aa9a1;--line:#2f3a34;--soft:#1f3a2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e6efe9;--mut:#9aa9a1;--line:#2f3a34;--soft:#1f3a2c}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:var(--pri)}button{font:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--pri2);color:#fff;box-shadow:0 2px 8px #0002}
.top .in{max-width:1100px;margin:auto;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}.top h1 small{opacity:.8;font-weight:400;font-size:12px;display:block}
.top nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.top nav button,.top nav a{background:#ffffff1a;color:#fff;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:14px;text-decoration:none}
.top nav button.on{background:#fff;color:var(--pri2);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1100px;margin:8px auto 0;padding:0 14px;font-size:13px;color:var(--mut)}
.bar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.bar .who{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
main{max-width:1100px;margin:auto;padding:12px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:20px}.card h3{margin:14px 0 6px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.tile .n{font-size:12px;color:var(--mut)}.tile .t{font-size:17px;font-weight:700}.tile .s{font-size:13px;color:var(--mut)}
.tile .done{float:right;font-size:12px;background:var(--soft);color:var(--pri2);border-radius:999px;padding:1px 8px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--pri2);margin:2px 4px 2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600;font-size:15px}
.btn.alt{background:var(--card);color:var(--pri2);border:1.5px solid var(--pri)}.btn.warn{background:var(--acc);color:#222}.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.play{border:0;background:var(--soft);color:var(--pri2);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:13px;flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.play:hover{background:var(--pri);color:#fff}.play.slow{width:auto;padding:0 8px;font-size:11px}
.zh{font-size:1.05em}.py{color:var(--blue);font-size:.9em}.sw{color:#8a5a00}.en{color:var(--mut);font-size:.88em}
:root[data-theme="dark"] .sw{color:#e8b64c}
.hide-en .en,.hide-py .py,.hide-sw .sw{display:none!important}
.tri>span{display:block}.tri.inl>span{display:inline;margin-right:8px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.word{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;background:var(--card)}
.word .h{font-size:26px;line-height:1.1;cursor:pointer}.word .h:hover{color:var(--red)}
.word .img{font-size:26px}
.line{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.line .spk{font-weight:700;color:var(--pri2);min-width:3.2em}
.line .zh{font-size:19px}
.line.on{background:#fff6d6}:root[data-theme="dark"] .line.on{background:#3a3520}
.gram{border-left:4px solid var(--acc);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}
.gram .pat{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 8px;border-radius:6px;display:inline-block;margin:4px 0}
.mis{font-size:14px;margin-top:6px}.mis .w{color:var(--bad);text-decoration:line-through}.mis .r{color:var(--good);font-weight:600}
.tbox{background:#fff9e8;border:1px solid #f0d58a;border-radius:12px;padding:10px 14px;margin:10px 0}
:root[data-theme="dark"] .tbox{background:#2d2816;border-color:#6b5a26}
.tbox h4{margin:0 0 4px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.q .qn{font-weight:700;color:var(--mut);margin-right:6px}
.q .opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:17px;min-width:44px}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--blue);background:#eaf1ff}
:root[data-theme="dark"] .opt.sel{background:#1c2c4a}
.opt.ok{border-color:var(--good);background:#e3f7ea;color:#0b5a2f}.opt.no{border-color:var(--bad);background:#fde8e7;color:#8c1d19}
.q input[type=text],.q textarea,.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:17px;width:100%;max-width:520px;background:var(--card);color:var(--ink)}
.q textarea{min-height:90px;max-width:100%}
.fb{margin-top:6px;font-size:14px;border-radius:8px;padding:6px 10px;display:none}
.fb.show{display:block}.fb.ok{background:#e3f7ea;color:#0b5a2f}.fb.no{background:#fde8e7;color:#8c1d19}.fb.info{background:var(--soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border:1.5px dashed var(--line);border-radius:10px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:18px;color:var(--ink)}
.chip.used{opacity:.25;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:560px}
.match .opt{width:100%;text-align:left}.match .opt.gone{visibility:hidden}
.score{font-size:15px;font-weight:700}
.keyhide .key{display:none}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.duo{background:var(--card);width:min(720px,100%);max-height:96vh;overflow:auto;border-radius:18px;padding:14px 16px;position:relative}
.duo .hd{display:flex;align-items:center;gap:10px}
.duo .prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}.duo .prog i{display:block;height:100%;background:var(--good);transition:.3s}
.duo .hearts{color:var(--bad);font-weight:700;white-space:nowrap}.duo .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.duo .body{min-height:250px;padding:10px 0}
.duo .ft{position:sticky;bottom:0;background:var(--card);padding-top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.duo .ft.ok{background:#e3f7ea}.duo .ft.no{background:#fde8e7}
:root[data-theme="dark"] .duo .ft.ok{background:#173726}:root[data-theme="dark"] .duo .ft.no{background:#3b1a19}
.big{font-size:34px;text-align:center;margin:10px 0}
.hz{display:inline-block;width:110px;height:110px;margin:4px;background:#fff;border:2px solid #333;position:relative}
.hz svg.grid{position:absolute;inset:0}
.hzwrap{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.hzbox{text-align:center;font-size:12px}
table.t{border-collapse:collapse;width:100%;font-size:14px}table.t td,table.t th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.pytab{overflow:auto;max-height:520px}.pytab td{text-align:center;cursor:pointer;font-size:13px;padding:3px}.pytab td:hover{background:var(--soft)}
.muted{color:var(--mut);font-size:14px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.timer{font:700 28px ui-monospace,monospace;color:var(--pri2)}
.step{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.step .m{min-width:48px;font-weight:700;color:var(--acc)}
.step.cur{background:var(--soft)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.xp{font-weight:700;color:var(--acc)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.node{width:78px;height:78px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 var(--pri2);position:relative}
.node.lock{background:#b8c2bc;box-shadow:0 6px 0 #8e9892}.node.gold{background:var(--acc);box-shadow:0 6px 0 #a67a14;color:#222}
.node small{display:block;font-weight:400;font-size:11px}
.pathrow{display:flex;gap:16px;align-items:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:999px;z-index:99;font-size:14px}
video{max-width:100%;border-radius:10px;background:#000}
.lib li{margin:3px 0}
@media (max-width:600px){.top h1{font-size:15px}.line .zh{font-size:17px}.word .h{font-size:22px}.hz{width:92px;height:92px}.match{grid-template-columns:1fr 1fr}}
@media print{.top,.bar,.noprint,.btn,.play,.tabs{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.q{break-inside:avoid}.keyhide .key{display:none}.printkey .key{display:block!important}}
.btn .sw,.btn .en,.tabs button.on .sw,.tabs button.on .en,.node .sw{color:inherit!important;opacity:.85}
.btn.alt .sw{color:#8a5a00!important}
.tabs button .en,.btn .en{font-size:.8em}
@media (max-width:600px){.top{position:static}.top nav a{font-size:12px;padding:4px 8px}}

iān","en":"ancestors; forebears; (biology) ancestral species; ancient species from which present-day species evolved"},{"h":"最初","p":"zuìchū","en":"first; primary; initial"},{"h":"罪犯","p":"zuìfàn","en":"criminal"},{"h":"醉","p":"zuì","en":"intoxicated"},{"h":"尊敬","p":"zūnjìng","en":"to respect; to revere; to esteem; honorable; distinguished (used on formal occasions before a term of address)"},{"h":"遵守","p":"zūnshǒu","en":"to comply with; to abide by; to respect (an agreement)"},{"h":"作品","p":"zuòpǐn","en":"work (of art); opus"},{"h":"作为","p":"zuòwéi","en":"one's conduct; deed; activity"},{"h":"作文","p":"zuòwén","en":"to write an essay; composition (student essay)"}]],"PLACE":{"title":"汉语水平分级测试 · Chinese Placement Test","title_zh":"汉语水平分级测试","title_sw":"Jaribio la Kupima Kiwango cha Kichina","title_en":"Chinese Placement Test","items":[{"t":"listen","audio":"你好！我叫阿里。","q":"他叫什么名字？","o":["阿明","阿里","朱玛"],"a":1,"ex":"我叫阿里 = My name is Ali.","lvl":1,"tag":"listening","ex_sw":"我叫阿里 = Jina langu ni Ali.","ex_zh":"“我叫阿里”——他叫阿里。"},{"t":"mcq","q":"“谢谢” = ?","o":["hello","thank you","sorry","goodbye"],"a":1,"ex":"谢谢 = thank you.","lvl":1,"tag":"reading","ex_sw":"谢谢 = asante.","ex_zh":"谢谢：感谢别人时说的话。","o_sw":["hujambo","asante","samahani","kwaheri"],"o_zh":["你好","谢谢","对不起","再见"]},{"t":"fill","q":"我___学生。","a":["是"],"ex":"是 links two nouns: 我是学生。","bank":["是","有","在"],"lvl":1,"tag":"grammar","ex_sw":"是 inaunganisha nomino mbili: 我是学生。","ex_zh":"“是”连接两个名词：我是学生。"},{"t":"mcq","q":"现在几点？","o":["三点。","三个。","三岁。"],"a":0,"ex":"几点 asks the time → 三点。","lvl":1,"tag":"reading","ex_sw":"几点 linauliza saa → 三点。","ex_zh":"“几点”问时间，所以回答“三点”。"},{"t":"order","words":["我","喜欢","吃","苹果"],"a":["我喜欢吃苹果。"],"ex":"Subject + 喜欢 + verb + object.","lvl":1,"tag":"grammar","ex_sw":"Kiima + 喜欢 + kitenzi + kitendwa.","ex_zh":"主语 + 喜欢 + 动词 + 宾语。"},{"t":"listen","audio":"男：你去哪儿？ 女：我去商店买东西。 问：女的去哪儿？","q":"女的去哪儿？","o":["学校","商店","医院"],"a":1,"ex":"我去商店买东西 — she is going to the shop.","lvl":1,"tag":"listening","ex_sw":"我去商店买东西 — anakwenda dukani.","ex_zh":"“我去商店买东西”——她去商店。"},{"t":"fill","q":"我___他高。","a":["比"],"ex":"A 比 B + adjective: 我比他高。","bank":["比","很","是"],"lvl":2,"tag":"grammar","ex_sw":"A 比 B + kivumishi: 我比他高。","ex_zh":"比较句：A + 比 + B + 形容词：我比他高。"},{"t":"listen","audio":"女：你每天怎么去公司？ 男：我坐公共汽车，因为我家离公司很远。 问：男的为什么坐公共汽车？","q":"男的为什么坐公共汽车？","o":["公共汽车很便宜","他家离公司很远","他没有自行车"],"a":1,"ex":"因为我家离公司很远 gives the reason.","lvl":2,"tag":"listening","ex_sw":"因为我家离公司很远 inatoa sababu.","ex_zh":"“因为我家离公司很远”说出了原因。"},{"t":"mcq","q":"我___吃完饭了，你们吃吧。","o":["已经","正在","因为"],"a":0,"ex":"已经…了 = already done.","lvl":2,"tag":"reading","ex_sw":"已经…了 = tayari imefanyika.","ex_zh":"“已经……了”表示事情已经完成。"},{"t":"order","words":["他","跑","得","很快"],"a":["他跑得很快。"],"ex":"Verb + 得 + comment: 跑得很快.","lvl":2,"tag":"grammar","ex_sw":"Kitenzi + 得 + maelezo: 跑得很快.","ex_zh":"动词 + 得 + 评价：跑得很快。"},{"t":"mcq","q":"A：你为什么不去游泳？ B：___我生病了。","o":["因为","所以","但是"],"a":0,"ex":"为什么 is answered with 因为 (because).","lvl":2,"tag":"reading","ex_sw":"为什么 hujibiwa kwa 因为 (kwa sababu).","ex_zh":"问“为什么”，用“因为”回答。"},{"t":"listen","audio":"男：这件衣服怎么样？ 女：颜色很漂亮，但是太贵了。 问：女的觉得这件衣服怎么样？","q":"女的觉得这件衣服怎么样？","o":["颜色不漂亮","太贵了","太小了"],"a":1,"ex":"但是太贵了 — the problem is the price.","lvl":2,"tag":"listening","ex_sw":"但是太贵了 — tatizo ni bei.","ex_zh":"“但是太贵了”——问题是价钱太贵。"},{"t":"mcq","q":"请___门关上。","o":["把","被","让"],"a":0,"ex":"把 + object + verb + result: 把门关上 = close the door.","lvl":3,"tag":"reading","ex_sw":"把 + kitendwa + kitenzi + matokeo: 把门关上 = funga mlango.","ex_zh":"把 + 宾语 + 动词 + 结果：把门关上。"},{"t":"listen","audio":"女：你周末打算做什么？ 男：我想去爬山，但是周末可能会下雨，所以我可能在家看书。 问：男的周末可能做什么？","q":"男的周末可能做什么？","o":["去爬山","在家看书","去游泳"],"a":1,"ex":"因为可能下雨，所以他可能在家看书。","lvl":3,"tag":"listening","ex_sw":"因为可能下雨，所以他可能在家看书。","ex_zh":"因为可能下雨，所以他可能在家看书。"},{"t":"mcq","q":"这个菜___好吃___便宜，我们常来这儿吃。","o":["又……又……","因为……所以……","虽然……但是……"],"a":0,"ex":"又 A 又 B = both A and B: 又好吃又便宜.","lvl":3,"tag":"reading","ex_sw":"又 A 又 B = A na pia B: 又好吃又便宜.","ex_zh":"“又A又B”表示两个特点同时存在：又好吃又便宜。"},{"t":"order","words":["我的","自行车","被","弟弟","骑走了"],"a":["我的自行车被弟弟骑走了。"],"ex":"被 sentence: receiver + 被 + doer + verb + result.","lvl":3,"tag":"grammar","ex_sw":"Sentensi ya 被: mpokeaji + 被 + mtendaji + kitenzi + matokeo.","ex_zh":"被字句：受事 + 被 + 施事 + 动词 + 结果。"},{"t":"mcq","q":"他从楼上走___了。","o":["下来","上来","起来"],"a":0,"ex":"从楼上 (from upstairs) + 走下来 = walked down.","lvl":3,"tag":"reading","ex_sw":"从楼上 (kutoka ghorofa ya juu) + 走下来 = alishuka akitembea.","ex_zh":"“从楼上”+“走下来”：从上面往下走。"},{"t":"listen","audio":"男：请问，附近有银行吗？ 女：有，你一直向前走，到了公园再向右，银行就在公园旁边。 问：银行在哪儿？","q":"银行在哪儿？","o":["超市旁边","公园旁边","公园里面"],"a":1,"ex":"银行就在公园旁边 — next to the park.","lvl":3,"tag":"listening","ex_sw":"银行就在公园旁边 — karibu na bustani.","ex_zh":"“银行就在公园旁边”——银行在公园旁边。"},{"t":"mcq","q":"___明天下雨，比赛也会按时举行。","o":["即使","因为","既然"],"a":0,"ex":"即使…也… = even if … still …","lvl":4,"tag":"reading","ex_sw":"即使…也… = hata kama … bado …","ex_zh":"“即使……也……”：就算有这种情况，结果也不变。"},{"t":"listen","audio":"女：你怎么又迟到了？ 男：真抱歉，路上堵车堵得厉害，我提前半个小时出发都来不及。 问：男的为什么迟到？","q":"男的为什么迟到？","o":["他起床晚了","路上堵车","他忘了时间"],"a":1,"ex":"堵车堵得厉害 = the traffic jam was very bad.","lvl":4,"tag":"listening","ex_sw":"堵车堵得厉害 = msongamano wa magari ulikuwa mbaya sana.","ex_zh":"“堵车堵得厉害”——路上堵车很严重。"},{"t":"order","words":["这次活动","是","由","我们学校","组织的"],"a":["这次活动是由我们学校组织的。"],"ex":"是由 + organiser + verb + 的 names who did it.","lvl":4,"tag":"grammar","ex_sw":"是由 + mwandaaji + kitenzi + 的 hutaja aliyefanya.","ex_zh":"“是由 + 组织者 + 动词 + 的”说明是谁做的。"},{"t":"mcq","q":"这件事你___别告诉他，否则他会很伤心。","o":["千万","肯定","往往"],"a":0,"ex":"千万别 = by no means / you must not.","lvl":4,"tag":"reading","ex_sw":"千万别 = kwa vyovyote usi… / hupaswi kabisa.","ex_zh":"“千万别”：一定不要。"},{"t":"mcq","q":"A：你觉得这次考试难吗？ B：___很难，我连一半的题都没做完。","o":["确实","难道","否则"],"a":0,"ex":"确实 = really, indeed — agreeing that it was hard.","lvl":4,"tag":"reading","ex_sw":"确实 = kweli, hakika — anakubali kwamba ulikuwa mgumu.","ex_zh":"“确实”：的确，表示同意考试很难。"},{"t":"mcq","q":"我本来打算去留学，可是后来因为家里的原因，只好放弃了。问：说话人现在怎么样？","o":["已经去留学了","没去留学","还在准备留学"],"a":1,"ex":"只好放弃了 = had to give it up → he did not go.","lvl":4,"tag":"reading","ex_sw":"只好放弃了 = alilazimika kuacha → hakwenda.","ex_zh":"“只好放弃了”——没有别的办法，只能放弃，所以他没去留学。"},{"t":"mcq","q":"___他帮忙，我们才按时完成了任务。","o":["多亏","难怪","何必"],"a":0,"ex":"多亏 = thanks to (someone's help).","lvl":5,"tag":"reading","ex_sw":"多亏 = shukrani kwa (msaada wa mtu).","ex_zh":"“多亏”：因为得到了别人的帮助才有好结果。"},{"t":"mcq","q":"她在中国生活了十年，___汉语说得这么地道。","o":["难怪","何况","不然"],"a":0,"ex":"难怪 = no wonder.","lvl":5,"tag":"reading","ex_sw":"难怪 = si ajabu.","ex_zh":"“难怪”：知道原因以后，觉得不奇怪了。"},{"t":"listen","audio":"男：你真的辞职了？ 女：是啊，那份工作虽然工资高，但是压力太大，经常加班，我连休息的时间都没有。 男：那你以后有什么打算？ 女：我想先休息一段时间，然后自己做点小生意。 问：女的为什么辞职？","q":"女的为什么辞职？","o":["工资太低","压力太大","想去留学"],"a":1,"ex":"虽然工资高，但是压力太大 — the pressure was too high.","lvl":5,"tag":"listening","ex_sw":"虽然工资高，但是压力太大 — shinikizo lilikuwa kubwa mno.","ex_zh":"“虽然工资高，但是压力太大”——她辞职是因为压力太大。"},{"t":"order","words":["他","不但","没有","生气","反而","笑了起来"],"a":["他不但没有生气，反而笑了起来。"],"ex":"不但不/没…，反而… = not only not …, but on the contrary …","lvl":5,"tag":"grammar","ex_sw":"不但不/没…，反而… = si tu hakufanya …, bali kinyume chake …","ex_zh":"“不但不／没……，反而……”：不但没有出现预想的情况，反而出现了相反的情况。"},{"t":"mcq","q":"很多人认为，失败是成功之母。其实，失败并不能直接带来成功，只有认真总结失败的原因，才能避免再出现同样的错误。问：这段话主要想告诉我们什么？","o":["失败一定会带来成功","要从失败中总结经验","成功比失败重要"],"a":1,"ex":"只有认真总结失败的原因，才能… — the key is to learn from failure.","lvl":5,"tag":"reading","ex_sw":"只有认真总结失败的原因，才能… — jambo muhimu ni kujifunza kutokana na kushindwa.","ex_zh":"“只有认真总结失败的原因，才能……”——关键是从失败中总结经验。"},{"t":"fill","q":"经过几年的努力，他终于___了自己的梦想。","a":["实现"],"ex":"实现梦想 = realise a dream. 实行 = carry out (a policy); 实践 = practise.","bank":["实现","实行","实践"],"lvl":5,"tag":"grammar","ex_sw":"实现梦想 = kutimiza ndoto. 实行 = kutekeleza (sera); 实践 = kufanya kwa vitendo.","ex_zh":"实现梦想：让梦想成为现实。“实行”用于政策、制度；“实践”是亲自去做。"}]},"TESTS":[{"level":1,"title":"HSK 1 自测 · Self-test","title_zh":"HSK 1 自测","title_sw":"HSK 1 — Jaribio la Kujipima","title_en":"HSK 1 Self-test","minutes":35,"pass":60,"sections":[{"name":"听力 第一部分","skill":"listening","inst_zh":"每题听两次。听录音，看图片，判断对错。","inst_en":"You hear each phrase twice. Does the picture match what you hear? True or false.","items":[{"t":"tf","q":"听一听，对不对？","a":true,"ex":"打电话 = make a phone call. The picture is a telephone, so it matches. 录音和图片一致。","audio":"打电话","img":"📞","tag":"listening","ex_sw":"打电话 = kupiga simu. Picha ni simu, kwa hiyo inalingana. 录音和图片一致。","ex_zh":"打电话就是用电话跟别人说话。图片是电话，所以录音和图片一致。"},{"t":"tf","q":"听一听，对不对？","a":false,"ex":"看书 = read a book, but the picture is a TV (电视). 图片是电视，不是书。","audio":"看书","img":"📺","tag":"listening","ex_sw":"看书 = kusoma kitabu, lakini picha ni televisheni (电视). 图片是电视，不是书。","ex_zh":"看书是读书，可是图片是电视（电视），不是书，所以不一致。"},{"t":"tf","q":"听一听，对不对？","a":true,"ex":"三个苹果 = three apples; the picture shows three apples. 图片是三个苹果。","audio":"三个苹果","img":"🍎🍎🍎","tag":"listening","ex_sw":"三个苹果 = matofaa matatu; picha inaonyesha matofaa matatu. 图片是三个苹果。","ex_zh":"三个苹果：图片上正好是三个苹果，所以一致。"},{"t":"tf","q":"听一听，对不对？","a":false,"ex":"天气很热 = the weather is hot, but the picture shows snow / cold (冷). 图片是冷天。","audio":"天气很热","img":"❄️","tag":"listening","ex_sw":"天气很热 = hali ya hewa ni joto, lakini picha inaonyesha theluji / baridi (冷). 图片是冷天。","ex_zh":"天气很热是说天气热，可是图片上是下雪、很冷（冷），所以不一致。"},{"t":"tf","q":"听一听，对不对？","a":true,"ex":"坐飞机 = take a plane; the picture is a plane. 图片是飞机。","audio":"坐飞机","img":"✈️","tag":"listening","ex_sw":"坐飞机 = kusafiri kwa ndege; picha ni ndege. 图片是飞机。","ex_zh":"坐飞机：图片是飞机，所以一致。"}],"inst_sw":"Utasikia kila kirai mara mbili. Je, picha inalingana na unachosikia? Kweli au si kweli."},{"name":"听力 第二部分","skill":"listening","inst_zh":"每题听两次。听句子，选出对应的图片。","inst_en":"You hear each sentence twice. Choose the matching picture.","items":[{"t":"listen","audio":"我喜欢喝茶。","q":"他说的是哪个？","o":["🍵","🥛","🍎"],"a":0,"ex":"茶 = tea. 🍵 is a cup of tea. 她喜欢喝茶。","tag":"listening","ex_sw":"茶 = chai. 🍵 ni kikombe cha chai. 她喜欢喝茶。","ex_zh":"茶：🍵 是一杯茶。说话人喜欢喝茶，所以选🍵。"},{"t":"listen","audio":"我女儿在学校学习。","q":"他说的是哪个？","o":["🏥","🏫","🏪"],"a":1,"ex":"学校 = school (🏫). 🏥 is a hospital, 🏪 is a shop.","tag":"listening","ex_sw":"学校 = shule (🏫). 🏥 ni hospitali, 🏪 ni duka.","ex_zh":"学校是🏫；🏥是医院，🏪是商店。"},{"t":"listen","audio":"他是医生。","q":"他说的是哪个？","o":["👨‍🏫","👨‍⚕️","👨‍🍳"],"a":1,"ex":"医生 = doctor (👨‍⚕️). 👨‍🏫 is a teacher (老师).","tag":"listening","ex_sw":"医生 = daktari (👨‍⚕️). 👨‍🏫 ni mwalimu (老师).","ex_zh":"医生是👨‍⚕️；👨‍🏫是老师。"},{"t":"listen","audio":"今天下雨了。","q":"他说的是哪个？","o":["🌧️","☀️","❄️"],"a":0,"ex":"下雨 = it rains (🌧️).","tag":"listening","ex_sw":"下雨 = mvua inanyesha (🌧️).","ex_zh":"下雨就是🌧️。"},{"t":"listen","audio":"我在饭馆吃米饭。","q":"他说的是哪个？","o":["🍞","🍜","🍚"],"a":2,"ex":"米饭 = cooked rice (🍚).","tag":"listening","ex_sw":"米饭 = wali uliopikwa (🍚).","ex_zh":"米饭就是🍚。"}],"inst_sw":"Utasikia kila sentensi mara mbili. Chagua picha inayolingana."},{"name":"听力 第三部分","skill":"listening","inst_zh":"每题听两次。听对话，选出对应的图片。","inst_en":"You hear each short dialogue twice. Choose the matching picture.","items":[{"t":"listen","audio":"男：你好，你想买什么？ 女：我想买三个苹果，多少钱？ 问：女的想买什么？","q":"女的想买什么？","o":["🍎","🍌","📚"],"a":0,"ex":"She says 我想买三个苹果 — she wants apples. 她想买苹果。","tag":"listening","ex_sw":"Anasema 我想买三个苹果 — anataka matofaa. 她想买苹果。","ex_zh":"女的说“我想买三个苹果”，所以她想买苹果。"},{"t":"listen","audio":"女：这是你的狗吗？ 男：不是，这是我朋友的狗。 问：他们在说什么？","q":"他们在说什么？","o":["🐱","🐶","🐟"],"a":1,"ex":"They are talking about a dog (狗). 他们在说狗。","tag":"listening","ex_sw":"Wanazungumza kuhusu mbwa (狗). 他们在说狗。","ex_zh":"他们说的是一只狗（狗），是男的朋友的狗。"},{"t":"listen","audio":"男：喂，你现在在哪儿？ 女：我在火车站，下午三点回家。 问：女的现在在哪儿？","q":"女的现在在哪儿？","o":["🚉","✈️","🏥"],"a":0,"ex":"火车站 = railway station (🚉). 她在火车站。","tag":"listening","ex_sw":"火车站 = kituo cha treni (🚉). 她在火车站。","ex_zh":"女的说“我在火车站”，所以选🚉。"},{"t":"listen","audio":"女：你看，那个人是谁？ 男：他是我们的汉语老师，王老师。 问：那个人是做什么的？","q":"那个人是做什么的？","o":["👨‍⚕️","👨‍🍳","👨‍🏫"],"a":2,"ex":"王老师 is a teacher (老师 👨‍🏫).","tag":"listening","ex_sw":"王老师 ni mwalimu (老师 👨‍🏫).","ex_zh":"“他是我们的汉语老师，王老师”，所以他是老师（👨‍🏫）。"},{"t":"listen","audio":"男：你在做什么呢？ 女：我在看电视，你来看吗？ 问：女的在做什么？","q":"女的在做什么？","o":["💻","📺","📖"],"a":1,"ex":"看电视 = watch TV (📺). 她在看电视。","tag":"listening","ex_sw":"看电视 = kutazama televisheni (📺). 她在看电视。","ex_zh":"女的说“我在看电视”，所以选📺。"}],"inst_sw":"Utasikia kila mazungumzo mafupi mara mbili. Chagua picha inayolingana."},{"name":"听力 第四部分","skill":"listening","inst_zh":"每题听两次。听一句话和一个问题，选出正确答案。","inst_en":"You hear a sentence and a question twice. Choose the correct answer.","items":[{"t":"listen","audio":"女：我今天下午去商店买衣服。 问：她下午去哪儿？","q":"她下午去哪儿？","o":["学校","商店","饭馆"],"a":1,"ex":"去商店买衣服 — she goes to the shop. 她去商店。","tag":"listening","ex_sw":"去商店买衣服 — anakwenda dukani. 她去商店。","ex_zh":"她说“去商店买衣服”，所以她下午去商店。"},{"t":"listen","audio":"男：我儿子今年七岁了，他很喜欢小狗。 问：他儿子多大了？","q":"他儿子多大了？","o":["七岁","八岁","十岁"],"a":0,"ex":"今年七岁了 = he is seven this year.","tag":"listening","ex_sw":"今年七岁了 = ana miaka saba mwaka huu.","ex_zh":"“今年七岁了”就是他儿子今年七岁。"},{"t":"listen","audio":"女：现在是上午十点，我们十一点去看电影。 问：他们几点去看电影？","q":"他们几点去看电影？","o":["十点","十一点","十二点"],"a":1,"ex":"十点 is the time now; they go to the film at 十一点 (11 o'clock).","tag":"listening","ex_sw":"十点 ni saa ya sasa; wanakwenda kutazama filamu saa 十一点 (saa tano asubuhi).","ex_zh":"十点是现在的时间，他们十一点去看电影。"},{"t":"listen","audio":"男：我是中国人，我在桑给巴尔工作。 问：他在哪儿工作？","q":"他在哪儿工作？","o":["中国","北京","桑给巴尔"],"a":2,"ex":"He is Chinese (中国人) but works in Zanzibar (在桑给巴尔工作).","tag":"listening","ex_sw":"Yeye ni Mchina (中国人) lakini anafanya kazi Zanzibar (在桑给巴尔工作).","ex_zh":"他是中国人（中国人），但是在桑给巴尔工作（在桑给巴尔工作）。"},{"t":"listen","audio":"女：昨天我没去学校，我在家里睡觉。 问：她昨天在哪儿？","q":"她昨天在哪儿？","o":["家里","学校","医院"],"a":0,"ex":"没去学校，在家里睡觉 — she was at home.","tag":"listening","ex_sw":"没去学校，在家里睡觉 — alikuwa nyumbani.","ex_zh":"“没去学校，在家里睡觉”——她昨天在家。"}],"inst_sw":"Utasikia sentensi na swali mara mbili. Chagua jibu sahihi."},{"name":"阅读 第一部分","skill":"reading","inst_zh":"看图片和词语，判断是否一致。","inst_en":"Look at the picture and the word. Do they match? True or false.","items":[{"t":"tf","q":"猫","a":true,"ex":"猫 = cat 🐱. 一致。","img":"🐱","tag":"reading","ex_sw":"猫 = paka 🐱. 一致。","ex_zh":"猫就是🐱，一致。"},{"t":"tf","q":"飞机","a":false,"ex":"The picture is a taxi (出租车), not a plane (飞机). 不一致。","img":"🚕","tag":"reading","ex_sw":"Picha ni teksi (出租车), si ndege (飞机). 不一致。","ex_zh":"图片是出租车，不是飞机，所以不一致。"},{"t":"tf","q":"衣服","a":true,"ex":"衣服 = clothes 👕. 一致。","img":"👕","tag":"reading","ex_sw":"衣服 = nguo 👕. 一致。","ex_zh":"衣服就是👕，一致。"},{"t":"tf","q":"桌子","a":false,"ex":"The picture is a chair (椅子); 桌子 is a table. 不一致。","img":"🪑","tag":"reading","ex_sw":"Picha ni kiti (椅子); 桌子 ni meza. 不一致。","ex_zh":"图片是椅子，桌子是另一样东西，所以不一致。"},{"t":"tf","q":"电脑","a":true,"ex":"电脑 = computer 💻. 一致。","img":"💻","tag":"reading","ex_sw":"电脑 = kompyuta 💻. 一致。","ex_zh":"电脑就是💻，一致。"}],"inst_sw":"Tazama picha na neno. Je, vinalingana? Kweli au si kweli."},{"name":"阅读 第二部分","skill":"reading","inst_zh":"读句子，选出对应的图片。","inst_en":"Read the sentence and choose the matching picture.","items":[{"t":"mcq","q":"我很喜欢我的小猫。","o":["🐶","🐱","🐟"],"a":1,"ex":"小猫 = kitten/cat 🐱.","tag":"reading","ex_sw":"小猫 = paka mdogo / paka 🐱.","ex_zh":"小猫就是🐱。"},{"t":"mcq","q":"他坐出租车去火车站。","o":["🚕","✈️","🚲"],"a":0,"ex":"出租车 = taxi 🚕.","tag":"reading","ex_sw":"出租车 = teksi 🚕.","ex_zh":"出租车就是🚕。"},{"t":"mcq","q":"我爸爸在医院工作，他是医生。","o":["🏫","🏪","🏥"],"a":2,"ex":"医院 = hospital 🏥.","tag":"reading","ex_sw":"医院 = hospitali 🏥.","ex_zh":"医院就是🏥。"},{"t":"mcq","q":"妈妈在家做菜呢。","o":["👩‍🍳","👩‍🏫","👩‍⚕️"],"a":0,"ex":"做菜 = cook food 👩‍🍳.","tag":"reading","ex_sw":"做菜 = kupika chakula 👩‍🍳.","ex_zh":"做菜就是👩‍🍳。"},{"t":"mcq","q":"今天天气很冷。","o":["☀️","❄️","🌧️"],"a":1,"ex":"冷 = cold ❄️.","tag":"reading","ex_sw":"冷 = baridi ❄️.","ex_zh":"冷就是❄️。"}],"inst_sw":"Soma sentensi kisha uchague picha inayolingana."},{"name":"阅读 第三部分","skill":"reading","inst_zh":"读问句，选出合适的回答。","inst_en":"Read the question and choose the right answer.","items":[{"t":"mcq","q":"你叫什么名字？","o":["不客气。","我叫法特玛。","明天上午。"],"a":1,"ex":"叫什么名字 asks for a name → 我叫法特玛。","tag":"reading","ex_sw":"叫什么名字 linauliza jina → 我叫法特玛。","ex_zh":"“叫什么名字”问名字，所以回答“我叫法特玛。”"},{"t":"mcq","q":"你女儿几岁了？","o":["她五岁了。","我喜欢吃苹果。","我叫法特玛。"],"a":0,"ex":"几岁 asks age (for a child) → 她五岁了。","tag":"reading","ex_sw":"几岁 linauliza umri (wa mtoto) → 她五岁了。","ex_zh":"“几岁”问（孩子的）年龄，所以回答“她五岁了。”"},{"t":"mcq","q":"你什么时候回来？","o":["不客气。","她五岁了。","明天上午。"],"a":2,"ex":"什么时候 asks when → 明天上午。","tag":"reading","ex_sw":"什么时候 linauliza lini → 明天上午。","ex_zh":"“什么时候”问时间，所以回答“明天上午。”"},{"t":"mcq","q":"谢谢你！","o":["没关系。","不客气。","她五岁了。"],"a":1,"ex":"Answer 谢谢 with 不客气. 没关系 answers 对不起.","tag":"reading","ex_sw":"Jibu 谢谢 kwa 不客气. 没关系 hujibu 对不起.","ex_zh":"回答“谢谢”要说“不客气”；“没关系”是回答“对不起”的。"},{"t":"mcq","q":"你喜欢吃什么水果？","o":["我喜欢吃苹果。","我喜欢看电影。","我在饭馆。"],"a":0,"ex":"水果 = fruit → 苹果 is a fruit.","tag":"reading","ex_sw":"水果 = tunda → 苹果 ni tunda.","ex_zh":"水果：苹果是一种水果。"}],"inst_sw":"Soma swali kisha uchague jibu linalofaa."},{"name":"阅读 第四部分","skill":"reading","inst_zh":"选词填空。","inst_en":"Choose the right word from the box to fill the gap.","items":[{"t":"fill","q":"我___出租车去学校。","a":["坐"],"ex":"坐出租车 = take a taxi.","bank":["坐","名字","商店","喜欢","在","看"],"tag":"reading","ex_sw":"坐出租车 = kupanda teksi.","ex_zh":"坐出租车：交通工具前面用“坐”。"},{"t":"fill","q":"你女儿叫什么___？","a":["名字"],"ex":"叫什么名字 = what is (her) name.","bank":["坐","名字","商店","喜欢","在","看"],"tag":"reading","ex_sw":"叫什么名字 = jina (lake) ni nani.","ex_zh":"叫什么名字：问别人的名字。"},{"t":"fill","q":"我想去___买东西。","a":["商店"],"ex":"去商店买东西 = go to the shop to buy things.","bank":["坐","名字","商店","喜欢","在","看"],"tag":"reading","ex_sw":"去商店买东西 = kwenda dukani kununua vitu.","ex_zh":"去商店买东西：去商店买需要的东西。"},{"t":"fill","q":"男：你___喝茶吗？ 女：很喜欢。","a":["喜欢"],"ex":"The answer 很喜欢 shows the question is 你喜欢喝茶吗？","bank":["坐","名字","商店","喜欢","在","看"],"tag":"reading","ex_sw":"Jibu 很喜欢 linaonyesha kwamba swali ni 你喜欢喝茶吗？","ex_zh":"回答是“很喜欢”，所以问题是“你喜欢喝茶吗？”"},{"t":"fill","q":"男：我的书___哪儿？ 女：在椅子下面。","a":["在"],"ex":"在哪儿 = where is it. 书在哪儿？","bank":["坐","名字","商店","喜欢","在","看"],"tag":"reading","ex_sw":"在哪儿 = kiko wapi. 书在哪儿？","ex_zh":"在哪儿：问东西在什么地方。书在哪儿？"}],"inst_sw":"Chagua neno sahihi kutoka kwenye kisanduku ili kujaza pengo."}],"can_do":["I can understand and use very simple words and phrases about myself, family and daily life.","I can greet people, say thank you and sorry, and give my name, age and nationality.","I can ask and tell the time, the date and prices with numbers.","I can understand short, slow questions about where people are and what they are doing.","I can recognise about 150 common words in characters (with pinyin support)."],"can_do_sw":["Ninaweza kuelewa na kutumia maneno na virai rahisi sana kuhusu mimi mwenyewe, familia na maisha ya kila siku.","Ninaweza kusalimia watu, kusema asante na samahani, na kutaja jina, umri na uraia wangu.","Ninaweza kuuliza na kueleza saa, tarehe na bei kwa kutumia namba.","Ninaweza kuelewa maswali mafupi yanayoulizwa polepole kuhusu watu walipo na wanachofanya.","Ninaweza kutambua takriban maneno 150 ya kawaida kwa herufi za Kichina (kwa msaada wa pinyin)."],"can_do_zh":["我能听懂并使用关于自己、家庭和日常生活的非常简单的词语和短语。","我能跟别人打招呼，说“谢谢”和“对不起”，并说出自己的名字、年龄和国籍。","我能用数字问和说时间、日期和价格。","我能听懂说得很慢的简短问题，比如别人在哪儿、在做什么。","我能认出大约150个常用词的汉字（有拼音帮助）。"]},{"level":2,"title":"HSK 2 自测 · Self-test","title_zh":"HSK 2 自测","title_sw":"HSK 2 — Jaribio la Kujipima","title_en":"HSK 2 Self-test","minutes":30,"pass":60,"sections":[{"name":"听力 第一部分","skill":"listening","inst_zh":"每题听两次。听句子，看图片，判断对错。","inst_en":"You hear each sentence twice. Does the picture match? True or false.","items":[{"t":"tf","q":"听一听，对不对？","a":true,"ex":"每天早上都去跑步 = runs every morning 🏃. 一致。","audio":"我每天早上都去跑步。","img":"🏃","tag":"listening","ex_sw":"每天早上都去跑步 = anakimbia kila asubuhi 🏃. 一致。","ex_zh":"“每天早上都去跑步”，图片是跑步🏃，一致。"},{"t":"tf","q":"听一听，对不对？","a":false,"ex":"She likes singing (唱歌), but the picture shows dancing (跳舞). 不一致。","audio":"她喜欢唱歌，每天晚上都唱。","img":"💃","tag":"listening","ex_sw":"Anapenda kuimba (唱歌), lakini picha inaonyesha kucheza dansi (跳舞). 不一致。","ex_zh":"她喜欢唱歌（唱歌），可是图片是跳舞（跳舞），不一致。"},{"t":"tf","q":"听一听，对不对？","a":true,"ex":"打篮球 = play basketball 🏀. 一致。","audio":"我哥哥每个星期六都去打篮球。","img":"🏀","tag":"listening","ex_sw":"打篮球 = kucheza mpira wa kikapu 🏀. 一致。","ex_zh":"打篮球就是🏀，一致。"},{"t":"tf","q":"听一听，对不对？","a":false,"ex":"The sentence is about a watermelon (西瓜), the picture is an apple. 不一致。","audio":"这个西瓜很大，也很便宜。","img":"🍎","tag":"listening","ex_sw":"Sentensi inahusu tikiti maji (西瓜), picha ni tofaa. 不一致。","ex_zh":"句子说的是西瓜（西瓜），图片是苹果，不一致。"},{"t":"tf","q":"听一听，对不对？","a":true,"ex":"生病了 = is ill 🤒, so he did not go to work. 一致。","audio":"他生病了，今天没去上班。","img":"🤒","tag":"listening","ex_sw":"生病了 = anaumwa 🤒, kwa hiyo hakwenda kazini. 一致。","ex_zh":"“生病了”🤒，所以他没去上班，一致。"}],"inst_sw":"Utasikia kila sentensi mara mbili. Je, picha inalingana? Kweli au si kweli."},{"name":"听力 第二部分","skill":"listening","inst_zh":"每题听两次。听对话，选出对应的图片。","inst_en":"You hear each dialogue twice. Choose the matching picture.","items":[{"t":"listen","audio":"男：你怎么去机场？ 女：我坐公共汽车去，很便宜。 问：女的怎么去机场？","q":"女的怎么去机场？","o":["🚌","🚕","🚲"],"a":0,"ex":"坐公共汽车 = by bus 🚌.","tag":"listening","ex_sw":"坐公共汽车 = kwa basi 🚌.","ex_zh":"“我坐公共汽车去”，所以选🚌。"},{"t":"listen","audio":"女：你手里的是什么？ 男：是我新买的手表，漂亮吗？ 问：男的买了什么？","q":"男的买了什么？","o":["📱","⌚","👕"],"a":1,"ex":"手表 = watch ⌚. 手机 would be 📱.","tag":"listening","ex_sw":"手表 = saa ya mkononi ⌚. 手机 ingekuwa 📱.","ex_zh":"手表是⌚；手机是📱，不要选错。"},{"t":"listen","audio":"男：我们下午去游泳吧？ 女：好，今天天气很热。 问：他们下午去做什么？","q":"他们下午去做什么？","o":["🏃","🏊","⚽"],"a":1,"ex":"游泳 = swim 🏊.","tag":"listening","ex_sw":"游泳 = kuogelea 🏊.","ex_zh":"“我们下午去游泳吧”，所以选🏊。"},{"t":"listen","audio":"女：服务员，我要一杯咖啡。 男：好的，请您坐这儿。 问：女的要喝什么？","q":"女的要喝什么？","o":["🍵","🥛","☕"],"a":2,"ex":"咖啡 = coffee ☕.","tag":"listening","ex_sw":"咖啡 = kahawa ☕.","ex_zh":"“我要一杯咖啡”，所以选☕。"},{"t":"listen","audio":"男：你看见我的自行车了吗？ 女：看见了，在门外边。 问：男的在找什么？","q":"男的在找什么？","o":["🚲","🚌","🚢"],"a":0,"ex":"自行车 = bicycle 🚲.","tag":"listening","ex_sw":"自行车 = baiskeli 🚲.","ex_zh":"他在找自行车，所以选🚲。"}],"inst_sw":"Utasikia kila mazungumzo mara mbili. Chagua picha inayolingana."},{"name":"听力 第三部分","skill":"listening","inst_zh":"每题听两次。听两句对话和一个问题，选出正确答案。","inst_en":"You hear a two-line dialogue and a question twice. Choose the correct answer.","items":[{"t":"listen","audio":"女：你的身体好了吗？ 男：好多了，医生说我明天可以去上班了。 问：男的明天做什么？","q":"男的明天做什么？","o":["去医院","去上班","在家休息"],"a":1,"ex":"医生说我明天可以去上班了 — he goes back to work tomorrow.","tag":"listening","ex_sw":"医生说我明天可以去上班了 — anarudi kazini kesho.","ex_zh":"“医生说我明天可以去上班了”——他明天去上班。"},{"t":"listen","audio":"男：这件衣服多少钱？ 女：三百五十块，现在很便宜。 问：这件衣服多少钱？","q":"这件衣服多少钱？","o":["三百五十块","五百三十块","三十五块"],"a":0,"ex":"三百五十 = 350.","tag":"listening","ex_sw":"三百五十 = 350.","ex_zh":"三百五十块就是350块。"},{"t":"listen","audio":"女：你哥哥是做什么的？ 男：他在一家公司工作，每天都很忙。 问：男的哥哥怎么样？","q":"男的哥哥怎么样？","o":["是服务员","在学校工作","每天很忙"],"a":2,"ex":"他在公司工作，每天都很忙 — he is busy every day.","tag":"listening","ex_sw":"他在公司工作，每天都很忙 — ana shughuli nyingi kila siku.","ex_zh":"“他在公司工作，每天都很忙”——他哥哥每天都很忙。"},{"t":"listen","audio":"男：从这儿到火车站远吗？ 女：不远，走路十分钟就到了。 问：从这儿到火车站要多长时间？","q":"从这儿到火车站要多长时间？","o":["五分钟","十分钟","一个小时"],"a":1,"ex":"走路十分钟就到了 — ten minutes on foot.","tag":"listening","ex_sw":"走路十分钟就到了 — dakika kumi kwa miguu.","ex_zh":"“走路十分钟就到了”——走路要十分钟。"},{"t":"listen","audio":"女：你为什么没来上课？ 男：因为我昨天晚上生病了。 问：男的为什么没来上课？","q":"男的为什么没来上课？","o":["他起床晚了","他去旅游了","他生病了"],"a":2,"ex":"因为我生病了 gives the reason: he was ill.","tag":"listening","ex_sw":"因为我生病了 inatoa sababu: alikuwa anaumwa.","ex_zh":"“因为我生病了”说出原因：他生病了。"}],"inst_sw":"Utasikia mazungumzo ya mistari miwili na swali mara mbili. Chagua jibu sahihi."},{"name":"听力 第四部分","skill":"listening","inst_zh":"每题听两次。听一段对话和一个问题，选出正确答案。","inst_en":"You hear a longer dialogue and a question twice. Choose the correct answer.","items":[{"t":"listen","audio":"男：阿米娜，你下个星期去哪儿旅游？ 女：我想去达累斯萨拉姆。 男：你怎么去？坐飞机吗？ 女：不，坐船去，船票比机票便宜。 问：阿米娜怎么去达累斯萨拉姆？","q":"阿米娜怎么去达累斯萨拉姆？","o":["坐飞机","坐船","坐公共汽车"],"a":1,"ex":"不，坐船去 — she goes by boat because the ticket is cheaper.","tag":"listening","ex_sw":"不，坐船去 — anakwenda kwa boti kwa sababu tiketi ni rahisi zaidi.","ex_zh":"“不，坐船去”——她坐船去，因为船票比机票便宜。"},{"t":"listen","audio":"女：你好，我想买一公斤羊肉。 男：好的，一公斤八十块。 女：太贵了，能便宜一点吗？ 男：好，七十块吧。 问：羊肉现在一公斤多少钱？","q":"羊肉现在一公斤多少钱？","o":["七十块","八十块","十七块"],"a":0,"ex":"The price was 八十块, then he agreed to 七十块.","tag":"listening","ex_sw":"Bei ilikuwa 八十块, kisha akakubali 七十块.","ex_zh":"开始是八十块，后来卖的人同意七十块。"},{"t":"listen","audio":"男：萨米拉，明天是几号？ 女：明天是十月八号，怎么了？ 男：明天是我妻子的生日，我想给她买一块手表。 女：那我们一起去商店看看吧。 问：明天是谁的生日？","q":"明天是谁的生日？","o":["萨米拉","男的妻子","男的女儿"],"a":1,"ex":"明天是我妻子的生日 — it is the man's wife's birthday.","tag":"listening","ex_sw":"明天是我妻子的生日 — ni siku ya kuzaliwa ya mke wa mwanamume.","ex_zh":"“明天是我妻子的生日”——是男的妻子的生日。"}],"inst_sw":"Utasikia mazungumzo marefu zaidi na swali mara mbili. Chagua jibu sahihi."},{"name":"阅读 第一部分","skill":"reading","inst_zh":"读句子，选出对应的图片。","inst_en":"Read the sentence and choose the matching picture.","items":[{"t":"mcq","q":"他每天早上都喝一杯牛奶。","o":["☕","🥛","🍵"],"a":1,"ex":"牛奶 = milk 🥛.","tag":"reading","ex_sw":"牛奶 = maziwa 🥛.","ex_zh":"牛奶就是🥛。"},{"t":"mcq","q":"我妹妹在房间里跳舞呢。","o":["💃","🏊","📖"],"a":0,"ex":"跳舞 = dance 💃.","tag":"reading","ex_sw":"跳舞 = kucheza dansi 💃.","ex_zh":"跳舞就是💃。"},{"t":"mcq","q":"今天下雪了，外面很冷。","o":["☀️","🌧️","❄️"],"a":2,"ex":"下雪 = it snows ❄️.","tag":"reading","ex_sw":"下雪 = theluji inanyesha ❄️.","ex_zh":"下雪就是❄️。"}],"inst_sw":"Soma sentensi kisha uchague picha inayolingana."},{"name":"阅读 第二部分","skill":"reading","inst_zh":"选词填空。","inst_en":"Choose the right word from the box to fill the gap.","items":[{"t":"fill","q":"这___衣服太贵了，我不买。","a":["件"],"ex":"件 is the measure word for clothes: 一件衣服.","bank":["件","别","非常","完","机场"],"tag":"reading","ex_sw":"件 ni kipimo (measure word) cha nguo: 一件衣服.","ex_zh":"“件”是衣服的量词：一件衣服。"},{"t":"fill","q":"你___说话了，大家都在休息。","a":["别"],"ex":"别 + verb = don't (do). 别说话了 = stop talking.","bank":["件","别","非常","完","机场"],"tag":"reading","ex_sw":"别 + kitenzi = usi(fanye). 别说话了 = acha kuongea.","ex_zh":"“别 + 动词”表示不要做：别说话了。"},{"t":"fill","q":"我今天___忙，没有时间吃饭。","a":["非常"],"ex":"非常 = very, goes before an adjective: 非常忙.","bank":["件","别","非常","完","机场"],"tag":"reading","ex_sw":"非常 = sana, huja kabla ya kivumishi: 非常忙.","ex_zh":"“非常”放在形容词前面：非常忙。"}],"inst_sw":"Chagua neno sahihi kutoka kwenye kisanduku ili kujaza pengo."},{"name":"阅读 第三部分","skill":"reading","inst_zh":"读第一句，判断★句的内容是否正确。","inst_en":"Read the first sentence(s). Is the ★ sentence true or false?","items":[{"t":"tf","q":"我姐姐比我大两岁，她今年二十岁。 ★ 我今年十八岁。","a":true,"ex":"姐姐二十岁，比我大两岁 → 我十八岁。","tag":"reading","ex_sw":"姐姐二十岁，比我大两岁 → 我十八岁。","ex_zh":"姐姐二十岁，比我大两岁，所以我十八岁，对。"},{"t":"tf","q":"哈桑，我们现在去看电影吧，还有二十分钟电影就开始了。 ★ 电影已经开始了。","a":false,"ex":"还有二十分钟就开始了 — the film starts in 20 minutes, it has not started yet.","tag":"reading","ex_sw":"还有二十分钟就开始了 — filamu inaanza baada ya dakika 20, bado haijaanza.","ex_zh":"“还有二十分钟就开始了”——电影还没开始，所以不对。"},{"t":"tf","q":"这个房间很大，但是离学校太远了，我不想住这儿。 ★ 他不想住这个房间。","a":true,"ex":"我不想住这儿 — he does not want to live here because it is far from school.","tag":"reading","ex_sw":"我不想住这儿 — hataki kuishi hapa kwa sababu ni mbali na shule.","ex_zh":"“我不想住这儿”——因为离学校太远，他不想住这个房间，对。"}],"inst_sw":"Soma sentensi ya kwanza (au sentensi za kwanza). Je, sentensi yenye ★ ni kweli au si kweli?"},{"name":"阅读 第四部分","skill":"reading","inst_zh":"读句子，选出合适的回答。","inst_en":"Read the sentence and choose the reply that goes with it.","items":[{"t":"mcq","q":"你的汉语说得非常好！","o":["谢谢，我学了两年了。","不客气，欢迎你来。","没关系，下次再来吧。"],"a":0,"ex":"Reply to praise with 谢谢.","tag":"reading","ex_sw":"Jibu sifa kwa 谢谢.","ex_zh":"别人夸你的时候，可以回答“谢谢”。"},{"t":"mcq","q":"你知道王老师的手机号吗？","o":["他是我们的汉语老师。","知道，我告诉你。","她在教室里上课。"],"a":1,"ex":"知道吗 → 知道，我告诉你。","tag":"reading","ex_sw":"知道吗 → 知道，我告诉你。","ex_zh":"问“知道吗”，回答“知道，我告诉你。”"},{"t":"mcq","q":"外面下雨了，我们还去跑步吗？","o":["我觉得西瓜很好吃。","别去了，明天再去吧。","我已经起床了。"],"a":1,"ex":"The question is about going running in the rain → 别去了，明天再去吧。","tag":"reading","ex_sw":"Swali linahusu kwenda kukimbia mvua ikinyesha → 别去了，明天再去吧。","ex_zh":"问题是下雨了还去不去跑步，所以回答“别去了，明天再去吧。”"},{"t":"mcq","q":"你怎么还没睡觉？","o":["我在准备明天的考试。","我已经吃完饭了。","我明天早上七点起床。"],"a":0,"ex":"怎么还没睡觉 asks why → he is preparing for tomorrow's exam.","tag":"reading","ex_sw":"怎么还没睡觉 linauliza kwa nini → anajiandaa kwa mtihani wa kesho.","ex_zh":"“怎么还没睡觉”问原因，回答是他在准备明天的考试。"},{"t":"mcq","q":"这个题你懂了吗？","o":["这是我的新手机。","对不起，我来晚了。","懂了，谢谢你的帮助。"],"a":2,"ex":"懂了吗 → 懂了。","tag":"reading","ex_sw":"懂了吗 → 懂了。","ex_zh":"问“懂了吗”，回答“懂了。”"}],"inst_sw":"Soma sentensi kisha uchague jibu linaloendana nayo."}],"can_do":["I can talk simply about daily routines, family, work and hobbies.","I can buy things, ask prices and bargain a little, and order food and drinks.","I can ask for and understand simple directions and distances.","I can follow short everyday dialogues about time, weather, health and travel.","I can use 比, 了, 过, 正在…呢 and 因为…所以… in simple sentences.","I can recognise about 300 common words in characters."],"can_do_sw":["Ninaweza kuzungumza kwa urahisi kuhusu shughuli za kila siku, familia, kazi na mambo ninayopenda kufanya.","Ninaweza kununua vitu, kuuliza bei na kupatana bei kidogo, na kuagiza chakula na vinywaji.","Ninaweza kuuliza na kuelewa maelekezo rahisi ya njia na umbali.","Ninaweza kufuatilia mazungumzo mafupi ya kila siku kuhusu wakati, hali ya hewa, afya na safari.","Ninaweza kutumia 比, 了, 过, 正在…呢 na 因为…所以… katika sentensi rahisi.","Ninaweza kutambua takriban maneno 300 ya kawaida kwa herufi za Kichina."],"can_do_zh":["我能简单地谈日常生活、家庭、工作和爱好。","我能买东西、问价钱、稍微讲讲价，还能点菜点饮料。","我能问路，也能听懂简单的方向和距离。","我能听懂关于时间、天气、身体和旅行的简短日常对话。","我能在简单的句子里用“比、了、过、正在……呢”和“因为……所以……”。","我能认出大约300个常用词的汉字。"]},{"level":3,"title":"HSK 3 自测 · Self-test","title_zh":"HSK 3 自测","title_sw":"HSK 3 — Jaribio la Kujipima","title_en":"HSK 3 Self-test","minutes":45,"pass":60,"can_do":["I can handle basic communication in daily life, study and work.","I can understand short dialogues about shopping, transport, health, school and plans.","I can read short notes and passages of about 50–80 characters and answer questions.","I can use 把, 被, 比, 过, 着 and result/degree complements in simple sentences.","I can write common HSK 3 characters and build correct sentences from given words.","I can manage most everyday situations when travelling in China."],"sections":[{"name":"听力 第一部分","skill":"listening","inst_zh":"听对话，选出对应的图片。每题听两次。","inst_en":"Listen to the dialogue and choose the matching picture. Each item is played twice.","items":[{"t":"listen","audio":"男：你怎么了？脸色不太好。女：我头疼，想去医院看看。问：女的要去哪儿？","q":"请选出和对话对应的图片。Choose the picture that matches the dialogue.","o":["🏥","🏫","🏪"],"a":0,"ex":"她说“想去医院看看”——the woman wants to go to the hospital (医院).","tag":"listening","ex_sw":"她说“想去医院看看”——mwanamke anataka kwenda hospitali (医院).","ex_zh":"她说“想去医院看看”——女的要去医院。","q_zh":"请选出和对话对应的图片。","q_sw":"请选出和对话对应的图片。 Chagua picha inayolingana na mazungumzo."},{"t":"listen","audio":"男：外面下雨了，你带伞了吗？女：带了，在我的包里。问：外面天气怎么样？","q":"请选出和对话对应的图片。Choose the picture that matches the dialogue.","o":["☀️","🌧️","❄️"],"a":1,"ex":"“外面下雨了” — it is raining outside.","tag":"listening","ex_sw":"“外面下雨了” — mvua inanyesha nje.","ex_zh":"“外面下雨了”——外面在下雨。","q_zh":"请选出和对话对应的图片。","q_sw":"请选出和对话对应的图片。 Chagua picha inayolingana na mazungumzo."},{"t":"listen","audio":"女：你喜欢什么运动？男：我最喜欢打篮球，每个周末都和朋友一起打。问：男的喜欢什么运动？","q":"请选出和对话对应的图片。Choose the picture that matches the dialogue.","o":["🏊","🏃","🏀"],"a":2,"ex":"“我最喜欢打篮球” — his favourite sport is basketball.","tag":"listening","ex_sw":"“我最喜欢打篮球” — mchezo anaoupenda zaidi ni mpira wa kikapu.","ex_zh":"“我最喜欢打篮球”——他最喜欢的运动是篮球。","q_zh":"请选出和对话对应的图片。","q_sw":"请选出和对话对应的图片。 Chagua picha inayolingana na mazungumzo."},{"t":"listen","audio":"男：服务员，我要一碗米饭，再要一杯茶。女：好的，请您等一下。问：他们最可能在哪儿？","q":"请选出和对话对应的图片。Choose the picture that matches the dialogue.","o":["🍽️","🚌","🏥"],"a":0,"ex":"服务员 (waiter), 一碗米饭 and 一杯茶 → they are in a restaurant.","tag":"listening","ex_sw":"服务员 (mhudumu), 一碗米饭 na 一杯茶 → wako mgahawani.","ex_zh":"有服务员，还点了一碗米饭和一杯茶，所以他们在饭馆。","q_zh":"请选出和对话对应的图片。","q_sw":"请选出和对话对应的图片。 Chagua picha inayolingana na mazungumzo."},{"t":"listen","audio":"女：你每天怎么去学校？男：我坐公共汽车，二十分钟就到了。问：男的怎么去学校？","q":"请选出和对话对应的图片。Choose the picture that matches the dialogue.","o":["🚲","🚌","✈️"],"a":1,"ex":"“我坐公共汽车” — he goes by bus (dala-dala).","tag":"listening","ex_sw":"“我坐公共汽车” — anakwenda kwa basi (daladala).","ex_zh":"“我坐公共汽车”——他坐公共汽车（达拉达拉）去学校。","q_zh":"请选出和对话对应的图片。","q_sw":"请选出和对话对应的图片。 Chagua picha inayolingana na mazungumzo."}],"inst_sw":"Sikiliza mazungumzo kisha uchague picha inayolingana. Kila swali linachezwa mara mbili."},{"name":"听力 第二部分","skill":"listening","inst_zh":"听一段话，判断★句子是对还是错。每题听两次。","inst_en":"Listen to a short passage and decide whether the ★ sentence is true or false. Each item is played twice.","items":[{"t":"tf","audio":"我哥哥在达累斯萨拉姆工作，他是医生。每个月他都回桑给巴尔看我们。","q":"★ 哥哥是医生。","a":true,"ex":"“他是医生” — her brother is a doctor. 对。","tag":"listening","ex_sw":"“他是医生” — kaka yake ni daktari. 对。","ex_zh":"“他是医生”——哥哥是医生，对。"},{"t":"tf","audio":"这件衬衫太大了，你能帮我换一件小一点儿的吗？","q":"★ 那件衬衫有点儿小。","a":false,"ex":"The speaker says the shirt is 太大了 (too big) and wants a smaller one. 错。","tag":"listening","p":"Zhè jiàn chènshān tài dà le, nǐ néng bāng wǒ huàn yí jiàn xiǎo yìdiǎnr de ma?","ex_sw":"Msemaji anasema shati ni 太大了 (kubwa mno) na anataka dogo zaidi. 错。","ex_zh":"说话人说衬衫“太大了”，想换小一点儿的，所以“有点儿小”不对。"},{"t":"tf","audio":"我已经学了两年汉语了，现在能和中国朋友说一些简单的话，但是看中文报纸还是很难。","q":"★ 他看中文报纸没有问题。","a":false,"ex":"“看中文报纸还是很难” — reading Chinese newspapers is still hard for him. 错。","tag":"listening","ex_sw":"“看中文报纸还是很难” — kusoma magazeti ya Kichina bado ni vigumu kwake. 错。","ex_zh":"“看中文报纸还是很难”——他看中文报纸还有困难，所以不对。"},{"t":"tf","audio":"明天上午的会议不开了，下午三点再开，请大家别忘了。","q":"★ 会议在明天下午。","a":true,"ex":"The morning meeting is cancelled and it will be held at 3 p.m. tomorrow. 对。","tag":"listening","ex_sw":"Mkutano wa asubuhi umefutwa na utafanyika saa tisa alasiri kesho. 对。","ex_zh":"上午的会不开了，改到明天下午三点，所以对。"},{"t":"tf","audio":"我妹妹特别喜欢小动物，家里有两只猫和一只狗。每天下课回家，她都先和它们一起玩儿。","q":"★ 妹妹家有三只猫。","a":false,"ex":"两只猫和一只狗 — two cats and one dog, not three cats. 错。","tag":"listening","ex_sw":"两只猫和一只狗 — paka wawili na mbwa mmoja, si paka watatu. 错。","ex_zh":"“两只猫和一只狗”——是两只猫，不是三只猫，所以不对。"}],"inst_sw":"Sikiliza kifungu kifupi kisha uamue kama sentensi yenye ★ ni kweli au si kweli. Kila swali linachezwa mara mbili."},{"name":"听力 第三部分","skill":"listening","inst_zh":"听两个人的对话和问题，选出正确答案。每题听两次。","inst_en":"Listen to a two-line dialogue and a question, then choose the correct answer. Each item is played twice.","items":[{"t":"listen","audio":"男：你的作业写完了吗？女：还没有，我还有两个题没做。问：女的作业怎么样？","q":"请选出正确答案。Choose the correct answer.","o":["已经写完了","还没写完","忘记带了"],"a":1,"ex":"“还没有，还有两个题没做” — she hasn't finished yet.","tag":"listening","ex_sw":"“还没有，还有两个题没做” — bado hajamaliza.","ex_zh":"“还没有，我还有两个题没做”——她还没写完。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"女：请问，银行离这儿远吗？男：不远，你向前走五分钟，银行就在超市旁边。问：银行在哪儿？","q":"请选出正确答案。Choose the correct answer.","o":["超市旁边","医院旁边","学校后面"],"a":0,"ex":"“就在超市旁边” — the bank is next to the supermarket.","tag":"listening","ex_sw":"“就在超市旁边” — benki iko karibu na supamaketi.","ex_zh":"“就在超市旁边”——银行在超市旁边。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"男：这个西瓜怎么卖？女：十块钱一个，这个西瓜非常甜。问：女的觉得西瓜怎么样？","q":"请选出正确答案。Choose the correct answer.","o":["很贵","很小","很甜"],"a":2,"ex":"She says 这个西瓜非常甜 — it is very sweet.","tag":"listening","ex_sw":"Anasema 这个西瓜非常甜 — ni tamu sana.","ex_zh":"她说“这个西瓜非常甜”——她觉得西瓜很甜。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"女：你怎么昨天没来？大家都在等你。男：对不起，我昨天生病了，一直在家休息。问：男的昨天为什么没来？","q":"请选出正确答案。Choose the correct answer.","o":["他去旅游了","他生病了","他忘记了"],"a":1,"ex":"“我昨天生病了” — he was ill.","tag":"listening","ex_sw":"“我昨天生病了” — alikuwa anaumwa.","ex_zh":"“我昨天生病了”——他生病了。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"男：你比你姐姐高吧？女：不，我姐姐比我高一点儿，但是我比她胖。问：谁更高？","q":"请选出正确答案。Choose the correct answer.","o":["女的","女的姐姐","男的"],"a":1,"ex":"“我姐姐比我高一点儿” — her elder sister is a little taller.","tag":"listening","ex_sw":"“我姐姐比我高一点儿” — dada yake mkubwa ni mrefu kidogo zaidi.","ex_zh":"“我姐姐比我高一点儿”——姐姐更高。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."}],"inst_sw":"Sikiliza mazungumzo ya mistari miwili na swali, kisha uchague jibu sahihi. Kila swali linachezwa mara mbili."},{"name":"听力 第四部分","skill":"listening","inst_zh":"听比较长的对话和问题，选出正确答案。每题听两次。","inst_en":"Listen to a longer dialogue (4–5 lines) and a question, then choose the correct answer. Each item is played twice.","items":[{"t":"listen","audio":"女：周末你打算做什么？男：我想去游泳。你呢？女：我要去商店买东西，下午可能也去游泳。男：那我们下午一起去吧。问：他们下午要一起做什么？","q":"请选出正确答案。Choose the correct answer.","o":["买东西","游泳","看电影"],"a":1,"ex":"男：我想去游泳 … 女：下午可能也去游泳 … 男：那我们下午一起去吧 → they will swim together.","tag":"listening","ex_sw":"男：我想去游泳 … 女：下午可能也去游泳 … 男：那我们下午一起去吧 → wataogelea pamoja.","ex_zh":"男的想去游泳，女的下午可能也去游泳，男的说“那我们下午一起去吧”——他们下午一起去游泳。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"男：你看起来很累，昨天晚上几点睡的？女：快十二点了。男：为什么那么晚？女：我在准备今天的考试，还有很多书没看完。问：女的为什么睡得很晚？","q":"请选出正确答案。Choose the correct answer.","o":["她在看电视","她在准备考试","她在玩儿电脑"],"a":1,"ex":"“我在准备今天的考试” — she was preparing for an exam.","tag":"listening","ex_sw":"“我在准备今天的考试” — alikuwa anajiandaa kwa mtihani.","ex_zh":"“我在准备今天的考试”——她在准备考试，所以睡得晚。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"女：你好，我想买一张去北京的飞机票。男：您要哪天的？女：下个星期三的，上午的最好。男：上午的票已经没有了，下午两点的可以吗？女：可以。问：女的买了几点的票？","q":"请选出正确答案。Choose the correct answer.","o":["上午的","下午两点的","晚上的"],"a":1,"ex":"Morning tickets are sold out; she accepts the 2 p.m. one (下午两点的可以吗？——可以).","tag":"listening","ex_sw":"Tiketi za asubuhi zimekwisha; anakubali ile ya saa nane mchana (下午两点的可以吗？——可以).","ex_zh":"上午的票没有了，她同意买下午两点的（“下午两点的可以吗？”——“可以。”）。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"男：小李，你的新电脑怎么样？女：很好用，比我以前的那个快多了。男：多少钱买的？女：四千多块，有点儿贵，但我很满意。问：关于新电脑，下面哪个是对的？","q":"请选出正确答案。Choose the correct answer.","o":["很便宜","比以前的慢","女的很满意"],"a":2,"ex":"She says 有点儿贵 (not cheap) and 快多了 (much faster), and 我很满意 — she is satisfied.","tag":"listening","ex_sw":"Anasema 有点儿贵 (si rahisi) na 快多了 (ina kasi zaidi sana), na 我很满意 — ameridhika.","ex_zh":"她说“有点儿贵”（不便宜），“快多了”（比以前快），还说“我很满意”——她很满意。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."},{"t":"listen","audio":"女：医生，我孩子发烧了，一直不想吃饭。男：发烧几天了？女：两天了。男：别担心，先吃这个药，多喝水，好好儿休息。问：孩子怎么了？","q":"请选出正确答案。Choose the correct answer.","o":["发烧了","腿疼","感冒好了"],"a":0,"ex":"“我孩子发烧了” — the child has a fever.","tag":"listening","p":"Nǚ: Yīshēng, wǒ háizi fāshāo le, yìzhí bù xiǎng chī fàn. Nán: Fāshāo jǐ tiān le? Nǚ: Liǎng tiān le. Nán: Bié dānxīn, xiān chī zhège yào, duō hē shuǐ, hǎohāor xiūxi.","ex_sw":"“我孩子发烧了” — mtoto ana homa.","ex_zh":"“我孩子发烧了”——孩子发烧了。","q_zh":"请选出正确答案。","q_sw":"请选出正确答案。 Chagua jibu sahihi."}],"inst_sw":"Sikiliza mazungumzo marefu zaidi (mistari 4–5) na swali, kisha uchague jibu sahihi. Kila swali linachezwa mara mbili."},{"name":"阅读 第一部分","skill":"reading","inst_zh":"选出最合适的回答。","inst_en":"Choose the reply that fits the sentence best.","items":[{"t":"mcq","q":"“你的汉语说得真好！”——哪个回答最合适？ Which reply fits best?","o":["没关系，我不累。","对不起，我不知道。","哪里哪里，我还要多练习。"],"a":2,"ex":"A polite reply to a compliment is 哪里哪里 + modest words.","tag":"reading","ex_sw":"Jibu la adabu kwa sifa ni 哪里哪里 + maneno ya unyenyekevu.","ex_zh":"别人夸你时，礼貌的回答是“哪里哪里”加上谦虚的话。","q_zh":"“你的汉语说得真好！”——哪个回答最合适？","q_sw":"“你的汉语说得真好！”——哪个回答最合适？ Jibu lipi linafaa zaidi?"},{"t":"mcq","q":"“你知道图书馆几点关门吗？”——哪个回答最合适？ Which reply fits best?","o":["我借了三本书。","晚上九点。","图书馆在学校东边。"],"a":1,"ex":"The question asks 几点 (what time), so the answer is a time: 晚上九点.","tag":"reading","ex_sw":"Swali linauliza 几点 (saa ngapi), kwa hiyo jibu ni saa: 晚上九点.","ex_zh":"问题问“几点”，所以回答一个时间：晚上九点。","q_zh":"“你知道图书馆几点关门吗？”——哪个回答最合适？","q_sw":"“你知道图书馆几点关门吗？”——哪个回答最合适？ Jibu lipi linafaa zaidi?"},{"t":"mcq","q":"“明天是你的生日，你想要什么礼物？”——哪个回答最合适？ Which reply fits best?","o":["我的生日是昨天。","我想要一本中文书。","谢谢你，我吃饱了。"],"a":1,"ex":"The question asks what present you want → 我想要一本中文书.","tag":"reading","ex_sw":"Swali linauliza unataka zawadi gani → 我想要一本中文书.","ex_zh":"问题问想要什么礼物，所以回答“我想要一本中文书。”","q_zh":"“明天是你的生日，你想要什么礼物？”——哪个回答最合适？","q_sw":"“明天是你的生日，你想要什么礼物？”——哪个回答最合适？ Jibu lipi linafaa zaidi?"},{"t":"mcq","q":"“你怎么还不走？快要迟到了！”——哪个回答最合适？ Which reply fits best?","o":["别着急，我马上就好。","我已经到了。","我不喜欢走路。"],"a":0,"ex":"The friend is worried about being late; 别着急，我马上就好 (don't worry, I'm almost ready) answers it.","tag":"reading","p":"Nǐ zěnme hái bù zǒu? Kuàiyào chídào le! — Bié zháojí, wǒ mǎshàng jiù hǎo.","ex_sw":"Rafiki ana wasiwasi wa kuchelewa; 别着急，我马上就好 (usijali, niko karibu tayari) ndilo jibu.","ex_zh":"朋友担心迟到，回答“别着急，我马上就好”最合适。","q_zh":"“你怎么还不走？快要迟到了！”——哪个回答最合适？","q_sw":"“你怎么还不走？快要迟到了！”——哪个回答最合适？ Jibu lipi linafaa zaidi?"},{"t":"mcq","q":"“这个题太难了，我不会做。”——哪个回答最合适？ Which reply fits best?","o":["太好了，我也会。","这个菜很好吃。","没关系，我来帮你。"],"a":2,"ex":"Offering help is the natural reply to “I can't do it”.","tag":"reading","ex_sw":"Kutoa msaada ndilo jibu la kawaida kwa “siwezi kulifanya”.","ex_zh":"别人说“我不会做”，自然的回答是提出帮助：“没关系，我来帮你。”","q_zh":"“这个题太难了，我不会做。”——哪个回答最合适？","q_sw":"“这个题太难了，我不会做。”——哪个回答最合适？ Jibu lipi linafaa zaidi?"}],"inst_sw":"Chagua jibu linaloendana vizuri zaidi na sentensi."},{"name":"阅读 第二部分","skill":"reading","inst_zh":"选词填空。","inst_en":"Fill in the blank with a word from the word bank.","items":[{"t":"fill","q":"老师上课的时候，学生们都在___地听。","a":["认真"],"bank":["认真","突然","把","一直","而且"],"ex":"认真地听 = listen carefully; 认真 + 地 + verb.","tag":"reading","ex_sw":"认真地听 = kusikiliza kwa makini; 认真 + 地 + kitenzi.","ex_zh":"认真地听：认真 + 地 + 动词。"},{"t":"fill","q":"我正在看书，灯___不亮了。","a":["突然"],"bank":["认真","突然","把","一直","而且"],"ex":"突然 = suddenly; something unexpected happened.","tag":"reading","ex_sw":"突然 = ghafla; jambo lisilotarajiwa lilitokea.","ex_zh":"突然：发生了没想到的事情。"},{"t":"fill","q":"请你___门关上，外面有点儿冷。","a":["把"],"bank":["认真","突然","把","一直","而且"],"ex":"把 sentence: 把 + object (门) + verb + result (关上).","tag":"reading","ex_sw":"Sentensi ya 把: 把 + kitendwa (门) + kitenzi + matokeo (关上).","ex_zh":"把字句：把 + 宾语（门）+ 动词 + 结果（关上）。"},{"t":"fill","q":"从早上到现在，他___在工作，还没吃饭。","a":["一直"],"bank":["认真","突然","把","一直","而且"],"ex":"一直 = continuously, all the time (从早上到现在).","tag":"reading","ex_sw":"一直 = mfululizo, muda wote (从早上到现在).","ex_zh":"一直：从早上到现在没有停。"},{"t":"fill","q":"这家饭馆的菜很好吃，___不太贵。","a":["而且"],"bank":["认真","突然","把","一直","而且"],"ex":"而且 = and also; adds a second good point.","tag":"reading","ex_sw":"而且 = na pia; linaongeza jambo la pili zuri.","ex_zh":"而且：再加上一个好的方面。"}],"inst_sw":"Jaza pengo kwa neno kutoka kwenye orodha ya maneno."},{"name":"阅读 第三部分","skill":"reading","inst_zh":"读短文，回答问题。","inst_en":"Read the short passage and answer the question.","items":[{"t":"mcq","q":"阿明是我的同学，他很高，喜欢打篮球。他学习也很好，上次考试他是我们班第一。\n问：关于阿明，可以知道什么？","o":["他很矮","他成绩很好","他不喜欢运动"],"a":1,"ex":"上次考试他是我们班第一 → his grades are very good.","tag":"reading","ex_sw":"上次考试他是我们班第一 → alama zake ni nzuri sana.","ex_zh":"“上次考试他是我们班第一”——他学习很好。"},{"t":"mcq","q":"我家离学校不远，以前我每天走路去学校。上个月爸爸给我买了一辆自行车，现在我骑车去，只要五分钟。\n问：他现在怎么去学校？","o":["走路","坐公共汽车","骑自行车"],"a":2,"ex":"现在我骑车去 — now he rides the bicycle his father bought.","tag":"reading","ex_sw":"现在我骑车去 — sasa anaendesha baiskeli aliyonunuliwa na baba yake.","ex_zh":"“现在我骑车去”——他现在骑爸爸买的自行车去学校。"},{"t":"mcq","q":"桑给巴尔一年里很多时候都比较热。每年三月到五月经常下雨，出去的时候最好带上伞。\n问：三月到五月桑给巴尔的天气怎么样？","o":["经常下雨","很冷","常常下雪"],"a":0,"ex":"每年三月到五月经常下雨 — it often rains from March to May.","tag":"reading","p":"Sānggěibā'ěr yì nián lǐ hěn duō shíhou dōu bǐjiào rè. Měi nián sānyuè dào wǔyuè jīngcháng xià yǔ, chūqu de shíhou zuìhǎo dàishang sǎn.","ex_sw":"每年三月到五月经常下雨 — mara nyingi mvua hunyesha kuanzia Machi hadi Mei.","ex_zh":"“每年三月到五月经常下雨”——三月到五月常常下雨。"},{"t":"mcq","q":"法特玛做的菜非常好吃，特别是她做的鱼。朋友们来她家的时候，都希望能吃到她做的鱼。\n问：朋友们最喜欢法特玛做的什么？","o":["米饭","面条","鱼"],"a":2,"ex":"特别是她做的鱼 … 都希望能吃到她做的鱼 — her fish.","tag":"reading","ex_sw":"特别是她做的鱼 … 都希望能吃到她做的鱼 — samaki wake.","ex_zh":"“特别是她做的鱼……都希望能吃到她做的鱼”——朋友们最喜欢她做的鱼。"},{"t":"mcq","q":"今天是星期天，商店里的人特别多。我想买一双运动鞋，但是没有我喜欢的颜色，所以我什么也没买就回家了。\n问：他为什么没买鞋？","o":["鞋太贵了","没有他喜欢的颜色","商店关门了"],"a":1,"ex":"没有我喜欢的颜色，所以……什么也没买 — the colour he wanted wasn't there.","tag":"reading","ex_sw":"没有我喜欢的颜色，所以……什么也没买 — rangi aliyoitaka haikuwepo.","ex_zh":"“没有我喜欢的颜色，所以……什么也没买”——没有他喜欢的颜色。"}],"inst_sw":"Soma kifungu kifupi kisha ujibu swali."},{"name":"书写 第一部分","skill":"writing","inst_zh":"用这些词语写一个句子（排列顺序）。","inst_en":"Put the words in order to make a correct sentence.","items":[{"t":"order","words":["我","把","作业","写完","了"],"a":["我把作业写完了。"],"ex":"把 sentence: Subject + 把 + object + verb + result + 了.","tag":"writing","ex_sw":"Sentensi ya 把: Kiima + 把 + kitendwa + kitenzi + matokeo + 了.","ex_zh":"把字句：主语 + 把 + 宾语 + 动词 + 结果 + 了。"},{"t":"order","words":["他","比","我","高","一点儿"],"a":["他比我高一点儿。"],"ex":"A 比 B + adjective + 一点儿.","tag":"writing","ex_sw":"A 比 B + kivumishi + 一点儿.","ex_zh":"比较句：A + 比 + B + 形容词 + 一点儿。"},{"t":"order","words":["桌子上","放着","一本","中文书"],"a":["桌子上放着一本中文书。"],"ex":"Existence: place + verb + 着 + number + measure word + noun.","tag":"writing","ex_sw":"Kuwepo: mahali + kitenzi + 着 + namba + kipimo + nomino.","ex_zh":"存在句：地点 + 动词 + 着 + 数词 + 量词 + 名词。"},{"t":"order","words":["你","去过","中国","吗"],"a":["你去过中国吗？"],"ex":"Verb + 过 for experience; 吗 at the end makes a yes/no question.","tag":"writing","ex_sw":"Kitenzi + 过 kwa uzoefu; 吗 mwishoni hufanya swali la ndiyo/hapana.","ex_zh":"动词 + 过 表示经历；句末加“吗”变成是非问句。"},{"t":"order","words":["这个","问题","被","他","解决了"],"a":["这个问题被他解决了。"],"ex":"被 sentence: receiver + 被 + doer + verb + 了.","tag":"writing","ex_sw":"Sentensi ya 被: mpokeaji + 被 + mtendaji + kitenzi + 了.","ex_zh":"被字句：受事 + 被 + 施事 + 动词 + 了。"}],"inst_sw":"Panga maneno ili kupata sentensi sahihi."},{"name":"书写 第二部分","skill":"writing","inst_zh":"看拼音，写汉字。","inst_en":"Look at the pinyin and write the missing character.","items":[{"t":"hanzi","q":"他今天很 ___ (gāo) 兴。","a":["高"],"ex":"高兴 gāoxìng = happy.","tag":"characters","ex_sw":"高兴 gāoxìng = furaha.","ex_zh":"高兴 gāoxìng：心情很好。"},{"t":"hanzi","q":"我每天早上七点 ___ (qǐ) 床。","a":["起"],"ex":"起床 qǐchuáng = get up.","tag":"characters","ex_sw":"起床 qǐchuáng = kuamka / kutoka kitandani.","ex_zh":"起床 qǐchuáng：睡醒以后从床上起来。"},{"t":"hanzi","q":"请 ___ (wèn)，洗手间在哪儿？","a":["问"],"ex":"请问 qǐngwèn = excuse me, may I ask…","tag":"characters","ex_sw":"请问 qǐngwèn = samahani, naomba kuuliza…","ex_zh":"请问 qǐngwèn：礼貌地向别人提问。"},{"t":"hanzi","q":"这个 ___ (zì) 我不认识。","a":["字"],"ex":"字 zì = character; 认识 = recognise.","tag":"characters","ex_sw":"字 zì = herufi; 认识 = kutambua.","ex_zh":"字 zì：汉字；认识：知道、认得。"},{"t":"hanzi","q":"我哥哥在 ___ (yī) 院工作。","a":["医"],"ex":"医院 yīyuàn = hospital.","tag":"characters","ex_sw":"医院 yīyuàn = hospitali.","ex_zh":"医院 yīyuàn：看病的地方。"}],"inst_sw":"Tazama pinyin kisha uandike herufi inayokosekana."}],"can_do_sw":["Ninaweza kuwasiliana katika mambo ya msingi ya maisha ya kila siku, masomo na kazi.","Ninaweza kuelewa mazungumzo mafupi kuhusu ununuzi, usafiri, afya, shule na mipango.","Ninaweza kusoma vidokezo na vifungu vifupi vya takriban herufi 50–80 na kujibu maswali.","Ninaweza kutumia 把, 被, 比, 过, 着 na viambishi vya matokeo/kiwango katika sentensi rahisi.","Ninaweza kuandika herufi za kawaida za HSK 3 na kujenga sentensi sahihi kutoka kwa maneno niliyopewa.","Ninaweza kukabiliana na hali nyingi za kila siku ninaposafiri nchini China."],"can_do_zh":["我能在日常生活、学习和工作中进行基本的交流。","我能听懂关于购物、交通、健康、学校和计划的简短对话。","我能读懂大约50—80个字的便条和短文，并回答问题。","我能在简单的句子里用“把、被、比、过、着”以及结果补语、程度补语。","我能写HSK三级常用汉字，并能用给出的词语组成正确的句子。","在中国旅行时，我能应付大部分日常情况。"]},{"level":4,"title":"HSK 4 自测 · Self-test","title_zh":"HSK 4 自测","title_sw":"HSK 4 — Jaribio la Kujipima","title_en":"HSK 4 Self-test","minutes":55,"pass":60,"can_do":["Can understand everyday conversations and short talks on familiar topics such as study, work, travel and health.","Can follow the main idea and key details of short notices and passages of about 100 characters.","Can use HSK 4 connectors (虽然……但是, 不但……而且, 即使……也, 为了) to link ideas.","Can build correct sentences with 把, 被 and 比 structures.","Can write a simple, correct sentence about a picture using a given word.","Can talk with native speakers about a fairly wide range of topics with reasonable fluency."],"sections":[{"name":"听力 第一部分","skill":"listening","inst_zh":"听一段话，判断★句子对还是错。每段话只听一次。","inst_en":"Listen to a short passage, then decide whether the ★ statement is true or false. Listen once.","items":[{"t":"tf","audio":"我本来打算今天下午去海边游泳，可是突然下起了大雨，只好在家看书了。","q":"★ 他今天下午去游泳了。","a":false,"ex":"He planned to swim, but it rained, so he stayed home reading. 他因为下雨没去游泳。","tag":"listening","ex_sw":"Alipanga kwenda kuogelea, lakini mvua ilinyesha, kwa hiyo alibaki nyumbani akisoma. 他因为下雨没去游泳。","ex_zh":"他本来打算去游泳，可是下起了大雨，只好在家看书。他因为下雨没去游泳。"},{"t":"tf","audio":"李老师教汉语已经十年了。她上课很有意思，学生们都很喜欢她。每次考试以前，她都会帮大家复习。","q":"★ 学生们觉得李老师的课很有意思。","a":true,"ex":"'她上课很有意思，学生们都很喜欢她' — the students find her classes interesting.","tag":"listening","ex_sw":"'她上课很有意思，学生们都很喜欢她' — wanafunzi wanaona vipindi vyake vinavutia.","ex_zh":"“她上课很有意思，学生们都很喜欢她”——学生们觉得李老师的课很有意思。"},{"t":"tf","audio":"这家饭馆的菜虽然有点儿贵，但是味道非常好，而且服务员也很热情，所以每到周末，这里的客人都特别多。","q":"★ 这家饭馆的菜很便宜。","a":false,"ex":"'菜虽然有点儿贵' — the food is a bit expensive, not cheap.","tag":"listening","ex_sw":"'菜虽然有点儿贵' — chakula ni ghali kidogo, si rahisi.","ex_zh":"“菜虽然有点儿贵”——这家饭馆的菜有点儿贵，不便宜。"},{"t":"tf","audio":"我弟弟从小就对电脑很感兴趣。大学毕业以后，他在达累斯萨拉姆找到了一份工作，现在在一家公司做技术工作。","q":"★ 弟弟现在在达累斯萨拉姆工作。","a":true,"ex":"'他在达累斯萨拉姆找到了一份工作' — he works in Dar es Salaam now.","tag":"listening","ex_sw":"'他在达累斯萨拉姆找到了一份工作' — sasa anafanya kazi Dar es Salaam.","ex_zh":"“他在达累斯萨拉姆找到了一份工作”——弟弟现在在达累斯萨拉姆工作。"},{"t":"tf","audio":"阿米娜，明天的会议改到上午九点了。你别忘了提前把材料准备好，最好八点半就到办公室。","q":"★ 会议改到了下午。","a":false,"ex":"The meeting was moved to 9 a.m. (上午九点), not the afternoon.","tag":"listening","ex_sw":"Mkutano ulihamishwa hadi saa tatu asubuhi (上午九点), si mchana.","ex_zh":"会议改到了上午九点（上午九点），不是下午。"}],"inst_sw":"Sikiliza kifungu kifupi, kisha uamue kama kauli yenye ★ ni kweli au si kweli. Sikiliza mara moja."},{"name":"听力 第二部分","skill":"listening","inst_zh":"听两个人的对话和一个问题，选择正确答案。","inst_en":"Listen to a two-line dialogue and a question, then choose the correct answer.","items":[{"t":"listen","audio":"男：你怎么还没出发？表演七点就开始了。 女：别着急，我已经叫了出租车，十分钟就到。 问：女的打算怎么去？","q":"女的打算怎么去？","o":["走路去","坐出租车","坐公共汽车","骑自行车"],"a":1,"ex":"'我已经叫了出租车' — she has called a taxi.","tag":"listening","ex_sw":"'我已经叫了出租车' — ameshaita teksi.","ex_zh":"“我已经叫了出租车”——她打算坐出租车去。"},{"t":"listen","audio":"女：这件衬衫颜色不错，就是有点儿小，有没有大一点儿的？ 男：对不起，大号的都卖完了，您明天再来看看吧。 问：他们最可能在哪儿？","q":"他们最可能在哪儿？","o":["医院","银行","图书馆","商店"],"a":3,"ex":"Talking about a shirt's size and it being sold out (卖完了) → a shop.","tag":"listening","ex_sw":"Wanazungumzia ukubwa wa shati na kwamba zimekwisha (卖完了) → dukani.","ex_zh":"他们在说衬衫的大小，还说大号的“卖完了”——他们在商店。"},{"t":"listen","audio":"男：你的汉语说得真流利，学了多长时间了？ 女：快三年了，不过我觉得自己的语法还有很多问题。 问：女的觉得自己哪方面需要提高？","q":"女的觉得自己哪方面需要提高？","o":["语法","写汉字","说话的速度","词语"],"a":0,"ex":"'我觉得自己的语法还有很多问题' — grammar.","tag":"listening","ex_sw":"'我觉得自己的语法还有很多问题' — sarufi.","ex_zh":"“我觉得自己的语法还有很多问题”——她需要提高语法。"},{"t":"listen","audio":"女：今天的作业你都做完了吗？ 男：还差一点儿，数学题太难了，我想明天早上问问张老师。 问：男的为什么还没做完作业？","q":"男的为什么还没做完作业？","o":["他忘了","他没有时间","数学题太难了","他生病了"],"a":2,"ex":"'数学题太难了' — the maths problems are too hard.","tag":"listening","ex_sw":"'数学题太难了' — maswali ya hesabu ni magumu mno.","ex_zh":"“数学题太难了”——数学题太难，所以还没做完。"},{"t":"listen","audio":"男：听说你下个月要去北京留学？ 女：是啊，签证已经办好了，就差买机票了。 问：女的还有什么事没做？","q":"女的还有什么事没做？","o":["办签证","找房子","学汉语","买机票"],"a":3,"ex":"'就差买机票了' = the only thing left is buying the plane ticket. The visa is already done.","tag":"listening","ex_sw":"'就差买机票了' = jambo pekee lililobaki ni kununua tiketi ya ndege. Visa tayari imeshapatikana.","ex_zh":"“就差买机票了”——只剩下买机票这件事了，签证已经办好了。"},{"t":"listen","audio":"女：你看起来很累，昨天晚上没睡好吗？ 男：邻居家一直在唱歌跳舞，声音特别大，我十二点多才睡着。 问：男的为什么没睡好？","q":"男的为什么没睡好？","o":["天气太热了","邻居家太吵了","工作太多了","身体不舒服"],"a":1,"ex":"The neighbours kept singing and dancing, and it was very loud (声音特别大).","tag":"listening","ex_sw":"Majirani waliendelea kuimba na kucheza, na kelele zilikuwa kubwa sana (声音特别大).","ex_zh":"邻居一直在唱歌跳舞，“声音特别大”，所以他没睡好。"},{"t":"listen","audio":"男：这个周末我们一起去市场买水果吧？ 女：好啊，不过星期六我要加班，星期天怎么样？ 问：女的星期六要做什么？","q":"女的星期六要做什么？","o":["买水果","在家休息","加班","去市场"],"a":2,"ex":"'星期六我要加班' — she has to work overtime on Saturday.","tag":"listening","ex_sw":"'星期六我要加班' — Jumamosi atafanya kazi ya ziada (saa za ziada).","ex_zh":"“星期六我要加班”——她星期六要加班。"},{"t":"listen","audio":"女：真抱歉，我来晚了，路上堵车堵得厉害。 男：没关系，会议还没开始呢，你先坐下喝杯水吧。 问：女的为什么来晚了？","q":"女的为什么来晚了？","o":["路上堵车","起床晚了","忘了时间","走错路了"],"a":0,"ex":"'路上堵车堵得厉害' — there was a bad traffic jam.","tag":"listening","ex_sw":"'路上堵车堵得厉害' — kulikuwa na msongamano mkubwa wa magari.","ex_zh":"“路上堵车堵得厉害”——路上堵车很厉害，所以来晚了。"}],"inst_sw":"Sikiliza mazungumzo ya mistari miwili na swali, kisha uchague jibu sahihi."},{"name":"听力 第三部分","skill":"listening","inst_zh":"听一段较长的对话或一段话，然后回答问题。","inst_en":"Listen to a longer dialogue or a short talk, then answer the question.","items":[{"t":"listen","audio":"女：你好，我想办一张银行卡。 男：好的，请给我看一下您的护照。 女：给您。需要填表吗？ 男：需要，请把这张表填好，然后在这儿写上您的名字。 问：男的最可能是做什么的？","q":"男的最可能是做什么的？","o":["司机","在银行工作","医生","老师"],"a":1,"ex":"She wants a bank card and he asks for her passport and a form → he works at a bank.","tag":"listening","ex_sw":"Anataka kadi ya benki na yeye anaomba pasipoti yake na fomu → anafanya kazi benki.","ex_zh":"女的要办银行卡，男的让她给护照、填表——男的在银行工作。"},{"t":"listen","audio":"哈桑每天早上六点起床，先跑半个小时步，然后吃早饭。他说，运动不但让他的身体更健康，而且让他一整天都很有精神。 问：哈桑为什么每天早上跑步？","q":"哈桑为什么每天早上跑步？","o":["为了参加比赛","医生让他跑","让身体更健康、更有精神","为了减肥"],"a":2,"ex":"'运动不但让他的身体更健康，而且让他一整天都很有精神'.","tag":"listening","ex_sw":"'运动不但让他的身体更健康，而且让他一整天都很有精神'.","ex_zh":"“运动不但让他的身体更健康，而且让他一整天都很有精神”——为了健康和精神好。"},{"t":"listen","audio":"男：法特玛，你决定了吗？去上海还是留在桑给巴尔？ 女：我还在考虑。上海那家公司工资高，可是离家太远了。 男：你父母怎么说？ 女：他们让我自己决定，不过我知道他们希望我留在家附近。 问：女的父母希望她怎么样？","q":"女的父母希望她怎么样？","o":["留在家附近","去上海工作","找工资高的工作","马上做决定"],"a":0,"ex":"'我知道他们希望我留在家附近' — they hope she stays near home.","tag":"listening","ex_sw":"'我知道他们希望我留在家附近' — wanatumaini abaki karibu na nyumbani.","ex_zh":"“我知道他们希望我留在家附近”——父母希望她留在家附近。"},{"t":"listen","audio":"很多人觉得学外语最重要的是记住很多词语。其实，敢说更重要。如果你害怕说错，就永远说不好。所以，要多找机会和别人聊天，不要怕说错。 问：说话人认为学外语最重要的是什么？","q":"说话人认为学外语最重要的是什么？","o":["多看书","多做练习","敢说","记住很多词语"],"a":2,"ex":"'其实，敢说更重要' — daring to speak is more important.","tag":"listening","ex_sw":"'其实，敢说更重要' — kuthubutu kusema ni muhimu zaidi.","ex_zh":"“其实，敢说更重要”——敢说是最重要的。"},{"t":"listen","audio":"女：这台电脑怎么打不开了？ 男：是不是没电了？你检查一下。 女：我检查过了，电是满的。 男：那可能是坏了，我们下午拿去修吧。 问：他们下午要做什么？","q":"他们下午要做什么？","o":["上网","修电脑","买电脑","检查电"],"a":1,"ex":"'我们下午拿去修吧' — take the computer to be repaired.","tag":"listening","ex_sw":"'我们下午拿去修吧' — kupeleka kompyuta ikatengenezwe.","ex_zh":"“我们下午拿去修吧”——他们下午要把电脑拿去修。"},{"t":"listen","audio":"我的邻居阿里是一个很热情的人。上个月我刚搬来的时候，对这里什么都不熟悉，是他带我去市场买东西，还告诉我哪家的水果最新鲜。现在我们已经成了好朋友。 问：关于阿里，可以知道什么？","q":"关于阿里，可以知道什么？","o":["他不喜欢说话","他很热情，愿意帮助别人","他是上个月刚搬来的","他在市场卖水果"],"a":1,"ex":"The speaker just moved in; Ali helped them → Ali is warm and helpful. (It was the speaker who moved, not Ali.)","tag":"listening","ex_sw":"Msemaji ndiye aliyehamia hivi karibuni; Ali alimsaidia → Ali ni mchangamfu na hupenda kusaidia. (Aliyehama ni msemaji, si Ali.)","ex_zh":"是说话人刚搬来，阿里帮助了他——阿里很热情，愿意帮助别人。（搬来的是说话人，不是阿里。）"},{"t":"listen","audio":"男：请问，去石头城的公共汽车在哪儿坐？ 女：就在前面，往左走一百米就到了。 男：大概多长时间来一辆？ 女：差不多十五分钟一辆，不过早上人比较多。 问：公共汽车多长时间来一辆？","q":"公共汽车多长时间来一辆？","o":["五分钟","半个小时","一个小时","十五分钟"],"a":3,"ex":"'差不多十五分钟一辆' — about every 15 minutes.","tag":"listening","ex_sw":"'差不多十五分钟一辆' — takriban kila dakika 15.","ex_zh":"“差不多十五分钟一辆”——大约十五分钟来一辆。"},{"t":"listen","audio":"同学们，这次的汉语比赛在下星期五上午举行。想参加的同学，请在这个星期三以前到办公室报名。比赛的内容是介绍“我的城市”，每个人讲三分钟。 问：比赛的内容是什么？","q":"比赛的内容是什么？","o":["介绍我的城市","介绍我的学校","介绍我的朋友","介绍我的爱好"],"a":0,"ex":"'比赛的内容是介绍“我的城市”' — 'My city'.","tag":"listening","ex_sw":"'比赛的内容是介绍“我的城市”' — 'Mji wangu'.","ex_zh":"“比赛的内容是介绍‘我的城市’”——介绍自己的城市。"},{"t":"listen","audio":"女：你上次说的那本小说，我已经看完了。 男：怎么样？好看吗？ 女：故事很让人感动，尤其是最后一部分，我都看哭了。 男：我就知道你一定会喜欢。 问：女的觉得这本小说怎么样？","q":"女的觉得这本小说怎么样？","o":["太长了","看不懂","很让人感动","没意思"],"a":2,"ex":"'故事很让人感动……我都看哭了' — the story is very moving.","tag":"listening","ex_sw":"'故事很让人感动……我都看哭了' — hadithi inagusa moyo sana.","ex_zh":"“故事很让人感动……我都看哭了”——她觉得这本小说很感人。"},{"t":"listen","audio":"开斋节快到了，这几天市场里特别热闹。人们忙着买新衣服、准备好吃的。孩子们最高兴，因为他们可以穿新衣服，还可以收到很多礼物。 问：孩子们为什么最高兴？","q":"孩子们为什么最高兴？","o":["不用去上学","可以去海边玩","可以去市场买东西","可以穿新衣服、收礼物"],"a":3,"ex":"'因为他们可以穿新衣服，还可以收到很多礼物'.","tag":"listening","ex_sw":"'因为他们可以穿新衣服，还可以收到很多礼物'.","ex_zh":"“因为他们可以穿新衣服，还可以收到很多礼物”。"}],"inst_sw":"Sikiliza mazungumzo marefu zaidi au hotuba fupi, kisha ujibu swali."},{"name":"阅读 第一部分","skill":"reading","inst_zh":"选词填空。","inst_en":"Choose the correct word from the word bank to fill the gap.","items":[{"t":"fill","q":"医生说，只要你___吃药，病很快就会好的。","a":["按时"],"bank":["竟然","按时","至少","坚持","温度","估计"],"ex":"按时 = on time / on schedule: take medicine on schedule.","tag":"vocab","ex_sw":"按时 = kwa wakati / kwa ratiba: kunywa dawa kwa ratiba.","ex_zh":"按时：按规定的时间，按时吃药。"},{"t":"fill","q":"学外语一定要___，每天学一点儿，时间长了水平就会提高。","a":["坚持"],"bank":["竟然","按时","至少","坚持","温度","估计"],"ex":"坚持 = keep at it / persist.","tag":"vocab","ex_sw":"坚持 = kuendelea bila kuacha / kuvumilia.","ex_zh":"坚持：一直做下去，不放弃。"},{"t":"fill","q":"从这儿到机场___要一个小时，我们早点儿出发吧。","a":["至少"],"bank":["竟然","按时","至少","坚持","温度","估计"],"ex":"至少 = at least (one hour), so leave early.","tag":"vocab","ex_sw":"至少 = angalau (saa moja), kwa hiyo ondokeni mapema.","ex_zh":"至少：最少要一个小时，所以要早点儿出发。"},{"t":"fill","q":"这么简单的问题，他___回答错了，真让人吃惊。","a":["竟然"],"bank":["竟然","按时","至少","坚持","温度","估计"],"ex":"竟然 = unexpectedly; fits '真让人吃惊' (surprising).","tag":"vocab","ex_sw":"竟然 = bila kutarajiwa; inaendana na '真让人吃惊' (inashangaza).","ex_zh":"竟然：没想到，跟“真让人吃惊”意思一致。"},{"t":"fill","q":"今天的___比昨天低了五度，出门多穿件衣服吧。","a":["温度"],"bank":["竟然","按时","至少","坚持","温度","估计"],"ex":"温度 = temperature; '低了五度' means 5 degrees lower.","tag":"vocab","ex_sw":"温度 = joto (kipimo cha joto); '低了五度' maana yake ni nyuzi tano chini.","ex_zh":"温度：冷热的程度；“低了五度”就是低了五度。"}],"inst_sw":"Chagua neno sahihi kutoka kwenye orodha ya maneno ili kujaza pengo."},{"name":"阅读 第二部分","skill":"reading","inst_zh":"把三个句子排列成正确的顺序。","inst_en":"Put the three sentences in the correct order.","items":[{"t":"order","q":"把A、B、C三个句子排成正确的顺序。","words":["本来我们打算今天去海边","可是听说下午会下大雨","所以我们决定改天再去"],"a":["本来我们打算今天去海边，可是听说下午会下大雨，所以我们决定改天再去。"],"ex":"本来 (originally) → 可是 (but) → 所以 (so).","tag":"reading","ex_sw":"本来 (awali) → 可是 (lakini) → 所以 (kwa hiyo).","ex_zh":"本来 → 可是 → 所以：先说原来的打算，再说变化，最后说结果。"},{"t":"order","q":"把A、B、C三个句子排成正确的顺序。","words":["阿明不但会说汉语","而且还能用汉字写短文","这让同学们都很羡慕"],"a":["阿明不但会说汉语，而且还能用汉字写短文，这让同学们都很羡慕。"],"ex":"不但……而且…… pair first; '这' refers back to both facts, so it comes last.","tag":"reading","ex_sw":"Jozi ya 不但……而且…… huja kwanza; '这' inarejelea mambo yote mawili, kwa hiyo huja mwisho.","ex_zh":"先用“不但……而且……”说两件事；“这”指前面的两件事，所以放在最后。"},{"t":"order","q":"把A、B、C三个句子排成正确的顺序。","words":["如果你周末有空","我们一起去市场买东西吧","顺便去看看王老师"],"a":["如果你周末有空，我们一起去市场买东西吧，顺便去看看王老师。"],"ex":"如果 gives the condition; 顺便 (while we're at it) adds an extra activity after the main plan.","tag":"reading","ex_sw":"如果 inatoa sharti; 顺便 (kwa nafasi hiyo hiyo) inaongeza shughuli ya ziada baada ya mpango mkuu.","ex_zh":"“如果”先说条件；“顺便”在主要计划后面再加一件事。"},{"t":"order","q":"把A、B、C三个句子排成正确的顺序。","words":["虽然这份工作的工资不太高","但是离家很近","而且同事们都很友好"],"a":["虽然这份工作的工资不太高，但是离家很近，而且同事们都很友好。"],"ex":"虽然 → 但是 → 而且 (adds one more good point).","tag":"reading","ex_sw":"虽然 → 但是 → 而且 (inaongeza jambo jingine zuri).","ex_zh":"虽然 → 但是 → 而且（再加一个好的方面）。"},{"t":"order","q":"把A、B、C三个句子排成正确的顺序。","words":["为了提高自己的汉语水平","萨米拉每天晚上都看中国电影","现在她已经能听懂很多对话了"],"a":["为了提高自己的汉语水平，萨米拉每天晚上都看中国电影，现在她已经能听懂很多对话了。"],"ex":"Purpose (为了) → action → result (现在……已经……).","tag":"reading","ex_sw":"Lengo (为了) → kitendo → matokeo (现在……已经……).","ex_zh":"目的（为了）→ 做法 → 结果（现在……已经……）。"}],"inst_sw":"Panga sentensi tatu kwa mpangilio sahihi."},{"name":"阅读 第三部分","skill":"reading","inst_zh":"读短文，选择正确答案。","inst_en":"Read the short passage and choose the correct answer.","items":[{"t":"mcq","q":"在桑给巴尔，很多人习惯坐达拉达拉出门。达拉达拉是一种公共汽车，虽然人有点儿多，但是很便宜，而且几乎哪儿都能去。\n★ 关于达拉达拉，下面哪个正确？","o":["很便宜","很安静","很贵","只去石头城"],"a":0,"ex":"'虽然人有点儿多，但是很便宜' — it is cheap (but crowded, so not quiet).","tag":"reading","ex_sw":"'虽然人有点儿多，但是很便宜' — ni rahisi (lakini imejaa watu, kwa hiyo si tulivu).","ex_zh":"“虽然人有点儿多，但是很便宜”——达拉达拉很便宜（但是人多，所以不安静）。"},{"t":"mcq","q":"请大家注意：从下个星期开始，图书馆周末的开门时间改为上午十点到下午五点，平时的时间不变。\n★ 图书馆哪些日子的开门时间改了？","o":["每天","星期一","周末","平时"],"a":2,"ex":"Only the weekend (周末) hours change; weekdays (平时) stay the same.","tag":"reading","ex_sw":"Ni saa za wikendi (周末) pekee zinazobadilika; siku za kawaida (平时) zinabaki zilezile.","ex_zh":"只有周末的开门时间改了，平时的时间不变。"},{"t":"mcq","q":"小李以前很胖，爬几层楼就累得不行。后来他开始每天游泳，还少吃甜的东西。一年以后，他瘦了十公斤，身体也比以前好多了。\n★ 小李是怎么变瘦的？","o":["每天爬楼","吃药","只吃水果","每天游泳，少吃甜的"],"a":3,"ex":"'他开始每天游泳，还少吃甜的东西'.","tag":"reading","ex_sw":"'他开始每天游泳，还少吃甜的东西'.","ex_zh":"“他开始每天游泳，还少吃甜的东西”——靠游泳和少吃甜的东西变瘦。"},{"t":"mcq","q":"很多年轻人找工作的时候只看工资高不高。其实，一份工作是不是适合自己，还要看自己对它有没有兴趣。如果对工作没有兴趣，工资再高也很难做好。\n★ 这段话主要想告诉我们什么？","o":["所有的工作都很难","找工作要考虑自己的兴趣","工资是最重要的","年轻人不喜欢工作"],"a":1,"ex":"Main idea: interest matters, not only salary.","tag":"reading","ex_sw":"Wazo kuu: kupenda kazi ni muhimu, si mshahara pekee.","ex_zh":"主要意思：工作要看自己有没有兴趣，不能只看工资。"},{"t":"mcq","q":"朱玛是导游，他的英语和汉语都说得很流利。每年都有很多中国人来桑给巴尔旅游，他常常带他们参观石头城，给他们介绍这里的历史和文化。\n★ 朱玛是做什么工作的？","o":["司机","医生","导游","老师"],"a":2,"ex":"'朱玛是导游' — he is a tour guide.","tag":"reading","ex_sw":"'朱玛是导游' — yeye ni mwongoza watalii.","ex_zh":"“朱玛是导游”——他是导游。"},{"t":"mcq","q":"要想让孩子有读书的好习惯，父母自己首先要爱读书。如果父母每天只玩儿手机，却要求孩子多看书，效果一定不会好。\n★ 根据这段话，父母应该怎么做？","o":["自己先爱读书","多给孩子买手机","让孩子多玩儿","少和孩子说话"],"a":0,"ex":"'父母自己首先要爱读书' — parents should love reading first.","tag":"reading","ex_sw":"'父母自己首先要爱读书' — wazazi wenyewe kwanza wapende kusoma.","ex_zh":"“父母自己首先要爱读书”——父母自己先要爱读书。"},{"t":"mcq","q":"同学们：明天的汉语课改在三楼的电脑教室上课，请大家按时到。另外，这次的作业可以推迟到下星期一再交。——李老师\n★ 明天的汉语课在哪儿上？","o":["办公室","一楼的教室","三楼的电脑教室","图书馆"],"a":2,"ex":"'改在三楼的电脑教室上课'.","tag":"reading","ex_sw":"'改在三楼的电脑教室上课'.","ex_zh":"“改在三楼的电脑教室上课”——明天在三楼的电脑教室上课。"},{"t":"mcq","q":"椰子树在桑给巴尔到处都能看到。椰子里的水很甜，天热的时候喝一点儿特别舒服；椰子里白色的部分可以用来做菜；椰子树还可以用来做家具。所以这里的人都说，椰子树的每个部分都有用。\n★ 这段话主要介绍了什么？","o":["怎么买家具","椰子树很有用","桑给巴尔的天气","怎么做菜"],"a":1,"ex":"Every part of the coconut tree is useful (每个部分都有用).","tag":"reading","ex_sw":"Kila sehemu ya mnazi ina manufaa (每个部分都有用).","ex_zh":"主要介绍椰子树的每个部分都有用。"},{"t":"mcq","q":"阿米娜第一次去中国的时候，最不习惯的是那里的冬天。桑给巴尔总是很热，可是北京的冬天常常到零下十几度。不过，她很快就喜欢上了看雪。\n★ 阿米娜第一次去中国时最不习惯什么？","o":["说汉语","北京的冬天很冷","看雪","中国菜"],"a":1,"ex":"'最不习惯的是那里的冬天' — Beijing's cold winter. She soon liked the snow.","tag":"reading","ex_sw":"'最不习惯的是那里的冬天' — majira ya baridi ya Beijing. Baadaye alipenda theluji.","ex_zh":"“最不习惯的是那里的冬天”——她最不习惯北京寒冷的冬天，不过很快喜欢上了看雪。"},{"t":"mcq","q":"有人说，旅游不一定要去很远的地方。即使只是在自己的城市里散步，只要你仔细看，也能发现很多以前没有注意到的美丽的东西。\n★ 这段话的意思是：","o":["旅游一定要去很远的地方","散步没有意思","城市里没有美丽的东西","在身边也能发现美"],"a":3,"ex":"Even walking in your own city you can discover beauty if you look carefully.","tag":"reading","ex_sw":"Hata ukitembea tu katika mji wako mwenyewe unaweza kugundua uzuri ukiangalia kwa makini.","ex_zh":"即使只在自己的城市散步，只要仔细看，也能发现美丽的东西。"}],"inst_sw":"Soma kifungu kifupi kisha uchague jibu sahihi."},{"name":"书写 第一部分","skill":"writing","inst_zh":"用下面的词语完成句子。","inst_en":"Put the words in order to make a sentence.","items":[{"t":"order","q":"用这些词语组成一个句子。","words":["那本小说","被","弟弟","借走了"],"a":["那本小说被弟弟借走了。"],"ex":"被 sentence: receiver + 被 + doer + verb + result.","tag":"writing","ex_sw":"Sentensi ya 被: mpokeaji + 被 + mtendaji + kitenzi + matokeo.","ex_zh":"被字句：受事 + 被 + 施事 + 动词 + 结果。"},{"t":"order","q":"用这些词语组成一个句子。","words":["他","把","护照","忘在","家里了"],"a":["他把护照忘在家里了。"],"ex":"把 sentence: subject + 把 + object + verb + 在 + place.","tag":"writing","ex_sw":"Sentensi ya 把: kiima + 把 + kitendwa + kitenzi + 在 + mahali.","ex_zh":"把字句：主语 + 把 + 宾语 + 动词 + 在 + 地点。"},{"t":"order","q":"用这些词语组成一个句子。","words":["这个城市的","空气","比以前","好多了"],"a":["这个城市的空气比以前好多了。"],"ex":"A + 比 + B + adj + 多了.","tag":"writing","ex_sw":"A + 比 + B + kivumishi + 多了.","ex_zh":"比较句：A + 比 + B + 形容词 + 多了。"},{"t":"order","q":"用这些词语组成一个句子。","words":["我们","对","这次","比赛的结果","很满意"],"a":["我们对这次比赛的结果很满意。"],"ex":"对 + something + 很满意 = satisfied with something.","tag":"writing","ex_sw":"对 + kitu + 很满意 = kuridhika na kitu.","ex_zh":"对 + 某事 + 很满意：对某事感到满意。"},{"t":"order","q":"用这些词语组成一个句子。","words":["她","已经","习惯了","这里的","生活"],"a":["她已经习惯了这里的生活。"],"ex":"Subject + 已经 + verb 了 + object; 这里的 modifies 生活.","tag":"writing","ex_sw":"Kiima + 已经 + kitenzi 了 + kitendwa; 这里的 kinaeleza 生活.","ex_zh":"主语 + 已经 + 动词了 + 宾语；“这里的”修饰“生活”。"}],"inst_sw":"Panga maneno ili kupata sentensi."},{"name":"书写 第二部分","skill":"writing","inst_zh":"看图，用下面的词语写一个句子。","inst_en":"Look at the picture and write one sentence using the given word.","items":[{"t":"write","img":"🎂","q":"看图，用“祝贺”写一个句子。 Look at the picture and write one sentence using 祝贺.","model":"祝贺你！祝你生日快乐！","rubric":["uses 祝贺 correctly","sentence matches the picture (birthday)","correct characters and punctuation"],"words":6,"ex":"Any correct sentence with 祝贺 about the birthday is fine, e.g. 今天是妹妹的生日，我们都祝贺她。","tag":"writing","ex_sw":"Sentensi yoyote sahihi yenye 祝贺 kuhusu siku ya kuzaliwa inakubalika, k.m. 今天是妹妹的生日，我们都祝贺她。","ex_zh":"只要用“祝贺”写出和生日有关的正确句子就可以，比如：今天是妹妹的生日，我们都祝贺她。","q_zh":"看图，用“祝贺”写一个句子。","q_sw":"看图，用“祝贺”写一个句子。 Tazama picha kisha uandike sentensi moja ukitumia 祝贺.","rubric_sw":["anatumia 祝贺 kwa usahihi","sentensi inalingana na picha (siku ya kuzaliwa)","herufi na alama za uandishi ni sahihi"],"rubric_zh":["正确使用“祝贺”","句子和图片（生日）一致","汉字和标点正确"]},{"t":"write","img":"🚗","q":"看图，用“堵车”写一个句子。 Look at the picture and write one sentence using 堵车.","model":"下班的时候，路上经常堵车。","rubric":["uses 堵车 correctly","sentence matches the picture (car / traffic)","correct characters and punctuation"],"words":6,"ex":"Any correct sentence with 堵车, e.g. 今天路上堵车，所以我来晚了。","tag":"writing","ex_sw":"Sentensi yoyote sahihi yenye 堵车, k.m. 今天路上堵车，所以我来晚了。","ex_zh":"只要用“堵车”写出正确的句子就可以，比如：今天路上堵车，所以我来晚了。","q_zh":"看图，用“堵车”写一个句子。","q_sw":"看图，用“堵车”写一个句子。 Tazama picha kisha uandike sentensi moja ukitumia 堵车.","rubric_sw":["anatumia 堵车 kwa usahihi","sentensi inalingana na picha (gari / msongamano wa magari)","herufi na alama za uandishi ni sahihi"],"rubric_zh":["正确使用“堵车”","句子和图片（汽车／交通）一致","汉字和标点正确"]}],"inst_sw":"Tazama picha kisha uandike sentensi moja ukitumia neno ulilopewa."}],"can_do_sw":["Anaweza kuelewa mazungumzo ya kila siku na hotuba fupi kuhusu mada zinazofahamika kama masomo, kazi, safari na afya.","Anaweza kufuatilia wazo kuu na maelezo muhimu ya matangazo mafupi na vifungu vya takriban herufi 100.","Anaweza kutumia viunganishi vya HSK 4 (虽然……但是, 不但……而且, 即使……也, 为了) kuunganisha mawazo.","Anaweza kujenga sentensi sahihi kwa miundo ya 把, 被 na 比.","Anaweza kuandika sentensi rahisi na sahihi kuhusu picha kwa kutumia neno alilopewa.","Anaweza kuzungumza na wazawa wa lugha kuhusu mada mbalimbali kwa ufasaha wa kuridhisha."],"can_do_zh":["能听懂关于学习、工作、旅行、健康等熟悉话题的日常对话和简短讲话。","能读懂大约100个字的通知和短文的主要意思和重要细节。","能用HSK四级关联词（虽然……但是、不但……而且、即使……也、为了）把意思连起来。","能用“把、被、比”句式组成正确的句子。","能用给出的词语，看图写一个简单、正确的句子。","能和以汉语为母语的人就比较广泛的话题进行比较流利的交谈。"]},{"level":5,"title":"HSK 5 自测 · Self-test","title_zh":"HSK 5 自测","title_sw":"HSK 5 — Jaribio la Kujipima","title_en":"HSK 5 Self-test","minutes":70,"pass":60,"can_do":["Understand the main idea and key details of everyday conversations and short talks on familiar topics (work, study, health, travel).","Read newspaper-style short articles, stories and notices and pick out the main point and the writer's attitude.","Choose the right word or sentence to complete a paragraph, using connectors such as 不但……而且……, 无论……都…… and 尤其.","Build correct complex sentences with 把, 被, 让 and 连……都…….","Write a short, well-organised paragraph of about 80 characters from given words or a picture.","Talk about one's experiences and opinions in a fairly complete way (HSK 5 has about 2,500 words)."],"sections":[{"name":"听力 第一部分","skill":"listening","inst_zh":"每题听一次。每题是两个人的两句对话，第三个人根据对话问一个问题。请选出正确答案。","inst_en":"Listen once. Each item is a two-line dialogue followed by a question. Choose the correct answer.","items":[{"t":"listen","audio":"女：这个周末的会议改到下周一了，你通知大家了吗？\n男：还没呢，我马上给他们发短信。\n问：男的接下来要做什么？","q":"男的接下来要做什么？","o":["参加会议","取消会议","通知大家","写会议报告"],"a":2,"ex":"He says 我马上给他们发短信 — he will text everyone about the change. 他马上要发短信通知大家。","tag":"listening","ex_sw":"Anasema 我马上给他们发短信 — atawatumia wote ujumbe mfupi kuhusu mabadiliko. 他马上要发短信通知大家。","ex_zh":"他说“我马上给他们发短信”——他马上要发短信通知大家会议改时间了。"},{"t":"listen","audio":"
