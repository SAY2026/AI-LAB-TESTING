<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2430;--mut:#5d6675;--line:#d9d5c8;--pri:#0b5c63;--pri2:#e2f0ef;--ok:#1d7a46;--bad:#b3261e;--warn:#8a5a00;--acc:#c2571a}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
header{background:var(--pri);color:#fff;padding:10px 16px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}

.tw{overflow-x:auto}

.x{text-decoration:line-through;color:var(--bad)}

.key{display:none}

.tonly{display:none}

.paper-head{display:none}

var TEACHER_PIN="2026";
var YEARS=[{"form":1,"groups":[{"zh":"问候与人","en":"Greetings and people","sw":"Salamu na watu","words":[{"h":"你好","p":"nǐ hǎo","en":"hello","sw":"hujambo / habari"},{"h":"再见","p":"zàijiàn","en":"goodbye","sw":"kwaheri"},{"h":"谢谢","p":"xièxie","en":"thank you","sw":"asante"},{"h":"老师","p":"lǎoshī","en":"teacher","sw":"mwalimu"},{"h":"学生","p":"xuésheng","en":"student","sw":"mwanafunzi"},{"h":"同学","p":"tóngxué","en":"classmate","sw":"mwanafunzi mwenzangu"},{"h":"朋友","p":"péngyou","en":"friend","sw":"rafiki"},{"h":"人","p":"rén","en":"person","sw":"mtu"},{"h":"名字","p":"míngzi","en":"name","sw":"jina"},{"h":"叫","p":"jiào","en":"to be called","sw":"kuitwa"},{"h":"坦桑尼亚","p":"Tǎnsāngníyà","en":"Tanzania","sw":"Tanzania"},{"h":"中国","p":"Zhōngguó","en":"China","sw":"China"}]},{"zh":"数字、年龄与日期","en":"Numbers, age and dates","sw":"Namba, umri na tarehe","words":[{"h":"二","p":"èr","en":"two","sw":"mbili"},{"h":"十","p":"shí","en":"ten","sw":"kumi"},{"h":"百","p":"bǎi","en":"hundred","sw":"mia"},{"h":"岁","p":"suì","en":"years old","sw":"umri wa miaka (… miaka)"},{"h":"几","p":"jǐ","en":"how many (under 10)","sw":"ngapi (chini ya kumi)"},{"h":"多大","p":"duō dà","en":"how old","sw":"umri gani"},{"h":"月","p":"yuè","en":"month","sw":"mwezi"},{"h":"号","p":"hào","en":"day of the month","sw":"tarehe (siku ya mwezi)"},{"h":"星期","p":"xīngqī","en":"week","sw":"wiki"},{"h":"今天","p":"jīntiān","en":"today","sw":"leo"},{"h":"明天","p":"míngtiān","en":"tomorrow","sw":"kesho"},{"h":"昨天","p":"zuótiān","en":"yesterday","sw":"jana"},{"h":"生日","p":"shēngrì","en":"birthday","sw":"siku ya kuzaliwa"}]},{"zh":"学校","en":"School","sw":"Shule","words":[{"h":"学校","p":"xuéxiào","en":"school","sw":"shule"},{"h":"教室","p":"jiàoshì","en":"classroom","sw":"darasa"},{"h":"书","p":"shū","en":"book","sw":"kitabu"},{"h":"笔","p":"bǐ","en":"pen","sw":"kalamu"},{"h":"桌子","p":"zhuōzi","en":"desk","sw":"meza"},{"h":"椅子","p":"yǐzi","en":"chair","sw":"kiti"},{"h":"黑板","p":"hēibǎn","en":"blackboard","sw":"ubao"},{"h":"汉语","p":"Hànyǔ","en":"Chinese language","sw":"lugha ya Kichina"},{"h":"图书馆","p":"túshūguǎn","en":"library","sw":"maktaba"},{"h":"办公室","p":"bàngōngshì","en":"office","sw":"ofisi"},{"h":"操场","p":"cāochǎng","en":"playground","sw":"uwanja wa michezo"},{"h":"厕所","p":"cèsuǒ","en":"toilet","sw":"choo"}]},{"zh":"家人与工作","en":"Family and jobs","sw":"Familia na kazi","words":[{"h":"家","p":"jiā","en":"family / home","sw":"familia / nyumbani"},{"h":"爸爸","p":"bàba","en":"father","sw":"baba"},{"h":"妈妈","p":"māma","en":"mother","sw":"mama"},{"h":"哥哥","p":"gēge","en":"older brother","sw":"kaka mkubwa"},{"h":"姐姐","p":"jiějie","en":"older sister","sw":"dada mkubwa"},{"h":"弟弟","p":"dìdi","en":"younger brother","sw":"mdogo wa kiume"},{"h":"妹妹","p":"mèimei","en":"younger sister","sw":"mdogo wa kike"},{"h":"医生","p":"yīshēng","en":"doctor","sw":"daktari"},{"h":"农民","p":"nóngmín","en":"farmer","sw":"mkulima"},{"h":"司机","p":"sījī","en":"driver","sw":"dereva"},{"h":"工作","p":"gōngzuò","en":"job / to work","sw":"kazi / kufanya kazi"}]},{"zh":"每天的动作","en":"Daily verbs","sw":"Vitenzi vya kila siku","words":[{"h":"起床","p":"qǐchuáng","en":"to get up","sw":"kuamka"},{"h":"吃","p":"chī","en":"to eat","sw":"kula"},{"h":"喝","p":"hē","en":"to drink","sw":"kunywa"},{"h":"上课","p":"shàngkè","en":"to have class","sw":"kuingia darasani / kuwa na kipindi"},{"h":"学习","p":"xuéxí","en":"to study","sw":"kusoma / kujifunza"},{"h":"回家","p":"huí jiā","en":"to go home","sw":"kurudi nyumbani"},{"h":"睡觉","p":"shuìjiào","en":"to sleep","sw":"kulala"},{"h":"去","p":"qù","en":"to go","sw":"kwenda"},{"h":"来","p":"lái","en":"to come","sw":"kuja"},{"h":"看","p":"kàn","en":"to look / read","sw":"kuangalia / kusoma"},{"h":"听","p":"tīng","en":"to listen","sw":"kusikiliza"},{"h":"说","p":"shuō","en":"to speak","sw":"kusema / kuzungumza"},{"h":"读","p":"dú","en":"to read aloud","sw":"kusoma kwa sauti"},{"h":"写","p":"xiě","en":"to write","sw":"kuandika"},{"h":"喜欢","p":"xǐhuan","en":"to like","sw":"kupenda"}]},{"zh":"时间与方位","en":"Time and place words","sw":"Maneno ya wakati na mahali","words":[{"h":"每天","p":"měi tiān","en":"every day","sw":"kila siku"},{"h":"早上","p":"zǎoshang","en":"morning","sw":"asubuhi"},{"h":"晚上","p":"wǎnshang","en":"evening","sw":"jioni / usiku"},{"h":"前边","p":"qiánbian","en":"in front","sw":"mbele"},{"h":"后边","p":"hòubian","en":"behind","sw":"nyuma"},{"h":"旁边","p":"pángbiān","en":"beside","sw":"kando / pembeni"},{"h":"里","p":"lǐ","en":"inside","sw":"ndani"},{"h":"上","p":"shàng","en":"on","sw":"juu ya"},{"h":"哪儿","p":"nǎr","en":"where","sw":"wapi"}]},{"zh":"语法词","en":"Grammar words","sw":"Maneno ya sarufi","words":[{"h":"是","p":"shì","en":"to be","sw":"kuwa (ni)"},{"h":"有","p":"yǒu","en":"to have / there is","sw":"kuwa na / kuna"},{"h":"没有","p":"méiyǒu","en":"not have","sw":"kutokuwa na / hakuna"},{"h":"不","p":"bù","en":"not","sw":"si / ha- (kukanusha)"},{"h":"吗","p":"ma","en":"(yes/no question)","sw":"(swali la ndiyo/hapana)"},{"h":"什么","p":"shénme","en":"what","sw":"nini"},{"h":"这","p":"zhè","en":"this","sw":"hiki / huyu"},{"h":"那","p":"nà","en":"that","sw":"kile / yule"},{"h":"的","p":"de","en":"(possession: 's / of)","sw":"(umilikishi: -a, -angu)"},{"h":"和","p":"hé","en":"and / with","sw":"na"},{"h":"但是","p":"dànshì","en":"but","sw":"lakini"},{"h":"也","p":"yě","en":"also","sw":"pia"},{"h":"都","p":"dōu","en":"all / both","sw":"wote / zote"},{"h":"很","p":"hěn","en":"very","sw":"sana"},{"h":"在","p":"zài","en":"at / in","sw":"katika / kwenye"},{"h":"请","p":"qǐng","en":"please","sw":"tafadhali"}]}],"patterns":[{"zh":"我叫哈桑。","p":"Wǒ jiào Hāsāng.","en":"My name is Hassan. (叫 = to be called)","sw":"Jina langu ni Hassan. (叫 = kuitwa)"},{"zh":"你是老师吗？——不，我是学生。","p":"Nǐ shì lǎoshī ma? — Bù, wǒ shì xuésheng.","en":"Are you a teacher? — No, I am a student. (吗 at the end makes a yes/no question)","sw":"Wewe ni mwalimu? — Hapana, mimi ni mwanafunzi. (吗 mwishoni hufanya swali la ndiyo/hapana)"},{"zh":"我是坦桑尼亚人。","p":"Wǒ shì Tǎnsāngníyà rén.","en":"I am Tanzanian. (country + 人)","sw":"Mimi ni Mtanzania. (nchi + 人)"},{"zh":"你几岁？——我十四岁。","p":"Nǐ jǐ suì? — Wǒ shísì suì.","en":"How old are you? — I am fourteen.","sw":"Una umri wa miaka mingapi? — Nina miaka kumi na minne."},{"zh":"今天九月二十号，星期六。","p":"Jīntiān jiǔ yuè èrshí hào, xīngqīliù.","en":"Today is 20 September, Saturday. (month first, then day)","sw":"Leo ni tarehe 20 Septemba, Jumamosi. (mwezi kwanza, kisha tarehe)"},{"zh":"这是我的书。那是老师的桌子。","p":"Zhè shì wǒ de shū. Nà shì lǎoshī de zhuōzi.","en":"This is my book. That is the teacher's desk.","sw":"Hiki ni kitabu changu. Ile ni meza ya mwalimu."},{"zh":"我们学校有二十个教室。","p":"Wǒmen xuéxiào yǒu èrshí gè jiàoshì.","en":"Our school has twenty classrooms. (有 = has / there is)","sw":"Shule yetu ina madarasa ishirini. (有 = kuwa na / kuna)"},{"zh":"我家有六口人。","p":"Wǒ jiā yǒu liù kǒu rén.","en":"There are six people in my family. (family members are counted with 口)","sw":"Familia yetu ina watu sita. (wanafamilia huhesabiwa kwa 口)"},{"zh":"我每天早上六点起床。","p":"Wǒ měi tiān zǎoshang liù diǎn qǐchuáng.","en":"I get up at six every morning. (time BEFORE the verb)","sw":"Ninaamka saa 6:00 asubuhi (saa kumi na mbili) kila siku. (wakati huja KABLA ya kitenzi)"},{"zh":"我在学校学习汉语。","p":"Wǒ zài xuéxiào xuéxí Hànyǔ.","en":"I study Chinese at school. (在 + place comes before the verb)","sw":"Ninasoma Kichina shuleni. (在 + mahali huja kabla ya kitenzi)"},{"zh":"哈桑在我的后边。","p":"Hāsāng zài wǒ de hòubian.","en":"Hassan is behind me. (reference point first, then 的 + direction)","sw":"Hassan yuko nyuma yangu. (kwanza kitu cha kurejelea, kisha 的 + mwelekeo)"},{"zh":"汉语很难，但是我很喜欢。","p":"Hànyǔ hěn nán, dànshì wǒ hěn xǐhuan.","en":"Chinese is difficult, but I like it a lot.","sw":"Kichina ni kigumu, lakini ninakipenda sana."}],"grammar":[{"name":"是字句","pat":"A 是 B · A 不是 B","en":"是 links two nouns (I am a student); the negative is 不是. Adjectives do NOT take 是: 汉语很难, not 汉语是难.","sw":"是 huunganisha nomino mbili (mimi ni mwanafunzi); kukanusha ni 不是. Vivumishi havichukui 是: 汉语很难, si 汉语是难."},{"name":"有字句","pat":"A 有 B · A 没有 B","en":"有 means have or there is; its negative is always 没有, never 不有.","sw":"有 maana yake 'kuwa na' au 'kuna'; kukanusha kwake ni 没有 kila mara, kamwe si 不有."},{"name":"疑问句","pat":"……吗？ · 什么 / 几 / 哪","en":"Yes/no questions add 吗 at the end; questions with 什么 (what), 几 (how many), 哪 (which) never add 吗.","sw":"Maswali ya ndiyo/hapana huongeza 吗 mwishoni; maswali yenye 什么 (nini), 几 (ngapi) au 哪 (ipi) hayaongezi 吗."},{"name":"的：所属","pat":"A 的 B","en":"的 marks possession (teacher's book, my pen); it is dropped for close relations (my mum, our school).","sw":"的 huonyesha umilikishi (kitabu cha mwalimu, kalamu yangu); huachwa kwa uhusiano wa karibu (mama yangu, shule yetu)."},{"name":"语序","pat":"主语 + 时间 + 地点 + 动词 + 宾语","en":"Word order: subject, time, place, verb, object. Time and place come BEFORE the verb, unlike English.","sw":"Mpangilio wa maneno: mtenda, wakati, mahali, kitenzi, yambwa. Wakati na mahali huja KABLA ya kitenzi, tofauti na Kiingereza."},{"name":"在 与 有","pat":"东西 + 在 + 地方 · 地方 + 有 + 东西","en":"Thing + 在 + place = 'is at'; place + 有 + thing = 'there is'. Both are correct; never use 是 for location.","sw":"Kitu + 在 + mahali = 'kiko'; mahali + 有 + kitu = 'kuna'. Zote ni sahihi; usitumie 是 kuonyesha mahali."},{"name":"和、也、都","pat":"名词 和 名词 · 也 / 都 + 动词","en":"和 joins nouns only, not sentences; 也 (also) and 都 (all) go before the verb.","sw":"和 huunganisha nomino tu, si sentensi; 也 (pia) na 都 (wote) huwekwa kabla ya kitenzi."},{"name":"量词 个、口","pat":"数字 + 个 / 口 + 名词","en":"Measure words: 个 for most things, 口 for family members; before a measure word 'two' is 两, not 二.","sw":"Vipimo: 个 kwa vitu vingi, 口 kwa wanafamilia; kabla ya kipimo 'mbili' ni 两, si 二."},{"name":"声调与标调","pat":"mā má mǎ mà + 轻声","en":"Four tones plus the neutral tone; the mark goes on a, then o, then e; with i and u together, on the second one (liú, guì).","sw":"Toni nne pamoja na toni hafifu; alama huwekwa kwenye a, kisha o, kisha e; i na u zikiwa pamoja, huwekwa kwenye ya pili (liú, guì)."}],"mistakes":[["我起床六点","我六点起床","Putting the time after the verb as in English (*我起床六点). Chinese keeps time before the verb: 我六点起床.","Kuweka wakati baada ya kitenzi kama katika Kiingereza. Kichina huweka wakati kabla ya kitenzi: 我六点起床."],["黑板是教室的前边；学校是二十个教室","黑板在教室的前边；学校有二十个教室","Using 是 for location or existence (*黑板是教室的前边, *学校是二十个教室). Use 在 for 'is at' and 有 for 'has / there is'.","Kutumia 是 kuonyesha mahali au kuwepo. Tumia 在 kwa 'iko' na 有 kwa 'ina / kuna'."],["我不有弟弟","我没有弟弟","Negating 有 with 不 (*我不有弟弟). The only negative of 有 is 没有.","Kukanusha 有 kwa 不. Kukanusha pekee kwa 有 ni 没有."],["你叫什么名字吗？","你叫什么名字？","Adding 吗 to a question that already has 什么/几/哪 (*你叫什么名字吗？). One question word per question.","Kuongeza 吗 kwenye swali ambalo tayari lina 什么/几/哪. Neno moja la swali kwa kila swali."],["二十号九月；星期七","九月二十号；星期日 / 星期天","Reading dates day-month (Swahili/English habit). Chinese says month first: 九月二十号 = 20 September; and Sunday is 星期日/星期天, never 星期七.","Kusoma tarehe kwa mpangilio wa siku-mwezi (tabia ya Kiswahili/Kiingereza). Kichina husema mwezi kwanza: 九月二十号 = 20 Septemba; na Jumapili ni 星期日/星期天, kamwe si 星期七."]]},{"form":2,"groups":[{"zh":"家与家里的东西","en":"Home and things at home","sw":"Nyumbani na vitu vya nyumbani","words":[{"h":"房间","p":"fángjiān","en":"room","sw":"chumba"},{"h":"客厅","p":"kètīng","en":"living room","sw":"sebule"},{"h":"厨房","p":"chúfáng","en":"kitchen","sw":"jiko"},{"h":"床","p":"chuáng","en":"bed","sw":"kitanda"},{"h":"电视","p":"diànshì","en":"TV","sw":"televisheni"},{"h":"手机","p":"shǒujī","en":"mobile phone","sw":"simu ya mkononi"},{"h":"电脑","p":"diànnǎo","en":"computer","sw":"kompyuta"},{"h":"杯子","p":"bēizi","en":"cup","sw":"kikombe"},{"h":"干净","p":"gānjìng","en":"clean","sw":"safi"}]},{"zh":"食物与三餐","en":"Food and meals","sw":"Vyakula na milo","words":[{"h":"水果","p":"shuǐguǒ","en":"fruit","sw":"matunda"},{"h":"鸡蛋","p":"jīdàn","en":"egg","sw":"yai"},{"h":"米饭","p":"mǐfàn","en":"cooked rice","sw":"wali"},{"h":"牛奶","p":"niúnǎi","en":"milk","sw":"maziwa"},{"h":"早饭","p":"zǎofàn","en":"breakfast","sw":"kifungua kinywa"},{"h":"午饭","p":"wǔfàn","en":"lunch","sw":"chakula cha mchana"},{"h":"晚饭","p":"wǎnfàn","en":"dinner","sw":"chakula cha jioni"},{"h":"做饭","p":"zuò fàn","en":"to cook","sw":"kupika"}]},{"zh":"时间","en":"Telling the time","sw":"Kueleza saa","words":[{"h":"点","p":"diǎn","en":"o'clock","sw":"saa (kamili)"},{"h":"分","p":"fēn","en":"minute (clock)","sw":"dakika (ya saa)"},{"h":"半","p":"bàn","en":"half","sw":"nusu"},{"h":"刻","p":"kè","en":"quarter","sw":"robo"},{"h":"差","p":"chà","en":"to (before the hour)","sw":"kasoro (kabla ya saa kamili)"},{"h":"两","p":"liǎng","en":"two (before a measure word)","sw":"mbili (kabla ya kipimo)"},{"h":"现在","p":"xiànzài","en":"now","sw":"sasa"},{"h":"上午","p":"shàngwǔ","en":"morning (a.m.)","sw":"asubuhi (kabla ya mchana)"},{"h":"中午","p":"zhōngwǔ","en":"noon","sw":"adhuhuri / mchana"},{"h":"下午","p":"xiàwǔ","en":"afternoon","sw":"mchana / alasiri"},{"h":"小时","p":"xiǎoshí","en":"hour","sw":"saa (muda)"},{"h":"分钟","p":"fēnzhōng","en":"minute (duration)","sw":"dakika (muda)"},{"h":"下课","p":"xiàkè","en":"class ends","sw":"kipindi kinaisha"}]},{"zh":"一天的生活与先后","en":"Daily routine and order words","sw":"Maisha ya kila siku na maneno ya mfuatano","words":[{"h":"刷牙","p":"shuā yá","en":"to brush teeth","sw":"kupiga mswaki"},{"h":"洗脸","p":"xǐ liǎn","en":"to wash the face","sw":"kunawa uso"},{"h":"打扫","p":"dǎsǎo","en":"to sweep / clean","sw":"kufagia / kusafisha"},{"h":"作业","p":"zuòyè","en":"homework","sw":"kazi ya nyumbani"},{"h":"帮","p":"bāng","en":"to help","sw":"kusaidia"},{"h":"休息","p":"xiūxi","en":"to rest","sw":"kupumzika"},{"h":"先","p":"xiān","en":"first","sw":"kwanza"},{"h":"然后","p":"ránhòu","en":"then","sw":"kisha"},{"h":"再","p":"zài","en":"then / again","sw":"halafu / tena"},{"h":"最后","p":"zuìhòu","en":"finally","sw":"mwishowe"},{"h":"以后","p":"yǐhòu","en":"after","sw":"baada ya"},{"h":"以前","p":"yǐqián","en":"before","sw":"kabla ya"}]},{"zh":"地方与方向","en":"Places and directions","sw":"Mahali na mielekeo","words":[{"h":"从","p":"cóng","en":"from","sw":"kutoka"},{"h":"往","p":"wǎng","en":"towards","sw":"kuelekea"},{"h":"到","p":"dào","en":"to / arrive","sw":"hadi / kufika"},{"h":"离","p":"lí","en":"(distance) from","sw":"(umbali) kutoka"},{"h":"左","p":"zuǒ","en":"left","sw":"kushoto"},{"h":"右","p":"yòu","en":"right","sw":"kulia"},{"h":"拐","p":"guǎi","en":"to turn","sw":"kupinda / kugeuka"},{"h":"走","p":"zǒu","en":"to walk / go","sw":"kutembea / kwenda"},{"h":"商店","p":"shāngdiàn","en":"shop","sw":"duka"},{"h":"医院","p":"yīyuàn","en":"hospital","sw":"hospitali"},{"h":"海边","p":"hǎibiān","en":"seaside","sw":"ufukweni"},{"h":"车站","p":"chēzhàn","en":"bus stop","sw":"kituo cha basi"},{"h":"远","p":"yuǎn","en":"far","sw":"mbali"},{"h":"近","p":"jìn","en":"near","sw":"karibu"}]},{"zh":"请求与礼貌","en":"Permission and politeness","sw":"Ruhusa na adabu","words":[{"h":"可以","p":"kěyǐ","en":"may (permission)","sw":"kuruhusiwa (unaweza)"},{"h":"能","p":"néng","en":"can (able)","sw":"kuweza"},{"h":"会","p":"huì","en":"can (learned skill)","sw":"kujua (ujuzi uliojifunza)"},{"h":"想","p":"xiǎng","en":"would like","sw":"kutaka / ningependa"},{"h":"借","p":"jiè","en":"to borrow / lend","sw":"kuazima / kuazimisha"},{"h":"用","p":"yòng","en":"to use","sw":"kutumia"},{"h":"出去","p":"chūqu","en":"to go out","sw":"kutoka nje"},{"h":"等","p":"děng","en":"to wait","sw":"kusubiri"},{"h":"一下","p":"yíxià","en":"(a moment)","sw":"(kidogo, kwa muda mfupi)"},{"h":"对不起","p":"duìbuqǐ","en":"sorry","sw":"samahani"},{"h":"没关系","p":"méi guānxi","en":"never mind","sw":"si kitu / hakuna shida"},{"h":"当然","p":"dāngrán","en":"of course","sw":"bila shaka"},{"h":"不行","p":"bùxíng","en":"not allowed","sw":"hairuhusiwi / haiwezekani"}]},{"zh":"短信","en":"Messages","sw":"Jumbe","words":[{"h":"微信","p":"Wēixìn","en":"WeChat","sw":"WeChat"},{"h":"短信","p":"duǎnxìn","en":"text message","sw":"ujumbe mfupi (SMS)"},{"h":"发","p":"fā","en":"to send","sw":"kutuma"},{"h":"收到","p":"shōudào","en":"received / got it","sw":"nimepokea"},{"h":"在吗","p":"zài ma","en":"are you there?","sw":"upo?"},{"h":"好的","p":"hǎo de","en":"OK","sw":"sawa"},{"h":"明天见","p":"míngtiān jiàn","en":"see you tomorrow","sw":"tuonane kesho"},{"h":"照片","p":"zhàopiàn","en":"photo","sw":"picha"},{"h":"忙","p":"máng","en":"busy","sw":"kuwa na shughuli nyingi"},{"h":"一起","p":"yìqǐ","en":"together","sw":"pamoja"}]},{"zh":"学习与考试","en":"Study and exams","sw":"Masomo na mitihani","words":[{"h":"复习","p":"fùxí","en":"to revise","sw":"kurudia masomo"},{"h":"考试","p":"kǎoshì","en":"exam","sw":"mtihani"},{"h":"答案","p":"dá'àn","en":"answer","sw":"jibu"},{"h":"对","p":"duì","en":"correct","sw":"sahihi"},{"h":"错","p":"cuò","en":"wrong","sw":"kosa / si sahihi"},{"h":"懂","p":"dǒng","en":"to understand","sw":"kuelewa"},{"h":"觉得","p":"juéde","en":"to think / feel","sw":"kuona / kuhisi"},{"h":"容易","p":"róngyì","en":"easy","sw":"rahisi"},{"h":"问题","p":"wèntí","en":"question / problem","sw":"swali / tatizo"}]}],"patterns":[{"zh":"我家有三个房间和一个客厅。","p":"Wǒ jiā yǒu sān gè fángjiān hé yí gè kètīng.","en":"My home has three rooms and a living room.","sw":"Nyumbani kwetu kuna vyumba vitatu na sebule moja."},{"zh":"电视在客厅里。手机在床上。","p":"Diànshì zài kètīng li. Shǒujī zài chuáng shang.","en":"The TV is in the living room. The phone is on the bed.","sw":"Televisheni iko sebuleni. Simu iko juu ya kitanda."},{"zh":"我的房间很干净。","p":"Wǒ de fángjiān hěn gānjìng.","en":"My room is clean. (adjective after 很, no 是)","sw":"Chumba changu ni safi. (kivumishi huja baada ya 很, bila 是)"},{"zh":"现在几点？——现在八点二十分。","p":"Xiànzài jǐ diǎn? — Xiànzài bā diǎn èrshí fēn.","en":"What time is it? — It is 8:20.","sw":"Ni saa ngapi? — Ni saa 8:20."},{"zh":"两点半 · 三点一刻 · 差五分四点","p":"liǎng diǎn bàn · sān diǎn yí kè · chà wǔ fēn sì diǎn","en":"2:30 · 3:15 · five to four (3:55). Say 两点, never 二点.","sw":"2:30 · 3:15 · dakika tano kasoro saa 4:00 (3:55). Sema 两点, kamwe si 二点."},{"zh":"我先刷牙，然后洗脸，再吃早饭，最后去学校。","p":"Wǒ xiān shuā yá, ránhòu xǐ liǎn, zài chī zǎofàn, zuìhòu qù xuéxiào.","en":"First I brush my teeth, then wash my face, then eat breakfast, and finally go to school.","sw":"Kwanza ninapiga mswaki, kisha ninanawa uso, halafu ninakula kifungua kinywa, na mwishowe ninakwenda shuleni."},{"zh":"放学以后我帮妈妈做饭。睡觉以前我做作业。","p":"Fàngxué yǐhòu wǒ bāng māma zuò fàn. Shuìjiào yǐqián wǒ zuò zuòyè.","en":"After school I help mum cook. Before sleeping I do homework.","sw":"Baada ya shule ninamsaidia mama kupika. Kabla ya kulala ninafanya kazi ya nyumbani."},{"zh":"我从学校回家。往右拐。","p":"Wǒ cóng xuéxiào huí jiā. Wǎng yòu guǎi.","en":"I go home from school. Turn right. (preposition phrase before the verb)","sw":"Ninarudi nyumbani kutoka shuleni. Pinda kulia. (kirai cha kihusishi huja kabla ya kitenzi)"},{"zh":"从我家到学校走十分钟。","p":"Cóng wǒ jiā dào xuéxiào zǒu shí fēnzhōng.","en":"From my home to school is a ten-minute walk.","sw":"Kutoka nyumbani kwetu hadi shuleni ni mwendo wa dakika kumi."},{"zh":"我家离海边很近。","p":"Wǒ jiā lí hǎibiān hěn jìn.","en":"My home is near the seaside.","sw":"Nyumbani kwetu ni karibu na ufukwe."},{"zh":"老师，我可以出去吗？——可以。","p":"Lǎoshī, wǒ kěyǐ chūqu ma? — Kěyǐ.","en":"Teacher, may I go out? — Yes. (吗 at the very end)","sw":"Mwalimu, naweza kutoka nje? — Ndiyo. (吗 mwisho kabisa)"},{"zh":"在吗？我想问你明天几点上课。——八点。好的，明天见！","p":"Zài ma? Wǒ xiǎng wèn nǐ míngtiān jǐ diǎn shàngkè. — Bā diǎn. Hǎo de, míngtiān jiàn!","en":"Are you there? I want to ask what time class is tomorrow. — Eight. OK, see you tomorrow!","sw":"Upo? Nataka kuuliza darasa litaanza saa ngapi kesho. — Saa 8:00. Sawa, tuonane kesho!"}],"grammar":[{"name":"轻声与三声连读","pat":"māma · 你好 ní hǎo","en":"A neutral-tone syllable gets no mark; when two 3rd tones meet, say the first as a 2nd tone but write the original marks.","sw":"Silabi yenye toni hafifu haipewi alama; toni mbili za tatu zikikutana, ya kwanza hutamkwa kama toni ya pili, lakini huandikwa kwa alama zake za asili."},{"name":"形容词谓语句","pat":"主语 + 很 + 形容词","en":"An adjective describing the subject takes 很 in front and never 是: 'my room is clean' = 我的房间很干净.","sw":"Kivumishi kinachoeleza mtenda huwekewa 很 mbele yake na kamwe si 是: 'chumba changu ni safi' = 我的房间很干净."},{"name":"介词 在、从、往","pat":"在 / 从 / 往 + 地方 + 动词","en":"在 (at), 从 (from) and 往 (towards) all come BEFORE the verb: 在家做作业, 从学校回家, 往右拐.","sw":"在 (katika), 从 (kutoka) na 往 (kuelekea) zote huja KABLA ya kitenzi: 在家做作业, 从学校回家, 往右拐."},{"name":"两点；分 与 分钟","pat":"两点 · 八点十分 · 十分钟","en":"2 o'clock is 两点, never 二点; 分 is clock minutes (8:10), 分钟 is a length of time (ten minutes).","sw":"Saa 2:00 ni 两点, kamwe si 二点; 分 ni dakika za saa (8:10), 分钟 ni urefu wa muda (dakika kumi)."},{"name":"时间词与时长","pat":"时间 + 动词 + 时长","en":"A time word (每天, 八点) goes before the verb; a duration (一个小时) goes after it.","sw":"Neno la wakati (每天, 八点) huja kabla ya kitenzi; urefu wa muda (一个小时) huja baada yake."},{"name":"然后；以后 / 以前","pat":"先……，然后…… · ……以后 / ……以前","en":"然后 links actions in a list; 以后 (after) and 以前 (before) attach to the END of an event: 放学以后 = after school.","sw":"然后 huunganisha vitendo katika orodha; 以后 (baada ya) na 以前 (kabla ya) hufuata MWISHO wa tukio: 放学以后 = baada ya shule."},{"name":"会、能、可以","pat":"会 / 能 / 可以 + 动词","en":"会 = learned skill, 能 = ability or possibility, 可以 = permission.","sw":"会 = ujuzi uliojifunza, 能 = uwezo au uwezekano, 可以 = ruhusa."},{"name":"吗 的位置与回答","pat":"……吗？——可以 / 不行","en":"吗 always goes at the very end; answer by repeating the verb (可以 / 不可以 / 不行), not with 是.","sw":"吗 huwekwa mwisho kabisa; jibu kwa kurudia kitenzi (可以 / 不可以 / 不行), si kwa 是."},{"name":"离 表示距离","pat":"A 离 B + 近 / 远","en":"离 marks distance between two places: A 离 B + 近 (near) / 远 (far).","sw":"离 huonyesha umbali kati ya mahali pawili: A 离 B + 近 (karibu) / 远 (mbali)."}],"mistakes":[["二点半","两点半","Writing 二点 for 2 o'clock. Before 点 and before measure words 'two' is 两: 两点半, 两个房间.","Kuandika 二点 kwa saa 2:00. Kabla ya 点 na kabla ya vipimo, 'mbili' ni 两: 两点半, 两个房间."],["我的房间是很干净","我的房间很干净","Putting 是 before an adjective (*我的房间是很干净). Use 很 + adjective and no 是.","Kuweka 是 kabla ya kivumishi. Tumia 很 + kivumishi bila 是."],["我来从学校；我做作业在家","我从学校来；我在家做作业","Placing the preposition phrase after the verb (*我来从学校, *我做作业在家). 从/在/往 phrases go before the verb: 我从学校来, 我在家做作业.","Kuweka kirai cha kihusishi baada ya kitenzi. Virai vya 从/在/往 huja kabla ya kitenzi: 我从学校来, 我在家做作业."],["吃饭然后我看电视","吃饭以后我看电视 / 我先吃饭，然后看电视","Mixing 然后 and 以后: *吃饭然后我看电视 → 吃饭以后我看电视 (after eating) or 我先吃饭，然后看电视 (first…, then…).","Kuchanganya 然后 na 以后: sema 吃饭以后我看电视 (baada ya kula) au 我先吃饭，然后看电视 (kwanza…, kisha…)."],["我可以吗出去；（回答）是","我可以出去吗？——可以。/ 不行。","Answering 可以…吗？ with 是, or putting 吗 in the middle (*我可以吗出去). Say 我可以出去吗？ and answer 可以 / 不行.","Kujibu swali la 可以…吗？ kwa 是, au kuweka 吗 katikati (*我可以吗出去). Sema 我可以出去吗？ na ujibu 可以 / 不行."]]},{"form":3,"groups":[{"zh":"变调词","en":"Tone-change words","sw":"Maneno yanayobadilisha toni","words":[{"h":"一个","p":"yí gè","en":"one (before a measure word; 一 becomes yí)","sw":"kimoja / mmoja (kabla ya kipimo; 一 inakuwa yí)"},{"h":"一样","p":"yíyàng","en":"the same","sw":"sawa / vilevile"},{"h":"第一","p":"dì-yī","en":"first (一 keeps yī after 第)","sw":"-a kwanza (一 hubaki yī baada ya 第)"},{"h":"老板","p":"lǎobǎn","en":"shop owner / boss","sw":"mwenye duka / bosi"},{"h":"很好","p":"hěn hǎo","en":"very good (said hén hǎo)","sw":"vizuri sana (hutamkwa hén hǎo)"}]},{"zh":"市场与商品","en":"Market and goods","sw":"Soko na bidhaa","words":[{"h":"市场","p":"shìchǎng","en":"market","sw":"soko"},{"h":"卖","p":"mài","en":"to sell","sw":"kuuza"},{"h":"买","p":"mǎi","en":"to buy","sw":"kununua"},{"h":"蔬菜","p":"shūcài","en":"vegetables","sw":"mboga"},{"h":"西瓜","p":"xīguā","en":"watermelon","sw":"tikiti maji"},{"h":"香蕉","p":"xiāngjiāo","en":"banana","sw":"ndizi"},{"h":"苹果","p":"píngguǒ","en":"apple","sw":"tufaha"},{"h":"鸡肉","p":"jīròu","en":"chicken (meat)","sw":"nyama ya kuku"},{"h":"牛肉","p":"niúròu","en":"beef","sw":"nyama ya ng'ombe"},{"h":"大米","p":"dàmǐ","en":"rice (grain)","sw":"mchele"},{"h":"面包","p":"miànbāo","en":"bread","sw":"mkate"},{"h":"新鲜","p":"xīnxiān","en":"fresh","sw":"-bichi (freshi)"},{"h":"好吃","p":"hǎochī","en":"tasty","sw":"-tamu"},{"h":"顾客","p":"gùkè","en":"customer","sw":"mteja"}]},{"zh":"价钱与讨价还价","en":"Prices and bargaining","sw":"Bei na kupatana bei","words":[{"h":"钱","p":"qián","en":"money","sw":"pesa"},{"h":"多少钱","p":"duōshao qián","en":"how much (money)","sw":"bei gani / shilingi ngapi"},{"h":"先令","p":"xiānlìng","en":"shilling","sw":"shilingi"},{"h":"贵","p":"guì","en":"expensive","sw":"ghali"},{"h":"便宜","p":"piányi","en":"cheap","sw":"rahisi (bei nafuu)"},{"h":"太……了","p":"tài … le","en":"too …","sw":"mno / kupita kiasi"},{"h":"一点儿","p":"yìdiǎnr","en":"a little","sw":"kidogo"},{"h":"给","p":"gěi","en":"to give","sw":"kutoa / kumpa"},{"h":"找钱","p":"zhǎo qián","en":"to give change","sw":"kurudisha chenji"},{"h":"一共","p":"yígòng","en":"altogether","sw":"jumla"},{"h":"算了","p":"suàn le","en":"forget it","sw":"basi, acha"},{"h":"行","p":"xíng","en":"OK / fine","sw":"sawa"},{"h":"千","p":"qiān","en":"thousand","sw":"elfu"},{"h":"万","p":"wàn","en":"ten thousand","sw":"elfu kumi"}]},{"zh":"量词","en":"Measure words","sw":"Vipimo (maneno ya kuhesabia)","words":[{"h":"本","p":"běn","en":"(for books)","sw":"(kipimo cha vitabu)"},{"h":"张","p":"zhāng","en":"(for flat things: paper, tickets)","sw":"(kipimo cha vitu bapa: karatasi, tiketi)"},{"h":"条","p":"tiáo","en":"(for long things: fish, trousers)","sw":"(kipimo cha vitu virefu: samaki, suruali)"},{"h":"杯","p":"bēi","en":"cup of","sw":"kikombe cha"},{"h":"瓶","p":"píng","en":"bottle of","sw":"chupa ya"},{"h":"斤","p":"jīn","en":"half a kilo (500 g)","sw":"nusu kilo (gramu 500)"},{"h":"公斤","p":"gōngjīn","en":"kilogram","sw":"kilo"},{"h":"件","p":"jiàn","en":"(for clothes)","sw":"(kipimo cha nguo)"},{"h":"双","p":"shuāng","en":"pair of","sw":"jozi ya"},{"h":"只","p":"zhī","en":"(for animals)","sw":"(kipimo cha wanyama)"},{"h":"些","p":"xiē","en":"some","sw":"baadhi"},{"h":"鞋","p":"xié","en":"shoes","sw":"viatu"}]},{"zh":"比较","en":"Comparing","sw":"Kulinganisha","words":[{"h":"比","p":"bǐ","en":"than (to compare)","sw":"kuliko (kulinganisha)"},{"h":"最","p":"zuì","en":"the most","sw":"kuliko wote (zaidi ya yote)"},{"h":"更","p":"gèng","en":"even more","sw":"zaidi tena"},{"h":"得多","p":"de duō","en":"much more","sw":"zaidi sana"},{"h":"长","p":"cháng","en":"long","sw":"-refu"},{"h":"短","p":"duǎn","en":"short","sw":"-fupi"},{"h":"重","p":"zhòng","en":"heavy","sw":"-zito"},{"h":"轻","p":"qīng","en":"light (weight)","sw":"-epesi (uzito)"},{"h":"快","p":"kuài","en":"fast","sw":"haraka"},{"h":"慢","p":"màn","en":"slow","sw":"polepole"},{"h":"因为","p":"yīnwèi","en":"because","sw":"kwa sababu"},{"h":"所以","p":"suǒyǐ","en":"so / therefore","sw":"kwa hiyo"}]},{"zh":"海报与通知","en":"Posters and notices","sw":"Mabango na matangazo","words":[{"h":"通知","p":"tōngzhī","en":"notice","sw":"tangazo"},{"h":"营业时间","p":"yíngyè shíjiān","en":"opening hours","sw":"saa za kazi (za kufungua)"},{"h":"开门","p":"kāi mén","en":"to open (a shop)","sw":"kufungua (duka)"},{"h":"关门","p":"guān mén","en":"to close","sw":"kufunga"},{"h":"免费","p":"miǎnfèi","en":"free of charge","sw":"bure"},{"h":"欢迎","p":"huānyíng","en":"welcome","sw":"karibu"},{"h":"特价","p":"tèjià","en":"special price","sw":"bei maalum"},{"h":"活动","p":"huódòng","en":"event / activity","sw":"tukio / shughuli"},{"h":"周末","p":"zhōumò","en":"weekend","sw":"wikendi (mwisho wa wiki)"},{"h":"到","p":"dào","en":"until / to","sw":"hadi"}]},{"zh":"故事与复述","en":"Stories and retelling","sw":"Hadithi na kusimulia upya","words":[{"h":"故事","p":"gùshi","en":"story","sw":"hadithi"},{"h":"主要","p":"zhǔyào","en":"main / mainly","sw":"-kuu / hasa"},{"h":"意思","p":"yìsi","en":"meaning","sw":"maana"},{"h":"讲","p":"jiǎng","en":"to tell / to be about","sw":"kusimulia / kuhusu"},{"h":"然后","p":"ránhòu","en":"then","sw":"kisha"},{"h":"最后","p":"zuìhòu","en":"finally","sw":"mwishowe"},{"h":"了","p":"le","en":"(action completed)","sw":"(kitendo kimekamilika)"},{"h":"已经","p":"yǐjing","en":"already","sw":"tayari"},{"h":"突然","p":"tūrán","en":"suddenly","sw":"ghafla"},{"h":"高兴","p":"gāoxìng","en":"happy","sw":"-enye furaha"},{"h":"丢","p":"diū","en":"to lose (something)","sw":"kupoteza (kitu)"}]},{"zh":"不同场合","en":"Different settings","sw":"Mazingira tofauti","words":[{"h":"请问","p":"qǐngwèn","en":"excuse me, may I ask","sw":"samahani, naomba kuuliza"},{"h":"服务员","p":"fúwùyuán","en":"waiter","sw":"mhudumu"},{"h":"点菜","p":"diǎn cài","en":"to order food","sw":"kuagiza chakula"},{"h":"菜单","p":"càidān","en":"menu","sw":"menyu"},{"h":"结账","p":"jiézhàng","en":"to pay the bill","sw":"kulipa bili"},{"h":"买票","p":"mǎi piào","en":"to buy a ticket","sw":"kununua tiketi"},{"h":"公共汽车","p":"gōnggòng qìchē","en":"bus","sw":"basi"},{"h":"下车","p":"xià chē","en":"to get off","sw":"kushuka garini"},{"h":"发烧","p":"fāshāo","en":"to have a fever","sw":"kuwa na homa"},{"h":"药","p":"yào","en":"medicine","sw":"dawa"},{"h":"看病","p":"kàn bìng","en":"to see a doctor","sw":"kumwona daktari"},{"h":"不用了","p":"bú yòng le","en":"no need","sw":"hakuna haja"}]}],"patterns":[{"zh":"不是 · 不好 · 一个 · 一天","p":"bú shì · bù hǎo · yí gè · yì tiān","en":"不 rises to 2nd tone only before a 4th tone; 一 becomes yí before a 4th tone and yì before the other tones.","sw":"不 hupanda kuwa toni ya pili kabla ya toni ya nne tu; 一 huwa yí kabla ya toni ya nne na yì kabla ya toni nyingine."},{"zh":"老板，有没有新鲜的鱼？——有。","p":"Lǎobǎn, yǒu méiyǒu xīnxiān de yú? — Yǒu.","en":"Do you have fresh fish? — Yes. (有没有 = yes/no question without 吗)","sw":"Una samaki wabichi? — Ndiyo. (有没有 = swali la ndiyo/hapana bila 吗)"},{"zh":"我要买三个西瓜和两斤大米。","p":"Wǒ yào mǎi sān gè xīguā hé liǎng jīn dàmǐ.","en":"I want to buy three watermelons and one kilo of rice. (never number + noun alone)","sw":"Nataka kununua matikiti maji matatu na kilo moja ya mchele. (kamwe si namba + nomino peke yake)"},{"zh":"新鲜的蔬菜、好吃的面包","p":"xīnxiān de shūcài, hǎochī de miànbāo","en":"fresh vegetables, tasty bread (的 links a two-syllable adjective to its noun)","sw":"mboga mbichi, mkate mtamu (的 huunganisha kivumishi cha silabi mbili na nomino yake)"},{"zh":"西瓜多少钱一个？——三千先令一个。","p":"Xīguā duōshao qián yí gè? — Sān qiān xiānlìng yí gè.","en":"How much is a watermelon? — 3,000 shillings each.","sw":"Tikiti maji moja ni bei gani? — Shilingi 3,000 kila moja."},{"zh":"太贵了！便宜一点儿吧。——两千五，行吗？——行。","p":"Tài guì le! Piányi yìdiǎnr ba. — Liǎng qiān wǔ, xíng ma? — Xíng.","en":"Too expensive! A bit cheaper, please. — 2,500, OK? — OK.","sw":"Ghali mno! Punguza kidogo tafadhali. — 2,500, sawa? — Sawa."},{"zh":"一共七千。给你一万，找你三千。","p":"Yígòng qī qiān. Gěi nǐ yí wàn, zhǎo nǐ sān qiān.","en":"Altogether 7,000. Here is 10,000; your change is 3,000.","sw":"Jumla ni 7,000. Chukua 10,000; chenji yako ni 3,000."},{"zh":"香蕉比苹果便宜得多。","p":"Xiāngjiāo bǐ píngguǒ piányi de duō.","en":"Bananas are much cheaper than apples. (no 很 after 比)","sw":"Ndizi ni rahisi sana kuliko tufaha. (hakuna 很 baada ya 比)"},{"zh":"这条鱼最新鲜。这两本书一样贵。","p":"Zhè tiáo yú zuì xīnxiān. Zhè liǎng běn shū yíyàng guì.","en":"This fish is the freshest. These two books are equally expensive.","sw":"Samaki huyu ndiye mbichi kuliko wote. Vitabu hivi viwili vina bei sawa."},{"zh":"因为这个便宜，所以我买这个。","p":"Yīnwèi zhège piányi, suǒyǐ wǒ mǎi zhège.","en":"Because this one is cheap, I buy this one. (both words are used together)","sw":"Kwa sababu hiki ni rahisi, ninanunua hiki. (maneno yote mawili hutumika pamoja)"},{"zh":"昨天我先去了市场，然后买了鱼，最后回家了。","p":"Zuótiān wǒ xiān qù le shìchǎng, ránhòu mǎi le yú, zuìhòu huí jiā le.","en":"Yesterday I first went to the market, then bought fish, and finally went home. (了 = completed)","sw":"Jana kwanza nilienda sokoni, kisha nikanunua samaki, na mwishowe nikarudi nyumbani. (了 = kimekamilika)"},{"zh":"请问，去石头城的车在哪儿？服务员，我要一杯茶。","p":"Qǐngwèn, qù Shítouchéng de chē zài nǎr? Fúwùyuán, wǒ yào yì bēi chá.","en":"Excuse me, where is the bus to Stone Town? Waiter, I would like a cup of tea.","sw":"Samahani, basi la kwenda Mji Mkongwe liko wapi? Mhudumu, naomba kikombe kimoja cha chai."}],"grammar":[{"name":"不 的变调","pat":"不 + 第四声 → bú","en":"不 changes to bú only before a 4th tone (bú shì, bú qù); before the other tones it stays bù (bù hǎo).","sw":"不 hubadilika kuwa bú kabla ya toni ya nne tu (bú shì, bú qù); kabla ya toni nyingine hubaki bù (bù hǎo)."},{"name":"一 的变调","pat":"一 → yí / yì / yī","en":"一 is yí before a 4th tone, yì before tones 1–3, and yī when alone or in 第一.","sw":"一 ni yí kabla ya toni ya nne, yì kabla ya toni 1–3, na yī likisimama peke yake au katika 第一."},{"name":"数量词","pat":"数字 + 量词 + 名词","en":"Number + measure word + noun is compulsory: 三本书 (three books), never 三书. 'Two' before a measure word is 两.","sw":"Namba + kipimo + nomino ni lazima: 三本书 (vitabu vitatu), kamwe si 三书. 'Mbili' kabla ya kipimo ni 两."},{"name":"有没有","pat":"有没有……？ = 有……吗？","en":"有没有 already makes a question, so do not add 吗: say 有没有鱼？ or 有鱼吗？, never both.","sw":"有没有 tayari hufanya swali, kwa hiyo usiongeze 吗: sema 有没有鱼？ au 有鱼吗？, kamwe si vyote viwili."},{"name":"太……了；形容词 + 的","pat":"太 + 形容词 + 了 · 双音节形容词 + 的 + 名词","en":"太 … 了 wraps an adjective ('too expensive'); a two-syllable adjective before a noun needs 的: 新鲜的鱼.","sw":"太 … 了 huzunguka kivumishi ('ghali mno'); kivumishi cha silabi mbili kabla ya nomino kinahitaji 的: 新鲜的鱼."},{"name":"比较句","pat":"A 比 B + 形容词（+ 一点儿 / 得多）· A 没有 B + 形容词","en":"Comparison: A 比 B + adjective, then 一点儿 (a bit) or 得多 (much); never 很. Negative: A 没有 B 贵 (A is not as expensive as B).","sw":"Ulinganisho: A 比 B + kivumishi, kisha 一点儿 (kidogo) au 得多 (sana); kamwe si 很. Kukanusha: A 没有 B 贵 (A si ghali kama B)."},{"name":"动词 + 了","pat":"动词 + 了 · 没 + 动词","en":"了 after a verb = the action is finished (bought three fish); the negative is 没 + verb with NO 了.","sw":"了 baada ya kitenzi = kitendo kimekwisha (alinunua samaki watatu); kukanusha ni 没 + kitenzi bila 了."},{"name":"是 / 在 / 喜欢 不加 了","pat":"是 · 在 · 喜欢（不加 了）","en":"是, 在 and 喜欢 never take 了: 我是学生, not 我是了学生.","sw":"是, 在 na 喜欢 havichukui 了: 我是学生, si 我是了学生."},{"name":"因为……所以……；先……然后……最后……","pat":"因为……，所以…… · 先……然后……最后……","en":"因为 and 所以 are used together (because … so …); 先 / 然后 / 最后 give the order of events in a story.","sw":"因为 na 所以 hutumika pamoja (kwa sababu … kwa hiyo …); 先 / 然后 / 最后 hupanga mfuatano wa matukio katika hadithi."},{"name":"看海报；到","pat":"什么 · 什么时候 · 在哪儿 · 多少钱 · A 到 B","en":"Read a poster for four facts: what, when, where, price; 到 between two times means 'until'.","sw":"Soma bango kwa mambo manne: nini, lini, wapi, bei gani; 到 kati ya nyakati mbili maana yake 'hadi'."}],"mistakes":[["不好 bú hǎo","不好 bù hǎo","Saying bú before every tone (*bú hǎo) or always reading 一 as yī. Only 4th tones change 不 to bú; 一 is yí before a 4th tone, yì before the others.","Kusema bú kabla ya kila toni, au kusoma 一 kama yī kila mara. Toni ya nne pekee hubadilisha 不 kuwa bú; 一 ni yí kabla ya toni ya nne, yì kabla ya nyingine."],["三书；三个鱼","三本书；三条鱼","Leaving out the measure word or using 个 for everything (*三书, *三个鱼). Learn 本 (books), 张 (paper/tickets), 条 (fish), 杯 (cups), 件 (clothes), 双 (pairs).","Kuacha kipimo au kutumia 个 kwa kila kitu. Jifunze 本 (vitabu), 张 (karatasi/tiketi), 条 (samaki), 杯 (vikombe), 件 (nguo), 双 (jozi)."],["他比我很高","他比我高 / 他比我高一点儿 / 他比我高得多","Adding 很 in a comparison (*他比我很高). Say 他比我高 or 他比我高一点儿 / 高得多.","Kuongeza 很 katika ulinganisho. Sema 他比我高 au 他比我高一点儿 / 高得多."],["我是了学生；我没买了","我是学生；我没买","Putting 了 after 是 or after a negative (*我是了学生, *我没买了). 是 never takes 了; 没 already means 'did not', so 了 disappears.","Kuweka 了 baada ya 是 au baada ya kukanusha. 是 kamwe haichukui 了; 没 tayari ina maana ya 'sikufanya', kwa hiyo 了 hupotea."],["十千；二千","一万；两千","Translating 'ten thousand' as 十千. Chinese counts in 万: 一万 = 10,000, 两万五千 = 25,000; and 'two thousand' is 两千, not 二千.","Kutafsiri 'elfu kumi' kama 十千. Kichina huhesabu kwa 万: 一万 = 10,000, 两万五千 = 25,000; na 'elfu mbili' ni 两千, si 二千."]]},{"form":4,"groups":[{"zh":"了、过、着","en":"Aspect and state words","sw":"Maneno ya hali ya kitendo (了, 过, 着)","words":[{"h":"过","p":"guo","en":"(have done before: experience)","sw":"(umewahi kufanya: uzoefu)"},{"h":"着","p":"zhe","en":"(ongoing state)","sw":"(hali inayoendelea)"},{"h":"正在","p":"zhèngzài","en":"in the middle of (doing)","sw":"katikati ya kufanya (-na-)"},{"h":"已经","p":"yǐjing","en":"already","sw":"tayari"},{"h":"还没","p":"hái méi","en":"not yet","sw":"bado (sija-)"},{"h":"次","p":"cì","en":"(number of) times","sw":"mara"},{"h":"开","p":"kāi","en":"to open / turn on","sw":"kufungua / kuwasha"},{"h":"关","p":"guān","en":"to close / turn off","sw":"kufunga / kuzima"},{"h":"站","p":"zhàn","en":"to stand","sw":"kusimama"},{"h":"戴","p":"dài","en":"to wear (hat, glasses)","sw":"kuvaa (kofia, miwani)"}]},{"zh":"天气与季节","en":"Weather and seasons","sw":"Hali ya hewa na misimu","words":[{"h":"天气","p":"tiānqì","en":"weather","sw":"hali ya hewa"},{"h":"热","p":"rè","en":"hot","sw":"joto"},{"h":"冷","p":"lěng","en":"cold","sw":"baridi"},{"h":"下雨","p":"xià yǔ","en":"to rain","sw":"kunyesha mvua"},{"h":"刮风","p":"guā fēng","en":"windy","sw":"upepo kuvuma"},{"h":"晴天","p":"qíngtiān","en":"sunny day","sw":"siku ya jua"},{"h":"雨季","p":"yǔjì","en":"rainy season","sw":"msimu wa mvua"},{"h":"夏天","p":"xiàtiān","en":"summer","sw":"kiangazi"},{"h":"冬天","p":"dōngtiān","en":"winter","sw":"majira ya baridi"},{"h":"度","p":"dù","en":"degree (temperature)","sw":"nyuzi (joto)"},{"h":"带","p":"dài","en":"to bring","sw":"kuleta / kubeba"},{"h":"伞","p":"sǎn","en":"umbrella","sw":"mwavuli"}]},{"zh":"健康与建议","en":"Health and advice","sw":"Afya na ushauri","words":[{"h":"感冒","p":"gǎnmào","en":"to have a cold","sw":"kuwa na mafua"},{"h":"咳嗽","p":"késou","en":"to cough","sw":"kukohoa"},{"h":"疼","p":"téng","en":"to hurt / ache","sw":"kuuma"},{"h":"休息","p":"xiūxi","en":"to rest","sw":"kupumzika"},{"h":"应该","p":"yīnggāi","en":"should","sw":"inapaswa"},{"h":"别","p":"bié","en":"don't","sw":"usi- (usifanye)"},{"h":"可能","p":"kěnéng","en":"maybe / possibly","sw":"huenda / labda"},{"h":"会","p":"huì","en":"will (likely to)","sw":"-ta- (huenda itakuwa)"}]},{"zh":"爱好、工作与打算","en":"Hobbies, work and plans","sw":"Burudani, kazi na mipango","words":[{"h":"爱好","p":"àihào","en":"hobby","sw":"burudani / hobi"},{"h":"唱歌","p":"chàng gē","en":"to sing","sw":"kuimba"},{"h":"踢足球","p":"tī zúqiú","en":"to play football","sw":"kucheza mpira wa miguu"},{"h":"游泳","p":"yóuyǒng","en":"to swim","sw":"kuogelea"},{"h":"旅游","p":"lǚyóu","en":"to travel (for pleasure)","sw":"kutalii"},{"h":"电影","p":"diànyǐng","en":"film","sw":"filamu"},{"h":"打算","p":"dǎsuàn","en":"to plan","sw":"kupanga / kukusudia"},{"h":"希望","p":"xīwàng","en":"to hope","sw":"kutumaini"},{"h":"将来","p":"jiānglái","en":"the future","sw":"siku zijazo"},{"h":"大学","p":"dàxué","en":"university","sw":"chuo kikuu"},{"h":"护士","p":"hùshi","en":"nurse","sw":"muuguzi"},{"h":"导游","p":"dǎoyóu","en":"tour guide","sw":"mwongoza watalii"},{"h":"经常","p":"jīngcháng","en":"often","sw":"mara nyingi"},{"h":"有时候","p":"yǒu shíhou","en":"sometimes","sw":"wakati mwingine"},{"h":"感兴趣","p":"gǎn xìngqù","en":"to be interested (对 … 感兴趣)","sw":"kupendezwa na (对 … 感兴趣)"}]},{"zh":"出行与问路","en":"Travel and directions","sw":"Usafiri na kuuliza njia","words":[{"h":"怎么走","p":"zěnme zǒu","en":"how to get there","sw":"njia ya kufika (nitafikaje)"},{"h":"出租车","p":"chūzūchē","en":"taxi","sw":"teksi"},{"h":"飞机","p":"fēijī","en":"plane","sw":"ndege"},{"h":"船","p":"chuán","en":"boat / ferry","sw":"boti / meli"},{"h":"自行车","p":"zìxíngchē","en":"bicycle","sw":"baiskeli"},{"h":"机场","p":"jīchǎng","en":"airport","sw":"uwanja wa ndege"},{"h":"码头","p":"mǎtóu","en":"ferry port","sw":"bandari"},{"h":"红绿灯","p":"hónglǜdēng","en":"traffic lights","sw":"taa za barabarani"},{"h":"附近","p":"fùjìn","en":"nearby","sw":"karibu na"},{"h":"公里","p":"gōnglǐ","en":"kilometre","sw":"kilomita"},{"h":"需要","p":"xūyào","en":"to need / take (time)","sw":"kuhitaji / kuchukua (muda)"},{"h":"大概","p":"dàgài","en":"about / roughly","sw":"takriban"},{"h":"迷路","p":"mílù","en":"to get lost","sw":"kupotea njia"},{"h":"地图","p":"dìtú","en":"map","sw":"ramani"}]},{"zh":"翻译与口译","en":"Translating and interpreting","sw":"Kutafsiri na kukalimani","words":[{"h":"翻译","p":"fānyì","en":"to translate / translator","sw":"kutafsiri / mtafsiri"},{"h":"意思","p":"yìsi","en":"meaning","sw":"maana"},{"h":"句子","p":"jùzi","en":"sentence","sw":"sentensi"},{"h":"词","p":"cí","en":"word","sw":"neno"},{"h":"检查","p":"jiǎnchá","en":"to check","sw":"kukagua"},{"h":"游客","p":"yóukè","en":"tourist","sw":"mtalii"},{"h":"当地人","p":"dāngdìrén","en":"local person","sw":"mwenyeji"},{"h":"英语","p":"Yīngyǔ","en":"English","sw":"Kiingereza"},{"h":"斯瓦希里语","p":"Sīwǎxīlǐyǔ","en":"Swahili","sw":"Kiswahili"}]},{"zh":"便条、短信与通知","en":"Notes, messages and notices","sw":"Vijibarua, jumbe na matangazo","words":[{"h":"便条","p":"biàntiáo","en":"note","sw":"kijibarua"},{"h":"通知","p":"tōngzhī","en":"notice","sw":"tangazo"},{"h":"请假","p":"qǐngjià","en":"to ask for leave","sw":"kuomba ruhusa (kutokuwepo)"},{"h":"参加","p":"cānjiā","en":"to take part","sw":"kushiriki"},{"h":"会议","p":"huìyì","en":"meeting","sw":"mkutano"},{"h":"邀请","p":"yāoqǐng","en":"to invite","sw":"kualika"},{"h":"祝","p":"zhù","en":"to wish (someone)","sw":"kumtakia (mtu)"},{"h":"身体健康","p":"shēntǐ jiànkāng","en":"good health","sw":"afya njema"},{"h":"生日快乐","p":"shēngrì kuàilè","en":"happy birthday","sw":"heri ya siku ya kuzaliwa"},{"h":"如果","p":"rúguǒ","en":"if","sw":"kama / ikiwa"}]},{"zh":"阅读与考试","en":"Reading and the exam","sw":"Kusoma na mtihani","words":[{"h":"短文","p":"duǎnwén","en":"short text","sw":"kifungu kifupi"},{"h":"根据","p":"gēnjù","en":"according to","sw":"kwa mujibu wa"},{"h":"正确","p":"zhèngquè","en":"correct","sw":"sahihi"},{"h":"为什么","p":"wèishénme","en":"why","sw":"kwa nini"},{"h":"觉得","p":"juéde","en":"to think / feel","sw":"kuona / kuhisi"},{"h":"环境","p":"huánjìng","en":"environment","sw":"mazingira"},{"h":"干净","p":"gānjìng","en":"clean","sw":"safi"},{"h":"模拟考试","p":"mónǐ kǎoshì","en":"mock exam","sw":"mtihani wa majaribio"},{"h":"错题","p":"cuò tí","en":"wrong items","sw":"maswali uliyokosea"},{"h":"努力","p":"nǔlì","en":"to work hard","sw":"kujitahidi"},{"h":"加油","p":"jiāyóu","en":"keep going!","sw":"kaza buti! / endelea!"}]}],"patterns":[{"zh":"我已经做了作业。我去过石头城两次。门开着。","p":"Wǒ yǐjing zuò le zuòyè. Wǒ qù guo Shítouchéng liǎng cì. Mén kāi zhe.","en":"I have done my homework (了 = finished). I have been to Stone Town twice (过 = experience). The door is open (着 = state).","sw":"Nimeshafanya kazi yangu ya nyumbani (了 = imekwisha). Nimewahi kwenda Mji Mkongwe mara mbili (过 = uzoefu). Mlango uko wazi (着 = hali)."},{"zh":"我正在写作业。我还没吃饭。","p":"Wǒ zhèngzài xiě zuòyè. Wǒ hái méi chī fàn.","en":"I am doing homework right now. I have not eaten yet. (没 removes 了)","sw":"Ninafanya kazi ya nyumbani sasa hivi. Bado sijala. (没 huondoa 了)"},{"zh":"今天很热，三十二度。明天可能会下雨。","p":"Jīntiān hěn rè, sānshí'èr dù. Míngtiān kěnéng huì xià yǔ.","en":"It is hot today, 32 degrees. Tomorrow it may rain. (会 = will / likely)","sw":"Leo kuna joto, nyuzi 32. Huenda kesho mvua ikanyesha. (会 = itakuwa / inawezekana)"},{"zh":"你感冒了，应该多休息，别喝冷水。","p":"Nǐ gǎnmào le, yīnggāi duō xiūxi, bié hē lěng shuǐ.","en":"You have a cold; you should rest more and not drink cold water.","sw":"Una mafua; unapaswa kupumzika zaidi na usinywe maji baridi."},{"zh":"我对汉语很感兴趣。我的爱好是踢足球。","p":"Wǒ duì Hànyǔ hěn gǎn xìngqù. Wǒ de àihào shì tī zúqiú.","en":"I am very interested in Chinese. My hobby is football. (对 goes before the topic)","sw":"Ninapendezwa sana na Kichina. Burudani yangu ni mpira wa miguu. (对 huja kabla ya mada)"},{"zh":"我打算上大学，将来做导游。我希望去中国旅游。","p":"Wǒ dǎsuàn shàng dàxué, jiānglái zuò dǎoyóu. Wǒ xīwàng qù Zhōngguó lǚyóu.","en":"I plan to go to university and be a tour guide in future. I hope to travel to China.","sw":"Ninapanga kwenda chuo kikuu na baadaye kuwa mwongoza watalii. Natumaini kutalii China."},{"zh":"请问，去码头怎么走？——往前走到红绿灯，往左拐。","p":"Qǐngwèn, qù mǎtóu zěnme zǒu? — Wǎng qián zǒu dào hónglǜdēng, wǎng zuǒ guǎi.","en":"Excuse me, how do I get to the port? — Go straight to the traffic lights and turn left.","sw":"Samahani, nitafikaje bandarini? — Nenda moja kwa moja hadi taa za barabarani, kisha pinda kushoto."},{"zh":"我们坐船去，大概两个小时。机场离石头城有多远？","p":"Wǒmen zuò chuán qù, dàgài liǎng gè xiǎoshí. Jīchǎng lí Shítouchéng yǒu duō yuǎn?","en":"We go by ferry, about two hours. How far is the airport from Stone Town? (坐 for bus/boat/plane, 骑 for bicycle)","sw":"Tunaenda kwa boti, takriban muda wa saa mbili. Uwanja wa ndege uko umbali gani kutoka Mji Mkongwe? (坐 kwa basi/boti/ndege, 骑 kwa baiskeli)"},{"zh":"她问你多少钱。他说三千先令。","p":"Tā wèn nǐ duōshao qián. Tā shuō sān qiān xiānlìng.","en":"She asks how much. He says 3,000 shillings. (how to interpret between two people)","sw":"Anauliza ni bei gani. Anasema shilingi 3,000. (jinsi ya kukalimani kati ya watu wawili)"},{"zh":"张老师：我今天发烧了，想请假一天。谢谢！——阿里 9月20日","p":"Zhāng lǎoshī: Wǒ jīntiān fāshāo le, xiǎng qǐngjià yì tiān. Xièxie! — Ālǐ 9 yuè 20 rì","en":"A note: addressee + colon, reason + request, thanks, name and date at the end.","sw":"Kijibarua: jina la unayemwandikia + nukta mbili, sababu + ombi, shukrani, jina na tarehe mwishoni."},{"zh":"如果明天下雨，活动就在教室。祝你生日快乐！","p":"Rúguǒ míngtiān xià yǔ, huódòng jiù zài jiàoshì. Zhù nǐ shēngrì kuàilè!","en":"If it rains tomorrow, the event is in the classroom. Happy birthday! (祝 opens a wish)","sw":"Kesho ikinyesha mvua, tukio litafanyika darasani. Heri ya siku ya kuzaliwa! (祝 hufungua matakwa mema)"},{"zh":"根据短文，下面哪个是正确的？为什么……？","p":"Gēnjù duǎnwén, xiàmiàn nǎge shì zhèngquè de? Wèishénme …?","en":"According to the text, which is correct? Why …? (the three exam question types: detail, reason, main idea)","sw":"Kwa mujibu wa kifungu, lipi ni sahihi? Kwa nini …? (aina tatu za maswali ya mtihani: undani, sababu, wazo kuu)"}],"grammar":[{"name":"了、过、着","pat":"V + 了 / V + 过 / V + 着","en":"了 marks a finished action, 过 an experience ('have ever'), 着 a continuing state (the door IS open).","sw":"了 huonyesha kitendo kilichokwisha, 过 uzoefu ('umewahi'), 着 hali inayoendelea (mlango UKO wazi)."},{"name":"否定：没","pat":"没 + V · 没 + V + 过","en":"Negative of 了 is 没 + verb with 了 dropped; negative of 过 keeps 过: 没去过.","sw":"Kukanusha 了 ni 没 + kitenzi, 了 huondolewa; kukanusha 过 hubaki na 过: 没去过."},{"name":"正在 与 着","pat":"正在 + V · V + 着","en":"正在 is for an action happening now; 着 is for a state that continues (he is wearing a hat).","sw":"正在 ni kwa kitendo kinachotokea sasa; 着 ni kwa hali inayoendelea (amevaa kofia)."},{"name":"很 + 形容词；别 + 动词","pat":"很 + 形容词 · 别 + 动词","en":"Adjectives take 很, never 是; 别 (don't) is followed by a verb, not an adjective.","sw":"Vivumishi huchukua 很, kamwe si 是; 别 (usi-) hufuatwa na kitenzi, si kivumishi."},{"name":"应该、可能、会","pat":"应该 + V · 可能会 + V","en":"可能 and 会 can be used together for a forecast: it may (可能) well (会) rain tomorrow.","sw":"应该 = inapaswa, 可能 = labda/huenda, 会 = itakuwa (uwezekano). 可能 na 会 vinaweza kutumika pamoja kwa utabiri: huenda (可能) kesho mvua ikanyesha (会)."},{"name":"对……感兴趣；打算 / 希望","pat":"对 + 事物 + 感兴趣 · 打算 / 希望 + 动词","en":"对 comes before the thing you are interested in; 打算 (plan) and 希望 (hope) are followed by a verb.","sw":"对 huja kabla ya kitu unachopendezwa nacho; 打算 (kupanga) na 希望 (kutumaini) hufuatwa na kitenzi."},{"name":"离；怎么走 / 怎么去","pat":"A 离 B + 远 / 近 / 有多远 · 怎么走 · 怎么去","en":"A 离 B measures distance; 怎么走 asks for the route, 怎么去 asks for the means of transport.","sw":"A 离 B hupima umbali; 怎么走 huuliza njia, 怎么去 huuliza usafiri utakaotumia."},{"name":"坐 与 骑","pat":"坐 + 公共汽车 / 船 / 飞机 / 出租车 · 骑 + 自行车","en":"Use 坐 (sit) for buses, boats, planes and taxis; 骑 (ride astride) for bicycles.","sw":"Tumia 坐 (kukaa) kwa basi, boti, ndege na teksi; 骑 (kupanda kwa kutandaza miguu) kwa baiskeli."},{"name":"如果……，就……","pat":"如果 + 条件，(主语) + 就 + 动词","en":"如果 (if) opens the condition; 就 goes before the verb of the result, after the subject.","sw":"如果 (kama/ikiwa) hufungua sharti; 就 huwekwa kabla ya kitenzi cha matokeo, baada ya mtenda."},{"name":"翻译四步","pat":"①意思 ②语序 ③量词 / 了 / 的 ④声调","en":"Translation check: meaning, word order (time and place BEFORE the verb), measure words and particles, tones.","sw":"Hatua nne za kukagua tafsiri: maana, mpangilio wa maneno (wakati na mahali KABLA ya kitenzi), vipimo na viambishi (了, 的), toni."}],"mistakes":[["昨天我去过市场","昨天我去了市场","Using 过 for a specific past event (*昨天我去过市场). Yesterday's action is 了: 昨天我去了市场; 过 is only for 'have ever'.","Kutumia 过 kwa tukio maalum la zamani. Kitendo cha jana ni 了: 昨天我去了市场; 过 ni kwa 'umewahi' tu."],["我没吃了","我没吃饭","Keeping 了 after 没 (*我没吃了). 没 already makes the past negative: 我没吃饭.","Kubakiza 了 baada ya 没. 没 tayari hufanya ukanushaji wa wakati uliopita: 我没吃饭."],["今天是很热；别冷","今天很热；别喝冷水","Putting 是 before an adjective or 别 before an adjective (*今天是很热, *别冷). Say 今天很热; 别 needs a verb: 别喝冷水.","Kuweka 是 kabla ya kivumishi au 别 kabla ya kivumishi. Sema 今天很热; 别 inahitaji kitenzi: 别喝冷水."],["我感兴趣汉语","我对汉语感兴趣","Putting the topic before 对 (*我感兴趣汉语). The order is 我对汉语感兴趣.","Kuweka mada kabla ya 对 (au kuiacha 对). Mpangilio ni 我对汉语感兴趣."],["三鱼","三条鱼","Word-for-word translation from English or Swahili (time after the verb, missing measure words, 三鱼). Use the four-step check: meaning, order, measure words/了/的, tones.","Kutafsiri neno kwa neno kutoka Kiingereza au Kiswahili (wakati baada ya kitenzi, kukosa vipimo, 三鱼). Tumia ukaguzi wa hatua nne: maana, mpangilio, vipimo/了/的, toni."]]}];
