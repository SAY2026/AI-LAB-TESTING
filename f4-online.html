var UNITS=[{"id":"F1U1","form":1,"zh":"拼音与声调","en":"Pinyin and the four tones","sw":"Pinyin na toni nne","keys":[{"zh":"四个声调：mā má mǎ mà（妈 麻 马 骂）","p":"","en":"Four tones: 1st high-flat, 2nd rising, 3rd dip, 4th falling. A different tone is a different word: mum / hemp / horse / scold.","sw":"Toni nne: ya 1 juu na tambarare, ya 2 inapanda, ya 3 inashuka kisha kupanda, ya 4 inashuka. Toni tofauti ni neno tofauti: mama / katani / farasi / kukemea."},{"zh":"轻声：吗 ma、谢谢 xièxie","p":"","en":"Neutral tone: the syllable is short and light and is written with NO tone mark.","sw":"Toni hafifu: silabi ni fupi na nyepesi, na huandikwa BILA alama ya toni."},{"zh":"符号位置：a > o > e；i 和 u 一起时写在后面的（liú、guì）","p":"","en":"Tone-mark position: on a, else o, else e; when i and u are together, on the second one.","sw":"Mahali pa alama ya toni: juu ya a; kama hakuna a, juu ya o; kisha e; i na u zikiwa pamoja, juu ya herufi ya pili."},{"zh":"两个第三声连读：你好 nǐ hǎo 说成 ní hǎo","p":"","en":"Two 3rd tones in a row: say the first one as a 2nd tone, but write the original marks.","sw":"Toni mbili za 3 zikifuatana: tamka ya kwanza kama toni ya 2, lakini andika alama za asili."}],"items":[{"u":0,"q":"Which syllable is 2nd tone (rising)?","o":["mā","má","mǎ","mà"],"a":1,"q_zh":"哪个音节是第二声（升调）？","q_sw":"Silabi ipi ina toni ya pili (inayopanda)?"},{"u":0,"q":"Choose the correct pinyin: 谢谢","o":["xiéxié","xièxie","xiěxiě","xiēxiē"],"a":1,"q_zh":"选出正确的拼音：谢谢","q_sw":"Chagua pinyin sahihi: 谢谢"},{"u":0,"q":"In the syllable 'hao', the tone mark goes on…","o":["h","a","o","no mark"],"a":1,"q_zh":"在音节 hao 中，声调符号标在……","q_sw":"Katika silabi 'hao', alama ya toni huwekwa juu ya…"},{"u":0,"q":"In 你好 (nǐ hǎo) the first syllable is spoken with a rising tone, like ní.","q_zh":"在“你好 (nǐ hǎo)”中，第一个音节读成升调，像 ní。","q_sw":"Katika 你好 (nǐ hǎo) silabi ya kwanza hutamkwa kwa toni inayopanda, kama ní.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F1U2","form":1,"zh":"问候与自我介绍","en":"Greetings and introducing yourself","sw":"Salamu na kujitambulisha","keys":[{"zh":"我叫阿米娜。","p":"Wǒ jiào Āmǐnà.","en":"My name is Amina. (叫 = to be called; never say 我是叫)","sw":"Jina langu ni Amina. (叫 = kuitwa; usiseme kamwe 我是叫)"},{"zh":"你叫什么名字？","p":"Nǐ jiào shénme míngzi?","en":"What is your name? (什么 = what; no 吗 is needed)","sw":"Jina lako ni nani? (什么 = nini; hakuna haja ya 吗)"},{"zh":"我是坦桑尼亚人。","p":"Wǒ shì Tǎnsāngníyà rén.","en":"I am Tanzanian: country name + 人 (person).","sw":"Mimi ni Mtanzania: jina la nchi + 人 (mtu)."},{"zh":"你是老师吗？——不，我是学生。","p":"Nǐ shì lǎoshī ma? — Bù, wǒ shì xuésheng.","en":"Are you a teacher? — No, I am a student.","sw":"Wewe ni mwalimu? — Hapana, mimi ni mwanafunzi."},{"zh":"你好 / 谢谢 / 不谢 / 再见","p":"nǐ hǎo / xièxie / bú xiè / zàijiàn","en":"hello / thank you / you're welcome / goodbye.","sw":"habari (salamu) / asante / karibu (si kitu) / kwaheri."}],"items":[{"u":0,"q":"Choose the correct pinyin: 老师","o":["lǎoshī","lǎoshì","láoshī","lāoshí"],"a":0,"q_zh":"选出正确的拼音：老师","q_sw":"Chagua pinyin sahihi: 老师"},{"u":0,"q":"他是______人。（China）","o":["坦桑尼亚","中国","学生","老师"],"a":1,"q_zh":"他是______人。（提示：China）","q_sw":"他是______人。（Uchina）"},{"u":0,"q":"A: 你好！ B: ______","o":["再见","你好","谢谢","不谢"],"a":1},{"u":0,"q":"你叫什么名字吗？ is a correct question.","q_zh":"“你叫什么名字吗？”是正确的问句。","q_sw":"你叫什么名字吗？ ni swali sahihi.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F1U3","form":1,"zh":"数字、年龄与日期","en":"Numbers, age and dates","sw":"Namba, umri na tarehe","keys":[{"zh":"十一、二十、二十五、九十九","p":"shíyī, èrshí, èrshíwǔ, jiǔshíjiǔ","en":"11 = ten-one, 20 = two-ten, 25 = two-ten-five, 99 = nine-ten-nine.","sw":"11 = kumi-moja, 20 = mbili-kumi, 25 = mbili-kumi-tano, 99 = tisa-kumi-tisa."},{"zh":"你几岁？/ 你多大？——我十四岁。","p":"Nǐ jǐ suì? / Nǐ duō dà? — Wǒ shísì suì.","en":"How old are you? — I am 14. (几岁 for children, 多大 for anyone)","sw":"Una umri gani? — Nina miaka 14. (几岁 kwa watoto, 多大 kwa mtu yeyote)"},{"zh":"今天几月几号？——今天九月二十号。","p":"Jīntiān jǐ yuè jǐ hào? — Jīntiān jiǔ yuè èrshí hào.","en":"What is the date today? — 20 September: month first, then day.","sw":"Leo ni tarehe ngapi? — Tarehe 20 Septemba: mwezi kwanza, kisha siku."},{"zh":"星期一……星期六、星期日","p":"xīngqīyī … xīngqīliù, xīngqīrì","en":"Monday … Saturday, Sunday. There is no 星期七.","sw":"Jumatatu … Jumamosi, Jumapili. Hakuna 星期七."},{"zh":"年 → 月 → 日：2026年9月20日","p":"èr líng èr liù nián jiǔ yuè èrshí rì","en":"Year, then month, then day; read the year digit by digit.","sw":"Mwaka, kisha mwezi, kisha siku; soma mwaka tarakimu moja moja."}],"items":[{"u":0,"q":"三十七 = ?","o":["37","73","307","13"],"a":0},{"u":0,"q":"Sunday is…","o":["星期七","星期日","星期六","星期一"],"a":1,"q_zh":"英语 Sunday 用中文是……","q_sw":"Jumapili ni…"},{"u":0,"q":"他______岁？","o":["几","什么","哪","多"],"a":0},{"u":0,"q":"今天是星期一，昨天是星期日。","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F1U4","form":1,"zh":"我的学校","en":"My school","sw":"Shule yangu","keys":[{"zh":"这是……。那是……。","p":"Zhè shì … Nà shì …","en":"This is … / That is … (这 = near, 那 = far).","sw":"Hiki ni … / Kile ni … (这 = karibu, 那 = mbali)."},{"zh":"这是什么？——这是笔。","p":"Zhè shì shénme? — Zhè shì bǐ.","en":"What is this? — It is a pen.","sw":"Hiki ni nini? — Ni kalamu."},{"zh":"我们学校有二十个教室。","p":"Wǒmen xuéxiào yǒu èrshí gè jiàoshì.","en":"Our school has twenty classrooms. (有 = has / there is; 个 = measure word)","sw":"Shule yetu ina madarasa ishirini. (有 = kuwa na / kuna; 个 = neno la kipimo)"},{"zh":"老师的书、我的笔","p":"lǎoshī de shū, wǒ de bǐ","en":"的 shows possession: the teacher's book, my pen.","sw":"的 huonyesha umiliki: kitabu cha mwalimu, kalamu yangu."},{"zh":"请坐 / 请看 / 请听 / 请读 / 请写","p":"qǐng zuò / kàn / tīng / dú / xiě","en":"Please sit / look / listen / read aloud / write: the classroom instructions.","sw":"Tafadhali keti / tazama / sikiliza / soma kwa sauti / andika: maagizo ya darasani."}],"items":[{"u":0,"q":"Choose the characters: jiàoshì (classroom)","o":["教师","教室","叫是","教是"],"a":1,"q_zh":"选出汉字：jiàoshì（学生上课的房间）","q_sw":"Chagua herufi: jiàoshì (darasa)"},{"u":0,"q":"______是什么？——那是椅子。","o":["这","那","哪","什么"],"a":1},{"u":0,"q":"老师说：\"请______。\"（sit）","o":["看","坐","写","听"],"a":1,"q_zh":"老师说：\"请______。\"（提示：sit）","q_sw":"老师说：\"请______。\"（kukaa）"},{"u":0,"q":"黑板 means 'blackboard'.","q_zh":"“黑板”的意思是 blackboard（教室前面写字的板）。","q_sw":"黑板 maana yake ni 'ubao'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F1U5","form":1,"zh":"我的家人","en":"My family","sw":"Familia yangu","keys":[{"zh":"你家有几口人？——我家有六口人。","p":"Nǐ jiā yǒu jǐ kǒu rén? — Wǒ jiā yǒu liù kǒu rén.","en":"How many people are in your family? — Six. (family members are counted with 口)","sw":"Familia yako ina watu wangapi? — Sita. (wanafamilia huhesabiwa kwa 口)"},{"zh":"我有一个哥哥和两个妹妹。","p":"Wǒ yǒu yí gè gēge hé liǎng gè mèimei.","en":"I have one older brother and two younger sisters. (before a measure word 'two' is 两, not 二)","sw":"Nina kaka mkubwa mmoja na dada wadogo wawili. (kabla ya neno la kipimo 'mbili' ni 两, si 二)"},{"zh":"我没有弟弟。","p":"Wǒ méiyǒu dìdi.","en":"I do not have a younger brother. (有 is negated with 没, never 不)","sw":"Sina kaka mdogo. (有 hukanushwa kwa 没, kamwe si 不)"},{"zh":"你爸爸做什么工作？——他是司机。","p":"Nǐ bàba zuò shénme gōngzuò? — Tā shì sījī.","en":"What does your father do? — He is a driver.","sw":"Baba yako anafanya kazi gani? — Ni dereva."},{"zh":"哥哥 / 姐姐 = older, 弟弟 / 妹妹 = younger","p":"","en":"Chinese always says whether a brother or sister is older or younger.","sw":"Kichina husema daima kama kaka au dada ni mkubwa au mdogo."}],"items":[{"u":0,"q":"我家有四______人。","o":["个","口","本","岁"],"a":1},{"u":0,"q":"我______姐姐。（do not have）","o":["不有","没有","不是","没是"],"a":1,"q_zh":"我______姐姐。（提示：do not have）","q_sw":"我______姐姐。（sina）"},{"u":0,"q":"Choose the correct pinyin: 医生","o":["yīshēng","yìshēng","yīshèng","yíshēng"],"a":0,"q_zh":"选出正确的拼音：医生","q_sw":"Chagua pinyin sahihi: 医生"},{"u":0,"q":"妹妹 means 'older sister'.","q_zh":"“妹妹”的意思是 older sister（比自己大的姐妹）。","q_sw":"妹妹 maana yake ni 'dada mkubwa'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F1U6","form":1,"zh":"每天的活动","en":"Daily activities","sw":"Shughuli za kila siku","keys":[{"zh":"主语 + 时间 + 动词：我每天早上六点起床。","p":"Wǒ měi tiān zǎoshang liù diǎn qǐchuáng.","en":"Subject + time + verb: I get up at six every morning. The time goes BEFORE the verb.","sw":"Kiima + wakati + kitenzi: Ninaamka saa kumi na mbili kila asubuhi. Wakati huja KABLA ya kitenzi."},{"zh":"你晚上做什么？——我学习汉语。","p":"Nǐ wǎnshang zuò shénme? — Wǒ xuéxí Hànyǔ.","en":"What do you do in the evening? — I study Chinese.","sw":"Unafanya nini jioni? — Ninasoma Kichina."},{"zh":"我在学校上课。","p":"Wǒ zài xuéxiào shàngkè.","en":"I have class at school. (在 + place + verb)","sw":"Nina masomo shuleni. (在 + mahali + kitenzi)"},{"zh":"我和朋友打球。","p":"Wǒ hé péngyou dǎ qiú.","en":"I play ball with my friend. (和 = and / with)","sw":"Ninacheza mpira na rafiki yangu. (和 = na / pamoja na)"}],"items":[{"u":0,"q":"Choose the correct word order:","o":["我起床六点","我六点起床","六点起床我","起床我六点"],"a":1,"q_zh":"选出正确的语序：","q_sw":"Chagua mpangilio sahihi wa maneno:"},{"u":0,"q":"我______家吃饭。（at）","o":["是","在","有","和"],"a":1,"q_zh":"我______家吃饭。（提示：at）","q_sw":"我______家吃饭。（mahali: katika / nyumbani）"},{"u":0,"q":"早上我______茶。","o":["吃","喝","看","说"],"a":1},{"u":0,"q":"睡觉 means 'to sleep'.","q_zh":"“睡觉”的意思是 to sleep。","q_sw":"睡觉 maana yake ni 'kulala'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F1U7","form":1,"zh":"方位词：前边、后边","en":"Directional nouns: in front / behind","sw":"Maneno ya mahali: mbele / nyuma","keys":[{"zh":"A 在 B 的前边 / 后边 / 旁边。","p":"A zài B de qiánbian / hòubian / pángbiān.","en":"A is in front of / behind / beside B: reference point first, then 的 + direction word.","sw":"A iko mbele ya / nyuma ya / kando ya B: kitu cha kurejelea kwanza, kisha 的 + neno la mwelekeo."},{"zh":"书在桌子上。笔在书包里。","p":"Shū zài zhuōzi shang. Bǐ zài shūbāo li.","en":"The book is on the desk. The pen is in the bag. (noun + 上 = on; noun + 里 = in)","sw":"Kitabu kiko juu ya meza. Kalamu iko ndani ya mkoba. (nomino + 上 = juu ya; nomino + 里 = ndani ya)"},{"zh":"图书馆在哪儿？——在教室的旁边。","p":"Túshūguǎn zài nǎr? — Zài jiàoshì de pángbiān.","en":"Where is the library? — Beside the classroom. (哪儿 = where)","sw":"Maktaba iko wapi? — Kando ya darasa. (哪儿 = wapi)"},{"zh":"教室的前边有黑板。","p":"Jiàoshì de qiánbian yǒu hēibǎn.","en":"In front of the classroom there is a blackboard. (place + 有 = there is; thing + 在 = is at)","sw":"Mbele ya darasa kuna ubao. (mahali + 有 = kuna; kitu + 在 = kiko mahali)"}],"items":[{"u":0,"q":"老师在教室的______。（front）","o":["后边","前边","里","下"],"a":1,"q_zh":"老师在教室的______。（提示：front）","q_sw":"老师在教室的______。（mbele）"},{"u":0,"q":"厕所在______？","o":["哪","什么","哪儿","几"],"a":2},{"u":0,"q":"书______桌子上。","o":["是","在","有","的"],"a":1},{"u":0,"q":"旁边 means 'beside'.","q_zh":"“旁边”的意思是 beside。","q_sw":"旁边 maana yake ni 'kando ya'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F1U8","form":1,"zh":"和、但是 与课堂指令","en":"Conjunctions 和/但是 and classroom instructions","sw":"Viunganishi 和/但是 na maagizo ya darasani","keys":[{"zh":"我和哈桑都是学生。","p":"Wǒ hé Hāsāng dōu shì xuésheng.","en":"Hassan and I are both students. (和 joins nouns; 都 = all / both, before the verb)","sw":"Hassan na mimi sote ni wanafunzi. (和 huunganisha nomino; 都 = wote / sote, kabla ya kitenzi)"},{"zh":"汉语很难，但是我很喜欢。","p":"Hànyǔ hěn nán, dànshì wǒ hěn xǐhuan.","en":"Chinese is difficult, but I like it a lot. (但是 begins the second half)","sw":"Kichina ni kigumu, lakini ninakipenda sana. (但是 huanza sehemu ya pili)"},{"zh":"她是学生，我也是学生。","p":"Tā shì xuésheng, wǒ yě shì xuésheng.","en":"She is a student; I am also a student. (也 = also, before the verb)","sw":"Yeye ni mwanafunzi; mimi pia ni mwanafunzi. (也 = pia, kabla ya kitenzi)"},{"zh":"请先打开书，然后读。","p":"Qǐng xiān dǎkāi shū, ránhòu dú.","en":"First open the book, then read. (先 … 然后 … = first … then …)","sw":"Kwanza fungua kitabu, kisha soma. (先 … 然后 … = kwanza … kisha …)"},{"zh":"。，？！","p":"","en":"Chinese punctuation is full-width: 。ends a statement, ？ends a question, ！an exclamation, ，separates parts inside a sentence.","sw":"Alama za uandishi za Kichina ni za upana kamili: 。humaliza sentensi ya taarifa, ？humaliza swali, ！ni mshangao, ，hutenganisha sehemu ndani ya sentensi."}],"items":[{"u":0,"q":"我喜欢茶______水。","o":["但是","和","也","都"],"a":1},{"u":0,"q":"汉语很难，______我很喜欢。","o":["和","但是","然后","先"],"a":1},{"u":0,"q":"我们______是坦桑尼亚人。（all）","o":["也","和","都","很"],"a":2,"q_zh":"我们______是坦桑尼亚人。（提示：all）","q_sw":"我们______是坦桑尼亚人。（wote）"},{"u":0,"q":"和 can join two whole sentences, like English 'and'.","q_zh":"“和”可以像英语的 and 一样连接两个完整的句子。","q_sw":"和 inaweza kuunganisha sentensi mbili nzima, kama 'na' ya Kiingereza.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F2U1","form":2,"zh":"声调标注与轻声","en":"Marking tones; the neutral tone in words","sw":"Kuweka alama za toni; toni hafifu katika maneno","keys":[{"zh":"轻声不写声调：妈妈 māma、朋友 péngyou、什么 shénme","p":"","en":"Neutral-tone second syllable: light and short, written with NO tone mark.","sw":"Silabi ya pili yenye toni hafifu: nyepesi na fupi, huandikwa BILA alama ya toni."},{"zh":"两个第三声：你好 nǐ hǎo 说成 ní hǎo，很好 hěn hǎo 说成 hén hǎo","p":"","en":"Two 3rd tones in a row: say the first as a 2nd tone; still write the original marks.","sw":"Toni mbili za 3 zikifuatana: tamka ya kwanza kama toni ya 2; bado andika alama za asili."},{"zh":"iu 的符号写在 u 上（休息 xiūxi），ui 写在 i 上（对 duì）","p":"","en":"In 'iu' the mark goes on u; in 'ui' it goes on i: always on the second letter.","sw":"Katika 'iu' alama huwekwa juu ya u; katika 'ui' juu ya i: daima juu ya herufi ya pili."},{"zh":"认识 rènshi、漂亮 piàoliang、东西 dōngxi、时候 shíhou","p":"","en":"Four common neutral-tone words you must spell correctly in the exam.","sw":"Maneno manne ya kawaida yenye toni hafifu ambayo lazima uyaandike kwa usahihi katika mtihani."}],"items":[{"u":0,"q":"Which word has a neutral-tone second syllable?","o":["学校","东西","老师","汉语"],"a":1,"q_zh":"哪个词的第二个音节是轻声？","q_sw":"Neno lipi lina silabi ya pili yenye toni hafifu?"},{"u":0,"q":"Choose the correct pinyin: 认识","o":["rénshi","rènshí","rènshi","rēnshì"],"a":2,"q_zh":"选出正确的拼音：认识","q_sw":"Chagua pinyin sahihi: 认识"},{"u":0,"q":"很好 is spoken as…","o":["hěn hǎo (two full dips)","hén hǎo","hèn hǎo","hēn hǎo"],"a":1,"q_zh":"“很好”读作……","q_sw":"很好 hutamkwa kama…"},{"u":0,"q":"In 朋友 the second syllable is a neutral tone.","q_zh":"“朋友”的第二个音节是轻声。","q_sw":"Katika 朋友 silabi ya pili ni toni hafifu.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F2U2","form":2,"zh":"我的家","en":"My home","sw":"Nyumbani kwangu","keys":[{"zh":"我家有三个房间和一个客厅。","p":"Wǒ jiā yǒu sān gè fángjiān hé yí gè kètīng.","en":"My home has three rooms and a living room. (我家有 + what the home has)","sw":"Nyumbani kwangu kuna vyumba vitatu na sebule moja. (我家有 + kile nyumba ilicho nacho)"},{"zh":"电视在客厅里。手机在床上。","p":"Diànshì zài kètīng li. Shǒujī zài chuáng shang.","en":"The TV is in the living room. The phone is on the bed. (在 + place + 里 / 上)","sw":"Televisheni iko sebuleni. Simu iko juu ya kitanda. (在 + mahali + 里 / 上)"},{"zh":"谁在厨房？——妈妈在厨房做饭。","p":"Shéi zài chúfáng? — Māma zài chúfáng zuò fàn.","en":"Who is in the kitchen? — Mum is cooking in the kitchen.","sw":"Nani yuko jikoni? — Mama yuko jikoni anapika."},{"zh":"我的房间很干净。","p":"Wǒ de fángjiān hěn gānjìng.","en":"My room is clean: 很 + adjective, and NO 是.","sw":"Chumba changu ni safi: 很 + kivumishi, na HAKUNA 是."}],"items":[{"u":0,"q":"Choose the characters: chúfáng (kitchen)","o":["厨房","出房","厨方","楚房"],"a":0,"q_zh":"选出汉字：chúfáng（做饭的房间）","q_sw":"Chagua herufi: chúfáng (jiko)"},{"u":0,"q":"我的房间______干净。","o":["是","很","有","在"],"a":1},{"u":0,"q":"'milk' is…","o":["牛奶","鸡蛋","米饭","水果"],"a":0,"q_zh":"英语 milk 用中文是……","q_sw":"'maziwa' ni…"},{"u":0,"q":"客厅 means 'kitchen'.","q_zh":"“客厅”的意思是 kitchen（做饭的地方）。","q_sw":"客厅 maana yake ni 'jiko'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F2U3","form":2,"zh":"现在几点？","en":"Telling the time","sw":"Kusoma saa","keys":[{"zh":"现在几点？——现在八点二十分。","p":"Xiànzài jǐ diǎn? — Xiànzài bā diǎn èrshí fēn.","en":"What time is it now? — 8:20. (点 = o'clock, 分 = minute)","sw":"Sasa ni saa ngapi? — 8:20. (点 = saa kamili, 分 = dakika)"},{"zh":"两点半 · 三点一刻 · 差五分四点","p":"liǎng diǎn bàn · sān diǎn yí kè · chà wǔ fēn sì diǎn","en":"2:30 (半 = half) · 3:15 (刻 = quarter) · 3:55 (差 = 'to', minutes before the hour).","sw":"2:30 (半 = nusu) · 3:15 (刻 = robo) · 3:55 (差 = kasoro, dakika kabla ya saa kamili)."},{"zh":"两点，不是二点","p":"liǎng diǎn","en":"For 2 o'clock say 两点, never 二点.","sw":"Kwa saa 2 kamili sema 两点, kamwe 二点."},{"zh":"我们上午八点上课，下午两点下课。","p":"Wǒmen shàngwǔ bā diǎn shàngkè, xiàwǔ liǎng diǎn xiàkè.","en":"We start class at 8 a.m. and finish at 2 p.m. (time before the verb)","sw":"Tunaanza masomo saa mbili asubuhi (8:00) na kumaliza saa nane mchana (14:00). (wakati kabla ya kitenzi)"},{"zh":"分 = 钟点（八点十分），分钟 = 时长（十分钟）","p":"","en":"分 is clock minutes (8:10); 分钟 is how long something lasts (ten minutes).","sw":"分 ni dakika za saa (8:10); 分钟 ni muda kitu kinachochukua (dakika kumi)."}],"items":[{"u":0,"q":"2:30 is…","o":["二点三十","两点半","两点三十半","二点半"],"a":1,"q_zh":"2:30 是……","q_sw":"2:30 ni…"},{"u":0,"q":"9:15 is…","o":["九点一刻","九点半","九点一分","一刻九点"],"a":0,"q_zh":"9:15 是……","q_sw":"9:15 ni…"},{"u":0,"q":"一节课四十______。","o":["分","分钟","点","小时"],"a":1},{"u":0,"q":"差五分八点 = 7:55.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F2U4","form":2,"zh":"一天的生活与先后顺序","en":"Daily routine and sequencing events","sw":"Ratiba ya siku na kupanga matukio kwa mfuatano","keys":[{"zh":"先……，然后……，再……，最后……。","p":"xiān … ránhòu … zài … zuìhòu …","en":"First …, then …, then …, finally …: the order words for telling a routine.","sw":"Kwanza …, kisha …, halafu …, mwishowe …: maneno ya mfuatano ya kusimulia ratiba."},{"zh":"放学以后我帮妈妈做饭。","p":"Fàngxué yǐhòu wǒ bāng māma zuò fàn.","en":"After school I help mum cook. (event + 以后 = after the event)","sw":"Baada ya shule ninamsaidia mama kupika. (tukio + 以后 = baada ya tukio)"},{"zh":"睡觉以前我做作业。","p":"Shuìjiào yǐqián wǒ zuò zuòyè.","en":"Before sleeping I do homework. (event + 以前 = before the event)","sw":"Kabla ya kulala ninafanya kazi ya nyumbani. (tukio + 以前 = kabla ya tukio)"},{"zh":"我每天学习一个小时汉语。","p":"Wǒ měi tiān xuéxí yí gè xiǎoshí Hànyǔ.","en":"I study Chinese for one hour every day. (duration comes AFTER the verb)","sw":"Ninasoma Kichina kwa saa moja kila siku. (muda huja BAADA ya kitenzi)"},{"zh":"然后 连接动作，以后 跟在事情后：然后吃饭 / 吃饭以后","p":"","en":"然后 links the next action in a list; 以后 attaches to the end of an event.","sw":"然后 huunganisha tendo linalofuata katika orodha; 以后 hufuata mwisho wa tukio."}],"items":[{"u":0,"q":"我先起床，______刷牙。","o":["最后","然后","以前","以后"],"a":1},{"u":0,"q":"晚饭______我看电视。（after）","o":["以后","以前","先","再"],"a":0,"q_zh":"晚饭______我看电视。（提示：after）","q_sw":"晚饭______我看电视。（baada ya）"},{"u":0,"q":"'breakfast' is…","o":["早饭","午饭","晚饭","米饭"],"a":0,"q_zh":"英语 breakfast 用中文是……","q_sw":"'kifungua kinywa' ni…"},{"u":0,"q":"最后 means 'first'.","q_zh":"“最后”的意思是 first（第一个）。","q_sw":"最后 maana yake ni 'kwanza'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F2U5","form":2,"zh":"介词：在、从、往","en":"Prepositions 在, 从, 往","sw":"Vihusishi 在, 从, 往","keys":[{"zh":"我在家做作业。","p":"Wǒ zài jiā zuò zuòyè.","en":"I do homework at home. (在 = at, where you are)","sw":"Ninafanya kazi ya nyumbani nyumbani. (在 = mahali ulipo)"},{"zh":"他从中国来。我从学校回家。","p":"Tā cóng Zhōngguó lái. Wǒ cóng xuéxiào huí jiā.","en":"He comes from China. I go home from school. (从 = from, placed before the verb)","sw":"Anatoka China. Ninarudi nyumbani kutoka shuleni. (从 = kutoka, huwekwa kabla ya kitenzi)"},{"zh":"往前走，往右拐。","p":"Wǎng qián zǒu, wǎng yòu guǎi.","en":"Go straight ahead, turn right. (往 + a direction, never a person)","sw":"Nenda moja kwa moja, pinda kulia. (往 + mwelekeo, kamwe si mtu)"},{"zh":"从我家到学校走十分钟。","p":"Cóng wǒ jiā dào xuéxiào zǒu shí fēnzhōng.","en":"From my home to school is a ten-minute walk. (从 A 到 B)","sw":"Kutoka nyumbani kwangu hadi shuleni ni mwendo wa dakika kumi. (从 A 到 B)"},{"zh":"我家离海边很近。","p":"Wǒ jiā lí hǎibiān hěn jìn.","en":"My home is near the seaside. (A 离 B + 近 / 远 for distance)","sw":"Nyumbani kwangu ni karibu na pwani. (A 离 B + 近 / 远 kwa umbali)"}],"items":[{"u":0,"q":"我______家吃午饭。","o":["从","在","往","到"],"a":1},{"u":0,"q":"她______坦桑尼亚来。","o":["在","往","从","离"],"a":2},{"u":0,"q":"______左拐，商店在前边。","o":["在","从","往","到"],"a":2},{"u":0,"q":"往 can be followed by a person, for example 往老师.","q_zh":"“往”后面可以跟人，比如“往老师”。","q_sw":"往 inaweza kufuatwa na mtu, kwa mfano 往老师.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F2U6","form":2,"zh":"请求与许可","en":"Requests and asking permission","sw":"Maombi na kuomba ruhusa","keys":[{"zh":"老师，我可以出去吗？——可以。/ 不行。","p":"Lǎoshī, wǒ kěyǐ chūqu ma? — Kěyǐ. / Bùxíng.","en":"Teacher, may I go out? — Yes. / No. (可以 = may; 吗 at the very end)","sw":"Mwalimu, naweza kutoka? — Ndiyo. / Hapana. (可以 = ruhusa; 吗 mwishoni kabisa)"},{"zh":"你能不能借我一支笔？","p":"Nǐ néng bu néng jiè wǒ yì zhī bǐ?","en":"Could you lend me a pen? (能不能 = can you or not)","sw":"Unaweza kuniazima kalamu? (能不能 = unaweza au huwezi)"},{"zh":"请等一下。请帮我一下。","p":"Qǐng děng yíxià. Qǐng bāng wǒ yíxià.","en":"Please wait a moment. Please help me. (请 + verb + 一下 = polite and brief)","sw":"Tafadhali subiri kidogo. Tafadhali nisaidie. (请 + kitenzi + 一下 = kwa adabu na kwa muda mfupi)"},{"zh":"对不起，我来晚了。——没关系。","p":"Duìbuqǐ, wǒ lái wǎn le. — Méi guānxi.","en":"Sorry, I am late. — Never mind.","sw":"Samahani, nimechelewa. — Haidhuru."},{"zh":"回答 可以……吗？用 可以 / 不可以 / 不行，不用 是","p":"","en":"Answer a 可以…吗 question by repeating 可以 or saying 不行, never with 是.","sw":"Jibu swali la 可以…吗 kwa kurudia 可以 au kusema 不行, kamwe si kwa 是."}],"items":[{"u":0,"q":"老师，我______用手机吗？","o":["可以","是","有","想"],"a":0},{"u":0,"q":"A: 对不起！ B: ______","o":["当然","没关系","不行","收到"],"a":1},{"u":0,"q":"请等______。","o":["一下","一个","一天","一点"],"a":0},{"u":0,"q":"不行 means 'of course'.","q_zh":"“不行”的意思是 of course（当然）。","q_sw":"不行 maana yake ni 'bila shaka'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F2U7","form":2,"zh":"手机短信与社交媒体","en":"Phone messages and social media","sw":"Ujumbe wa simu na mitandao ya kijamii","keys":[{"zh":"在吗？我想问你明天几点上课。","p":"Zài ma? Wǒ xiǎng wèn nǐ míngtiān jǐ diǎn shàngkè.","en":"Are you there? I want to ask you what time class is tomorrow. (how a chat starts)","sw":"Upo? Nataka kukuuliza darasa ni saa ngapi kesho. (jinsi mazungumzo ya ujumbe yanavyoanza)"},{"zh":"好的，收到！明天八点学校见！","p":"Hǎo de, shōudào! Míngtiān bā diǎn xuéxiào jiàn!","en":"OK, got it! See you at school at 8 tomorrow! (time + place + 见)","sw":"Sawa, nimepokea! Tuonane shuleni saa mbili kesho! (wakati + mahali + 见)"},{"zh":"请发照片给我。","p":"Qǐng fā zhàopiàn gěi wǒ.","en":"Please send me the photo. (发 = to send)","sw":"Tafadhali nitumie picha. (发 = kutuma)"},{"zh":"我们星期六一起学习吧。","p":"Wǒmen xīngqīliù yìqǐ xuéxí ba.","en":"Let's study together on Saturday. (一起 = together; 吧 makes a suggestion)","sw":"Tusome pamoja Jumamosi. (一起 = pamoja; 吧 hufanya pendekezo)"}],"items":[{"u":0,"q":"A: 在吗？ B: ______","o":["明天见","在，什么事？","收到","不行"],"a":1},{"u":0,"q":"'received / got it' is…","o":["收到","知道","发","见"],"a":0,"q_zh":"英语 received / got it 用中文是……","q_sw":"'nimepokea / nimeelewa' ni…"},{"u":0,"q":"请______视频给我。","o":["看","发","拿","写"],"a":1},{"u":0,"q":"微信 is WeChat.","q_zh":"“微信”就是 WeChat。","q_sw":"微信 ni WeChat.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F2U8","form":2,"zh":"复习与中二全国测评（FTNA）","en":"Revision and the Form II national assessment","sw":"Marudio na upimaji wa kitaifa wa Kidato cha Pili (FTNA)","keys":[{"zh":"会 = 学会的技能：我会说汉语。","p":"Wǒ huì shuō Hànyǔ.","en":"会 = a learned skill: I can speak Chinese.","sw":"会 = ujuzi uliojifunza: Ninaweza kuzungumza Kichina."},{"zh":"能 = 有没有可能：我今天不能来。","p":"Wǒ jīntiān bù néng lái.","en":"能 = ability or possibility: I cannot come today.","sw":"能 = uwezo au uwezekano: Siwezi kuja leo."},{"zh":"可以 = 许可：我可以进来吗？","p":"Wǒ kěyǐ jìnlái ma?","en":"可以 = permission: May I come in?","sw":"可以 = ruhusa: Naweza kuingia?"},{"zh":"我觉得汉语不难。","p":"Wǒ juéde Hànyǔ bù nán.","en":"I think Chinese is not difficult. (觉得 = to think / feel)","sw":"Nadhani Kichina si kigumu. (觉得 = kudhani / kuhisi)"},{"zh":"便条：妈妈：我下午四点回家。——阿米娜","p":"","en":"A note: the person's name + colon, the message, then your own name at the end.","sw":"Kikaratasi: jina la mtu + nukta mbili, ujumbe, kisha jina lako mwishoni."}],"items":[{"u":0,"q":"我______说汉语。（learned skill）","o":["可以","能","会","有"],"a":2,"q_zh":"我______说汉语。（提示：learned skill）","q_sw":"我______说汉语。（ujuzi uliojifunza）"},{"u":0,"q":"这个答案______吗？——不对，错了。","o":["对","懂","会","题"],"a":0},{"u":0,"q":"我觉得这个题很______。","o":["对","容易","懂","错"],"a":1},{"u":0,"q":"复习 means 'to revise'.","q_zh":"“复习”的意思是 to revise。","q_sw":"复习 maana yake ni 'kurudia masomo'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F3U1","form":3,"zh":"变调：不、一、三声连读","en":"Tone sandhi: 不, 一 and consecutive 3rd tones","sw":"Mabadiliko ya toni: 不, 一 na toni ya 3 zinazofuatana","keys":[{"zh":"不 + 第四声 → bú：不是 bú shì、不去 bú qù；不好 bù hǎo 不变","p":"","en":"不 rises to 2nd tone only before a 4th tone; before tones 1–3 it stays bù.","sw":"不 hupanda kuwa toni ya 2 kabla ya toni ya 4 tu; kabla ya toni 1–3 hubaki bù."},{"zh":"一 + 第四声 → yí：一个 yí gè、一样 yíyàng；一 + 一/二/三声 → yì：一天 yì tiān、一年 yì nián","p":"","en":"一 becomes yí before a 4th tone and yì before tones 1, 2 and 3.","sw":"一 huwa yí kabla ya toni ya 4 na yì kabla ya toni 1, 2 na 3."},{"zh":"单说 一 和 第一 读 yī","p":"dì-yī","en":"Alone, in numbers and in 第一 (first), 一 keeps its own 1st tone yī.","sw":"Peke yake, katika namba na katika 第一 (ya kwanza), 一 hubaki na toni yake ya 1, yī."},{"zh":"三个第三声连读：我很好 wǒ hén hǎo","p":"","en":"Three 3rd tones in a row: group by meaning, say (我)(很好) = wǒ hén hǎo; the last 3rd tone stays.","sw":"Toni tatu za 3 zikifuatana: panga kwa maana, sema (我)(很好) = wǒ hén hǎo; toni ya 3 ya mwisho haibadiliki."},{"zh":"写的时候写本调，说的时候说变调","p":"","en":"Textbooks may print the original tone; in the exam 'as said' means the changed tone.","sw":"Vitabu vinaweza kuchapisha toni ya asili; katika mtihani 'kama inavyotamkwa' maana yake ni toni iliyobadilika."}],"items":[{"u":0,"q":"不是 is said…","o":["bù shì","bú shì","bǔ shì","bū shì"],"a":1,"q_zh":"“不是”读作……","q_sw":"不是 hutamkwa…"},{"u":0,"q":"一天 is said…","o":["yí tiān","yī tiān","yì tiān","yǐ tiān"],"a":2,"q_zh":"“一天”读作……","q_sw":"一天 hutamkwa…"},{"u":0,"q":"Which 不 does NOT change to bú?","o":["不去","不要","不好","不是"],"a":2,"q_zh":"哪个“不”不变成 bú？","q_sw":"不 ipi HAIBADILIKI kuwa bú?"},{"u":0,"q":"In 第一 (first), 一 is said yí.","q_zh":"在“第一”里，“一”读 yí。","q_sw":"Katika 第一 (ya kwanza), 一 hutamkwa yí.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F3U2","form":3,"zh":"市场与商品","en":"The market and goods","sw":"Soko na bidhaa","keys":[{"zh":"老板，有没有新鲜的鱼？——有。/ 没有。","p":"Lǎobǎn, yǒu méiyǒu xīnxiān de yú? — Yǒu. / Méiyǒu.","en":"Do you have fresh fish? — Yes. / No. (有没有 makes the question; no 吗)","sw":"Una samaki wabichi? — Ndiyo. / Hapana. (有没有 huunda swali; hakuna 吗)"},{"zh":"我要买三个西瓜和一斤糖。","p":"Wǒ yào mǎi sān gè xīguā hé yì jīn táng.","en":"I want to buy three watermelons and half a kilo of sugar. (要买 = want to buy)","sw":"Nataka kununua matikiti maji matatu na nusu kilo ya sukari. (要买 = kutaka kununua)"},{"zh":"新鲜的蔬菜、好吃的面包","p":"xīnxiān de shūcài, hǎochī de miànbāo","en":"fresh vegetables, tasty bread: two-syllable adjective + 的 + noun.","sw":"mboga mbichi, mkate mtamu: kivumishi cha silabi mbili + 的 + nomino."},{"zh":"买 mǎi = to buy（3rd tone），卖 mài = to sell（4th tone，one extra 十 on top）","p":"","en":"The customer 买 (buys), the 老板 卖 (sells): same sound, different tone and character.","sw":"Mteja 买 (ananunua), 老板 卖 (anauza): sauti ileile, toni na herufi tofauti."},{"zh":"顾客 = customer，老板 = seller / shop owner","p":"","en":"The two roles in every market dialogue.","sw":"顾客 = mteja, 老板 = muuzaji / mwenye duka — wahusika wawili katika kila mazungumzo ya sokoni."}],"items":[{"u":0,"q":"Choose the correct pinyin: 新鲜","o":["xīnxiǎn","xīnxiān","xínxiān","xīnxián"],"a":1,"q_zh":"选出正确的拼音：新鲜","q_sw":"Chagua pinyin sahihi: 新鲜"},{"u":0,"q":"老板______水果，顾客______水果。","o":["买 / 卖","卖 / 买","卖 / 卖","买 / 买"],"a":1},{"u":0,"q":"'beef' is…","o":["鸡肉","羊肉","牛肉","大米"],"a":2,"q_zh":"英语 beef 用中文是……","q_sw":"'nyama ya ng'ombe' ni…"},{"u":0,"q":"新鲜鱼 is the correct way to say 'fresh fish'.","q_zh":"“新鲜鱼”是 fresh fish 的正确说法。","q_sw":"新鲜鱼 ndiyo njia sahihi ya kusema 'samaki mbichi'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F3U3","form":3,"zh":"多少钱？讨价还价","en":"Prices and bargaining","sw":"Bei na kupatana bei","keys":[{"zh":"西瓜多少钱一个？——三千先令一个。","p":"Xīguā duōshao qián yí gè? — Sān qiān xiānlìng yí gè.","en":"How much is one watermelon? — 3,000 shillings each. (多少钱 = how much; no 是)","sw":"Tikiti maji moja ni bei gani? — Shilingi 3,000 kila moja. (多少钱 = bei gani; hakuna 是)"},{"zh":"太贵了！便宜一点儿吧。","p":"Tài guì le! Piányi yìdiǎnr ba.","en":"Too expensive! A bit cheaper, please. (太 … 了 = too …; 吧 softens the request)","sw":"Ghali mno! Punguza kidogo, tafadhali. (太 … 了 = mno; 吧 hulainisha ombi)"},{"zh":"两千五，行吗？——行。/ 算了。","p":"Liǎng qiān wǔ, xíng ma? — Xíng. / Suàn le.","en":"2,500, OK? — OK. / Forget it.","sw":"2,500, sawa? — Sawa. / Achana nayo."},{"zh":"一共七千五百先令。给你一万，找你两千五。","p":"Yígòng qī qiān wǔ bǎi xiānlìng. Gěi nǐ yí wàn, zhǎo nǐ liǎng qiān wǔ.","en":"Altogether 7,500 shillings. Here is 10,000; your change is 2,500.","sw":"Jumla ni shilingi 7,500. Hizi hapa 10,000; chenji yako ni 2,500."},{"zh":"千 = 1,000，万 = 10,000：一万两千 = 12,000；两千 不说 二千","p":"","en":"Count in thousands and ten-thousands: 一万两千 = 12,000; 'two thousand' is 两千.","sw":"Hesabu kwa maelfu na makumi ya maelfu: 一万两千 = 12,000; 'elfu mbili' ni 两千."}],"items":[{"u":0,"q":"苹果______一个？","o":["几钱","多少钱","什么钱","多钱"],"a":1},{"u":0,"q":"太______了！便宜一点儿吧。","o":["便宜","贵","好","多"],"a":1},{"u":0,"q":"10,000 shillings is…","o":["十千先令","一万先令","一千先令","十百先令"],"a":1,"q_zh":"10,000 先令是……","q_sw":"Shilingi 10,000 ni…"},{"u":0,"q":"算了 means 'OK, I agree'.","q_zh":"“算了”的意思是“好，我同意”。","q_sw":"算了 maana yake ni 'Sawa, nakubali'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F3U4","form":3,"zh":"量词","en":"Measure words","sw":"Maneno ya vipimo","keys":[{"zh":"两本书、三张票、一条鱼、五斤大米","p":"liǎng běn shū, sān zhāng piào, yì tiáo yú, wǔ jīn dàmǐ","en":"two books, three tickets, one fish, 2.5 kg of rice: number + measure word + noun, always.","sw":"vitabu viwili, tiketi tatu, samaki mmoja, kilo 2.5 za mchele: namba + neno la kipimo + nomino, daima."},{"zh":"一杯茶、一瓶水、一件衣服、一双鞋","p":"yì bēi chá, yì píng shuǐ, yí jiàn yīfu, yì shuāng xié","en":"a cup of tea, a bottle of water, a piece of clothing, a pair of shoes.","sw":"kikombe cha chai, chupa ya maji, nguo moja, jozi ya viatu."},{"zh":"这件衣服多少钱？那双鞋很漂亮。","p":"Zhè jiàn yīfu duōshao qián? Nà shuāng xié hěn piàoliang.","en":"How much is this piece of clothing? Those shoes are pretty. (这 / 那 + measure + noun)","sw":"Nguo hii ni bei gani? Viatu vile ni vizuri. (这 / 那 + neno la kipimo + nomino)"},{"zh":"你要几斤？——要两斤。","p":"Nǐ yào jǐ jīn? — Yào liǎng jīn.","en":"How many jin do you want? — Two. (几 + measure word asks a small number)","sw":"Unataka jin ngapi? — Mbili. (几 + neno la kipimo huuliza idadi ndogo)"},{"zh":"斤 = 500 g，公斤 = 1 kg；一些 = some（我买了一些水果）","p":"","en":"斤 is half a kilo, 公斤 is a kilo; 一些 (some) is used when the number does not matter.","sw":"斤 ni nusu kilo, 公斤 ni kilo moja; 一些 (baadhi) hutumika pale idadi haijalishi."}],"items":[{"u":0,"q":"两______书","o":["个","本","张","条"],"a":1},{"u":0,"q":"一______鱼","o":["条","个","本","杯"],"a":0},{"u":0,"q":"这______衣服很漂亮。","o":["件","张","本","双"],"a":0},{"u":0,"q":"斤 means one kilogram.","q_zh":"“斤”的意思是一公斤。","q_sw":"斤 maana yake ni kilo moja.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F3U5","form":3,"zh":"比较：A 比 B……","en":"Comparing: A 比 B","sw":"Kulinganisha: A 比 B","keys":[{"zh":"这个西瓜比那个大。","p":"Zhège xīguā bǐ nàge dà.","en":"This watermelon is bigger than that one. (A 比 B + adjective; no 很)","sw":"Tikiti maji hili ni kubwa kuliko lile. (A 比 B + kivumishi; hakuna 很)"},{"zh":"香蕉比苹果便宜得多。牛肉比鸡肉贵一点儿。","p":"Xiāngjiāo bǐ píngguǒ piányi de duō. Niúròu bǐ jīròu guì yìdiǎnr.","en":"Bananas are much cheaper than apples. Beef is a little more expensive than chicken.","sw":"Ndizi ni rahisi sana kuliko matofaa. Nyama ya ng'ombe ni ghali kidogo kuliko kuku."},{"zh":"这条鱼最新鲜。","p":"Zhè tiáo yú zuì xīnxiān.","en":"This fish is the freshest. (最 + adjective = the most)","sw":"Samaki huyu ndiye mbichi kuliko wote. (最 + kivumishi = kuliko wote)"},{"zh":"这两件衣服一样贵。","p":"Zhè liǎng jiàn yīfu yíyàng guì.","en":"These two pieces of clothing are equally expensive. (A 和 B 一样 + adjective)","sw":"Nguo hizi mbili zina bei sawa. (A 和 B 一样 + kivumishi)"},{"zh":"因为这个便宜，所以我买这个。","p":"Yīnwèi zhège piányi, suǒyǐ wǒ mǎi zhège.","en":"Because this one is cheap, I buy this one. (因为 … 所以 … used together)","sw":"Kwa sababu hii ni rahisi, ninanunua hii. (因为 … 所以 … hutumika pamoja)"}],"items":[{"u":0,"q":"这个西瓜______那个大。","o":["比","最","更","和"],"a":0},{"u":0,"q":"Which is correct?","o":["他比我很高","他比我高","他很比我高","他高比我"],"a":1,"q_zh":"哪个正确？","q_sw":"Ipi ni sahihi?"},{"u":0,"q":"香蕉比苹果便宜______。（much）","o":["一点","得多","很","太"],"a":1,"q_zh":"香蕉比苹果便宜______。（提示：much）","q_sw":"香蕉比苹果便宜______。（sana / kwa kiasi kikubwa）"},{"u":0,"q":"最 means 'the most'.","q_zh":"“最”的意思是 the most。","q_sw":"最 maana yake ni 'kuliko wote / zaidi ya yote'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F3U6","form":3,"zh":"看海报与通知","en":"Reading posters and notices","sw":"Kusoma mabango na matangazo","keys":[{"zh":"营业时间：早上八点到晚上八点。","p":"Yíngyè shíjiān: zǎoshang bā diǎn dào wǎnshang bā diǎn.","en":"Opening hours: 8 a.m. to 8 p.m. (到 between two times = until)","sw":"Saa za kazi: saa mbili asubuhi hadi saa mbili usiku (8:00–20:00). (到 kati ya nyakati mbili = hadi)"},{"zh":"本周西瓜特价：两千先令一个！","p":"Běn zhōu xīguā tèjià: liǎng qiān xiānlìng yí gè!","en":"This week watermelon special price: 2,000 shillings each!","sw":"Bei maalum ya tikiti maji wiki hii: shilingi 2,000 kila moja!"},{"zh":"新店开门，欢迎光临！","p":"Xīn diàn kāi mén, huānyíng guānglín!","en":"New shop open, welcome! (开门 = opens, 关门 = closes)","sw":"Duka jipya limefunguliwa, karibuni! (开门 = kufungua, 关门 = kufunga)"},{"zh":"免费 = free of charge，便宜 = cheap，打折 = discount","p":"","en":"Three price words that look alike on a poster but mean different things.","sw":"免费 = bure, 便宜 = rahisi, 打折 = punguzo — maneno matatu ya bei yanayofanana kwenye bango lakini yana maana tofauti."},{"zh":"看海报找四件事：什么？什么时候？在哪儿？多少钱？","p":"","en":"Scan a poster for four facts: what, when, where, how much. Do not read every character.","sw":"Pitia bango kutafuta mambo manne: nini, lini, wapi, bei gani. Usisome kila herufi."}],"items":[{"u":0,"q":"'free of charge' is…","o":["便宜","特价","免费","打折"],"a":2,"q_zh":"英语 free of charge 用中文是……","q_sw":"'bure (bila malipo)' ni…"},{"u":0,"q":"Poster: 星期六下午三点，学校操场，汉语活动，免费。 Where is the event?","o":["教室","操场","市场","图书馆"],"a":1,"q_zh":"海报：星期六下午三点，学校操场，汉语活动，免费。活动在哪儿？","q_sw":"Bango: 星期六下午三点，学校操场，汉语活动，免费。 Tukio liko wapi?"},{"u":0,"q":"Same poster: when?","o":["星期六上午三点","星期六下午三点","星期天下午三点","每天三点"],"a":1,"q_zh":"同一张海报：什么时候？","q_sw":"Bango lilelile: lini?"},{"u":0,"q":"营业时间：8:00–20:00 means the shop closes at 8 p.m.","q_zh":"“营业时间：8:00–20:00”表示商店晚上八点关门。","q_sw":"营业时间：8:00–20:00 maana yake ni duka linafungwa saa mbili usiku (20:00).","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F3U7","form":3,"zh":"概括与复述","en":"Summarising and retelling a story","sw":"Kufupisha na kusimulia tena hadithi","keys":[{"zh":"昨天我去了市场，买了三条鱼。","p":"Zuótiān wǒ qù le shìchǎng, mǎi le sān tiáo yú.","en":"Yesterday I went to the market and bought three fish. (verb + 了 = completed)","sw":"Jana nilienda sokoni na kununua samaki watatu. (kitenzi + 了 = tendo limekamilika)"},{"zh":"这个故事主要讲阿里在市场丢了钱。","p":"Zhège gùshi zhǔyào jiǎng Ālǐ zài shìchǎng diū le qián.","en":"The story is mainly about Ali losing money at the market. (主要讲 = is mainly about)","sw":"Hadithi hii inahusu hasa Ali kupoteza pesa sokoni. (主要讲 = inahusu hasa)"},{"zh":"阿里先去买鱼，然后发现钱丢了，最后老板帮他找到了。","p":"Ālǐ xiān qù mǎi yú, ránhòu fāxiàn qián diū le, zuìhòu lǎobǎn bāng tā zhǎodào le.","en":"Ali first went to buy fish, then found his money was lost, and finally the seller helped him find it. (先 / 然后 / 最后)","sw":"Ali kwanza alienda kununua samaki, kisha akagundua pesa zake zimepotea, na mwishowe muuzaji akamsaidia kuzipata. (先 / 然后 / 最后)"},{"zh":"是、在、喜欢 后面没有 了：我是学生","p":"","en":"是, 在 and 喜欢 never take 了.","sw":"是, 在 na 喜欢 kamwe havichukui 了."},{"zh":"已经 = already，突然 = suddenly，高兴 = happy，生气 = angry","p":"","en":"Four story words that carry the feeling and the timing of the events.","sw":"已经 = tayari, 突然 = ghafla, 高兴 = furaha, 生气 = hasira — maneno manne ya hadithi yanayobeba hisia na wakati wa matukio."}],"items":[{"u":0,"q":"昨天我______市场买菜。","o":["去了","去","了去","去过了"],"a":0},{"u":0,"q":"这个故事______讲什么？","o":["主要","意思","发生","已经"],"a":0},{"u":0,"q":"Which sentence is wrong?","o":["我买了两条鱼","他是了老师","她找到了钱","我们回家了"],"a":1,"q_zh":"哪个句子是错的？","q_sw":"Sentensi ipi si sahihi?"},{"u":0,"q":"突然 means 'finally'.","q_zh":"“突然”的意思是“最后”。","q_sw":"突然 maana yake ni 'mwishowe'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F3U8","form":3,"zh":"不同场合的会话","en":"Conversations in different settings","sw":"Mazungumzo katika mazingira tofauti","keys":[{"zh":"请问，去石头城的车在哪儿？","p":"Qǐngwèn, qù Shítouchéng de chē zài nǎr?","en":"Excuse me, where is the bus to Stone Town? (请问 opens a polite question)","sw":"Samahani, basi la kwenda Mji Mkongwe liko wapi? (请问 hufungua swali la adabu)"},{"zh":"服务员，我要一杯茶和米饭。请给我菜单。","p":"Fúwùyuán, wǒ yào yì bēi chá hé mǐfàn. Qǐng gěi wǒ càidān.","en":"Waiter, I would like a cup of tea and rice. Please give me the menu. (要 + number + measure + noun)","sw":"Mhudumu, naomba kikombe cha chai na wali. Tafadhali nipe menyu. (要 + namba + neno la kipimo + nomino)"},{"zh":"我发烧了，头很疼。我要去看病。","p":"Wǒ fāshāo le, tóu hěn téng. Wǒ yào qù kàn bìng.","en":"I have a fever and a headache. I need to see a doctor.","sw":"Nina homa na maumivu ya kichwa. Ninahitaji kwenda kumwona daktari."},{"zh":"吃完饭以后结账；坐车以前买票；到了以后下车","p":"jiézhàng / mǎi piào / xià chē","en":"Pay the bill after eating; buy a ticket before the bus; get off when you arrive.","sw":"Lipa bili baada ya kula; nunua tiketi kabla ya basi; shuka ukifika."},{"zh":"不用了，谢谢。/ 没问题。","p":"Bú yòng le, xièxie. / Méi wèntí.","en":"No need, thanks. / No problem. (polite ways to decline or agree)","sw":"Hapana, asante. / Hakuna shida. (njia za adabu za kukataa au kukubali)"}],"items":[{"u":0,"q":"______，车站在哪儿？","o":["请问","麻烦","不用","没问题"],"a":0},{"u":0,"q":"服务员，我要______。","o":["茶","一杯茶","杯茶","茶一杯"],"a":1},{"u":0,"q":"我发烧了，我要去______。","o":["买票","看病","点菜","结账"],"a":1},{"u":0,"q":"服务员 means 'doctor'.","q_zh":"“服务员”的意思是“医生”。","q_sw":"服务员 maana yake ni 'daktari'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F4U1","form":4,"zh":"了、过、着 综合","en":"Aspect: 了, 过, 着 together","sw":"Hali ya kitenzi: 了, 过, 着 kwa pamoja","keys":[{"zh":"我已经做了作业。","p":"Wǒ yǐjing zuò le zuòyè.","en":"I have already done my homework. (verb + 了 = completed action)","sw":"Nimeshafanya kazi yangu ya nyumbani. (kitenzi + 了 = tendo lililokamilika)"},{"zh":"我去过石头城两次。我没去过中国。","p":"Wǒ qù guo Shítouchéng liǎng cì. Wǒ méi qù guo Zhōngguó.","en":"I have been to Stone Town twice. I have never been to China. (过 = experience; negative 没 … 过)","sw":"Nimewahi kwenda Mji Mkongwe mara mbili. Sijawahi kwenda China. (过 = uzoefu; ukanushi 没 … 过)"},{"zh":"门开着。他戴着帽子站着。","p":"Mén kāi zhe. Tā dài zhe màozi zhàn zhe.","en":"The door is open. He is standing wearing a hat. (着 = a state that continues)","sw":"Mlango uko wazi. Amesimama akiwa amevaa kofia. (着 = hali inayoendelea)"},{"zh":"我正在写作业，别说话。","p":"Wǒ zhèngzài xiě zuòyè, bié shuōhuà.","en":"I am doing homework right now; don't talk. (正在 = action in progress)","sw":"Ninafanya kazi ya nyumbani sasa hivi; usiongee. (正在 = tendo linaloendelea)"},{"zh":"你吃饭了吗？——还没。","p":"Nǐ chī fàn le ma? — Hái méi.","en":"Have you eaten? — Not yet. (还没 answers a 了 question; no 了 after 没)","sw":"Umeshakula? — Bado. (还没 hujibu swali la 了; hakuna 了 baada ya 没)"}],"items":[{"u":0,"q":"我______去过中国。","o":["不","没","没有了","不了"],"a":1},{"u":0,"q":"门开______，请进。","o":["了","过","着","在"],"a":2},{"u":0,"q":"他______看书，别说话。","o":["过","着","正在","了"],"a":2},{"u":0,"q":"我没吃了 is a correct sentence.","q_zh":"“我没吃了”是正确的句子。","q_sw":"我没吃了 ni sentensi sahihi.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F4U2","form":4,"zh":"天气、季节与健康","en":"Weather, seasons and health","sw":"Hali ya hewa, majira na afya","keys":[{"zh":"今天天气怎么样？——今天很热，三十二度。","p":"Jīntiān tiānqì zěnmeyàng? — Jīntiān hěn rè, sānshí'èr dù.","en":"What is the weather like today? — Hot, 32 degrees. (很 + adjective; no 是)","sw":"Hali ya hewa leo ikoje? — Joto, nyuzi 32. (很 + kivumishi; hakuna 是)"},{"zh":"明天可能会下雨，别忘了带伞。","p":"Míngtiān kěnéng huì xià yǔ, bié wàng le dài sǎn.","en":"It may rain tomorrow; don't forget to bring an umbrella. (可能会 = may well)","sw":"Huenda kesho kukanyesha; usisahau kubeba mwavuli. (可能会 = huenda ikawa)"},{"zh":"桑给巴尔的冬天比中国的冬天热得多。","p":"Sāngjǐbā'ěr de dōngtiān bǐ Zhōngguó de dōngtiān rè de duō.","en":"Zanzibar's winter is much hotter than China's winter. (比 + 得多)","sw":"Majira ya baridi ya Zanzibar ni ya joto zaidi sana kuliko ya China. (比 + 得多)"},{"zh":"我感冒了，头疼、咳嗽。","p":"Wǒ gǎnmào le, tóu téng, késou.","en":"I have a cold, a headache and a cough. (感冒了 = have caught a cold)","sw":"Nina mafua, maumivu ya kichwa na kikohozi. (感冒了 = kupata mafua)"},{"zh":"你应该多休息，别喝冷水。","p":"Nǐ yīnggāi duō xiūxi, bié hē lěng shuǐ.","en":"You should rest more; don't drink cold water. (应该 = should; 别 + verb = don't)","sw":"Unapaswa kupumzika zaidi; usinywe maji baridi. (应该 = unapaswa; 别 + kitenzi = usi-)"}],"items":[{"u":0,"q":"明天可能______下雨。","o":["能","会","可以","要"],"a":1},{"u":0,"q":"你感冒了，______多喝水。","o":["别","应该","可能","比"],"a":1},{"u":0,"q":"Which sentence is correct?","o":["今天是很热","今天很热","今天热是","今天是热很"],"a":1,"q_zh":"哪个句子是正确的？","q_sw":"Sentensi ipi ni sahihi?"},{"u":0,"q":"雨季 means 'rainy season'.","q_zh":"“雨季”的意思是 rainy season。","q_sw":"雨季 maana yake ni 'msimu wa mvua'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":0}]},{"id":"F4U3","form":4,"zh":"工作、爱好与打算","en":"Work, hobbies and plans","sw":"Kazi, mambo ya kupenda na mipango","keys":[{"zh":"我的爱好是踢足球和唱歌。","p":"Wǒ de àihào shì tī zúqiú hé chàng gē.","en":"My hobbies are football and singing. (爱好 = hobby)","sw":"Mambo ninayopenda ni mpira wa miguu na kuimba. (爱好 = jambo la kupenda)"},{"zh":"我对汉语很感兴趣。","p":"Wǒ duì Hànyǔ hěn gǎn xìngqù.","en":"I am very interested in Chinese. (对 + topic + 感兴趣; never 感兴趣汉语)","sw":"Ninavutiwa sana na Kichina. (对 + mada + 感兴趣; kamwe 感兴趣汉语)"},{"zh":"我经常游泳，有时候画画。","p":"Wǒ jīngcháng yóuyǒng, yǒu shíhou huà huà.","en":"I often swim and sometimes draw. (经常 = often, 有时候 = sometimes, before the verb)","sw":"Mara nyingi ninaogelea na wakati mwingine ninachora. (经常 = mara nyingi, 有时候 = wakati mwingine, kabla ya kitenzi)"},{"zh":"我打算上大学，将来做导游。","p":"Wǒ dǎsuàn shàng dàxué, jiānglái zuò dǎoyóu.","en":"I plan to go to university and be a tour guide in the future. (打算 + verb)","sw":"Ninapanga kwenda chuo kikuu na kuwa kiongozi wa watalii baadaye. (打算 + kitenzi)"},{"zh":"毕业以后我希望去中国旅游。","p":"Bìyè yǐhòu wǒ xīwàng qù Zhōngguó lǚyóu.","en":"After graduating I hope to travel to China. (event + 以后 = after; 希望 + verb)","sw":"Baada ya kuhitimu natumaini kusafiri kwenda China. (tukio + 以后 = baada ya; 希望 + kitenzi)"}],"items":[{"u":0,"q":"我______汉语很感兴趣。","o":["对","给","比","从"],"a":0},{"u":0,"q":"我______上大学，将来做护士。","o":["打算","经常","有时候","感兴趣"],"a":0},{"u":0,"q":"'tour guide' is…","o":["护士","导游","医生","司机"],"a":1,"q_zh":"英语 tour guide 用中文是……","q_sw":"'kiongozi wa watalii' ni…"},{"u":0,"q":"有时候 means 'often'.","q_zh":"“有时候”的意思是“经常”。","q_sw":"有时候 maana yake ni 'mara nyingi'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F4U4","form":4,"zh":"出行与问路","en":"Travel and asking the way","sw":"Kusafiri na kuuliza njia","keys":[{"zh":"请问，去码头怎么走？——往前走到红绿灯，往左拐。","p":"Qǐngwèn, qù mǎtóu zěnme zǒu? — Wǎng qián zǒu dào hónglǜdēng, wǎng zuǒ guǎi.","en":"Excuse me, how do I get to the port? — Straight on to the lights, then turn left.","sw":"Samahani, nitafikaje bandarini? — Nenda moja kwa moja hadi kwenye taa, kisha pinda kushoto."},{"zh":"我们坐船去，大概两个小时。","p":"Wǒmen zuò chuán qù, dàgài liǎng gè xiǎoshí.","en":"We go by ferry, about two hours. (坐 + vehicle + 去; 大概 = about)","sw":"Tunakwenda kwa boti, takriban saa mbili. (坐 + chombo + 去; 大概 = takriban)"},{"zh":"我骑自行车去学校。","p":"Wǒ qí zìxíngchē qù xuéxiào.","en":"I go to school by bicycle. (骑 for bicycles; 坐 for bus, boat, plane, taxi)","sw":"Ninaenda shuleni kwa baiskeli. (骑 kwa baiskeli; 坐 kwa basi, boti, ndege, teksi)"},{"zh":"机场离石头城有多远？——大概八公里。","p":"Jīchǎng lí Shítouchéng yǒu duō yuǎn? — Dàgài bā gōnglǐ.","en":"How far is the airport from Stone Town? — About 8 km. (A 离 B 有多远)","sw":"Uwanja wa ndege uko umbali gani kutoka Mji Mkongwe? — Takriban km 8. (A 离 B 有多远)"},{"zh":"坐出租车需要二十分钟。我们迷路了，你有地图吗？","p":"Zuò chūzūchē xūyào èrshí fēnzhōng. Wǒmen mílù le, nǐ yǒu dìtú ma?","en":"A taxi takes twenty minutes. We are lost; do you have a map?","sw":"Teksi inachukua dakika ishirini. Tumepotea njia; una ramani?"}],"items":[{"u":0,"q":"请问，去机场______？","o":["怎么走","怎么样","什么","哪儿"],"a":0},{"u":0,"q":"我______自行车去学校。","o":["坐","开","骑","走"],"a":2},{"u":0,"q":"码头______这儿有多远？","o":["从","往","离","到"],"a":2},{"u":0,"q":"码头 means 'airport'.","q_zh":"“码头”的意思是“机场”。","q_sw":"码头 maana yake ni 'uwanja wa ndege'.","o":["对 ✓ True / Kweli","错 ✗ False / Si kweli"],"a":1}]},{"id":"F4U5","form":4,"zh":"翻译与口译（简单信息）","en":"Translating and interpreting simple information","sw":"Kutafsiri na ukalimani (taarifa rahisi)","keys":[{"zh":"翻译四步：①意思对吗？②语序对吗？③量词/了/的 对吗？④声调对吗？","p":"","en":"The four-step check: meaning, word order, measure words and particles, tones.","sw":"Ukaguzi wa hatua nne: maana, mpangilio wa maneno, maneno ya kipimo na viambishi, toni."},{"zh":"她问你多少钱。他说三千先令。","p":"Tā wèn nǐ duōshao qián. Tā shuō sān qiān xiānlìng.","en":"She asks how much. He says  quizState={g:gi,i:0,ok:0,items:ws.map(function(w){var o=[w];while(o.length<4){var c=all[Math.floor(Math.random()*all.length)];if(o.indexOf(c)<0&&c.h!==w.h)o.push(c)}o.sort(function(){return Math.random()-.5});return{w:w,o:o}})};

}

q4:[["天气","tiānqì"],["医院","yīyuàn"],["朋友","péngyou"],["便宜","piányi"],["机场","jīchǎng"],["打算","dǎsuàn"],["咳嗽","késou"],["环境","huánjìng"],["喜欢","xǐhuan"]],
q5:[["xuésheng","学生"],["lǎoshī","老师"],["māma","妈妈"],["jīntiān","今天"],["míngtiān","明天"],["Hànyǔ","汉语"],["shuǐguǒ","水果"],["duōshao qián","多少钱"],["xièxie","谢谢"]],
q6:[["这个房间很（大 / 太）。","大"],["我每天（午 / 五）点起床。","五"],["学校有一（白 / 百）个学生。","百"],["我去市场（买 / 卖）水果吃。","买"],["（请 / 清）问，去车站怎么走？","请"],["他（在 / 再）图书馆学习。","在"],["我家有五口（人 / 入）。","人"],["明（天 / 大）见！","天"],["我想（喝 / 渴）茶。","喝"]],
q7:[["学习 / 我 / 在 / 图书馆 / 每天 / 汉语","我每天在图书馆学习汉语。"],["已经 / 作业 / 我 / 了 / 做","我已经做了作业。"],["去 / 打算 / 我 / 旅游 / 中国 / 将来","我将来打算去中国旅游。（将来我打算去中国旅游。也对 / also correct）"]],
q8:["你家有几口人？","你每天几点起床？","考试以后你打算做什么？"],
c:[["我的一天","My day: when you get up, what you do at school, what you do after school (use 先…然后…最后).","Siku yangu: unaamka saa ngapi, unafanya nini shuleni na baada ya shule (tumia 先…然后…最后).","我每天早上六点起床，先刷牙、洗脸，然后吃早饭。七点我从家去学校，八点上课。我最喜欢汉语课。下午两点半下课。放学以后我先做作业，然后帮妈妈做饭。晚上我学习一个小时，十点睡觉。"],
 ["便条：请假","A note to your Chinese teacher: you are ill, what is wrong, what the doctor said, and you ask for one day's leave. Use the note format.","Ujumbe mfupi kwa mwalimu wako wa Kichina: unaumwa, unaumwa nini, daktari alisema nini, na unaomba ruhusa ya siku moja. Tumia muundo wa ujumbe mfupi.","张老师：我今天感冒了，头疼、咳嗽，还发烧。妈妈带我去医院看病，医生说我应该多休息、多喝水。我今天不能上课，想请假一天。作业我已经做了，明天给你。谢谢老师！——阿里 十月二十日"],
 ["我的爱好和打算","My hobby and my plan after the exam: what you like doing, how often, what you plan to do in the future and why.","Ninachopenda na mpango wangu baada ya mtihani: unapenda kufanya nini, mara ngapi, unapanga kufanya nini baadaye na kwa nini.","我的爱好是踢足球和唱歌。我经常和朋友一起踢足球，有时候去海边游泳。我对汉语很感兴趣，每天学习一个小时汉语。考试以后我打算上大学，将来做导游，因为我喜欢旅游，也想去中国。"]]};

function tick(){
 clearInterval(timerInt);var el=$("#timer");if(!el||!timerEnd)return;
 timerInt=setInterval(function(){var el=$("#timer");if(!el){clearInterval(timerInt);return}var s=Math.max(0,Math.round((timerEnd-Date.now())/1000));el.textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2);el.classList.toggle("low",s<600)},1000);
}
function collect(prefix,n){var a=[];for(var i=0;i<n;i++){var e=document.querySelector('input[name="'+prefix+i+'"]:checked');a[i]=e?+e.value:null}return a}

function likert(name,val){return '<div class="lik">'+[1,2,3,4,5].map(function(n){return '<label><input type="radio" name="'+name+'" value="'+n+'"'+(val===n?" checked":"")+'><span>'+n+'</span></label>'}).join("")+'</div>'}
function tri(a){return esc(a[0])+'<br>'+esc(a[1])+'<br>'+esc(a[2])}
function choice(k,q,val){return '<tr><td colspan="2">'+tri(q.q)+'</td></tr><tr><td colspan="2"><div class="row">'+q.o.map(function(o,j){return '<label><input type="radio" name="'+k+'" value="'+j+'"'+(val===j?" checked":"")+'> '+esc(o[0]+" / "+o[1]+" / "+o[2])+'</label>'}).join("")+'</div></td></tr>'}

 var a=[r.school,r.id,{m1:"own_device",m2:"whole_class",m3:"print"}[r.mode]||"",r.diag?r.diag.score:"",s[0],s[1],s[2],s[3],s[4],m.auto,m.wmark,(m.auto!=null&&m.wmark!=null)?m.auto+m.wmark:""];
 for(var i=1;i<=8;i++)a.push(p["q"+i]);for(i=1;i<=8;i++)a.push(q["q"+i]);
 a.push(p.dev,p.hrs,p.hard,q.best,q.change,q.help);var un=r.unit||{},uk=Object.keys(un);a.push(uk.length,uk.reduce(function(n,k){return n+un[k].score},0));return a.map(function(x){return x==null?"":x})}
function vResults(){
 var ks=Object.keys(RECS).sort();
 var h='<h2>'+esc(t("results"))+'</h2><div class="card row noprint"><button class="btn" data-act="csv">CSV</button><button class="btn sec" data-act="json">JSON</button>'+printBtn()+'<span class="mut">'+ks.length+' records on this device</span></div>'+

 ks.map(function(k){var r=RECS[k],a=rowOf(r),p=r.pre||{},q=r.post||{};function pr(i,j){function v(o){return (o["q"+i]!=null&&o["q"+j]!=null)?((o["q"+i]+o["q"+j])/2).toFixed(1):"—"}return v(p)+" → "+v(q)}
  return '<tr>'+a.slice(0,12).map(function(x){return '<td>'+esc(x)+'</td>'}).join("")+'<td>'+pr(1,2)+'</td><td>'+pr(3,4)+'</td><td>'+pr(5,6)+'</td><td>'+pr(7,8)+'</td></tr>'}).join("")+'</table></div></div>'+
 '<div class="card mut"><b>Research notes · 研究说明</b><br>Items 1–2 = Self-Efficacy (SE), 3–4 = Technology Acceptance (TAM), 5–6 = Digital Agency (DA), 7–8 = Contextual Resilience (CR): the four DILM variables, adapted here for students. Matched PRE/POST by anonymous code; "mode" (own device / whole class / print) gives a comparison between ways of studying. The items are adapted, not yet validated scales; students are minors, so collect with permission from the school and the Ministry and keep codes, never names. Each device stores only its own records: export a CSV from every device and merge.<br>第 1–2 题 = 自我效能，3–4 = 技术接受，5–6 = 数字能动性，7–8 = 情境韧性（DILM 四个变量的学生版）。按匿名编号前后配对；“学习方式”一栏用于比较不同的学习方式。题目是改编的，还不是验证过的量表；学生是未成年人，请在学校和教育部许可范围内收集，只用编号不写名字。每台设备只保存自己的记录，请逐台导出 CSV 后合并。</div>';
 return h;
}

  r.mock={ans:all,w:$("#mw").value,secs:secs,auto:auto,wmark:null,ts:Date.now()};delete r.mdraft;saveRecs();timerEnd=0;render()}
 else if(a==="remock"){delete r.mock;saveRecs();render()}
 else if(a==="submockA"){var A={},sa=0;CM.q1.forEach(function(x,i){var e2=document.querySelector('input[name="mIa'+i+'"]:checked');A["a"+i]=e2?+e2.value:null;if(A["a"+i]===x[2])sa++});CM.q2k.forEach(function(k,i){var s2=document.querySelector('select[name="mm'+i+'"]');A["m"+i]=s2&&s2.value!==""?+s2.value:null;if(A["m"+i]===k)sa++});r.mock={ans:A,auto:sa,secs:[sa],wmark:null,ts:Date.now()};saveRecs();render()}
 else if(a==="bcmark"){var vb=parseFloat($("#mb").value),vc=parseFloat($("#mc").value);if(!(vb>=0&&vb<=54&&vc>=0&&vc<=30))return;r.mock.b=vb;r.mock.c=vc;r.mock.wmark=vb+vc;saveRecs();render()}
 else if(a==="wmark"){var v=parseFloat($("#wmark").value);if(!(v>=0&&v<=8))return;r.mock.wmark=v;saveRecs();render()}
 else if(a==="wave"){sset("f4x:wave",el.dataset.w);render()}
 else if(a==="subsurvey"){var w=el.dataset.w,d={ts:Date.now()};SURVEY.forEach(function(q,i){var x=document.querySelector('input[name="s'+i+'"]:checked');d["q"+(i+1)]=x?+x.value:null});
  (w==="pre"?BG:POSTQ).forEach(function(q){var x=document.querySelector('input[name="c_'+q.k+'"]:checked');d[q.k]=x?+x.value:null});
  if(w==="post")OPENQ.forEach(function(q){d[q[0]]=$("#o_"+q[0]).value});r[w]=d;saveRecs();$("#svmsg").textContent=t("saved")}
 else if(a==="csv"){download("f4_results.csv",[COLS.join(",")].concat(Object.keys(RECS).sort().map(function(k){return rowOf(RECS[k]).map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",")})).join("\r\n"),"text/csv")}
 else if(a==="json"){download("f4_results.json",JSON.stringify(RECS,null,1),"application/json")}
});
